# ────────── A 編年骨幹 ──────────

- id: chun-qiu
  name: 春秋
  full_name: 春秋經
  layer: A
  compiled: -481
  compiler: 舊題孔子修訂魯史
  ctext: chun-qiu-zuo-zhuan
  nature: >-
    魯國官修編年，起隱公元年（前 722）迄哀公十四年（前 481），凡二百四十二年。
    文極簡，一事多不過十餘字，而「一字褒貶」之義例為後世經學所本。
    今存本附於《左傳》之中。
  caveat: 只記魯國視角所及之事，且諱莫如深（「為尊者諱、為親者諱、為賢者諱」），不可獨立為信史之全。

- id: shiji-tables
  name: 史記年表
  full_name: 史記·十二諸侯年表、六國年表
  layer: A
  compiled: -91
  compiler: 司馬遷
  ctext: shiji
  chapters:
    - {name: 十二諸侯年表, slug: shi-er-zhu-hou-nian-biao, range: "前 841 – 前 477"}
    - {name: 六國年表, slug: liu-guo-nian-biao, range: "前 476 – 前 222"}
  nature: >-
    以年為經、以國為緯的對照表，是本站時間軸「年份 × 列國」矩陣的直接來源。
    十二諸侯年表始於共和元年（前 841），此為中國信史確切紀年之始。
  caveat: 六國年表據秦記為主，六國史料已為秦火所焚，故秦以外各國紀年時有舛誤，須與《竹書紀年》及出土材料互校。

- id: zhushu-jinian
  name: 竹書紀年
  full_name: 竹書紀年（汲冢紀年）
  layer: A
  compiled: -299
  compiler: 魏國史官
  ctext: zhushu-jinian
  nature: >-
    西晉太康二年（281）汲郡魏襄王墓出土的魏國編年史，未經漢儒改竄，
    所記多與正統說法相牴——如「伊尹放太甲」「共伯和干王位」。
    原簡與晉人整理本（古本）已佚，今傳「今本」為明人輯偽，須用清人所輯古本佚文。
  caveat: 必須分辨「古本」（輯佚可信）與「今本」（明代偽作）。本站引用一律指古本。

# ────────── B 敘事主源 ──────────

- id: zuo-zhuan
  name: 左傳
  full_name: 春秋左氏傳
  layer: B
  compiled: -389
  compiler: 舊題左丘明，實成於戰國前期
  ctext: chun-qiu-zuo-zhuan
  locus_format: 「<公>公<年>年」，例：僖公二十三年
  nature: >-
    春秋段第一大敘事源，亦是本站成語典源最集中之處。
    以《春秋》經為綱而詳敘其事，起隱公元年迄悼公四年（前 464，記事至前 468），
    載外交辭令、戰陣謀略、卜筮夢兆、君子之評，文辭之美為古文之宗。
  contributes: 退避三舍、唇亡齒寒、假道伐虢、一鼓作氣、多行不義必自斃、問鼎中原、篳路藍縷、外強中乾、大義滅親、風馬牛不相及、上下其手、表裡山河、貪天之功
  caveat: 成書晚於所記之事二三百年，其中預言必驗、君子曰之類明顯出於後人追記；然其史料價值仍為春秋段之冠。

- id: guo-yu
  name: 國語
  layer: B
  compiled: -389
  compiler: 舊題左丘明
  ctext: guo-yu
  locus_format: 「<國>語<卷次>」，例：晉語四、越語上
  nature: >-
    按國分卷（周、魯、齊、晉、鄭、楚、吳、越）的言論輯錄，重記言而略記事，
    與《左傳》互為表裡，舊有「春秋外傳」之稱。晉語九卷最詳，越語二卷為句踐滅吳之主源。
  contributes: 防民之口甚於防川、同德則同心（越語）、唇齒相依之論
  caveat: 各卷體例與可信度參差，周語多存舊聞，吳越二語則近於文學鋪陳。

- id: zhan-guo-ce
  name: 戰國策
  layer: B
  compiled: -25
  compiler: 劉向編定（原為戰國縱橫家遊說辭之匯編）
  ctext: zhan-guo-ce
  locus_format: 「<國>策<卷次>」，例：楚策一、齊策四
  nature: >-
    戰國段第一大源，按國分卷（東周、西周、秦、齊、楚、趙、魏、韓、燕、宋衛、中山），
    共三十三篇。所錄多為策士遊說之辭，善用譬喻寓言以動人主，
    本站大量寓言型成語出於此。
  contributes: 畫蛇添足、狐假虎威、驚弓之鳥、鷸蚌相爭、亡羊補牢、南轅北轍、三人成虎、前倨後恭、圖窮匕見、驚弓之鳥
  caveat: >-
    非史書而為說辭集，同一事往往繫於不同人物、不同年份，人物年代常不可考。
    馬王堆帛書《戰國縱橫家書》出土後，可證蘇秦事跡與本書所記出入極大。

- id: shiji
  name: 史記
  layer: B
  compiled: -91
  compiler: 司馬遷
  ctext: shiji
  locus_format: 篇名，例：廉頗藺相如列傳、商君列傳
  nature: >-
    三十世家幾乎一國一篇（齊、魯、晉、楚、越、鄭、趙、魏、韓、田齊……），
    本身即是一套按國組織的春秋戰國史；七十列傳則以人物為單位，
    是戰國後期成語最集中的來源。司馬遷去戰國未遠而得見秦記與諸侯史料之殘存。
  contributes: 完璧歸趙、負荊請罪、紙上談兵、毛遂自薦、竊符救趙、奇貨可居、一字千金、臥薪嘗膽（本事）、烽火戲諸侯
  caveat: 距所記之事已數百年，多採《左傳》《國語》《戰國策》及傳聞；西周至春秋初的部分，屢與清華簡《繫年》等出土材料相牴。

# ────────── C 諸子 ──────────

- id: hanfeizi
  name: 韓非子
  layer: C
  compiled: -233
  compiler: 韓非
  ctext: hanfeizi
  locus_format: 篇名，例：五蠹、說林上、喻老
  nature: >-
    寓言密度最高的先秦典籍。〈說林〉〈儲說〉諸篇專輯歷史故事與寓言以為說理之資，
    既是成語的寶庫，也保存了大量不見於他書的春秋戰國掌故。
  contributes: 守株待兔、自相矛盾、濫竽充數、買櫝還珠、老馬識途、鄭人買履、諱疾忌醫、遠水不救近火
  caveat: 韓非取材以說理為的，人事年代往往為論證而剪裁，不可徑作史實。

- id: zhuangzi
  name: 莊子
  layer: C
  compiled: -286
  compiler: 莊周及其後學
  ctext: zhuangzi
  locus_format: 篇名，例：養生主、秋水
  nature: 「寓言十九」，所敘人物事跡多為虛構寄託，然其寓言入漢語極深。
  contributes: 庖丁解牛、朝三暮四、井底之蛙、螳臂當車、邯鄲學步、東施效顰、每下愈況
  caveat: 內篇為莊子自著，外雜篇多出後學；所載孔子、惠施等人言行一概不可作史料用。

- id: liezi
  name: 列子
  layer: C
  compiled: 300
  compiler: 舊題列禦寇，今傳本實為魏晉人所輯
  ctext: liezi
  locus_format: 篇名，例：湯問、說符
  nature: 保存了大量先秦寓言，其中若干見於《莊子》《呂氏春秋》而文字更詳。
  contributes: 愚公移山、杞人憂天、高山流水、歧路亡羊、朝三暮四
  caveat: >-
    今傳《列子》公認為魏晉偽書，然所輯寓言多有先秦來源。
    本站凡引《列子》而無他書旁證者，reliability 一律標為「寓言」，並於 crystallisation 註明成書問題。

- id: mengzi
  name: 孟子
  layer: C
  compiled: -300
  compiler: 孟軻及其弟子
  ctext: mengzi
  locus_format: 篇名，例：公孫丑上、梁惠王上
  contributes: 揠苗助長、五十步笑百步、緣木求魚、出爾反爾、專心致志
  nature: 以譬喻論政，所設寓言簡而利，多為批評當世君主而發。

- id: lv-shi-chun-qiu
  name: 呂氏春秋
  full_name: 呂氏春秋（呂覽）
  layer: C
  compiled: -239
  compiler: 呂不韋門客集體編纂
  ctext: lv-shi-chun-qiu
  locus_format: 篇名，例：察今、自知
  contributes: 刻舟求劍、掩耳盜鈴、一字千金（本事）
  nature: 雜家總集，兼採諸子而成書於秦統一前夕，保存戰國史事與掌故甚多。

- id: yanzi-chun-qiu
  name: 晏子春秋
  layer: C
  compiled: -250
  compiler: 不詳，戰國時人輯晏嬰事跡
  ctext: yanzi-chun-qiu
  locus_format: 「內篇<篇名>」，例：內篇諫下、內篇雜下
  contributes: 二桃殺三士、南橘北枳、掛羊頭賣狗肉
  caveat: 以晏嬰為主角的故事集，非晏嬰自著，其中不乏後人附益之作。

- id: mozi
  name: 墨子
  layer: C
  compiled: -350
  compiler: 墨翟及其後學
  ctext: mozi
  locus_format: 篇名，例：公輸、非攻上
  contributes: 墨守成規（本事出〈公輸〉）
  nature: 〈公輸〉篇記墨子止楚攻宋，為先秦罕見的完整外交敘事。

- id: art-of-war
  name: 孫子兵法
  layer: C
  compiled: -512
  compiler: 孫武
  ctext: art-of-war
  locus_format: 篇名，例：謀攻、始計
  contributes: 出其不意、攻其無備、知己知彼、百戰不殆、圍魏救趙（理論所本）
  nature: 銀雀山漢簡出土（1972）證實《孫子》《孫臏兵法》確為二書，解決了千年聚訟。

- id: xunzi
  name: 荀子
  layer: C
  compiled: -238
  compiler: 荀況
  ctext: xunzi
  locus_format: 篇名，例：勸學、王制
  contributes: 青出於藍、鍥而不捨、鴻鵠之志（相關）

- id: analects
  name: 論語
  layer: C
  compiled: -400
  compiler: 孔門弟子及再傳弟子
  ctext: analects
  locus_format: 篇名，例：季氏、子路
  contributes: 既來之則安之、欲速則不達、過猶不及、成人之美

# ────────── D 出土文獻 ──────────

- id: qinghua-xinian
  name: 清華簡繫年
  full_name: 清華大學藏戰國竹簡·繫年
  layer: D
  compiled: -300
  excavated: 2008
  nature: >-
    2008 年入藏清華大學的戰國楚簡，其中〈繫年〉一百三十八支簡，
    記西周初至戰國前期史事，是近數十年最重要的春秋戰國新出編年史料。
    多處與《史記》所記相牴，其中以西周覆亡一段最為關鍵。
  contributes: 為「烽火戲諸侯」等條提供異說依據
  caveat: 出土文獻本身亦是一家之言（楚人視角），與傳世文獻相牴時不必然以出土者為是，須並存互參。

- id: mawangdui-zongheng
  name: 戰國縱橫家書
  full_name: 馬王堆帛書·戰國縱橫家書
  layer: D
  compiled: -200
  excavated: 1973
  nature: 馬王堆三號漢墓出土，二十七章，其中十六章不見於傳世文獻。
  caveat: 所記蘇秦事跡與《史記》《戰國策》出入極大——蘇秦晚於張儀而非同時，此為戰國史研究的重大修正。

- id: yinqueshan
  name: 銀雀山漢簡
  layer: D
  excavated: 1972
  nature: 山東臨沂銀雀山漢墓出土，含《孫子兵法》與久佚的《孫臏兵法》，證實孫武、孫臏各有其書。

- id: shuihudi
  name: 睡虎地秦簡
  layer: D
  excavated: 1975
  nature: 湖北雲夢睡虎地秦墓出土秦律與文書，見戰國末秦制之實際運作，可與《商君書》互證。

- id: houma-mengshu
  name: 侯馬盟書
  layer: D
  excavated: 1965
  nature: 山西侯馬出土晉國卿大夫盟誓辭，見春秋晚期六卿傾軋之實況，為三家分晉之前史。

- id: guodian
  name: 郭店楚簡
  layer: D
  excavated: 1993
  nature: 湖北荊門郭店楚墓出土，含最早的《老子》抄本與大批儒家佚籍，改寫了戰國思想史的圖景。

# ────────── E 後世輯錄（保存先秦材料） ──────────

- id: shuo-yuan
  name: 說苑
  layer: E
  compiled: -17
  compiler: 劉向
  ctext: shuo-yuan
  nature: 分類輯錄先秦兩漢故事，保存了不少已佚的春秋戰國掌故。
  caveat: 劉向編纂時已多所潤飾，且雜入漢人之作，孤證不可據。

- id: xin-xu
  name: 新序
  layer: E
  compiled: -17
  compiler: 劉向
  ctext: xin-xu
  nature: 體例同《說苑》，二書常錄同一故事而文字互異。
  caveat: 同《說苑》。

- id: huainanzi
  name: 淮南子
  layer: E
  compiled: -139
  compiler: 淮南王劉安門客
  ctext: huainanzi
  nature: 雜家鉅著，〈人間訓〉〈道應訓〉引先秦故事甚夥。
  caveat: 漢初之書，所引先秦事多經改造以就其論。
