# 春秋戰國分期定義
# 年份規範：公元前用負整數（-770 = 公元前 770 年）
# start / end 為閉區間；分期以政治史的結構轉折為界，而非整數紀年

- id: dong-qian
  name: 平王東遷
  subtitle: 王綱解紐
  start: -771
  end: -723
  marker: 幽王死於驪山、平王東遷洛邑；至《春秋》紀年起始之前一年
  summary: >-
    犬戎破鎬京、幽王死於驪山之下，平王在晉、鄭、秦的護送下東遷洛邑。
    周天子自此失去關中舊土與直屬軍力，「禮樂征伐自天子出」的舊秩序名存實亡，
    諸侯坐大的兩百餘年由此開場。

- id: chun-qiu-early
  name: 春秋前期・鄭莊小霸
  subtitle: 禮壞之始
  start: -722
  end: -686
  marker: 《春秋》經始於魯隱公元年（前 722）；至齊桓公即位前一年
  summary: >-
    鄭莊公以王朝卿士之位兼諸侯之勢，繻葛之戰射傷周桓王，天子之師敗於諸侯，
    象徵意義遠大於軍事意義。此期公室內鬥、弒君篡位頻仍，《春秋》書法所譏者多在此。

- id: wu-ba
  name: 春秋中期・五霸迭興
  subtitle: 尊王攘夷
  start: -685
  end: -547
  marker: 齊桓公即位、管仲相齊；至向戌弭兵之會
  summary: >-
    霸主政治成形：齊桓「九合諸侯，一匡天下」，晉文城濮敗楚而繼之，
    秦穆霸西戎，楚莊問鼎中原。霸權以「尊王攘夷」為名，實則以會盟與軍賦
    重建一套天子失能後的國際秩序。晉楚百年爭霸貫穿全期。

- id: chun-qiu-late
  name: 春秋後期・吳越爭霸
  subtitle: 政在大夫
  start: -546
  end: -473
  marker: 弭兵之會後晉楚息爭；至越滅吳、句踐北會諸侯而霸
  summary: >-
    大國爭霸的重心移向東南，吳越迭起而速亡。中原諸國則轉入公室卑弱、
    政在私門的階段——魯有三桓、齊有田氏、晉有六卿，孔子所歎「陪臣執國命」
    正指此局。社會結構的變動比戰場勝負更具決定性。

- id: zhan-guo-early
  name: 戰國前期・變法圖強
  subtitle: 力政之世
  start: -472
  end: -338
  marker: 三家滅智伯（前 453）、周威烈王命三晉為諸侯（前 403）；至商鞅車裂
  summary: >-
    卿大夫取代舊公室：三家分晉、田氏代齊。列國競相變法——魏有李悝、
    楚有吳起、秦有商鞅——目標一致：廢世卿、行軍功、編戶齊民，
    把封建采邑之國改造為郡縣動員之國。戰爭規模與烈度隨之躍升。

- id: zhan-guo-mid
  name: 戰國中期・合縱連橫
  subtitle: 縱橫捭闔
  start: -337
  end: -285
  marker: 商鞅死後秦制已立、諸侯相王；至五國伐齊之前
  summary: >-
    七雄格局定型，秦一強而六國俱疲。外交成為與戰爭並行的主戰場：
    公孫衍、蘇秦倡合縱，張儀、范睢主連橫與遠交近攻。
    趙武靈王胡服騎射、燕昭王樂毅破齊、齊楚交惡，皆在此期。

- id: zhan-guo-late
  name: 戰國後期・秦滅六國
  subtitle: 天下一統
  start: -284
  end: -221
  marker: 樂毅破齊（前 284）——山東唯趙可與秦抗；歷長平之戰，至秦王政二十六年並天下
  summary: >-
    五國伐齊、樂毅下七十餘城，齊自此一蹶不振，山東唯趙尚能與秦正面相持。
    長平坑趙卒四十萬，六國再無野戰之力。此後三十九年是收局：
    呂不韋當國、秦王政親政、李斯用事，十年之內韓趙魏楚燕齊次第而滅。
    荊軻刺秦是舊秩序最後一次以個人之力抗拒結構之勢。
