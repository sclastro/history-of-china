id: pang-juan
name:
  zh: 龐涓
  en: Pang Juan
state: wei
role: 將領
birth: null
death: -341
sort_year: -354
bio: >-
  魏惠王的將領。他與孫臏同學兵法，自知比不上對方就陷害他，砍斷了他的腳。前353年他圍攻趙國邯鄲，齊軍轉而圍攻魏國，他回師救援，在桂陵戰敗。前341年他攻打韓國，齊國再次出兵相救，孫臏用了減灶之計——進入魏國境內第一天壘十萬個灶，第二天五萬，第三天三萬，龐涓大喜說「我固知齊軍怯，入吾地三日，士卒亡者過半矣」（白話：我本來就知道齊軍怯懦，進入我國境內才三天，逃亡的士卒就超過一半了），於是丟下步兵，率輕裝精銳日夜兼程追擊。追到馬陵，道路狹窄，齊軍砍去大樹的樹皮，在上面寫著「龐涓死于此樹之下」（白話：龐涓死在這棵樹下），萬弩齊發。龐涓智窮兵敗，自刎時說：「遂成豎子之名！」
sources:
