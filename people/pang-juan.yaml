id: pang-juan
name:
  zh: 龐涓
  en: Pang Juan
state: wei
role: 將領
birth: null
death: -341
sort_year: -354
bio: >-
  魏惠王之將。與孫臏同學兵法，自知不及而陷之，斷其足。前 353
  年圍趙邯鄲，齊師圍魏而涓還救，敗於桂陵。前 341 年伐韓，齊復救之，孫臏用減灶之計——
  入魏地為十萬灶、明日五萬、又明日三萬，龐涓大喜曰「我固知齊軍怯，入吾地三日，士卒亡者過半
  矣」（白話：我本來就知道齊軍怯懦，進入我國境內才三天，逃亡的士卒就超過一半了），乃棄步軍
  以輕銳倍日兼行逐之。至馬陵道狹，斫大樹白而書曰「龐涓死于此樹之下」（白話：龐涓死在這棵樹下），萬弩俱發。龐涓智窮兵
  敗，自剄曰：「遂成豎子之名！」
sources:
