id: zhao-kuo
name:
  zh: 趙括
  house: 趙
  en: Zhao Kuo
state: zhao
role: 將領
birth: null
death: -260
sort_year: -260
bio: >-
  趙奢的兒子。他從小學兵法、談用兵，自認為天下無人比得上——曾經跟父親論兵，趙奢駁不倒他，卻並不認為他行。母親問是什麼緣故，趙奢說：「兵，死地也，而括易言之。使趙不將括即已，若必將之，破趙軍者必括也。」（白話：用兵是關乎生死的事，而趙括說得太輕易了。趙國不用他為將便罷；若一定要用他，使趙軍覆滅的必定是趙括。）長平之戰，秦國施行反間計，散布「秦之所惡，獨畏馬服子趙括將耳」（白話：秦國最怕的，只怕馬服君之子趙括來當主將），趙孝成王就用他替換廉頗。趙括到任後，把原有的規章全部更改、軍吏也全部換人，出兵攻擊秦軍。白起假裝敗退而切斷他的糧道，圍困了四十六天，士卒到了人吃人的地步；趙括親自率領精銳搏戰，被射死，四十萬人投降後全被活埋。他母親事先已經上書說「趙括不可以當主將」，並且請求「即如有不稱，妾得無隨坐乎」（白話：萬一他不稱職，我可以不受連坐嗎）——所以只有她一人得免於誅。
