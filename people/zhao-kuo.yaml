id: zhao-kuo
name:
  zh: 趙括
  house: 趙
  en: Zhao Kuo
state: zhao
role: 將領
birth: null
death: -260
sort_year: -260
bio: >-
  趙奢之子。自少學兵法、言兵事，以天下莫能當——嘗與其父論兵，奢不能難，然不謂善。母問其故
  ，奢曰：「兵，死地也，而括易言之。使趙不將括即已，若必將之，破趙軍者必括也。」（白話：用
  兵是關乎生死的事，而趙括說得太輕易了。趙國不用他為將便罷；若一定要用他，使趙軍覆滅的必定
  是趙括。）長平之戰，秦行反間曰「秦之所惡，獨畏馬服子趙括將耳」（白話：秦國最怕的，只怕馬
  服君之子趙括來當主將），趙孝成王以代廉頗。括至，悉更約束、易置軍吏，出擊秦師。白起佯敗而
  絕其糧道，圍之四十六日，士卒相食；括自出銳卒搏戰，射殺之，四十萬眾降而盡坑。其母先已上書
  言「括不可使將」，且請「即如有不稱，妾得無隨坐乎」（白話：萬一他不稱職，我可以不受連坐嗎）——故獨得不誅。
