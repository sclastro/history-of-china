id: jin-hui-gong
name:
  zh: 晉惠公
  personal: 夷吾
  clan: 姬
  posthumous: 惠
  en: Duke Hui of Jin
state: jin
role: 君主
birth: null
death: -637
sort_year: -650
bio: >-
  重耳之弟。賴秦穆公之力得國，許以河外五城而背之；晉飢，秦輸之粟（泛舟之役）；秦飢而請糴，
  晉閉之不與。前 645 年秦伐晉，韓原之戰，惠公捨舊有之戰馬而乘鄭所獻小駟，慶鄭諫曰：「
  古者大事，必乘其產……今乘異產以從戎事，及懼而變，將與人易……亂氣狡憤，陰血周作，張脈僨
  興，外彊中乾。」（白話：古人遇大事，必定乘用本國所產的馬……如今用外地產的馬來從事戰陣，
  等到牠受驚而性情改變，就會與駕馭者相違……屆時氣息紊亂躁怒、血脈奔湧僨張，外表強壯而內裡
  枯竭。）惠公不聽，車陷泥中而見虜。此即「外強中乾」之所出。
sources:
