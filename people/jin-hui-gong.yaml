id: jin-hui-gong
name:
  zh: 晉惠公
  personal: 夷吾
  clan: 姬
  posthumous: 惠
  en: Duke Hui of Jin
state: jin
role: 君主
birth: null
death: -637
sort_year: -650
bio: >-
  重耳的弟弟。他靠秦穆公的力量取得君位，答應割讓河外五城卻食言；晉國鬧饑荒，秦國運糧接濟（就是泛舟之役）；輪到秦國鬧饑荒來求購糧食，晉國卻關起門不給。前645年秦國出兵伐晉，韓原之戰，惠公捨棄原有的戰馬，改乘鄭國進獻的小駟，慶鄭勸諫說：「古者大事，必乘其產……今乘異產以從戎事，及懼而變，將與人易……亂氣狡憤，陰血周作，張脈僨興，外彊中乾。」（白話：古人遇大事，必定乘用本國所產的馬……如今用外地產的馬來從事戰陣，等到牠受驚而性情改變，就會與駕馭者相違……屆時氣息紊亂躁怒、血脈奔湧僨張，外表強壯而內裡枯竭。）惠公不聽，結果戰車陷在泥裡而被俘。這就是「外強中乾」的出處。
