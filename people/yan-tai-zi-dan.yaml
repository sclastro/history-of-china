id: yan-tai-zi-dan
name:
  zh: 燕太子丹
  personal: 丹
  clan: 姬
  en: Prince Dan of Yan
state: yan
role: 君主
birth: null
death: -226
sort_year: -232
bio: >-
  燕王喜的太子。他曾經在趙國做人質，秦王政也生在趙國，兩人少年時就相識；等到嬴政做了秦王，太子丹在秦國做人質而秦王待他不好，他就逃了回來。當時秦國已經滅韓、破趙，兵臨易水。太子丹跟太傅鞠武商量，鞠武勸他聯合楚趙、結交匈奴來共同對付秦國，太子丹嫌太慢；於是去找田光，田光推薦了荊軻。太子丹尊荊軻為上卿，安置在上等館舍，供給豐盛的飲食和珍奇之物，車馬美女任他享用。後來又疑心他反悔，屢次催促，於是荊軻在準備未周的情況下就出發了。事情失敗後，秦國大舉發兵攻燕，燕王喜殺了太子丹獻給秦國，秦兵仍不退，五年之後燕國滅亡。
