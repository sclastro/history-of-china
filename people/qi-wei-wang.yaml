id: qi-wei-wang
name:
  zh: 齊威王
  personal: 因齊
  clan: 媯
  house: 田
  posthumous: 威
  en: King Wei of Qi
state: tian-qi
role: 君主
birth: null
death: -320
sort_year: -356
bio: >-
  田齊中興的君主。即位九年不理政事，淳于髡用隱語勸諫他（「國中有大鳥，止王之庭，三年不蜚又不鳴」（白話：國中有隻大鳥，停在大王的庭院裡，三年既不飛也不叫）），威王說「此鳥不飛則已，一飛沖天；不鳴則已，一鳴驚人」（白話：這鳥不飛則已，一飛就要沖天；不叫則已，一叫就要驚人），於是親自執政——烹殺阿地大夫、封賞即墨大夫，齊國因而大治。他任用田忌、孫臏在桂陵、馬陵打敗魏國，齊國於是取代魏國而強盛；又設立稷下學宮來聚集天下的士人。
sources:
  - source: shiji
    locus: 滑稽列傳
  - source: shiji
    locus: 田敬仲完世家
    ctext_urn: ctp:shiji/tian-jing-zhong-wan-shi-jia
notes: >-
  「一鳴驚人」有楚莊王（《韓非子·喻老》《史記·楚世家》）與齊威王
  （《史記·滑稽列傳》）兩個版本，本站以楚莊王為典源、齊威王為異說。
