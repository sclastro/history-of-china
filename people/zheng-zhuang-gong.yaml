id: zheng-zhuang-gong
name:
  zh: 鄭莊公
  personal: 寤生
  clan: 姬
  posthumous: 莊
  en: Duke Zhuang of Zheng
state: zheng
role: 君主
birth: -757
death: -701
bio: >-
  春秋初期第一個以諸侯之力壓倒周王的君主，史稱「鄭莊小霸」。
  生時難產（寤生）而不見愛於母姜氏，母欲立弟共叔段。莊公縱段以驕之，
  待其反形已具乃一舉克之，遂有「多行不義必自斃」之語。
  其後以王朝卿士之位而抗周桓王，繻葛之戰射傷桓王之肩——
  天子之師敗於諸侯而天子受創，周室僅存的威權自此蕩然。
timeline:
