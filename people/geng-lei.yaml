id: geng-lei
name:
  zh: 更羸
  en: Geng Lei
state: wei
role: 將領
birth: null
death: null
sort_year: -330
bio: >-
  魏之善射者。與魏王處京臺之下，仰見飛鳥，謂「臣為王引弓虛發而下鳥」（白話：臣可以為大王空拉弓弦、不發箭就把鳥射下來）。有間，雁從東方來，更
  羸虛發而雁墜。王曰「射可至此乎」。更羸曰：「此孽也……其飛徐而鳴悲。飛徐者，故瘡痛也；鳴
  悲者，久失群也。故瘡未息而驚心未去也，聞弦音，引而高飛，故瘡隕也。」（白話：這是一隻有舊
  傷的鳥……牠飛得慢而叫聲悲。飛得慢，是舊傷還在痛；叫聲悲，是離群已久。舊傷未癒而驚懼未消
  ，一聽到弓弦的聲音，就拚命往高處飛，於是舊傷迸裂而墜落。）《戰國策》以此喻臨武君之不可為
  將——敗軍之將，聞戰而懼。
sources:
