sort_year: -330
bio: >-
  魏國善於射箭的人。他與魏王同在京臺之下，抬頭看見飛鳥，就說「臣為王引弓虛發而下鳥」（白話：臣可以為大王空拉弓弦、不發箭就把鳥射下來）。過了一會兒，有雁從東方飛來，更羸拉空弦而雁就掉了下來。魏王說「射可至此乎」。更羸說：「此孽也……其飛徐而鳴悲。飛徐者，故瘡痛也；鳴悲者，久失群也。故瘡未息而驚心未去也，聞弦音，引而高飛，故瘡隕也。」（白話：這是一隻有舊傷的鳥……牠飛得慢而叫聲悲。飛得慢，是舊傷還在痛；叫聲悲，是離群已久。舊傷未癒而驚懼未消，一聽到弓弦的聲音，就拚命往高處飛，於是舊傷迸裂而墜落。）《戰國策》用這個故事來說明臨武君不適合為將——打過敗仗的將領，一聽到打仗就害怕。
