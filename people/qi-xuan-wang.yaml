id: qi-xuan-wang
name:
  zh: 齊宣王
  personal: 辟疆
  clan: 媯
  house: 田
  posthumous: 宣
  en: King Xuan of Qi
state: tian-qi
role: 君主
birth: null
death: -301
sort_year: -319
bio: >-
  田齊的國君，稷下學宮在他在位時最為興盛，孟子、淳于髡、鄒衍都曾經在他門下遊學。孟子見到他，談過「以羊換牛」的不忍之心、「爬到樹上找魚」的不可行——《孟子·梁惠王》裡最著名的幾段對答都是跟這位國君談的。《韓非子·內儲說上》記載他「使人吹竽，必三百人」，南郭處士於是得以濫竽充數——這是先秦對「集體考核」制度缺陷最早的一次診斷。
sources:
