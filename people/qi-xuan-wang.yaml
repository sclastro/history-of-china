id: qi-xuan-wang
name:
  zh: 齊宣王
  personal: 辟疆
  clan: 媯
  house: 田
  posthumous: 宣
  en: King Xuan of Qi
state: tian-qi
role: 君主
birth: null
death: -301
sort_year: -319
bio: >-
  田齊之君，稷下學宮極盛於其時，孟子、淳于髡、鄒衍皆嘗游其門。
  孟子見之而論「以羊易牛」之不忍、「緣木求魚」之不可——
  《孟子·梁惠王》中最著名的幾段對答皆與此君。
  《韓非子·內儲說上》記其「使人吹竽，必三百人」，
  南郭處士遂得濫竽以充數——這是先秦對「集體考核」制度缺陷最早的診斷。
sources:
