id: zhuang-zi
name:
  zh: 莊子
  personal: 周
  house: 莊
  en: Zhuangzi
state: song
role: 思想家
birth: -369
death: -286
bio: >-
  宋國蒙地人，做過漆園小吏。楚威王聽說他賢能，派人帶厚禮去迎接他，答應讓他做相國，莊周笑著對使者說：「千金重利，卿相尊位也；子獨不見郊祭之犧牛乎？……我寧游戲污瀆之中自快，無為有國者所羈。」（白話：千金是厚利，卿相是尊位；可是您難道沒見過郊祭用的那頭牛嗎？……我寧可在污濁的小水溝裡自得其樂，也不要被有國者所束縛。）他終身沒有做官。他的書有十多萬字，「寓言十九」——庖丁解牛、朝三暮四、井底之蛙、螳臂當車、邯鄲學步、望洋興嘆、涸轍之鮒，都已進入漢語的日常用語而人們不覺得它們有出處。他所設計的人物言行一概不能當作史料，但這些寓言本身正是戰國思想的一手材料。
