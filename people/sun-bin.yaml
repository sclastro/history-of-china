bio: >-
  孫武之後，與龐涓俱學兵法。龐涓仕魏為將，自以能不及孫臏，
  乃陰召而以法刑斷其兩足、黥之，欲使終身廢而不見。
  齊使者竊載之入齊，田忌客之。以「批亢擣虛、形格勢禁」之理定圍魏救趙之策，
  桂陵（前 353）虜龐涓、馬陵（前 341）以減灶誘之而射殺之於馬陵道。
  銀雀山漢簡出土《孫臏兵法》，證實其書與《孫子》各自別行。
