bio: >-
  孫武的後代，與龐涓一起學過兵法。龐涓在魏國做將領，自認為才能比不上孫臏，就暗中把他召去，用刑砍斷他的兩腳並在臉上刺字，想讓他終身殘廢、不能見人。齊國使者偷偷用車把他載回齊國，田忌待他為上賓。他用「扼住要害、直搗空虛，使對方形勢受制」的道理定下圍魏救趙之策，桂陵之戰（前353）俘虜龐涓，馬陵之戰（前341）用減灶之計引誘他，在馬陵道上把他射殺。銀雀山漢墓出土的《孫臏兵法》，證實了他的書與《孫子》各自單獨流傳。
