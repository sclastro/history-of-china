id: jie-zhi-tui
name:
  zh: 介之推
  en: Jie Zhitui
state: jin
role: 卿大夫
birth: null
death: null
sort_year: -636
bio: >-
  跟隨重耳流亡的臣子。文公回國論功行賞，介之推不提自己的功勞，賞賜也就沒有輪到他。他說：「獻公之子九人，唯君在矣……天實置之，而二三子以為己力，不亦誣乎？竊人之財，猶謂之盜，況貪天之功以為己力乎？」（白話：獻公的九個兒子，如今只剩國君一人在世……這實在是上天安排的，而那幾位卻當作自己的功勞，不是欺騙嗎？偷別人的財物尚且叫做盜，何況把上天的功勞據為己有？）於是與母親一同隱居而死。文公找不到他，就把綿上一帶封為他的祭田，說「以志吾過，且旌善人」（白話：用來記下我的過失，並且表彰善人）。後世附加上去的「割股啖君」「焚山逼出」以及寒食的風俗，都不見於《左傳》。他所批評的不是文公刻薄，而是同僚的「貪天之功」——把歷史的偶然算作自己的功勞，這是一種認識論上的錯誤。
sources:
  - source: zuo-zhuan
    locus: 僖公二十四年
