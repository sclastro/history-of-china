id: shang-yang
name:
  zh: 商鞅
  personal: 鞅
  clan: 姬
  house: 公孫
  en: Shang Yang
state: qin
role: 卿大夫
birth: -390
death: -338
bio: >-
  衛國的庶出公子，所以稱衛鞅；在秦國為相有功，封於商地十五邑，號商君。他起初在魏國相國公叔痤手下做事，公叔痤病重時向魏惠王推薦他，還說「不用就殺掉他」，惠王兩樣都沒有聽。他聽說秦孝公求賢，就西行入秦，遊說三次之後才用富國強兵之術打動了孝公。變法有兩件事最關鍵：一是搬木頭立信用，表明法令說到做到；二是編組什伍實行連坐、廢除井田、開闢阡陌、獎勵農戰、明定軍功爵位、推行縣制。太子犯法，他處罰太子的師傅公子虔、在太子的老師公孫賈臉上刺字——「法之不行，自上犯之」（白話：法令推行不了，是因為上面的人帶頭違犯）。十年之後秦國百姓大為滿意，路不拾遺，鄉邑大治。孝公一死，公子虔一夥人告發他想造反。商鞅逃到關口下想住旅店，店主說「商君之法，舍人無驗者坐之」（白話：按商君的法令，收留沒有身分憑證的人，主人要連坐）——於是有了「作法自斃」的感歎。他在彤地被車裂，全族被誅；可是他的法沒有敗，秦國終究靠這套法統一了天下。
timeline:
  - year: -361
    event: 聞孝公求賢令，自魏入秦
  - year: -356
    event: 第一次變法：什伍連坐、重農抑商、軍功爵；徙木立信
  - year: -350
    event: 第二次變法：廢井田開阡陌、行縣制、徙都咸陽
  - year: -340
    event: 詐虜魏公子卬而破魏軍，魏獻河西之地；受封商於十五邑
  - year: -338
    event: 孝公卒，惠文王立；商鞅出亡不得舍，車裂而死
