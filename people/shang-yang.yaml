id: shang-yang
name:
  zh: 商鞅
  personal: 鞅
  clan: 姬
  house: 公孫
  en: Shang Yang
state: qin
role: 卿大夫
birth: -390
death: -338
bio: >-
  衛之庶公子，故稱衛鞅；相秦有功，封於商十五邑，號商君。
  初事魏相公叔痤，痤病，薦之魏惠王曰「不用則殺之」，惠王皆不從。
  聞秦孝公求賢，西入秦，三說而後以強國之術動之。
  變法二事：徙木立信以示令必行，作什伍連坐、廢井田、開阡陌、
  重農戰、明軍功爵、行縣制。太子犯法，刑其傅公子虔、黥其師公孫賈——
  「法之不行，自上犯之」（白話：法令推行不了，是因為上面的人帶頭違犯）。十年而秦民大悅、道不拾遺、鄉邑大治。
  孝公卒，公子虔之徒告其欲反。商鞅亡至關下欲舍客舍，
  舍人曰「商君之法，舍人無驗者坐之」（白話：按商君的法令，收留沒有身分憑證的人，主人要連坐）——遂有「作法自斃」之歎。
  車裂於彤，滅其族；而其法未敗，秦卒以此并天下。
timeline:
  - year: -361
    event: 聞孝公求賢令，自魏入秦
  - year: -356
    event: 第一次變法：什伍連坐、重農抑商、軍功爵；徙木立信
  - year: -350
    event: 第二次變法：廢井田開阡陌、行縣制、徙都咸陽
  - year: -340
    event: 詐虜魏公子卬而破魏軍，魏獻河西之地；受封商於十五邑
  - year: -338
    event: 孝公卒，惠文王立；商鞅出亡不得舍，車裂而死
sources:
