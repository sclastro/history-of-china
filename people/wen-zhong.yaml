id: wen-zhong
name:
  zh: 文種
  house: 文
  en: Wen Zhong
state: yue
role: 卿大夫
birth: null
death: -472
sort_year: -494
bio: >-
  與范蠡同為句踐謀主。獻「伐吳七術」，行賄吳太宰嚭以間伍子胥，又借粟於吳而還以蒸熟之種——
  皆陰謀之尤者。句踐入吳為質，文種留守國政。滅吳之後，范蠡去而遺書勸之，文種稱病不朝，或讒
  之曰種且作亂。句踐賜劍曰：「子教寡人伐吳七術，寡人用其三而敗吳，其四在子，子為我從先王試
  之。」（白話：你教過寡人討伐吳國的七條計策，寡人只用了三條就打敗了吳國，剩下四條還在你身
  上——你替我到先王那裡去試試吧。）文種遂自殺——「鳥盡弓藏」的原始注腳。
