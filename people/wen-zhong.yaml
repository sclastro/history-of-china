id: wen-zhong
name:
  zh: 文種
  house: 文
  en: Wen Zhong
state: yue
role: 卿大夫
birth: null
death: -472
sort_year: -494
bio: >-
  與范蠡同為句踐的主要謀臣。他獻上「伐吳七術」，用賄賂收買吳國太宰嚭去離間伍子胥，又向吳國借糧而還回蒸熟的種子——都是陰謀中的極致。句踐到吳國做人質期間，文種留守國政。滅吳之後，范蠡離去並留書勸他也走，文種便稱病不上朝，有人趁機進讒說文種將要作亂。句踐賜劍給他說：「子教寡人伐吳七術，寡人用其三而敗吳，其四在子，子為我從先王試之。」（白話：你教過寡人討伐吳國的七條計策，寡人只用了三條就打敗了吳國，剩下四條還在你身上——你替我到先王那裡去試試吧。）文種於是自殺——這是「鳥盡弓藏」最原始的注腳。
