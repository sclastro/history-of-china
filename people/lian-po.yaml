bio: >-
  趙國名將，以勇猛聞名於諸侯。他討伐齊國並打敗齊軍，被任命為上卿。藺相如憑口舌之功而位次在他之上，廉頗不服，揚言一定要羞辱他；相如處處迴避，門客勸諫，相如用「兩虎共鬥、其勢不俱生」（白話：兩隻老虎相鬥，勢必不能同時存活）的道理開導他們。廉頗聽說後便脫去上衣、背著荊條，由賓客引領到門前謝罪，兩人於是成為生死之交。長平之戰初期他任主將，堅守營壘不出戰，要拖垮秦軍——秦國施行反間計，趙王改派趙括代替他，於是有了四十萬人被活埋的慘劇。晚年他離開趙國住在魏國，趙王想再起用他，使者收了郭開的賄賂，回報說「廉將軍雖老，尚善飯，然與臣坐，頃之三遺矢矣」（白話：廉將軍雖然老了，飯量還好；不過與臣同坐的一頓飯工夫裡，他就上了三次廁所），趙王於是不再召他。
