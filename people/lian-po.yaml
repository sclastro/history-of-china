id: lian-po
name:
  zh: 廉頗
  house: 廉
  en: Lian Po
state: zhao
role: 將領
birth: null
death: null
sort_year: -283
bio: >-
  趙之良將，以勇氣聞於諸侯。伐齊破之，拜為上卿。藺相如以口舌之功而位居其上，廉頗不服，宣言
  必辱之；相如引避，門客諫，相如以「兩虎共鬥、其勢不俱生」曉之。廉頗聞而肉袒負荊，因賓客至
  門謝罪，遂為刎頸之交。長平之戰初為將，堅壁不出以老秦師——秦行反間，趙王以趙括代之，遂有
  四十萬之坑。晚年去趙居魏，趙王欲復用之，使者受郭開之賂，還報曰「廉將軍雖老，尚善飯，然與
  臣坐，頃之三遺矢矣」（白話：廉將軍雖然老了，飯量還好；不過與臣同坐的一頓飯工夫裡，他就上
  了三次廁所），遂不召。
