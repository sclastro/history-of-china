id: zi-lu
name:
  zh: 子路
  en: Zilu
state: lu
role: 卿大夫
birth: -542
death: -480
sort_year: -500
bio: >-
  名仲由，字子路，又字季路，孔子弟子中年長者之一，以勇武與直率著稱。他初見孔子時頭戴雄雞之冠、腰佩公豬之飾，態度粗野，孔子以禮樂漸漸引導他，才委身為弟子。《論語》中他問政、問成人、問事君，屢屢被孔子當面責備而不改其直；問衛君待先生為政將先做甚麼，孔子答「必也正名乎」，他即回一句「有是哉，子之迂也」（白話：有這種事嗎？先生也太迂闊了），是《論語》裡少見的當面頂撞。孔子評他「由也升堂矣，未入於室也」（白話：仲由已經登上廳堂，只是還沒有進入內室），「登堂入室」由此而來。後仕衛為蒲邑大夫，衛國父子爭位之亂中赴難，被擊斷冠纓，說「君子死，冠不免」，結纓而死。孔子聞訊，把家中的肉醬倒掉了。
