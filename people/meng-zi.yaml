id: meng-zi
name:
  zh: 孟子
  personal: 軻
  house: 孟
  en: Mencius
state: lu
role: 思想家
birth: -372
death: -289
bio: >-
  鄒國人，受業於子思的門人。他遊歷齊、宋、滕、魏各國，提倡仁政、民本與性善之說，以「民為貴，社稷次之，君為輕」（白話：百姓最重要，國家其次，君主最輕）立論。所到之處都受到禮遇卻不被任用——當時各國正忙於合縱連橫、把攻伐當作本事，而孟子開口就談堯舜，「見以為迂遠而闊於事情」（白話：被認為迂闊遙遠，不切實際）。他退下來與萬章等弟子整理《詩》《書》、闡述孔子的意旨，寫成《孟子》七篇。他的書善於用比喻來折服君主：用揠苗助長來講養氣、用五十步笑百步來答梁惠王、用緣木求魚來答齊宣王——寓言在他手裡不是修辭，而是論證。
