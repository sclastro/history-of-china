id: zou-ji
name:
  zh: 鄒忌
  en: Zou Ji
state: qi
role: 卿大夫
birth: null
death: null
sort_year: -350
bio: >-
  齊威王之相，封成侯。他身高八尺有餘、容貌美麗。一天早上他問妻子、妾、來客三人：自己與城北徐公誰美？三人都說他美。等徐公來了，他仔細端詳，自認不如；晚上躺著想通了：「吾妻之美我者，私我也；妾之美我者，畏我也；客之美我者，欲有求於我也。」（白話：我妻子說我美，是偏愛我；小妾說我美，是害怕我；客人說我美，是有求於我。）他把這件家事帶進朝堂，對威王說齊國地方千里、城池百二十，宮中妃嬪偏愛您、群臣畏懼您、四境之內有求於您——「由此觀之，王之蔽甚矣」（白話：這樣看來，大王受到的蒙蔽太嚴重了）。威王於是下令：當面指出過失的受上賞，上書勸諫的受中賞，在公共場所議論而傳到君主耳中的受下賞。令下之初，「門庭若市」（白話：門口和庭院裡人多得像市集）；幾個月後間或有人進言；一年之後就算想說也沒有什麼可說了。「門庭若市」由此而來。
