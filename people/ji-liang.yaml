  en: Ji Liang
state: wei
role: 策士
birth: null
death: null
sort_year: -340
bio: >-
  魏國臣子。魏王想攻打邯鄲，季梁半路折回，衣服皺了來不及撫平、頭上的塵土來不及拍掉，就去見魏王說：「今者臣來，見人於大行，方北面而持其駕，告臣曰『我欲之楚』。臣曰『君之楚，將奚為北面？』曰『吾馬良』……曰『吾用多』……曰『吾御者善』。此數者愈善，而離楚愈遠耳。」（白話：今天臣來的路上，在大路旁見到一個人，正把車頭朝北趕著，卻告訴臣說「我要去楚國」。臣問：「您要去楚國，怎麼往北走？」他說「我的馬好」……說「我的路費多」……說「我的車夫技術好」。這幾樣越好，離楚國反而越遠。）「今王動欲成霸王，舉欲信於天下；恃王國之大、兵之精銳而攻邯鄲，以廣地尊名——王之動愈數而離王愈遠耳，猶至楚而北行也。」（白話：如今大王一舉一動都想成就霸業、想取信於天下；卻仗著國家大、兵精銳而去攻打邯鄲，藉此擴地揚名——大王這樣的行動越多，離王業反而越遠，就跟要去楚國卻往北走一樣。）
