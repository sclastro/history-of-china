id: ji-liang
name:
  zh: 季梁
  en: Ji Liang
state: wei
role: 策士
birth: null
death: null
sort_year: -340
bio: >-
  魏臣。魏王欲攻邯鄲，季梁中道而返，衣焦不申、頭塵不去，往見王曰：「今者臣來，見人於大行，
  方北面而持其駕，告臣曰『我欲之楚』。臣曰『君之楚，將奚為北面？』曰『吾馬良』……曰『吾用
  多』……曰『吾御者善』。此數者愈善，而離楚愈遠耳。」（白話：今天臣來的路上，在大路旁見到
  一個人，正把車頭朝北趕著，卻告訴臣說「我要去楚國」。臣問：「您要去楚國，怎麼往北走？」他
  說「我的馬好」……說「我的路費多」……說「我的車夫技術好」。這幾樣越好，離楚國反而越遠。
  ）「今王動欲成霸王，舉欲信於天下；恃王國之大、兵之精銳而攻邯鄲，以廣地尊名——王之動愈數
  而離王愈遠耳，猶至楚而北行也。」（白話：如今大王一舉一動都想成就霸業、想取信於天下；卻仗
  著國家大、兵精銳而去攻打邯鄲，藉此擴地揚名——大王這樣的行動越多，離王業反而越遠，就跟要
  去楚國卻往北走一樣。）
