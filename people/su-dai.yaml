id: su-dai
name:
  zh: 蘇代
  house: 蘇
  en: Su Dai
state: yan
role: 策士
birth: null
death: null
sort_year: -290
bio: >-
  蘇秦之弟，戰國縱橫策士。趙且伐燕，蘇代為燕謂趙惠王曰：「今者臣來，過易水，蚌方出曝而鷸啄
  其肉，蚌合而箝其喙。鷸曰『今日不雨，明日不雨，即有死蚌』；蚌亦謂鷸曰『今日不出，明日不出
  ，即有死鷸』。兩者不肯相舍，漁者得而并禽之。今趙且伐燕，燕趙久相支以敝大眾，臣恐強秦之為
  漁父也。」（白話：今天臣來的時候，經過易水，看見河蚌正出來曬太陽，鷸鳥去啄牠的肉，河蚌合
  起殼夾住鷸的嘴。鷸說：今天不下雨、明天不下雨，就有一隻死蚌；河蚌也對鷸說：今天不放開、明
  天不放開，就有一隻死鷸。兩個都不肯放手，漁夫就把牠們一併捉走了。如今趙國要攻打燕國，燕趙
  長久相持而使兩國百姓疲敝，臣恐怕強大的秦國就是那個漁夫。）惠王曰「善」，乃止。這是戰國外
  交中「第三方得利」邏輯最精煉的一次表述。
sources:
