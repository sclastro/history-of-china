id: wei-hui-wang
name:
  zh: 魏惠王
  personal: 罃
  clan: 姬
  house: 魏
  posthumous: 惠
  en: King Hui of Wei (King Hui of Liang)
state: wei
role: 君主
birth: -400
death: -319
bio: >-
  魏武侯的兒子，在位五十年。他把國都遷到大梁，所以也稱梁惠王；《莊子·養生主》裡的「文惠君」一般也認為就是他。即位之初承接文侯、武侯的基業，魏國是天下最強的國家；然而桂陵（前353）、馬陵（前341）兩次敗給齊國，又敗給秦國而獻出河西之地，霸業於是衰落。他自己說「東敗於齊，長子死焉；西喪地於秦七百里；南辱於楚」（白話：東邊敗給齊國，長子也死在那裡；西邊丟給秦國七百里土地；南邊又受辱於楚國），孟子見到他，開口第一句就是「王何必曰利」。他是戰國中期最著名的失敗者——不是因為不努力，而是因為他的努力全用在爭霸的舊路上。
