id: chen-zhen
name:
  zh: 陳軫
  en: Chen Zhen
state: qin
role: 策士
birth: null
death: null
sort_year: -323
bio: >-
  戰國策士，先事秦而後事楚，與張儀爭寵於秦惠王。
  楚將昭陽既破魏軍、殺其將、得八城，又移兵攻齊。
  齊王使陳軫往說之。陳軫問楚國之制：破軍殺將者何官？
  曰上柱國。上柱國之上更有何官？曰唯令尹耳。
  乃言祠者賜舍人卮酒、共畫地為蛇先成者飲之事——
  一人蛇先成，左手持卮、右手畫蛇曰「吾能為之足」，
  未成而他人蛇成，奪其卮曰「蛇固無足，子安能為之足」，遂飲之。
  「今君相楚而攻魏，破軍殺將得八城……又移兵欲攻齊，
  戰無不勝而不知止者，身且死，爵且後歸，猶為蛇足也。」昭陽乃引兵去。
