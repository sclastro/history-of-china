id: chen-zhen
name:
  zh: 陳軫
  en: Chen Zhen
state: qin
role: 策士
birth: null
death: null
sort_year: -323
bio: >-
  戰國策士，先在秦國做事而後轉事楚國，在秦惠王面前與張儀爭寵。楚將昭陽已經打敗魏軍、殺了魏將、奪得八座城，又轉移兵力去攻打齊國。齊王派陳軫前去遊說他。陳軫先問起楚國的官制：擊破敵軍、殺死敵將的封什麼官？回答是上柱國。上柱國之上還有什麼官？回答是只有令尹了。陳軫於是講了主祭人賞給門客一壺酒、大家在地上畫蛇、先畫成的人喝酒那件事——有一個人先畫成了，左手端著酒壺、右手繼續畫蛇說「吾能為之足」，還沒畫完別人的蛇已經畫成，把酒壺奪過去說「蛇固無足，子安能為之足」（白話：蛇本來就沒有腳，你怎麼能給牠添腳），就把酒喝了。「今君相楚而攻魏，破軍殺將得八城（白話：如今您做楚國令尹去攻魏，破敵軍、殺敵將、取得八城）……又移兵欲攻齊，戰無不勝而不知止者，身且死，爵且後歸，猶為蛇足也。」（白話：如今您身為楚國宰相而攻打魏國，破軍殺將、拿下八座城……又轉移兵力想去攻齊。打仗百戰百勝卻不知道適可而止的人，最後會身死名裂，爵位還要落到別人後頭——這就跟給蛇添腳一樣。）昭陽於是撤兵離去。
