bio: >-
  晉六卿之趙氏宗主。智伯索地，韓魏與之而趙不與，
  智伯遂率韓魏圍晉陽，決汾水以灌之，城不浸者三版，
  「懸釜而炊，易子而食」（白話：把鍋吊起來煮飯，交換孩子來吃）。襄子使張孟談潛出說韓魏，
  三家反攻，前 453 年殺智伯於晉陽城下而三分其地——
  這一年才是戰國的實際起點，比周威烈王命三晉為諸侯（前 403）早半世紀。
  襄子漆智伯之頭以為飲器，豫讓為之報仇者再，襄子義之而終殺之。
