bio: >-
  晉國六卿之中趙氏的宗主。智伯向各家索取土地，韓、魏給了而趙氏不給，智伯於是率韓魏兩家圍攻晉陽，掘開汾水灌城，城牆沒被淹到的只剩三版高，城裡「懸釜而炊，易子而食」（白話：把鍋吊起來煮飯，交換孩子來吃）。襄子派張孟談偷偷出城遊說韓、魏，三家反過來夾攻，前453年在晉陽城下殺了智伯而三分他的土地——這一年才是戰國真正的起點，比周威烈王正式承認三晉為諸侯（前403）早了半個世紀。襄子把智伯的頭顱塗漆做成飲器，豫讓兩次替智伯報仇，襄子敬重他的義氣，最終還是把他殺了。
