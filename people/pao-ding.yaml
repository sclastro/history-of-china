id: pao-ding
name:
  zh: 庖丁
  en: Cook Ding
state: wei
role: 工匠
birth: null
death: null
sort_year: -350
bio: >-
  《莊子·養生主》中的廚師，歷史上並無其人。他替文惠君分解牛體，手所觸、肩所倚、腳所踩、膝所抵，發出嘩嘩的響聲，運刀時霍霍作響，沒有一下不合乎音律，既合於《桑林》之舞的節拍，又合於《經首》之樂的韻律。他自己說「臣之所好者道也，進乎技矣」（白話：臣所愛好的是道，已經超過技術了）——剛開始解牛時，眼裡看到的無非是整頭牛；三年之後，就再也看不見整頭牛了；到了現在，他用心神去接觸而不用眼睛去看。刀用了十九年而刀刃像剛磨過一樣，就因為他「依乎天理」「以無厚入有間」。文惠君說：「善哉！吾聞庖丁之言，得養生焉。」（白話：好啊！我聽了庖丁這番話，領悟到養生的道理了。）
sources:
  - source: zhuangzi
    locus: 養生主
    ctext_urn: ctp:zhuangzi/nourishing-the-lord-of-life
notes: 寓言人物，非史有其人；state 欄取文惠君所在之魏，僅為索引之便。
