id: pao-ding
name:
  zh: 庖丁
  en: Cook Ding
state: wei
role: 工匠
birth: null
death: null
sort_year: -350
bio: >-
  《莊子·養生主》中的廚人，非史有其人。為文惠君解牛，
  手觸、肩倚、足履、膝踦，砉然嚮然，奏刀騞然，莫不中音，
  合於《桑林》之舞、中《經首》之會。自言「臣之所好者道也，進乎技矣」——
  始解牛時所見無非全牛，三年之後未嘗見全牛，方今則以神遇而不以目視。
  刀十九年而刃若新發於硎，以其「依乎天理」「以無厚入有間」。
  文惠君曰：「善哉！吾聞庖丁之言，得養生焉。」
sources:
  - source: zhuangzi
    locus: 養生主
    ctext_urn: ctp:zhuangzi/nourishing-the-lord-of-life
notes: 寓言人物，非史有其人；state 欄取文惠君所在之魏，僅為索引之便。
