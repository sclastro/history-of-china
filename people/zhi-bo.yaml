id: zhi-bo
name:
  zh: 智伯
  personal: 瑤
  house: 智
  en: Zhi Bo (Earl Zhi)
state: jin
role: 卿大夫
birth: null
death: -453
sort_year: -453
bio: >-
  晉六卿之首，智氏宗主。滅范氏、中行氏後獨強，
  盡取其地而復索地於韓、魏、趙。韓魏懼而與之，趙襄子不與，
  遂率二家圍晉陽三年。方水灌晉陽時，智伯巡城曰
  「吾乃今知水可以亡人國也」——魏桓子、韓康子肘足相示，
  蓋汾水可灌安邑、絳水可灌平陽，此語適足以自警二家。
  其臣絺疵察之而諫，智伯不聽，反以告韓魏。
  三家反攻，智伯身死國分。《資治通鑑》以此為全書之始，
  司馬光論曰：「智伯之亡也，才勝德也。」
