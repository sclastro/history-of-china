id: zhi-bo
name:
  zh: 智伯
  personal: 瑤
  house: 智
  en: Zhi Bo (Earl Zhi)
state: jin
role: 卿大夫
birth: null
death: -453
sort_year: -453
bio: >-
  晉國六卿之首，智氏的宗主。他滅掉范氏、中行氏之後獨大，奪盡兩家的土地還向韓、魏、趙索取。韓魏害怕而給了，趙襄子不給，他就率領韓魏兩家圍攻晉陽三年。用水灌晉陽的時候，智伯巡視城防說「吾乃今知水可以亡人國也」（白話：我今天才知道，水可以用來滅掉一個國家）——魏桓子、韓康子用手肘和腳互相示意，因為汾水可以灌魏的安邑、絳水可以灌韓的平陽，這句話正好提醒了兩家。他的臣子絺疵看出苗頭而勸諫，智伯不聽，反而把話告訴了韓魏。三家反過來夾攻，智伯身死而智氏土地被瓜分。《資治通鑑》把這件事當作全書的開端，司馬光評論說：「智伯之亡也，才勝德也。」（白話：智伯之所以敗亡，是因為才能勝過德行。）
