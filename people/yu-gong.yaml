id: yu-gong
name:
  zh: 虞公
  clan: 姬
  en: Duke of Yu
state: yu
role: 君主
birth: null
death: null
sort_year: -655
bio: >-
  虞國的國君。他貪圖晉國屈地產的良馬和垂棘的美玉，兩次答應借道給晉國去攻打虢國。宮之奇用唇亡齒寒的道理勸諫，虞公回答「晉，吾宗也，豈害我哉」（白話：晉國是我的同宗，難道會害我嗎），又說「吾享祀豐絜，神必據我」。宮之奇反駁他：「鬼神非人實親，惟德是依。」（白話：鬼神並不真的親近某個人，只依附有德者。）他終究不聽。晉國滅掉虢國回師時，順手就把虞公抓了。他是先秦最著名的短視之君，可悲之處不在於被騙，而在於被同一手法騙了兩次。
sources:
