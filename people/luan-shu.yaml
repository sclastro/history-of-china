bio: >-
  晉國正卿，諡號武，所以稱欒武子。邲之戰時他任下軍佐，極力主張不可討伐楚國：「楚自克庸以來，其君無日不討國人而訓之于民生之不易、禍至之無日、戒懼之不可以怠……訓之以若敖、蚡冒篳路藍縷以啟山林。」（白話：楚國自從攻克庸國以來，國君沒有一天不召集國人訓誡：民生不易、禍患隨時會來、戒懼不可鬆懈……還用先君若敖、蚡冒駕柴車、穿破衣去開闢山林的事跡教導他們。）「篳路藍縷」四個字就出自這一段——他用楚國人自述先祖創業艱難的做法，來論證楚國內部的凝聚力，這是春秋時代少見的、以敵國政治文化為判斷根據的戰略分析。後來他做了中軍元帥，鄢陵之戰打敗楚國，晉國重新稱霸。晚年他殺了厲公而擁立悼公。
