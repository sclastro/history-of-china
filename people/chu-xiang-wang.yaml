id: chu-xiang-wang
name:
  zh: 楚頃襄王
  personal: 橫
  house: 熊
  posthumous: 頃襄
  en: King Qingxiang of Chu
state: chu
role: 君主
birth: null
death: -263
sort_year: -298
bio: >-
  楚懷王的兒子。父親被誘騙扣留、死在秦國而他無力雪恥，在位期間荒淫安逸。前278年秦將白起攻下郢都、焚燒夷陵，楚國遷都到陳。屈原自沉汨羅就在這前後。失去國都之後他才召回莊辛，採用莊辛的建議收攏東部的兵力，重新奪回淮北十幾座城——這就是「亡羊補牢」的出處。楚國從此偏安淮河一帶五十多年，最終被秦國所滅。
