id: qi-min-wang
name:
  zh: 齊湣王
  personal: 地
  clan: 媯
  house: 田
  posthumous: 湣
  en: King Min of Qi
state: tian-qi
role: 君主
birth: null
death: -284
sort_year: -300
bio: >-
  齊宣王的兒子。他滅掉宋國（前286）而引起諸侯側目，一度與秦昭王並稱東帝、西帝。後來燕昭王派樂毅聯合五國的兵力攻齊，攻下七十多座城，湣王出逃，被楚將淖齒所殺。齊國幾乎滅亡，靠田單以即墨為據點才復國。《韓非子》記載他「好一一聽之」——宣王在位時吹竽一定要三百人合奏，南郭處士因此得以混在裡面湊數；湣王改為一個一個單獨吹奏，處士只好逃走。同一項制度細節的一點改動，就篩掉了一個混在裡面的人。
