id: fu-chai
name:
  zh: 吳王夫差
  personal: 夫差
  clan: 姬
  en: King Fuchai of Wu
state: wu
role: 君主
birth: null
death: -473
sort_year: -495
bio: >-
  闔閭之子。父傷於越而死，遺命勿忘，夫差使人立於庭，
  出入必呼「夫差，而忘越王之殺而父乎」（白話：夫差，你忘了越王殺你父親的仇嗎）——這才是「不忘國恥」故事的原型，
  後世卻把它整個轉移到了句踐身上。
  前 494 年夫椒大敗越軍，伍子胥諫「越不可赦」而不聽，許越之成。
  其後北上爭霸，敗齊於艾陵，會諸侯於黃池而與晉爭長，
  國內空虛，越乘之而入。前 473 年城破，夫差請為越之附庸不許，
  乃自剄，曰「吾無面以見子胥也」（白話：我沒有臉去見伍子胥）。
