id: fu-chai
name:
  zh: 吳王夫差
  personal: 夫差
  clan: 姬
  en: King Fuchai of Wu
state: wu
role: 君主
birth: null
death: -473
sort_year: -495
bio: >-
  吳王闔閭的兒子。父親被越國所傷而死，臨終囑咐他不要忘記，夫差就派人站在庭院裡，自己每次出入都要被叫一聲「夫差，而忘越王之殺而父乎」（白話：夫差，你忘了越王殺你父親的仇嗎）——這才是「不忘國恥」故事的原型，後世卻把它整個轉移到了句踐身上。前494年夫椒之戰大敗越軍，伍子胥勸諫「越不可赦」而他不聽，答應了越國的求和。後來他北上爭霸，在艾陵打敗齊國，在黃池會合諸侯而與晉國爭當盟主，國內因此空虛，越國乘虛攻入。前473年都城被攻破，夫差請求做越國的附庸而不被允許，於是自刎，臨死說「吾無面以見子胥也」（白話：我沒有臉去見伍子胥）。
