sort_year: -611
bio: >-
  楚大夫，伍子胥之祖。楚莊王即位三年不理政事而下令拒諫，伍舉入見，以隱語問之：「有鳥在於阜
  ，三年不蜚不鳴，是何鳥也？」（白話：有隻鳥停在土山上，三年不飛不叫，這是什麼鳥？）王曰：
  「三年不蜚，蜚將沖天；三年不鳴，鳴將驚人。」（白話：三年不飛，一飛就要沖天；三年不叫，一
  叫就要驚人。）數月後莊王罷淫樂而聽政。此事《韓非子·喻老》繫於楚莊王而不著諫者之名，《史
  記·楚世家》以為伍舉，《史記·滑稽列傳》則另有齊威王與淳于髡的同型故事。
