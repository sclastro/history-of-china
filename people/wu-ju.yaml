bio: >-
  楚國大夫，伍子胥的祖父。楚莊王即位三年不理政事，還下令拒絕進諫，伍舉入宮進見，用隱語問他：「有鳥在於阜，三年不蜚不鳴，是何鳥也？」（白話：有隻鳥停在土山上，三年不飛不叫，這是什麼鳥？）莊王說：「三年不蜚，蜚將沖天；三年不鳴，鳴將驚人。」（白話：三年不飛，一飛就要沖天；三年不叫，一叫就要驚人。）幾個月後莊王停止荒樂、開始理政。這件事《韓非子·喻老》繫在楚莊王名下而沒有寫明進諫者是誰，《史記·楚世家》認為是伍舉，《史記·滑稽列傳》則另有齊威王與淳于髡的同型故事。
