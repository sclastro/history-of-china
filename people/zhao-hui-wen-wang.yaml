id: zhao-hui-wen-wang
name:
  zh: 趙惠文王
  personal: 何
  clan: 嬴
  house: 趙
  posthumous: 惠文
  en: King Huiwen of Zhao
state: zhao
role: 君主
birth: null
death: -266
sort_year: -298
bio: >-
  趙武靈王的小兒子，因為父親傳位而即位，後來沙丘之亂中父親餓死。在位三十三年，任用藺相如、廉頗、趙奢、平原君，在秦國的壓迫下屢次挫敗它的鋒芒——完璧歸趙、澠池之會、閼與大捷都發生在他這一朝。趙國是崤山以東六國中唯一能與秦國正面抗衡的，這份本錢大半積累於此時。
