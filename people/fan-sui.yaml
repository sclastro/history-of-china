id: fan-sui
name:
  zh: 范睢
  en: Fan Sui
state: qin
role: 策士
birth: null
death: -255
sort_year: -266
bio: >-
  魏國人，本事魏中大夫須賈。隨須賈出使齊國，齊襄王聞其辯才而賜金，須賈疑他洩露國情，回國告發於相國魏齊。魏齊命人鞭笞至肋折齒落，以葦席裹屍棄於廁中。他裝死得脫，改名張祿，由秦使王稽帶入秦國。入秦後說秦昭王行遠交近攻之策——結交遠方的齊楚而先取相鄰的韓魏，「得寸則王之寸也，得尺亦王之尺也」（白話：奪得一寸就是大王的一寸，奪得一尺也是大王的一尺）。又勸昭王廢宣太后、逐穰侯等四貴，收回君權。任相之後他報舊怨：迫魏齊自殺；而對出使秦國時見他衣衫襤褸、贈他一件綈袍的須賈則加以寬免。《史記》記其為人「一飯之德必償，睚眥之怨必報」（白話：一頓飯的恩德一定報答，瞪一眼的怨恨也一定報復）——「睚眥必報」由此而來。後因所薦鄭安平降趙、王稽通敵，引咎謝病歸相印。
