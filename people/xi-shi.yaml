id: xi-shi
name:
  zh: 西施
  en: Xi Shi
state: yue
role: 君主
birth: null
death: null
sort_year: -490
bio: >-
  越之美女，相傳文種行美人計獻於吳王夫差。其事不見於《左傳》《國語》《史記》，
  最早僅《莊子》以「西施病心而矉其里」為喻，《管子》《墨子》偶及其名以言美，
  獻吳的情節要到東漢《越絕書》《吳越春秋》才完備。
  《莊子·天運》記醜人見而美之，歸亦捧心而矉，里人見之閉門不出——
  「東施效顰」由此而來，而「東施」之名更是宋以後才有。
sources:
  - source: zhuangzi
    locus: 天運
    ctext_urn: ctp:zhuangzi/revolution-of-heaven
notes: >-
  role 欄暫填「君主」（本站分類未設此類），其人是否實有其事亦不可考；
  相關條目一律標 reliability: 寓言 或 後世附會。
