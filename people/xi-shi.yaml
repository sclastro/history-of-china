id: xi-shi
name:
  zh: 西施
  en: Xi Shi
state: yue
role: 君主
birth: null
death: null
sort_year: -490
bio: >-
  越國的美女，相傳文種施行美人計把她獻給吳王夫差。這件事在《左傳》《國語》《史記》中都找不到，最早只有《莊子》用「西施病心而矉其里」（白話：西施心口疼而在鄉里間皺眉）作比喻，《管子》《墨子》偶爾提到她的名字來形容美，獻給吳國的情節要到東漢的《越絕書》《吳越春秋》才完備。《莊子·天運》記載醜女看見她皺眉覺得好看，回去也捧著心口皺眉，鄉里人見了都關門不出——「東施效顰」由此而來，而「東施」這個名字更是宋代以後才有的。
sources:
  - source: zhuangzi
    locus: 天運
    ctext_urn: ctp:zhuangzi/revolution-of-heaven
notes: >-
  role 欄暫填「君主」（本站分類未設此類），其人是否實有其事亦不可考；
  相關條目一律標 reliability: 寓言 或 後世附會。
