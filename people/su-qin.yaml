id: su-qin
name:
  zh: 蘇秦
  house: 蘇
  en: Su Qin
state: zhou
role: 策士
birth: null
death: -284
sort_year: -333
bio: >-
  東周洛陽人。他起初用連橫之說遊說秦惠王，上書十次都沒被採納，黑貂皮裘穿破了、百斤黃金也花光了，形容枯槁地回家；妻子不肯下織機，嫂子不肯替他做飯，父母不跟他說話。他於是連夜翻書，攤開幾十個書箱，找到姜太公《陰符》的謀略，伏案誦讀，讀到想睡就拿錐子扎自己的大腿。一年之後揣摩有成，就用合縱之說遊說六國，佩上六國相印。路過洛陽時，父母到三十里外迎接，妻子不敢正視、嫂子像蛇一樣匍匐爬行，蘇秦問嫂子「何前倨而後恭也」，嫂子說「以季子之位尊而多金」（白話：因為小叔你地位尊貴而且錢多）。蘇秦長歎說：「此一人之身，富貴則親戚畏懼之，貧賤則輕易之，況眾人乎！」（白話：同樣是這一個人，富貴的時候親戚都畏懼他，貧賤的時候就輕視他——何況一般人呢！）這就是「前倨後恭」的出處。
sources:
