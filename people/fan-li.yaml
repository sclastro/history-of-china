bio: >-
  楚國宛地人而在越國做事。句踐困守會稽時，范蠡主張「卑辭厚禮以遺之」，並且陪同句踐到吳國做了三年人質。回國後輔佐句踐二十多年，終於滅掉吳國。大功告成那天，他乘船由海路離去，留書給文種說：「蜚鳥盡，良弓藏；狡兔死，走狗烹。越王為人長頸鳥喙，可與共患難，不可與共樂。子何不去？」（白話：飛鳥打盡了，好弓就被收藏起來；狡兔死光了，獵狗就被烹煮。越王這個人長頸鳥嘴，可以和他共患難，不可以和他共安樂。你為什麼不走呢？）文種沒有走，果然被賜死。范蠡則改名換姓，到陶地做了朱公，三次積聚起千金家產又三次散盡。他是先秦少數對權力的性質有清醒認識、並且真正照此行動的人。
