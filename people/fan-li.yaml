sort_year: -494
bio: >-
  楚宛人而事越。句踐棲會稽，范蠡主「卑辭厚禮以遺之」，並隨句踐入質於吳三年。歸而佐之二十餘
  年，卒以滅吳。功成之日，浮海而去，遺書文種曰：「蜚鳥盡，良弓藏；狡兔死，走狗烹。越王為人
  長頸鳥喙，可與共患難，不可與共樂。子何不去？」（白話：飛鳥打盡了，好弓就被收藏起來；狡兔
  死光了，獵狗就被烹煮。越王這個人長頸鳥嘴，可以和他共患難，不可以和他共安樂。你為什麼不走
  呢？）文種不去，果賜死。范蠡則變名易姓，之陶為朱公，「三致千金」而三散之。他是先秦少數對
  權力的性質有清醒認識、且真正據此行動的人。
sources:
