id: qi-jing-gong
name:
  zh: 齊景公
  personal: 杵臼
  clan: 姜
  house: 呂
  posthumous: 景
  en: Duke Jing of Qi
state: qi
role: 君主
birth: null
death: -490
sort_year: -547
bio: >-
  在位五十八年，是齊國在位最久的國君。他有晏嬰、司馬穰苴這樣的人才，卻無法重現桓公的霸業；一味修築宮室、蓄養狗馬、賦稅繁重刑罰嚴苛，齊國百姓落到「鞋子便宜、假腳昂貴」的地步。孔子到齊國，景公問他為政之道，孔子回答「君君、臣臣、父父、子子」（白話：君要像君、臣要像臣、父要像父、子要像子）；再問，回答「政在節財」。景公想把尼谿一帶的田地封給孔子，晏嬰勸阻了。他晚年時，田氏用大斗借出、小斗收回的辦法收攏民心，齊國的政權已在悄悄轉移——景公一朝表面上的繁盛，正是姜姓齊國被架空的過程。
