id: jiang-yi
name:
  zh: 江乙
  en: Jiang Yi
state: chu
role: 策士
birth: null
death: null
sort_year: -350
bio: >-
  本是魏國人而在楚宣王手下做事。宣王問群臣「吾聞北方之畏昭奚恤也，果誠何如」（白話：我聽說北方諸國都害怕昭奚恤，這到底是怎麼回事），群臣沒有人答得上來。江乙用老虎和狐狸的比喻回答他：老虎捉到狐狸，狐狸說「子無敢食我也，天帝使我長百獸，子隨我後觀百獸之見我而敢不走乎」（白話：你不敢吃我。天帝派我做百獸之長，你跟在我後面，看看百獸見了我敢不逃跑嗎），老虎跟在牠後面而百獸都逃走，老虎不知道野獸怕的是自己，以為牠們怕狐狸。「今王之地方五千里，帶甲百萬，而專屬之昭奚恤；故北方之畏奚恤也，其實畏王之甲兵也，猶百獸之畏虎也。」（白話：如今大王的土地方圓五千里、甲兵百萬，卻全交給昭奚恤掌管；所以北方諸國怕昭奚恤，其實是怕大王的甲兵，就像百獸怕的是老虎一樣。）他不是在講寓言，而是在拆解一位政敵的權力基礎。
