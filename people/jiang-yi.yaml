id: jiang-yi
name:
  zh: 江乙
  en: Jiang Yi
state: chu
role: 策士
birth: null
death: null
sort_year: -350
bio: >-
  本魏人而事楚宣王。宣王問群臣「吾聞北方之畏昭奚恤也，果誠何如」（白話：我聽說北方諸國都害
  怕昭奚恤，這到底是怎麼回事），群臣莫對。江乙以虎與狐之喻對之：虎得狐，狐曰「子無敢食我也
  ，天帝使我長百獸，子隨我後觀百獸之見我而敢不走乎」（白話：你不敢吃我。天帝派我做百獸之長
  ，你跟在我後面，看看百獸見了我敢不逃跑嗎），虎隨之而百獸皆走，虎不知獸畏己也，以為畏狐。
  「今王之地方五千里，帶甲百萬，而專屬之昭奚恤；故北方之畏奚恤也，其實畏王之甲兵也，猶百獸
  之畏虎也。」（白話：如今大王的土地方圓五千里、甲兵百萬，卻全交給昭奚恤掌管；所以北方諸國
  怕昭奚恤，其實是怕大王的甲兵，就像百獸怕的是老虎一樣。）他不是在講寓言，是在拆一位政敵的
  權力基礎。
