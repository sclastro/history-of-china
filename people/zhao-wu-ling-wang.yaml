bio: >-
  戰國時期最有改革膽識的君主。前307年他下令推行胡服騎射——把寬袍大袖換成胡人的短衣皮帶，把車戰改為騎射。公子成、趙文、趙造等人以「變古之教、易古之道」（白話：改變古人的教化、變易古人的常道）為理由反對，武靈王回答說「循法之功，不足以高世；法古之學，不足以制今」（白話：墨守成法所能取得的功業，不足以超越當世；效法古人的學問，不足以應付今天），又說「聖人利身之謂服，便事之謂教」（白話：聖人以有利於身的叫做服，以便於行事的叫做教），於是推行下去。從此趙國有了騎兵之利，向北打敗林胡、樓煩，修築長城，滅掉中山。可是晚年他把君位傳給小兒子何，卻又把長子章封在代地，兄弟爭位，武靈王被圍困在沙丘宮三個多月，掏鳥窩裡的幼雀來吃，最後餓死。
