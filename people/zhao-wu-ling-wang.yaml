role: 君主
birth: null
death: -295
sort_year: -325
bio: >-
  戰國最富改革膽識的君主。前 307 年下令胡服騎射——易寬袍大袖為胡人短衣革帶，改車戰為
  騎射。公子成、趙文、趙造等以「變古之教、易古之道」相爭，武靈王答曰「循法之功，不足以高世
  ；法古之學，不足以制今」（白話：墨守成法所能取得的功業，不足以超越當世；效法古人的學問，
  不足以應付今天），「聖人利身之謂服，便事之謂教」，遂行之。自此趙有騎兵之利，北破林胡、樓
  煩，築長城，滅中山。然晚年傳位少子何而封長子章於代，兄弟爭立，武靈王被圍於沙丘宮三月餘，
  探雀鷇而食之，終餓死。
