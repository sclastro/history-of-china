id: jing-ke
name:
  zh: 荊軻
  en: Jing Ke
state: yan
role: 刺客
birth: null
death: -227
sort_year: -227
bio: >-
  衛國人而客游燕國，喜歡讀書擊劍，跟一個屠狗的和善於擊筑的高漸離做朋友，天天在燕國市集上喝酒，酒喝到興頭上就唱歌，唱完又相對哭泣，旁若無人。田光把他推薦給太子丹，然後自刎以表明不會洩密。太子丹要行刺秦王，荊軻請求拿樊於期的人頭和燕國督亢的地圖作為取信之物；樊於期自刎獻上頭顱。出發那天，太子和賓客穿白衣戴白帽在易水邊送行，高漸離擊筑，荊軻和著唱：「風蕭蕭兮易水寒，壯士一去兮不復還。」（白話：風蕭蕭地吹著，易水寒冷；壯士這一去，就不再回來了。）進入秦國後，他捧著地圖上前，地圖展到盡頭匕首露了出來——他抓住秦王的衣袖，袖子扯斷了；追殺秦王，秦王繞著柱子跑，群臣驚愕而手上沒有兵器，最後侍醫夏無且用藥囊砸他，秦王拔劍砍斷他的大腿。荊軻岔開兩腿坐在地上大罵，身中八處創傷而死。
