id: shi-que
name:
  zh: 石碏
  en: Shi Que
state: wey
role: 卿大夫
birth: null
death: null
sort_year: -719
bio: >-
  衛國大夫。衛莊公寵州吁而不禁其驕，石碏諫「將立州吁，乃定之矣；若猶未也，階之為禍」（白話
  ：若打算立州吁為嗣，就趁早定下來；若還沒打算，如今這樣只是替他鋪一條禍路），不聽。其子石
  厚與州吁交遊，石碏禁之不可。州吁弒桓公自立，石碏設計誘二人至陳而執之——使人殺州吁於濮，
  又使其家宰獳羊肩殺石厚於陳。《左傳》君子曰：「石碏，純臣也，惡州吁而厚與焉。『大義滅親』
  ，其是之謂乎！」（白話：石碏是純粹的忠臣。他厭惡州吁，而自己的兒子石厚卻參與其事。所謂「
  大義滅親」，說的正是這種情形吧！）
timeline:
