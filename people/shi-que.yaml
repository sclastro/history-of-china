sort_year: -719
bio: >-
  衛國大夫。衛莊公寵愛州吁而不約束他的驕縱，石碏勸諫說「將立州吁，乃定之矣；若猶未也，階之為禍」（白話：若打算立州吁為嗣，就趁早定下來；若還沒打算，如今這樣只是替他鋪一條禍路），莊公不聽。他的兒子石厚與州吁交往，石碏禁止不住。州吁弒殺桓公自立，石碏設計把兩人誘到陳國抓了起來——派人在濮地殺了州吁，又派自己的家宰獳羊肩到陳國殺了石厚。《左傳》的君子評論說：「石碏，純臣也，惡州吁而厚與焉。『大義滅親』，其是之謂乎！」（白話：石碏是純粹的忠臣。他厭惡州吁，而自己的兒子石厚卻參與其事。所謂「大義滅親」，說的正是這種情形吧！）
