id: qing-zheng
name:
  zh: 慶鄭
  en: Qing Zheng
state: jin
role: 卿大夫
birth: null
death: -645
sort_year: -645
bio: >-
  晉國大夫。韓原之戰前他勸諫惠公不要乘用鄭國進獻的小駟，用「外彊中乾」四個字斷定牠不能用於作戰——外表強壯而內裡已經虛空，一旦受驚就氣息紊亂躁怒、血脈僨張，到那時進退都由不得人。惠公不聽，果然陷在泥淖裡而被秦國俘虜。作戰中惠公呼叫慶鄭來救，慶鄭用「愎諫違卜，固敗是求，又何逃焉」（白話：您固執己見、不聽勸諫，又違背卜辭，本來就是在自求失敗，如今還逃得掉嗎）拒絕了他，掉頭離去。惠公回國以後，把他殺了。
