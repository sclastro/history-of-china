id: feng-xuan
name:
  zh: 馮諼
  en: Feng Xuan
state: qi
role: 策士
birth: null
death: null
sort_year: -290
bio: >-
  孟嘗君的食客。初來時自稱無好無能，孟嘗君仍收留了他。他先後三次彈劍而歌，抱怨吃飯沒有魚、出門沒有車、家中無以養母，孟嘗君都一一滿足。後來孟嘗君要人到薛地收債，他自請前往，臨行問「收債回來要買什麼」，孟嘗君說看家裡缺什麼就買什麼。他到薛地後把債券當眾燒掉，宣稱是奉命免除，百姓歡呼萬歲。回來說「臣竊計，君宮中積珍寶……而君家所寡有者，以義耳。竊以為君市義」（白話：臣私下盤算，您宮裡珍寶堆滿……您家中唯一缺的就是「義」，所以臣替您買了義回來）。一年後孟嘗君被免相，回到薛地，百姓扶老攜幼在路上迎接。馮諼說「狡兔有三窟，僅得免其死耳；今君有一窟，未得高枕而臥也」（白話：狡猾的兔子有三個洞，才不過免於一死；如今您只有一個洞，還不能高枕無憂），隨即替他經營另外兩窟——說動梁惠王三次重金聘他以抬高身價，逼齊王復其相位；又請立宗廟於薛，使齊國不敢輕棄。「狡兔三窟」與「高枕無憂」皆出於此。
