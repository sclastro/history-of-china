sort_year: -311
bio: >-
  燕國謀臣。燕昭王即位時國家新破於齊，他卑身厚幣以招賢者，問郭隗該怎麼做。郭隗講了一個故事：古代有國君懸賞千金求千里馬，三年不得；一名近侍請求前往，三個月後找到千里馬，馬卻已死，他用五百金買下馬骨回來。國君大怒，近侍說「死馬且買之五百金，況生馬乎？天下必以王為能市馬，馬今至矣」（白話：死馬尚且用五百金買下，何況活馬？天下人必定認為大王真肯出錢買馬，千里馬很快就會來了）。不到一年，千里馬來了三匹。郭隗接著說：「王必欲致士，先從隗始；況賢於隗者，豈遠千里哉？」（白話：大王若真想招攬人才，就先從我郭隗開始；何況比我賢能的人，難道還會嫌千里之遠嗎？）昭王於是為他改築宮室、以師事之。樂毅、鄒衍、劇辛相繼而至，燕國由是強盛，終至樂毅破齊七十餘城。「千金買骨」由此而來。
