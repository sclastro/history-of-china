id: qi-huan-gong
name:
  zh: 齊桓公
  personal: 小白
  clan: 姜
  house: 呂
  posthumous: 桓
  en: Duke Huan of Qi
state: qi
role: 君主
birth: null
death: -643
sort_year: -685
bio: >-
  春秋第一位霸主。襄公死後他與哥哥公子糾爭奪君位，管仲射中他的衣帶鉤而沒有射死他，他搶先進入臨淄而即位。即位以後，他不計射鉤之仇而任用管仲為相，推行「參其國而伍其鄙」的制度，開發魚鹽之利，以「尊王攘夷」相號召——保存邢國、拯救衛國、討伐楚國責問它不進貢包茅、召陵會盟、葵丘會盟，《論語》稱他「九合諸侯，一匡天下」。管仲死後，他任用易牙、豎刁、開方；桓公病重時，五個公子爭奪君位，他的屍體在床上停放六十七天，蛆蟲爬出了門外。霸業的興起與它的崩壞，同樣說明一件事：春秋的霸權高度依賴人，而不是制度。
timeline:
  - year: -685
    event: 從莒國回國即位；經鮑叔牙推薦，不計較射鉤之仇，任用管仲為相
  - year: -681
    event: 北杏之會，開始主持諸侯會盟
  - year: -656
    event: 率領八國軍隊討伐楚國，責問楚國不進貢包茅；雙方在召陵結盟
  - year: -651
    event: 葵丘之會，周襄王派宰孔賜祭肉，霸業達到頂峰
  - year: -645
    event: 管仲去世，臨終勸他不要任用易牙、豎刁、開方，齊桓公不聽
  - year: -643
    event: 去世；五個兒子爭奪君位，屍體六十七日無人收殮
