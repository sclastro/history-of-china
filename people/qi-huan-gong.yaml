id: qi-huan-gong
name:
  zh: 齊桓公
  personal: 小白
  clan: 姜
  house: 呂
  posthumous: 桓
  en: Duke Huan of Qi
state: qi
role: 君主
birth: null
death: -643
sort_year: -685
bio: >-
  春秋第一位霸主。襄公死後他與哥哥公子糾爭奪君位，管仲射中他的衣帶鉤而沒有射死他，他搶先進入臨淄而即位。即位以後，他不計射鉤之仇而任用管仲為相，推行「叁其國而伍其鄙」的制度，開發魚鹽之利，以「尊王攘夷」相號召——保存邢國、拯救衛國、討伐楚國責問它不進貢包茅、召陵會盟、葵丘會盟，《論語》稱他「九合諸侯，一匡天下」。管仲死後，他任用易牙、豎刁、開方；桓公病重時，五個公子爭奪君位，他的屍體在床上停放六十七天，蛆蟲爬出了門外。霸業的興起與它的崩壞，同樣說明一件事：春秋的霸權高度依賴人，而不是制度。
timeline:
  - year: -685
    event: 自莒返國即位，鮑叔牙薦管仲，赦射鉤之仇而相之
  - year: -681
    event: 北杏之會，始主諸侯之盟
  - year: -656
    event: 率八國之師伐楚，責楚不貢包茅，召陵之盟
  - year: -651
    event: 葵丘之會，周襄王使宰孔賜胙，霸業之極
  - year: -645
    event: 管仲卒，遺言勿用易牙、豎刁、開方，不聽
  - year: -643
    event: 卒；五公子爭立，屍不得殮者六十七日
