id: zhong-zi-qi
name:
  zh: 鍾子期
  en: Zhong Ziqi
state: chu
role: 隱士
birth: null
death: null
sort_year: -400
bio: >-
  砍柴的人，善於聽琴。伯牙彈琴而子期能夠完全領會他心意所向，所以「知音」兩個字從此成為千古的比喻。子期死後，伯牙終身不再彈琴。《呂氏春秋·本味》在這裡下了一句斷語：「非獨琴若此也，賢者亦然。」（白話：不只彈琴是這樣，賢者也是這樣。）——它講的其實不是音樂，而是戰國士人最深的焦慮：有才能而沒有人認得出來。
