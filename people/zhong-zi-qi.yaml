id: zhong-zi-qi
name:
  zh: 鍾子期
  en: Zhong Ziqi
state: chu
role: 隱士
birth: null
death: null
sort_year: -400
bio: >-
  樵夫，善聽琴。伯牙鼓琴而子期能盡得其志之所之，
  故「知音」二字自此為千古之喻。子期死，伯牙終身不復鼓琴。
  《呂氏春秋·本味》於此有一句斷語：「非獨琴若此也，賢者亦然。」——
  它講的其實不是音樂，而是戰國士人最深的焦慮：懷才而無人能識。
sources:
