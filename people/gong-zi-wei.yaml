id: gong-zi-wei
name:
  zh: 公子圍
  personal: 圍
  house: 熊
  en: Prince Wei of Chu (later King Ling)
state: chu
role: 君主
birth: null
death: -529
sort_year: -547
bio: >-
  楚共王的兒子、康王的弟弟，就是後來的楚靈王。前547年楚國攻鄭，公子圍與穿封戌爭奪俘獲皇頡的功勞，請伯州犁來裁決——州犁「上其手」指向公子圍、「下其手」指向穿封戌，暗示囚犯應當承認的貴賤，於是成了「上下其手」的典故。前541年他弒殺郟敖自立，喜好細腰、修築章華臺、遷徙陳蔡的百姓，最後因眾叛親離而自縊於乾谿。
sources:
  - source: zuo-zhuan
    locus: 襄公二十六年
