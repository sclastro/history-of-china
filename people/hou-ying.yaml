id: hou-ying
name:
  zh: 侯嬴
  en: Hou Ying
state: wei
role: 隱士
birth: null
death: -257
sort_year: -257
bio: >-
  大梁夷門監者，年七十，家貧。信陵君置酒大會賓客，
  自駕虛左以迎之；侯生攝敝衣冠直上載公子上坐，
  又中道請過屠者朱亥，故久立與其客語以觀公子——
  公子執轡愈恭，顏色愈和。是為「虛左以待」之典。
  秦圍邯鄲，公子將以客往赴秦軍，過謝侯生。
  侯生曰「公子勉之矣，老臣不能從」，行數里，公子心不快而返問之，
  侯生笑曰「臣固知公子之還也」——遂獻竊符之計。
  復言「臣宜從，老不能」，約以「公子至晉鄙軍之日，北鄉自剄以送公子」。
  果如其言。
