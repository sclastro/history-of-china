id: hou-ying
name:
  zh: 侯嬴
  en: Hou Ying
state: wei
role: 隱士
birth: null
death: -257
sort_year: -257
bio: >-
  大梁夷門監者，年七十，家貧。信陵君置酒大會賓客，自駕虛左以迎之；侯生攝敝衣冠直上載公子上
  坐，又中道請過屠者朱亥，故久立與其客語以觀公子——公子執轡愈恭，顏色愈和。是為「虛左以待
  」之典。秦圍邯鄲，公子將以客往赴秦軍，過謝侯生。侯生曰「公子勉之矣，老臣不能從」（白話：公子好自為之，老臣不能隨行），行數里
  ，公子心不快而返問之，侯生笑曰「臣固知公子之還也」（白話：臣本來就知道公子會回頭）——遂獻竊符之計。復言「臣宜從，老不能
  」（白話：臣理應隨行，只是年老不能去），約以「公子至晉鄙軍之日，北鄉自剄以送公子」（白話：等公子抵達晉鄙軍中的那一天，我就面
  向北方自刎，以此為公子送行）。果如其言。
