id: hou-ying
name:
  zh: 侯嬴
  en: Hou Ying
state: wei
role: 隱士
birth: null
death: -257
sort_year: -257
bio: >-
  大梁夷門的看門人，七十歲，家境貧寒。信陵君擺酒大會賓客，親自駕車、空出左邊的尊位去迎接他；侯生穿著破舊衣帽就直接坐上公子的上座，半路又要求繞去看屠戶朱亥，故意站著跟朱亥聊很久，藉此觀察公子——公子握著韁繩態度更加恭敬，臉色更加溫和。這就是「虛左以待」的典故。秦國圍攻邯鄲，公子打算帶著門客去衝擊秦軍，路過向侯生辭行。侯生說「公子勉之矣，老臣不能從」（白話：公子好自為之，老臣不能隨行），走出幾里路，公子心裡不痛快而折返詢問，侯生笑著說「臣固知公子之還也」（白話：臣本來就知道公子會回頭）——於是獻上竊取兵符的計謀。又說「臣宜從，老不能」（白話：臣理應隨行，只是年老不能去），並約定「公子至晉鄙軍之日，北鄉自剄以送公子」（白話：等公子抵達晉鄙軍中的那一天，我就面向北方自刎，以此為公子送行）。後來果然照他說的做了。
