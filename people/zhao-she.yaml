bio: >-
  趙國名將。他起初做管理田賦的小吏，收租時平原君家不肯繳納，趙奢依法處置，殺了平原君家管事的九個人；平原君大怒想殺他，趙奢說「君於趙為貴公子，今縱君家而不奉公則法削，法削則國弱……君安得有此富乎」（白話：您在趙國是尊貴的公子，如今若放縱您家不奉行公法，法度就會削弱；法度削弱，國家就會衰弱……那時您哪還保得住這樣的富貴呢），平原君認為他賢能而把他推薦給趙王。前269年他救援閼與，以「其道遠險狹，譬之猶兩鼠鬥於穴中，將勇者勝」（白話：那條路又遠又險又窄，好比兩隻老鼠在洞裡相鬥，將領勇猛的一方獲勝）為判斷，大破秦軍，獲賜號馬服君。他評論兒子趙括說：「兵，死地也，而括易言之。」（白話：用兵是關乎生死的事，而趙括說得太輕易了。）——他是唯一一個在長平之戰以前就準確預言了長平結局的人。
