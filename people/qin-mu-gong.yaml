id: qin-mu-gong
name:
  zh: 秦穆公
  personal: 任好
  clan: 嬴
  posthumous: 穆
  en: Duke Mu of Qin
state: qin
role: 君主
birth: null
death: -621
sort_year: -659
bio: >-
  在位三十九年。以五羖羊皮贖百里奚，又用蹇叔、由余，三置晉君（惠公、懷公、文公），秦晉世為
  婚姻而有「秦晉之好」之語。韓原之戰虜晉惠公，泛舟之役輸粟於晉——恩威並用以控制東鄰。文公
  死後急欲東出，不聽蹇叔之諫而襲鄭，敗於崤，三帥被虜；穆公素服郊迎，曰「孤之罪也」，是先秦
  君主罪己的著名一例。東出之路既為晉所塞，乃轉而「益國十二，開地千里，遂霸西戎」（白話：增
  加了十二個國家的疆土、開拓土地一千里，於是稱霸西戎）。死而以子車氏三子殉葬，《詩·黃鳥》
  哀之——秦人殉葬之俗，自此為東方所非。
