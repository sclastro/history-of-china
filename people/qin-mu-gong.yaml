id: qin-mu-gong
name:
  zh: 秦穆公
  personal: 任好
  clan: 嬴
  posthumous: 穆
  en: Duke Mu of Qin
state: qin
role: 君主
birth: null
death: -621
sort_year: -659
bio: >-
  在位三十九年。他用五張黑羊皮贖回百里奚，又任用蹇叔、由余；三次扶立晉國國君（惠公、懷公、文公），秦晉兩國世代通婚，因而有「秦晉之好」的說法。韓原之戰俘虜了晉惠公，泛舟之役又運糧接濟晉國——恩威並施來控制東邊的鄰國。晉文公死後他急於向東發展，不聽蹇叔勸阻而偷襲鄭國，在崤山戰敗，三名主帥被俘；穆公穿素服到郊外迎接他們，說「孤之罪也」，是先秦君主自責的著名一例。東進的道路既然被晉國堵死，他就轉而「益國十二，開地千里，遂霸西戎」（白話：增加了十二個國家的疆土、開拓土地一千里，於是稱霸西戎）。他死時用子車氏三兄弟殉葬，《詩經·黃鳥》為他們哀悼——秦國殉葬的風俗，從此被東方各國所非議。
