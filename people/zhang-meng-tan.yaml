birth: null
death: null
sort_year: -453
bio: >-
  趙襄子的謀臣。智伯率韓魏圍晉陽、決汾水灌城，城中「沈灶產蛙」而民無叛意。他自請潛出城去見韓康子與魏桓子，指出「臣聞脣亡則齒寒，今知伯帥二國之君伐趙，趙將亡矣，亡則二君為之次矣」（白話：我聽說嘴唇沒了牙齒就冷；如今智伯帶著兩位國君攻趙，趙國快要滅亡了，趙國一亡，下一個就輪到兩位了），說動二家倒戈。前 453 年三家反攻，殺智伯於晉陽城下而三分其地。事成之後他請求離去，襄子不許，他說：「前事之不忘，後事之師。君若弗圖，則臣力不足。」（白話：先前發生過的事不要忘記，可以作為日後行事的借鑒。您如果不為此打算，我的力量就不足以應付了。）並指出功成而不退則勢必生嫌，於是辭去封地，耕於負親之丘。「前事不忘，後事之師」由此而來。
