bio: >-
  在位四十六年，楚之北進至於極盛。滅弦、黃、英、夔諸小國，
  服鄭、許、陳、蔡，齊桓死後中原無強敵，泓水一戰敗宋襄公。
  重耳流亡至楚，成王以諸侯之禮待之，問「何以報不穀」，
  重耳許以「退避三舍」；子玉請殺之，成王不許——
  這份氣度後來換來城濮的慘敗。城濮前成王已察楚師不可用而欲退，
  子玉不從，遂敗。晚年欲廢太子商臣，商臣以宮甲圍王，王請食熊蹯而後死，弗聽，自縊。
