id: qin-xiao-gong
name:
  zh: 秦孝公
  personal: 渠梁
  clan: 嬴
  posthumous: 孝
  en: Duke Xiao of Qin
state: qin
role: 君主
birth: -381
death: -338
bio: >-
  他即位時秦國偏處雍州一隅，諸侯看不起它，不讓它參加中原的會盟。他頒下求賢令說：「賓客群臣有能出奇計強秦者，吾且尊官，與之分土。」（白話：賓客與群臣之中，若有人能提出奇計使秦國強大，我就給他高官，並與他分封土地。）他得到商鞅並任用了二十多年，秦國因此富強；周天子送來霸主的名分，諸侯都來道賀。他與商鞅這一對組合，是戰國變法中唯一真正做到「君主不猜疑、臣子不畏懼」而終其一生沒有改變的君臣——也正因為如此，孝公一死，反撲立刻就來了。
