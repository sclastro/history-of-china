id: qin-xiao-gong
name:
  zh: 秦孝公
  personal: 渠梁
  clan: 嬴
  posthumous: 孝
  en: Duke Xiao of Qin
state: qin
role: 君主
birth: -381
death: -338
bio: >-
  即位時秦僻在雍州，諸侯卑之，不與中國之會盟。下求賢令曰：「賓客群臣有能出奇計強秦者，吾且
  尊官，與之分土。」（白話：賓客與群臣之中，若有人能提出奇計使秦國強大，我就給他高官，並與
  他分封土地。）得商鞅而任之二十餘年，秦由是富強；天子致伯，諸侯畢賀。他與商鞅的組合，是戰
  國變法中唯一一對真正做到「主不疑、臣不畏」而終其身不變的君臣——也正因如此，孝公一死，反
  撲隨即而至。
