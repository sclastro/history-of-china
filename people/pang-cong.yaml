id: pang-cong
name:
  zh: 龐蔥
  en: Pang Cong
state: wei
role: 卿大夫
birth: null
death: null
sort_year: -330
bio: >-
  魏國大夫。他將要陪太子到邯鄲做人質，臨行前問魏王：「今一人言市有虎，王信之乎？」（白話：如今一個人說市集上有老虎，大王相信嗎？）魏王說不信。「二人言市有虎，王信之乎？」（白話：兩個人說市集上有老虎，大王相信嗎？）魏王說寡人開始懷疑了。「三人言市有虎，王信之乎？」（白話：三個人說市集上有老虎，大王相信嗎？）魏王說寡人相信了。龐蔥於是說：「夫市之無虎明矣，然而三人言而成虎。」（白話：市集上沒有老虎是很明白的事，然而三個人一說就成了真有老虎。）「今邯鄲去大梁也遠於市，而議臣者過於三人矣，願王察之。」（白話：如今邯鄲離大梁比市集遠得多，而議論臣的人會超過三個，希望大王明察。）魏王說「寡人自為知」。等到龐蔥從邯鄲回來，終究沒能再見到魏王。
sources:
  - source: zhan-guo-ce
