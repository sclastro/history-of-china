id: zhou-you-wang
name:
  zh: 周幽王
  personal: 宮涅
  clan: 姬
  posthumous: 幽
  en: King You of Zhou
state: zhou
role: 君主
birth: -795
death: -771
bio: >-
  西周最後一位天子，在位十一年。他廢掉申后與太子宜臼，改立褒姒生的兒子伯服，申侯於是聯合繒國與西戎攻打宗周，幽王死在驪山之下，西周滅亡。《史記》用他舉烽火戲弄諸侯來解釋他的覆亡，可是清華簡〈繫年〉所記載的完全不同——是幽王先出兵包圍收留宜臼的西申，繒國引西戎反擊而將他消滅。「幽」是惡諡，取「壅塞不通」的意思，後世對他的敘述始終被這個諡號框住。
timeline:
  - year: -781
    event: 即位
  - year: -774
    event: 廢黜申后和太子宜臼，改立褒姒為王后、伯服為太子
  - year: -771
    event: 申侯聯合繒國和西戎攻打宗周，幽王死於驪山下，西周滅亡
sources:
  - source: shiji
    locus: 周本紀
    ctext_urn: ctp:shiji/zhou-ben-ji
  - source: qinghua-xinian
    locus: 第二章
notes: >-
  周幽王死於前 771 年，傳世文獻與出土材料在這一點上一致；他的生年只是推算。
