id: lv-bu-wei
name:
  zh: 呂不韋
  house: 呂
  en: Lü Buwei
state: qin
role: 商人
birth: null
death: -235
sort_year: -257
bio: >-
  陽翟的大商人，往來各地賤買貴賣，家產累積到千金。他在邯鄲見到在趙國作人質的秦公子異人，回家問父親：「耕田之利幾倍？」父親說十倍。「珠玉之贏幾倍？」說一百倍。「立國家之主贏幾倍？」（白話：扶立一國之君，利潤有幾倍？）說數不清。他於是說：「此奇貨可居。」便拿出千金替異人西行活動，遊說華陽夫人立他為嫡嗣，改名子楚。子楚即位為莊襄王，用呂不韋做丞相，封文信侯。莊襄王死後，秦王政十三歲即位，稱呂不韋為仲父。他招攬士人編成《呂氏春秋》二十多萬字，公布在咸陽市集門口，上面懸掛千金，邀請諸侯的游士賓客，有誰能增刪一個字就給千金——這就是「一字千金」的出處。後來他因嫪毐一案被免去相位，遷往蜀地，喝毒酒而死。
