id: fan-wu-ji
name:
  zh: 樊於期
  en: Fan Wuji
state: qin
role: 將領
birth: null
death: -227
sort_year: -227
bio: >-
  秦將，得罪於秦王而亡之燕，秦購其首金千斤、邑萬家，父母宗族皆為戮沒。太子丹受而舍之，鞠武
  諫其不可，丹不忍。荊軻私見樊於期曰：「願得將軍之首以獻秦王，秦王必喜而見臣，臣左手把其袖
  、右手揕其胸，則將軍之仇報而燕見陵之愧除矣。」（白話：希望得到將軍的頭去獻給秦王，秦王必
  定高興地接見我；我左手抓住他的衣袖、右手刺他的胸口，那麼將軍的仇就報了，燕國被欺凌的恥辱
  也洗刷了。）樊於期偏袒扼腕而進曰：「此臣之日夜切齒拊心也，乃今得聞教！」（白話：這正是我
  日夜咬牙捶胸的事，今天才聽到您的指教！）遂自剄。他是這場刺殺中唯一一個完全自願、且在死前
  就已知道結果的人。
sources:
