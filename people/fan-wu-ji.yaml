id: fan-wu-ji
name:
  zh: 樊於期
  en: Fan Wuji
state: qin
role: 將領
birth: null
death: -227
sort_year: -227
bio: >-
  秦國將領，得罪秦王而逃到燕國，秦國懸賞他的人頭黃金千斤、封邑萬家，他的父母宗族都被殺戮沒官。太子丹收留了他，鞠武勸諫說不可以，太子丹不忍心趕他走。荊軻私下去見樊於期說：「願得將軍之首以獻秦王，秦王必喜而見臣，臣左手把其袖、右手揕其胸，則將軍之仇報而燕見陵之愧除矣。」（白話：希望得到將軍的頭去獻給秦王，秦王必定高興地接見我；我左手抓住他的衣袖、右手刺他的胸口，那麼將軍的仇就報了，燕國被欺凌的恥辱也洗刷了。）樊於期脫下一邊衣袖、握緊手腕上前說：「此臣之日夜切齒拊心也，乃今得聞教！」（白話：這正是我日夜咬牙捶胸的事，今天才聽到您的指教！）於是自刎。他是這場刺殺行動中唯一一個完全出於自願、而且在死前就已經知道結果的人。
sources:
