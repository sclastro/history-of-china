id: tian-ji
name:
  zh: 田忌
  house: 田
  en: Tian Ji
state: tian-qi
role: 將領
birth: null
death: null
sort_year: -353
bio: >-
  齊國的將領。他以孫臏為門客，採用孫臏的賽馬對策——用下等馬對人家的上等馬、上等馬對中等馬、中等馬對下等馬，輸一場而贏兩場——於是把孫臏推薦給威王。桂陵、馬陵兩場戰役他都是主將，以孫臏為軍師。後來被鄒忌讒害，逃奔楚國；宣王即位後才把他召回。
