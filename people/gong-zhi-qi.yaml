id: gong-zhi-qi
name:
  zh: 宮之奇
  en: Gong Zhiqi
state: yu
role: 卿大夫
birth: null
death: null
sort_year: -655
bio: >-
  虞國大夫。晉國第二次借道去攻打虢國，宮之奇勸諫說：「虢，虞之表也；虢亡，虞必從之。諺所謂『輔車相依，唇亡齒寒』者，其虞虢之謂也。」（白話：虢國是虞國的屏障；虢國一亡，虞國必定跟著完。俗話所說「頰骨與牙床相互依靠，嘴唇沒了牙齒就冷」，講的正是虞、虢的關係。）虞公仗著跟晉國同宗、又相信神明保佑而不肯聽，宮之奇說「虞不臘矣」，就帶著全族離開。這年冬天，晉國滅了虢國，回師途中順手滅了虞國。他這番諫辭把小國夾在大國博弈中的處境講到了極處——唇亡齒寒不是道德勸告，而是幾何學。
