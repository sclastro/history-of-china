id: bao-si
name:
  zh: 褒姒
  clan: 姒
  en: Bao Si
state: zhou
role: 君主
birth: null
death: null
sort_year: -774
bio: >-
  褒國進獻的女子，幽王寵愛她，因而廢掉申后，立她為王后。《史記》說她「不好笑」，幽王為了博她一笑而點燃烽火戲弄諸侯，終於亡國。這個說法在清華簡〈繫年〉裡完全找不到蹤影，而且與西周並沒有烽燧制度的事實相牴觸——她這個人的存在無可懷疑，「女色亡國」這套敘事框架則是戰國到漢代史觀的產物。她是中國歷史上被這套框架塑造得最徹底的人物之一。
sources:
  - source: shiji
    locus: 周本紀
    ctext_urn: ctp:shiji/zhou-ben-ji
relations:
  - target: zhou-you-wang
    kind: kin
    note: 幽王之后
notes: >-
  role 欄填「君主」是就她的王后身分而言，本站 role 分類未設后妃一項，
  日後條目增多可再細分。
