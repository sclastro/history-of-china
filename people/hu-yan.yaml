sort_year: -636
bio: >-
  字子犯，是重耳的舅父，所以也稱舅犯。他跟隨重耳流亡十九年，是主要的謀士。在齊國時重耳安於安樂而不想再走，狐偃跟姜氏商量，把他灌醉了用車載走。城濮之戰前，晉侯顧慮楚國從前的恩惠，狐偃說：「戰也。戰而捷，必得諸侯；若其不捷，表裡山河，必無害也。」（白話：打。打贏了，必定得到諸侯擁戴；就算打不贏，晉國外有黃河、內有高山，也不會有大害。）這就是「表裡山河」的出處。他又主張「退三舍辟之」，用履行舊日承諾來收攏人心——把守約與誘敵合成一條計策。剛回國時，狐偃把玉璧投進黃河說「所不與舅氏同心者，有如白水」（白話：我若不與舅父同心，有這白水為證），以退為進而定下君臣的名分，是春秋政治手腕的高手。
