id: jin-wen-gong
name:
  zh: 晉文公
  personal: 重耳
  clan: 姬
  posthumous: 文
  en: Duke Wen of Jin
state: jin
role: 君主
birth: -697
death: -628
bio: >-
  春秋第二位霸主。因驪姬之亂出奔，流亡十九年，先後經過翟、衛、齊、曹、宋、鄭、楚、秦八國，嘗盡困厄——經過衛國時向農夫討飯，只得到一塊泥土；經過曹國時受到曹君偷看他肋骨的羞辱；在齊國安於享樂，幾乎不想再走。楚成王用諸侯之禮款待他，問他將來怎麼報答，重耳承諾他日兩國交兵就退避三舍。前 636 年靠秦穆公的力量回國即位，據《史記》那年六十二歲。他任用狐偃、趙衰、先軫、賈佗、魏犫等人，編成三軍、施行三種賞賜、出兵勤王送周襄王復位，前 632 年城濮之戰打敗楚國、踐土會盟而霸業告成——從即位到稱霸，只用了五年。
timeline:
  - year: -655
    event: 為躲避驪姬之難，從蒲城逃往翟國
  - year: -644
    event: 離開翟國，經衛國前往齊國
  - year: -637
    event: 途經曹、宋、鄭三國到達楚國；楚成王厚待他，他許諾日後退避三舍
  - year: -636
    event: 秦穆公派兵護送他回國即位
  - year: -635
    event: 出兵勤王，護送周襄王回到王城，獲賜陽樊、溫、原、欑茅四地
  - year: -632
    event: 在城濮之戰大敗楚軍；踐土之盟，周襄王冊封他為諸侯之長
  - year: -628
    event: 去世
