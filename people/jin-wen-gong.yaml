id: jin-wen-gong
name:
  zh: 晉文公
  personal: 重耳
  clan: 姬
  posthumous: 文
  en: Duke Wen of Jin
state: jin
role: 君主
birth: -697
death: -628
bio: >-
  春秋第二位霸主。因驪姬之亂出奔，流亡十九年，先後經過翟、衛、齊、曹、宋、鄭、楚、秦八國，嘗盡困厄——經過衛國時向農夫討飯，只得到一塊泥土；經過曹國時受到曹君偷看他肋骨的羞辱；在齊國安於享樂，幾乎不想再走。楚成王用諸侯之禮款待他，問他將來怎麼報答，重耳承諾他日兩國交兵就「退避三舍」。前636年靠秦穆公的力量回國即位，那年六十二歲。他任用狐偃、趙衰、先軫、賈佗、魏犫等人，編成三軍、施行三種賞賜、出兵勤王送周襄王復位，前632年城濮之戰打敗楚國、踐土會盟而霸業告成——從即位到稱霸，只用了五年。
timeline:
  - year: -655
    event: 避驪姬之難，出奔翟
  - year: -644
    event: 去齊，歷曹、宋、鄭
  - year: -637
    event: 至楚，楚成王厚待之，許以退避三舍
  - year: -636
    event: 秦穆公納之，返國即位
  - year: -635
    event: 勤王，納周襄王於成周，受陽樊、溫、原、欑茅之田
  - year: -632
    event: 城濮之戰大敗楚軍；踐土之盟，周襄王策命為侯伯
  - year: -628
    event: 卒
