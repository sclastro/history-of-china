id: bian-que
name:
  zh: 扁鵲
  personal: 秦越人
  en: Bian Que
state: qi
role: 醫者
birth: null
death: null
sort_year: -350
bio: >-
  渤海郡鄭人，先秦名醫之代稱。《韓非子·喻老》記其見蔡桓公，
  四見而疾自腠理入肌膚、入腸胃、入骨髓，桓侯每曰「寡人無疾」，
  且謂「醫之好治不病以為功」（白話：醫生就愛醫治沒病的人，好拿來邀功）；及骨髓則司命之所屬，
  扁鵲望桓侯而還走，居五日桓侯體痛，索之已逃秦矣，遂死。
  《史記·扁鵲倉公列傳》另記其六不治，首曰「驕恣不論於理」。
  其人年代橫跨二百餘年，顯係先秦名醫故事的共同託名。
sources:
