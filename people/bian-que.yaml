id: bian-que
name:
  zh: 扁鵲
  personal: 秦越人
  en: Bian Que
state: qi
role: 醫者
birth: null
death: null
sort_year: -350
bio: >-
  渤海郡鄭地人，是先秦名醫的代稱。《韓非子·喻老》記載他去見蔡桓公，四次求見，說病已由皮膚表層進到肌肉、進到腸胃、進到骨髓，桓侯每次都說「寡人無疾」，還私下說「醫之好治不病以為功」（白話：醫生就愛醫治沒病的人，好拿來邀功）；等到病入骨髓，那已歸司命神管，扁鵲遠遠望見桓侯就掉頭快步走開，過了五天桓侯渾身疼痛，派人去找他，他已經逃到秦國，桓侯於是死了。《史記·扁鵲倉公列傳》另外記下他所說的六種不治，第一種就是「驕恣不論於理」。他的年代前後橫跨兩百多年，顯然是先秦名醫故事的共同託名。
sources:
  - source: hanfeizi
