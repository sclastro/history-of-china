id: lin-xiang-ru
name:
  zh: 藺相如
  house: 藺
  en: Lin Xiangru
state: zhao
role: 卿大夫
birth: null
death: null
sort_year: -283
bio: >-
  本趙宦者令繆賢舍人。秦昭王請以十五城易和氏璧，趙王患之，繆賢薦相如。相如奉璧入秦，見秦王
  無意償城，乃紿曰「璧有瑕，請指示王」，取璧卻立倚柱，怒髮上衝冠，言「臣頭今與璧俱碎於柱矣
  」（白話：臣的頭今天就與這塊璧一同碎在柱子上），卒使從者懷璧間行歸趙。澠池之會，秦王令趙王鼓瑟，相如進缻請秦王擊之，秦王不肯，相如曰
  「五步之內，臣請得以頸血濺大王矣」（白話：在這五步之內，臣可以把脖子上的血濺到大王身上）
  ，秦王為一擊缻。歸而拜為上卿，位在廉頗之右。廉頗怒而欲辱之，相如引車避匿，曰「吾所以為此
  者，以先國家之急而後私讎也」（白話：我之所以這樣做，是把國家的急難放在前面、把個人的恩怨
  放在後面）；廉頗聞之，肉袒負荊至門謝罪，卒相與為刎頸之交。
sources:
