id: lin-xiang-ru
name:
  zh: 藺相如
  house: 藺
  en: Lin Xiangru
state: zhao
role: 卿大夫
birth: null
death: null
sort_year: -283
bio: >-
  本來是趙國宦者令繆賢的門客。秦昭王提出用十五座城交換和氏璧，趙王為難，繆賢推薦了相如。相如捧璧入秦，看出秦王無意交付城池，就騙他說「璧有瑕，請指示王」，取回璧後退到柱子旁站定，怒得頭髮直豎頂起帽子，說「臣頭今與璧俱碎於柱矣」（白話：臣的頭今天就與這塊璧一同碎在柱子上），最後讓隨從懷揣玉璧抄小路送回趙國。澠池之會上，秦王要趙王彈瑟，相如捧著缻請秦王敲擊，秦王不肯，相如說「五步之內，臣請得以頸血濺大王矣」（白話：在這五步之內，臣可以把脖子上的血濺到大王身上），秦王只好敲了一下缻。回國後他被任命為上卿，位次在廉頗之上。廉頗惱怒而想羞辱他，相如卻掉轉車子躲開，說「吾所以為此者，以先國家之急而後私讎也」（白話：我之所以這樣做，是把國家的急難放在前面、把個人的恩怨放在後面）；廉頗聽到這話，脫去上衣背著荊條到門前謝罪，兩人終於結為生死之交。
sources:
