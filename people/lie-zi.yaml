sort_year: -400
bio: >-
  鄭國人，先秦道家。《莊子·逍遙遊》說他「御風而行，泠然善也」（白話：駕著風飛行，輕妙自得），《呂氏春秋》《戰國策》也提到他的名字，但他的事跡渺茫難考。今天流傳的《列子》八篇，公認是魏晉人編輯假託的，不過其中保存的寓言——愚公移山、杞人憂天、高山流水、歧路亡羊、疑鄰盜斧、兩小兒辯日——多有先秦來源，是研究先秦寓言繞不開的一部書。
sources:
