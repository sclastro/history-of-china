id: jin-xian-gong
name:
  zh: 晉獻公
  personal: 詭諸
  clan: 姬
  posthumous: 獻
  en: Duke Xian of Jin
state: jin
role: 君主
birth: null
death: -651
sort_year: -676
bio: >-
  在位二十六年，「并國十七，服國三十八」，奠定晉國成為北方大國的基礎。他把桓叔、莊伯兩支公族殺光，晉國從此沒有公族——這個做法使晉國免於公室內鬥而強盛，也埋下卿族坐大、六卿分晉的遠因。他向虞國借道去攻打虢國，回師時順手滅了虞國，是中國戰略史上最著名的一次連環詐術。晚年被驪姬迷惑，殺了太子申生，逼走重耳、夷吾，晉國於是大亂十九年。
timeline:
