id: zi-chu
name:
  zh: 秦莊襄王
  personal: 異人（後改名子楚）
  clan: 嬴
  posthumous: 莊襄
  en: King Zhuangxiang of Qin
state: qin
role: 君主
birth: -281
death: -247
bio: >-
  秦昭王的孫子、安國君（即後來的孝文王）的次子，母親夏姬不受寵，他在趙國做人質而秦國屢次攻趙，趙國待他不怎麼客氣，車馬用度都不寬裕，處境困窘而不得志。呂不韋見到他，認為是「奇貨可居」，拿出五百金替他結交賓客，又用五百金買了珍奇玩物西行遊說，說動安國君所寵愛而沒有兒子的華陽夫人收他為嫡嗣。華陽夫人本是楚國人，所以他改名子楚。邯鄲被圍時他逃回秦國。孝文王即位三天就去世，子楚繼位為莊襄王，在位三年而死，兒子嬴政即位。
sources:
