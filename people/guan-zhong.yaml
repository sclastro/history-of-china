id: guan-zhong
name:
  zh: 管仲
  personal: 夷吾
  house: 管
  en: Guan Zhong
state: qi
role: 卿大夫
birth: null
death: -645
sort_year: -685
bio: >-
  齊桓霸業的設計者。他年輕時貧困，與鮑叔牙在南陽一同經商，分錢時多給自己而鮑叔不認為他貪。他起初輔佐公子糾，射中小白的衣帶鉤；公子糾失敗後，鮑叔把他推薦給桓公，於是在齊國做了四十年相國。他的政策以「倉廩實而知禮節，衣食足而知榮辱」（白話：糧倉充實了，人才懂得禮節；衣食足夠了，人才顧得上榮辱）為根本，推行士農工商分區定業的制度、國野分治的軍賦、鹽鐵官營的財政，又提倡「尊王攘夷」，用霸道去做王道的事。孔子雖然譏諷他器量小、不節儉、不知禮，仍然稱讚「微管仲，吾其被髮左衽矣」（白話：要不是有管仲，我們早就披頭散髮、衣襟左開，淪為夷狄了）——保住了華夏的衣冠，這是最高的評價。
timeline:
  - year: -685
    event: 曾射中公子小白的衣帶鉤；後經鮑叔牙推薦，出任齊國的相
  - year: -679
    event: 鄄之會，齊國的霸業開始確立
  - year: -663
    event: 隨齊桓公討伐山戎、援救燕國；歸途迷路，放出老馬引路
  - year: -645
    event: 去世
