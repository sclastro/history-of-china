id: guan-zhong
name:
  zh: 管仲
  personal: 夷吾
  house: 管
  en: Guan Zhong
state: qi
role: 卿大夫
birth: null
death: -645
sort_year: -685
bio: >-
  齊桓霸業的設計者。少貧，與鮑叔牙賈於南陽，分財多自與而鮑叔不以為貪。
  初事公子糾，射小白中帶鉤；糾敗，鮑叔薦之於桓公，遂相齊四十年。
  其政以「倉廩實而知禮節，衣食足而知榮辱」為本，
  行士農工商分居定業之制、國野分治之軍賦、鹽鐵官營之財政，
  又倡「尊王攘夷」以霸道行王事之名。孔子雖譏其器小、不儉、不知禮，
  仍稱「微管仲，吾其被髮左衽矣」——保住了華夏的衣冠，這是最高的評價。
timeline:
