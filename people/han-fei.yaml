id: han-fei
name:
  zh: 韓非
  personal: 非
  clan: 姬
  house: 韓
  en: Han Fei
state: han
role: 思想家
birth: -280
death: -233
bio: >-
  韓國的公子，與李斯同在荀子門下求學。他口吃不擅長講話而善於著書，屢次上書勸諫韓王安都不被採納，退下來寫成〈孤憤〉〈五蠹〉〈說難〉等十多萬字。秦王政讀了以後讚歎「得見此人與之遊，死不恨矣」（白話：若能見到這個人並與他交往，我死也無憾了）；前 233 年韓國派他出使秦國，李斯、姚賈毀謗他，他被下獄，李斯送去毒藥逼他自殺。他書中寓言之豐富是先秦第一——守株待兔、自相矛盾、買櫝還珠、濫竽充數、老馬識途、諱疾忌醫，多出自〈說林〉〈儲說〉〈喻老〉幾篇。思想部分見哲學家知識庫，本站只記他的史事。
timeline:
