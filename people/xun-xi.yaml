id: xun-xi
name:
  zh: 荀息
  en: Xun Xi
state: jin
role: 卿大夫
birth: null
death: -651
sort_year: -658
bio: >-
  晉獻公的謀臣，假道伐虢之策就出自他手。獻公捨不得屈地產的良馬和垂棘的美玉，荀息說，這不過是把寶物從內庫取出來，暫時存放到外庫罷了。滅掉虢國回師又滅了虞國之後，據《穀梁傳》記載，他牽著馬、捧著玉璧回報說：「璧則猶是也，而馬齒加長矣。」（白話：玉璧還是原來那塊，只是馬的年齒長了幾歲罷了。）獻公去世，他受遺命輔佐奚齊，里克接連弒殺奚齊、卓子，荀息救不了而以身殉——他以說過的話不反悔自守，是春秋士大夫「言責」觀念的實例。
