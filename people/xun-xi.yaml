id: xun-xi
name:
  zh: 荀息
  en: Xun Xi
state: jin
role: 卿大夫
birth: null
death: -651
sort_year: -658
bio: >-
  晉獻公之謀臣，假道伐虢之策出其手。獻公惜屈產之乘與垂棘之璧，
  荀息曰：「是猶取之內府而藏之外府也。」既滅虢還而滅虞，
  牽馬持璧而復曰：「璧則猶是也，而馬齒加長矣。」
  獻公卒，受遺輔奚齊，里克連弒奚齊、卓子，荀息不能救而死之——
  以「不食其言」自守，是春秋士大夫「言責」觀念的實例。
sources:
