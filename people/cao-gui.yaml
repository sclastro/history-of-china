id: cao-gui
name:
  zh: 曹劌
  en: Cao Gui
state: lu
role: 卿大夫
birth: null
death: null
sort_year: -684
bio: >-
  魯國平民出身之謀士。齊師伐魯，曹劌請見莊公，鄉人止之曰
  「肉食者謀之，又何間焉」（白話：當官的自然會謀劃，你又何必去插手），劌答「肉食者鄙，未能遠謀」（白話：當官的見識淺陋，不能作長遠打算）。
  長勺之戰，他以「一鼓作氣，再而衰，三而竭」（白話：第一次擊鼓振起士氣，第二次就衰減了，第三次便耗盡了）候敵氣之竭而後擊，
  又「視其轍亂、望其旗靡」（白話：看見他們車轍雜亂、望見旗幟倒伏）而後逐——是中國戰史上最早的士氣論與偵察論。
  戰前更逼問莊公憑何可戰，直至莊公答「小大之獄，必以情」（白話：大大小小的訴訟，一定按實情處理）乃曰「忠之屬也，可以一戰」（白話：這是盡心待民一類的事，可以憑這個打一仗），
  把勝負的根據放在民心而非甲兵。
sources:
  - source: zuo-zhuan
    locus: 莊公十年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/zhuang-gong-shi-nian
notes: 《史記·刺客列傳》另有「曹沫」劫齊桓公事，或即一人而異名，然事跡與性格全然不類，本站不併。
