id: cao-gui
name:
  zh: 曹劌
  en: Cao Gui
state: lu
role: 卿大夫
birth: null
death: null
sort_year: -684
bio: >-
  魯國平民出身的謀士。齊軍攻魯，曹劌求見魯莊公，同鄉勸阻他說「肉食者謀之，又何間焉」（白話：當官的自然會謀劃，你又何必去插手），曹劌回答「肉食者鄙，未能遠謀」（白話：當官的見識淺陋，不能作長遠打算）。長勺之戰，他用「一鼓作氣，再而衰，三而竭」（白話：第一次擊鼓振起士氣，第二次就衰減了，第三次便耗盡了）的道理，等敵方士氣耗盡才出擊；又先「視其轍亂、望其旗靡」（白話：看見他們車轍雜亂、望見旗幟倒伏）才追擊——這是中國戰爭史上最早的士氣論與偵察論。開戰前他更逼問莊公憑什麼可以一戰，直到莊公答出「小大之獄，必以情」（白話：大大小小的訴訟，一定按實情處理），他才說「忠之屬也，可以一戰」（白話：這是盡心待民一類的事，可以憑這個打一仗），把勝負的根據放在民心而不是甲兵上。
sources:
  - source: zuo-zhuan
    locus: 莊公十年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/zhuang-gong-shi-nian
notes: 《史記·刺客列傳》另有「曹沫」劫齊桓公事，或即一人而異名，然事跡與性格全然不類，本站不併。
