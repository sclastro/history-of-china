id: mao-sui
name:
  zh: 毛遂
  en: Mao Sui
state: zhao
role: 策士
birth: null
death: null
sort_year: -257
bio: >-
  平原君門下客，居三年而無所稱。楚趙合縱之行少一人，毛遂自薦。平原君曰：「夫賢士之處世也，
  譬若錐之處囊中，其末立見。今先生處勝之門下三年於此矣，左右未有所稱誦，勝未有所聞，是先生
  無所有也。」（白話：賢士處於世上，就像錐子放在布袋裡，錐尖立刻就會露出來。如今先生在我門
  下已經三年了，左右沒有稱讚過您，我也沒有聽說過您，這說明先生沒有什麼本事。）毛遂曰：「臣
  乃今日請處囊中耳。使遂蚤得處囊中，乃穎脫而出，非特其末見而已。」（白話：臣今天才請求放進
  袋裡罷了。假使我早得以放進袋中，整個錐子都會脫穎而出，不只是露出錐尖而已。）至楚，按劍而
  前曰：「今十步之內，王不得恃楚國之眾也，王之命懸於遂手。」（白話：如今在這十步之內，大王
  仗不上楚國的人多了——大王的性命就懸在我手上。）復以湯武之事、白起三戰而辱楚之恥激之，楚
  王乃定從於殿上。平原君曰：「毛先生一至楚而使趙重於九鼎大呂。」（白話：毛先生一到楚國，就
  使趙國的分量重於九鼎大呂。）
