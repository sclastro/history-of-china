id: mao-sui
name:
  zh: 毛遂
  en: Mao Sui
state: zhao
role: 策士
birth: null
death: null
sort_year: -257
bio: >-
  平原君的門客，待了三年都沒有人稱道過他。楚趙合縱的出使隊伍還差一人，毛遂自我推薦。平原君說：「夫賢士之處世也，譬若錐之處囊中，其末立見。今先生處勝之門下三年於此矣，左右未有所稱誦，勝未有所聞，是先生無所有也。」（白話：賢士處於世上，就像錐子放在布袋裡，錐尖立刻就會露出來。如今先生在我門下已經三年了，左右沒有稱讚過您，我也沒有聽說過您，這說明先生沒有什麼本事。）毛遂說：「臣乃今日請處囊中耳。使遂蚤得處囊中，乃穎脫而出，非特其末見而已。」（白話：臣今天才請求放進袋裡罷了。假使我早得以放進袋中，整個錐子都會脫穎而出，不只是露出錐尖而已。）到了楚國，他按著劍上前說：「今十步之內，王不得恃楚國之眾也，王之命懸於遂手。」（白話：如今在這十步之內，大王仗不上楚國的人多了——大王的性命就懸在我手上。）又拿商湯周武的事跡、白起三戰而使楚國蒙羞的恥辱激他，楚王這才在殿上定下合縱之約。平原君說：「毛先生一至楚而使趙重於九鼎大呂。」（白話：毛先生一到楚國，就使趙國的分量重於九鼎大呂。）
