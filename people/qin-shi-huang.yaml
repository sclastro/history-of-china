id: qin-shi-huang
name:
  zh: 秦始皇
  personal: 政
  clan: 嬴
  en: Qin Shi Huang
state: qin
role: 君主
birth: -259
death: -210
bio: >-
  莊襄王的兒子，生在邯鄲。十三歲即位，呂不韋做仲父，二十二歲行冠禮親政，誅殺嫪毐、免去呂不韋。他任用李斯、尉繚、王翦、王賁，從前230年滅韓開始，十年之內依次滅掉趙、魏、楚、燕、齊，前221年統一天下，自稱皇帝，廢除封建改行郡縣，統一法度與度量衡、車軌與文字。本站以秦統一為下限，此後的事屬於秦帝國史，不在收錄範圍。
