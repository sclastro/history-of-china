id: bo-ya
name:
  zh: 伯牙
  en: Bo Ya
state: chu
role: 樂師
birth: null
death: null
sort_year: -400
bio: >-
  善於彈琴的人。他心裡想著登高山，鍾子期就說「善哉，峨峨兮若泰山」（白話：好啊，巍峨得像泰山）；心裡想著流水，子期就說「善哉，洋洋兮若江河」（白話：好啊，浩蕩得像江河）——伯牙心中所想，子期一定領會得到。子期死後，伯牙摔琴斷弦，終身不再彈琴，認為世上再沒有值得為他彈奏的人。他的事跡只見於《列子·湯問》與《呂氏春秋·本味》，年代與國屬都無法確考，本站繫於戰國前期只是為了排序方便。
sources:
