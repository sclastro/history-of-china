id: wang-sun-man
name:
  zh: 王孫滿
  clan: 姬
  en: Wangsun Man
state: zhou
role: 卿大夫
birth: null
death: null
sort_year: -606
bio: >-
  周朝大夫。楚莊王在周朝疆界上閱兵，定王派王孫滿去慰勞楚軍，莊王問起九鼎的大小輕重。王孫滿回答說：「在德不在鼎……桀有昏德，鼎遷于商，載祀六百；商紂暴虐，鼎遷于周。德之休明，雖小重也；其姦回昏亂，雖大輕也。周德雖衰，天命未改。鼎之輕重，未可問也。」（白話：在於德而不在於鼎……夏桀昏亂無德，鼎就遷到商朝，歷時六百年；商紂暴虐，鼎又遷到周朝。德行美好清明，鼎雖小也是重的；若姦邪昏亂，鼎雖大也是輕的。周室的德行雖已衰微，天命卻還沒有改變。鼎的輕重，是不可以問的。）他用「德」與「命」兩個字擋住一個剛剛把軍隊開到王畿的霸主，是春秋外交辭令的最高範例——沒有一句威脅，卻把問題整個換掉了。
