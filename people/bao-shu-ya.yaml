id: bao-shu-ya
name:
  zh: 鮑叔牙
  house: 鮑
  en: Bao Shuya
state: qi
role: 卿大夫
birth: null
death: null
sort_year: -685
bio: >-
  齊國大夫。年輕時就與管仲交往，深知他的才幹，事事替他辯解——分錢時管仲多拿，他不認為是貪；替他出的主意辦砸了，他不認為是笨；管仲三次出仕三次被辭退，他不認為是無能；三次上陣三次逃跑，他不認為是怯懦。他輔佐公子小白，小白取得君位後想任他為相，鮑叔推辭說「君且欲霸王，非管夷吾不可」（白話：您若要成就霸業，非管夷吾不可），於是請桓公赦免管仲射中衣帶鉤的罪過並加以推薦，自己甘居其下。管仲說：「生我者父母，知我者鮑子也。」（白話：生我的是父母，真正了解我的是鮑叔。）《史記》說天下人稱道的不是管仲的賢能，而是鮑叔的知人——推舉賢才而自己退居其後，在講究權位的春秋是很罕見的事。
