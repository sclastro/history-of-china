id: lu-zhuang-gong
name:
  zh: 魯莊公
  personal: 同
  clan: 姬
  posthumous: 莊
  en: Duke Zhuang of Lu
state: lu
role: 君主
birth: -706
death: -662
bio: >-
  在位三十二年。長勺之戰任用曹劌而打敗齊軍，是春秋前期弱國戰勝強國的著名戰例。此後齊桓公稱霸，魯國終究成為齊國的附庸。晚年他沒能決定好繼承人的事，死後慶父作亂，「慶父不死，魯難未已」（白話：慶父一天不死，魯國的禍亂就一天不停）說的就是這件事。
