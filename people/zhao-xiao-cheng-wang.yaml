id: zhao-xiao-cheng-wang
name:
  zh: 趙孝成王
  personal: 丹
  clan: 嬴
  house: 趙
  posthumous: 孝成
  en: King Xiaocheng of Zhao
state: zhao
role: 君主
birth: null
death: -245
sort_year: -265
bio: >-
  惠文王之子。受韓上黨郡之獻而致長平之禍——
  平陽君趙豹以「無故之利，禍必及之」諫，平原君主受，王從之。
  戰事既久，趙乏食而廉頗堅壁，王數以為怯；
  中秦反間，以趙括代廉頗，四十萬眾遂坑於長平。
  其後秦圍邯鄲，賴平原君得毛遂而合楚、信陵君竊符而救趙，國僅存。
