id: zhao-xiao-cheng-wang
name:
  zh: 趙孝成王
  personal: 丹
  clan: 嬴
  house: 趙
  posthumous: 孝成
  en: King Xiaocheng of Zhao
state: zhao
role: 君主
birth: null
death: -245
sort_year: -265
bio: >-
  趙惠文王的兒子。他接受韓國上黨郡的獻地而招來長平之禍——平陽君趙豹以「無故之利，禍必及之」（白話：無緣無故得來的好處，災禍必定跟著來）勸阻，平原君主張接受，趙王聽了平原君的。戰事拖久之後，趙國缺糧而廉頗堅守不出，趙王屢次認為他怯懦；又中了秦國的反間計，用趙括替換廉頗，四十萬大軍於是被活埋在長平。後來秦國圍攻邯鄲，靠平原君得到毛遂而與楚國結盟、信陵君竊符救趙，國家才勉強保住。
