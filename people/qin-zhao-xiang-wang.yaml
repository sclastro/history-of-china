id: qin-zhao-xiang-wang
name:
  zh: 秦昭襄王
  personal: 稷
  clan: 嬴
  posthumous: 昭襄
  en: King Zhaoxiang of Qin
state: qin
role: 君主
birth: -325
death: -251
bio: >-
  在位五十六年，秦國的霸業在他手裡定型。前期由母親宣太后和舅父魏冉當權，後來任用范睢推行「遠交近攻」，廢掉太后、驅逐四貴而把君權收回。澠池之會上他想羞辱趙王，被藺相如挫敗；索取和氏璧，又被藺相如完璧歸趙。他任用白起，伊闕之戰斬殺韓魏二十四萬、鄢郢之役攻破楚國、長平之戰活埋趙軍四十萬——崤山以東六國從此再無野戰的能力。前256年滅掉西周公，把九鼎遷到咸陽。
