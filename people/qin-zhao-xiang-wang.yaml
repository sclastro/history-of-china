id: qin-zhao-xiang-wang
name:
  zh: 秦昭襄王
  personal: 稷
  clan: 嬴
  posthumous: 昭襄
  en: King Zhaoxiang of Qin
state: qin
role: 君主
birth: -325
death: -251
bio: >-
  在位五十六年，秦之霸業於其時定型。前期母宣太后與舅魏冉當國，
  後用范睢行「遠交近攻」，廢太后逐四貴而收君權。
  澠池之會欲辱趙王而為藺相如所折；索和氏璧而藺相如完璧歸趙。
  用白起，伊闕斬韓魏二十四萬、鄢郢破楚、長平坑趙卒四十萬——
  山東六國自此無野戰之力。前 256 年滅西周公，遷九鼎於咸陽。
