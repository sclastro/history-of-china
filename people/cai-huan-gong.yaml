id: cai-huan-gong
name:
  zh: 蔡桓公
  en: Duke Huan of Cai
state: cai
role: 君主
birth: null
death: null
sort_year: -350
bio: >-
  《韓非子·喻老》中拒絕就醫而死的國君。扁鵲四次求見，四次說他的病又深了一層，桓侯三次回答「寡人無疾」，還私下議論「醫之好治不病以為功」（白話：醫生就愛醫治沒病的人，好拿來邀功）。病在皮膚表層、在肌肉、在腸胃時都還能治，到了骨髓就無可奈何了。韓非用這個故事來說明老子的「圖難於其易，為大於其細」（白話：解決難事要趁它還容易時，成就大事要從細微處著手）——他關心的不是醫學，而是君主對小毛病的輕忽如何釀成無可挽救的大禍。按蔡桓侯（前714–695）的年代遠早於扁鵲，《史記》又寫作「齊桓侯」，人物與年代都對不上，可見這是寓言而不是史事。
sources:
  - source: hanfeizi
    locus: 喻老
