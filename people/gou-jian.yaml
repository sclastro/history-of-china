id: gou-jian
name:
  zh: 越王句踐
  personal: 句踐
  clan: 姒
  en: King Goujian of Yue
state: yue
role: 君主
birth: null
death: -465
sort_year: -496
bio: >-
  春秋最後一位霸主。前 494 年敗於夫椒，棲於會稽之上，卑辭厚禮以事吳，入臣於吳三年而歸
  。返國後「苦身焦思，置膽於坐，坐臥即仰膽，飲食亦嘗膽」（白話：勞苦身體、焦慮思索，把苦膽
  放在座位上，坐著躺著都抬頭看得見它，吃喝時也要嘗一嘗），行十年生聚、十年教訓之策，用范蠡
  、文種，前 473 年滅吳，夫差自剄。既滅吳，北渡淮，會齊晉諸侯於徐州，周元王命為伯。然
  其為人「可與共患難，不可與共樂」（白話：可以和他共患難，不可以和他共安樂），范蠡去而文種死——這句評語與「臥薪嘗膽」同樣出自《史記
  》，卻遠不如後者流傳。
