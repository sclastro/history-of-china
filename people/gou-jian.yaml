id: gou-jian
name:
  zh: 越王句踐
  personal: 句踐
  clan: 姒
  en: King Goujian of Yue
state: yue
role: 君主
birth: null
death: -465
sort_year: -496
bio: >-
  春秋最後一位霸主。前 494 年敗於夫椒，困守在會稽山上，用謙卑的言辭和厚重的禮物侍奉吳國，到吳國做了三年臣僕才得以回國。回國後他「苦身焦思，置膽於坐，坐臥即仰膽，飲食亦嘗膽也」（白話：刻苦自勵，費盡心思，把苦膽放在座位旁，坐著躺著都抬頭看見它，吃喝時也要嘗一嘗），推行十年生聚、十年教訓的策略，任用范蠡、文種，前 473 年滅掉吳國，夫差自刎。滅吳之後他北渡淮河，在徐州會合齊、晉諸侯，周元王任命他為霸主。然而他為人「可與共患難，不可與共樂」（白話：可以和他共患難，不可以和他共安樂），范蠡出走而文種被賜死——這句評語與「臥薪嘗膽」同樣出自《史記》，流傳的程度卻遠遠不如後者。
timeline:
  - year: -496
    event: 即位；在檇李之戰打敗吳軍，吳王闔閭腳趾受傷，不久去世
  - year: -494
    event: 在夫椒之戰大敗，退守會稽山，向吳國求和
  - year: -493
    event: 據《國語》，到吳國做臣僕
  - year: -490
    event: 回國後把苦膽放在座位旁，時常嘗一嘗；推行十年繁衍積聚的策略
  - year: -482
    event: 趁夫差在黃池會合諸侯，乘虛攻入吳國都城
  - year: -473
    event: 滅吳，夫差自殺；北上在徐州會合諸侯，周天子任命他為霸主
  - year: -465
    event: 去世
