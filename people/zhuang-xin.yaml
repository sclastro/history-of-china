id: zhuang-xin
name:
  zh: 莊辛
  en: Zhuang Xin
state: chu
role: 卿大夫
birth: null
death: null
sort_year: -278
bio: >-
  楚國臣子。他勸諫頃襄王不要跟州侯、夏侯、鄢陵君、壽陵君一起荒淫奢靡，襄王說「先生老悖乎？將以為楚國祅祥乎？」（白話：先生是老糊塗了嗎？還是認為楚國要出妖孽了？）莊辛就請求避居趙國。五個月後秦國果然攻下鄢、郢、巫、上蔡、陳等地，襄王流亡到城陽，這才召回莊辛。莊辛說：「臣聞鄙語曰：『見兔而顧犬，未為晚也；亡羊而補牢，未為遲也。』」（白話：臣聽俗話說：看見兔子才想起獵狗，還不算晚；羊跑掉了才修補羊圈，也還不算遲。）接著用蜻蜓、黃雀、黃鵠、蔡靈侯四個比喻層層推進，最後說到襄王自己身上。襄王於是封他為陽陵君，跟他一起謀劃復國。
