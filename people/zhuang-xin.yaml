id: zhuang-xin
name:
  zh: 莊辛
  en: Zhuang Xin
state: chu
role: 卿大夫
birth: null
death: null
sort_year: -278
bio: >-
  楚臣。諫頃襄王勿與州侯、夏侯、鄢陵君、壽陵君淫逸侈靡，王曰「先生老悖乎？將以為楚國祅祥乎
  ？」（白話：先生是老糊塗了嗎？還是認為楚國要出妖孽了？）莊辛請避於趙。五月而秦果舉鄢、郢
  、巫、上蔡、陳之地，襄王流揜於城陽，乃召莊辛。莊辛曰：「臣聞鄙語曰：『見兔而顧犬，未為晚
  也；亡羊而補牢，未為遲也。』」（白話：臣聽俗話說：看見兔子才想起獵狗，還不算晚；羊跑掉了
  才修補羊圈，也還不算遲。）繼以蜻蛉、黃雀、黃鵠、蔡靈侯四喻層層推上，終及襄王自身。王遂封
  之為陽陵君，與謀復國。
