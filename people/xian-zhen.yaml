birth: null
death: -627
sort_year: -632
bio: >-
  晉國名將，城濮之戰時任中軍元帥（當時稱原軫）。開戰前他定下「執曹伯、分曹衛之田以賜宋人」（白話：扣住曹伯，把曹、衛的田地分給宋國人）的計策，逼得楚國不得不戰，而且理虧的一方變成楚國。前627年崤之戰，他極力主張攔擊秦軍，說「一日縱敵，數世之患也」（白話：放走敵人一天，便是好幾代的禍患），於是在崤山全殲秦軍，俘虜三名主帥。後來文嬴請求放回三帥而襄公答應了，先軫怒不可遏，當著朝堂吐了口水——事後自愧對國君失禮，在箕地之役中脫下頭盔衝入狄軍而死。他是春秋將帥中戰術最凌厲、而自我要求也最嚴苛的一個。
