id: bo-zhou-li
name:
  zh: 伯州犁
  en: Bo Zhouli
state: chu
role: 卿大夫
birth: null
death: -541
sort_year: -547
bio: >-
  本是晉國大夫伯宗的兒子，伯宗被殺後他逃奔楚國，做了楚國太宰。前547年他裁決公子圍與穿封戌爭奪俘虜的訴訟，用手勢暗示囚犯應當攀附的貴賤，「上下其手」由此得名——這是中國文獻中最早、也最清晰的一次「程序中的偏私」記錄：形式上他問了囚犯，實質上他已經給了答案。前541年公子圍弒君自立，伯州犁也被他所殺。
sources:
  - source: zuo-zhuan
