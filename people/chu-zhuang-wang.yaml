id: chu-zhuang-wang
name:
  zh: 楚莊王
  personal: 侶
  house: 熊
  posthumous: 莊
  en: King Zhuang of Chu
state: chu
role: 君主
birth: null
death: -591
sort_year: -613
bio: >-
  春秋五霸之一，楚國霸業之極。即位三年不出號令，日夜為樂，令國中曰「有敢諫者死無赦」；伍舉
  以「三年不蜚，蜚將沖天；三年不鳴，鳴將驚人」（白話：三年不飛，一飛就要沖天；三年不叫，一
  叫就要驚人）隱之，遂罷淫樂而聽政，所誅者數百、所進者數百，國人大悅——「一鳴驚人」之所出
  。前 606 年伐陸渾之戎，觀兵於周疆，問九鼎之大小輕重，王孫滿以「在德不在鼎」對之。前
  597 年邲之戰大敗晉師，遂為霸主。既勝而不築京觀，論「武」字從止從戈，提出「夫武，禁暴
  、戢兵、保大、定功、安民、和眾、豐財者也」（白話：所謂武，是禁絕暴亂、收起兵器、保有天下
  、鞏固功業、安定百姓、和睦人群、豐足財用）——是先秦最完整的一段戰爭倫理論述，出自一個剛
  剛贏了大仗的人之口。
