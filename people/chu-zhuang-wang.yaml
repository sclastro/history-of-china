bio: >-
  春秋五霸之一，楚國霸業的頂點。即位三年不發號令，日夜作樂，還向國中下令「有敢諫者死無赦」；伍舉用「三年不蜚，蜚將沖天；三年不鳴，鳴將驚人」（白話：三年不飛，一飛就要沖天；三年不叫，一叫就要驚人）來隱喻進諫，他於是停止荒樂、開始理政，誅殺數百人、提拔數百人，國人大為振奮——這就是「一鳴驚人」的出處。前606年他討伐陸渾之戎，在周朝疆界上閱兵，問起九鼎的大小輕重，王孫滿以「在德不在鼎」回答他。前597年邲之戰大敗晉軍，於是成為霸主。打贏之後他不築京觀，並就「武」字從止從戈立論，提出「夫武，禁暴、戢兵、保大、定功、安民、和眾、豐財者也」（白話：所謂武，是禁絕暴亂、收起兵器、保有天下、鞏固功業、安定百姓、和睦人群、豐足財用）——這是先秦最完整的一段戰爭倫理論述，而且出自一個剛剛打贏大仗的人之口。
