id: wei-zhou-xu
name:
  zh: 州吁
  clan: 姬
  en: Zhouxu of Wey
state: wey
role: 君主
birth: null
death: -719
sort_year: -719
bio: >-
  衛莊公寵妾所生的兒子，喜好用兵而莊公不加禁止。前719年他弒殺兄長桓公自立，是《春秋》經文所記載的第一批弒君者之一。即位以後，他急於用對外用兵來收攏人望，聯合宋、陳、蔡三國攻打鄭國，卻安定不了自己的百姓。石碏把他誘騙到陳國，在濮地將他殺掉，在位不滿一年。《左傳》用「眾叛親離，難以濟矣」（白話：眾人背叛、親信離散，這樣是成不了事的）斷定他必敗，成為春秋政治判斷的經典表述。
sources:
