id: wei-zhou-xu
name:
  zh: 州吁
  clan: 姬
  en: Zhouxu of Wey
state: wey
role: 君主
birth: null
death: -719
sort_year: -719
bio: >-
  衛莊公嬖人之子，好兵而莊公弗禁。前 719 年弒兄桓公自立，
  為春秋見於《春秋》經的第一批弒君者之一。既立，急欲以外事收人望，
  連宋、陳、蔡伐鄭而不能定其民。石碏誘之於陳而殺之於濮，在位不足一年。
  《左傳》以「眾叛親離，難以濟矣」四句斷其必敗，成為春秋政治判斷的經典表述。
sources:
