id: chuan-feng-xu
name:
  zh: 穿封戌
  en: Chuanfeng Xu
state: chu
role: 將領
birth: null
death: null
sort_year: -547
bio: >-
  楚方城外之縣尹。前 547 年楚伐鄭，穿封戌俘鄭將皇頡，公子圍與之爭功，訟於伯州犁。州犁
  曰「請問於囚」，乃上其手曰「夫子為王子圍，寡君之貴介弟也」（白話：這一位是王子圍，是我們
  國君尊貴的弟弟），下其手曰「此子為穿封戌，方城外之縣尹也」（白話：這一位是穿封戌，是方城
  之外的縣尹）——囚會意而言「頡遇王子，弱焉」。穿封戌怒，抽戈逐王子圍，弗及。他是「上下其
  手」故事中被判輸的那一方，其憤怒正是這個成語能流傳的原因。
sources:
