id: chuan-feng-xu
name:
  zh: 穿封戌
  en: Chuanfeng Xu
state: chu
role: 將領
birth: null
death: null
sort_year: -547
bio: >-
  楚國方城以外的縣尹。前547年楚國攻鄭，穿封戌俘獲鄭將皇頡，公子圍跟他爭功，兩人到伯州犁那裡打官司。州犁說「請問於囚」，於是抬起手說「夫子為王子圍，寡君之貴介弟也」（白話：這一位是王子圍，是我們國君尊貴的弟弟），又放下手說「此子為穿封戌，方城外之縣尹也」（白話：這一位是穿封戌，是方城之外的縣尹）——囚犯會意，就說「頡遇王子，弱焉」。穿封戌大怒，抽出戈追殺王子圍，沒有追上。他是「上下其手」故事裡被判輸的那一方，而他的憤怒正是這個成語得以流傳的原因。
sources:
