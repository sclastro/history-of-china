id: ping-yuan-jun
name:
  zh: 平原君
  personal: 勝
  clan: 嬴
  house: 趙
  en: Lord Pingyuan
state: zhao
role: 卿大夫
birth: null
death: -251
sort_year: -260
bio: >-
  趙武靈王的兒子、惠文王的弟弟，名勝，三次離開相位又三次復任。他喜歡養士，食客數千人。邯鄲被圍時，他奉命出使楚國謀求合縱，約定帶上文武兼備的食客二十人同行，只挑得十九人還差一個，毛遂自我推薦，並用「錐處囊中，其末立見」（白話：錐子放在布袋裡，錐尖立刻就會露出來）來回應平原君「三年沒有聽說過您」的疑問。到了楚國，從日出談到中午還定不下來，毛遂按著劍拾級而上，用「十步之內楚王性命就懸在他手上」責問楚王，楚國於是定下合縱之約。平原君回國後說：「勝不敢復相士。」司馬遷評他「翩翩濁世之佳公子也，然未睹大體」（白話：是濁世中風度翩翩的佳公子，可惜看不清大局）——接受上黨的獻地而招來長平之禍，正是「利令智昏」。
