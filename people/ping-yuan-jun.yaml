id: ping-yuan-jun
name:
  zh: 平原君
  personal: 勝
  clan: 嬴
  house: 趙
  en: Lord Pingyuan
state: zhao
role: 卿大夫
birth: null
death: -251
sort_year: -260
bio: >-
  趙武靈王之子、惠文王之弟，名勝，三去相三復位。喜賓客，食客數千人。邯鄲被圍，奉使至楚求合
  縱，約與食客文武備具者二十人偕，得十九人而少一人，毛遂自薦，以「錐處囊中，其末立見」（白話：錐子放在布袋裡，錐尖立刻就會露出來）對其
  「三年無所聞」之疑。至楚，日出而言、日中不決，毛遂按劍歷階而上，以十步之內楚王命懸其手而
  責之，楚遂定從。平原君歸而曰：「勝不敢復相士。」司馬遷評其「翩翩濁世之佳公子也，然未睹大
  體」（白話：是濁世中風度翩翩的佳公子，可惜看不清大局）——受上黨之獻而致長平，正是「利令
  智昏」。
sources:
