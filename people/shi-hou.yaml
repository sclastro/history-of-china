sort_year: -719
bio: >-
  石碏的兒子，與公子州吁交往。父親禁止他而他不聽，終於成了州吁的黨羽，幫助州吁弒殺衛桓公。州吁即位後國人不肯歸附，石厚向父親請教辦法，石碏教他們「到陳國去請求周天子的接見」——藉陳桓公的力量把兩人抓住，父子二人都沒能逃脫。他是「大義滅親」故事中被滅的那一方，史書上再沒有關於他的其他事跡。
