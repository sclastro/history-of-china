id: yan-ying
name:
  zh: 晏嬰
  personal: 嬰
  house: 晏
  posthumous: 平
  en: Yan Ying (Yanzi)
state: qi
role: 卿大夫
birth: null
death: -500
sort_year: -556
bio: >-
  歷事齊靈公、莊公、景公三世，相齊數十年。以節儉力行、食不重肉、妾不衣帛見稱，「一狐裘三十
  年」。崔杼弒莊公，晏子枕屍股而哭，起而三踊——不死不亡而不從弒君之盟，在暴力面前守住了一
  個第三種選擇。使楚而楚人欲辱之，以「橘生淮南則為橘，生于淮北則為枳」（白話：橘樹生在淮南
  就是橘，生在淮北就成了枳）對之，遂有「南橘北枳」。又以二桃殺公孫接、田開疆、古冶子三士，
  是先秦最冷峻的權術記錄之一。孔子稱其「善與人交，久而敬之」（白話：善於與人交往，相處越久越受人敬重）；司馬遷則說「假令晏子而在，余
  雖為之執鞭，所忻慕焉」（白話：假使晏子還在世，就算替他執鞭趕車，也是我心所欣慕的）。
