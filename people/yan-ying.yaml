id: yan-ying
name:
  zh: 晏嬰
  personal: 嬰
  house: 晏
  posthumous: 平
  en: Yan Ying (Yanzi)
state: qi
role: 卿大夫
birth: null
death: -500
sort_year: -556
bio: >-
  他先後侍奉齊靈公、莊公、景公三代，在齊國為相數十年。以節儉力行著稱，吃飯不擺兩樣肉菜，妾室不穿絲綢，一件狐皮裘穿了三十年。崔杼弒殺莊公，晏子把莊公的屍體枕在自己腿上痛哭，起身頓足三次就走——既不自殺殉主也不出逃，卻拒絕參加弒君者的盟誓，在暴力面前守住了第三種選擇。他出使楚國，楚人想羞辱他，他用「橘生淮南則為橘，生于淮北則為枳」（白話：橘樹生在淮南就是橘，生在淮北就成了枳）來應對，於是有了「南橘北枳」。他又用兩個桃子逼死公孫接、田開疆、古冶子三名勇士，是先秦最冷峻的權術記錄之一。孔子稱讚他「善與人交，久而敬之」（白話：善於與人交往，相處越久越受人敬重）；司馬遷則說「假令晏子而在，余雖為之執鞭，所忻慕焉」（白話：假使晏子還在世，就算替他執鞭趕車，也是我心所欣慕的）。
timeline:
  - year: -556
    event: 父親晏弱去世後，繼任齊國的卿
  - year: -548
    event: 崔杼殺死齊莊公；晏嬰伏在莊公屍體上痛哭，並拒絕參加崔杼主持的盟誓
  - year: -531
    event: 出使楚國，以南橘北枳之喻反駁楚王
  - year: -500
    event: 去世
