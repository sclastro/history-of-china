id: chu-xuan-wang
name:
  zh: 楚宣王
  personal: 良夫
  house: 熊
  posthumous: 宣
  en: King Xuan of Chu
state: chu
role: 君主
birth: null
death: -340
sort_year: -369
bio: >-
  在位三十年，是楚國承平的時代，與他兒子威王的時期合稱「宣威盛世」。他任用昭奚恤為令尹，昭奚恤因而威震北方，於是有了江乙「狐假虎威」那番進言。這段對話真正的主題是君主與權臣的關係——江乙要讓宣王明白：臣子的威望是借來的，而債主就是君主本人。
sources:
