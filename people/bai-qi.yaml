id: bai-qi
name:
  zh: 白起
  house: 白
  en: Bai Qi
state: qin
role: 將領
birth: null
death: -257
sort_year: -293
bio: >-
  秦之名將，號武安君。伊闕斬韓魏聯軍二十四萬，鄢郢之役引水灌鄢、拔郢燒夷陵，華陽斬魏趙十五
  萬，長平坑趙降卒四十萬——一生所殲山東兵力逾百萬，未嘗一敗。長平之後欲乘勝取邯鄲，范睢忌
  其功而請罷兵，失其機。其後昭王復欲攻邯鄲，白起以「秦雖破長平軍，而秦卒死者過半，國內空」
  （白話：秦國雖然打垮了長平的趙軍，但秦軍陣亡也超過一半，國內已經空虛）而稱病不行；秦軍果
  敗。王怒，遷之，行至杜郵賜劍自裁。白起引劍將自剄曰：「我固當死。長平之戰，趙卒降者數十萬
  人，我詐而盡阬之，是足以死。」（白話：我本來就該死。長平一戰，趙軍投降的有數十萬人，我用
  詐術把他們全部活埋，單憑這一件就足夠死了。）
