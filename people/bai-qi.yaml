bio: >-
  秦國名將，封號武安君。伊闕之戰斬殺韓魏聯軍二十四萬，鄢郢之役引水灌鄢城、攻下郢都並焚燒夷陵，華陽之戰斬殺魏趙聯軍十五萬，長平之戰活埋趙國降卒四十萬——一生殲滅崤山以東各國的兵力超過一百萬，從來沒有打過敗仗。長平之後他想乘勝攻取邯鄲，范睢忌憚他的功勞而主張罷兵，錯過了時機。後來昭王又想攻打邯鄲，白起以「秦雖破長平軍，而秦卒死者過半，國內空」（白話：秦國雖然打垮了長平的趙軍，但秦軍陣亡也超過一半，國內已經空虛）為理由稱病不去；秦軍果然敗了。昭王大怒，把他貶出咸陽，走到杜郵時賜劍命他自盡。白起拔劍將要自刎時說：「我固當死。長平之戰，趙卒降者數十萬人，我詐而盡阬之，是足以死。」（白話：我本來就該死。長平一戰，趙軍投降的有數十萬人，我用詐術把他們全部活埋，單憑這一件就足夠死了。）
