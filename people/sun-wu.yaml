id: sun-wu
name:
  zh: 孫武
  en: Sun Wu
state: wu
role: 思想家
birth: null
death: null
sort_year: -512
bio: >-
  齊人而事吳，兵法家，《孫子兵法》十三篇的作者。伍子胥七次向吳王闔閭推薦他。闔閭讀過他的兵法後說「可以小試勒兵乎」（白話：可以拿來小規模試著操練軍隊嗎），又問能不能用婦人試，孫武說可以。於是宮中美女一百八十人分為兩隊，以闔閭最寵愛的兩名姬妾為隊長。他先講明前後左右的口令，反覆申明三次五次，然後擊鼓下令；婦人大笑，隊形不動。他說「約束不明，申令不熟，將之罪也」（白話：紀律不明、號令不熟，是將領的過錯），再次申明；又擊鼓下令，婦人仍然大笑。他說「約束不明，申令不熟，將之罪也；既已明而不如法者，吏士之罪也」（白話：紀律不明、號令不熟是將領的過錯；已經講明白了還不照做，就是軍吏士卒的過錯），下令斬兩名隊長。闔閭在台上急忙求情，孫武答「臣既已受命為將，將在軍，君命有所不受」（白話：臣既然已受命為將，將領在軍中，君主的命令有時可以不接受），仍然斬了。此後隊伍進退跪起全都合乎規矩，鴉雀無聲。「三令五申」由此而來。
