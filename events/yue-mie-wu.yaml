variants:
  - claim: >-
      《左傳》《國語》詳記句踐復國之事而**無「臥薪」亦無「嘗膽」**；
      「置膽於坐」首見於《史記》，「臥薪」二字更遲至宋代才與此事相連。
    source: zuo-zhuan
    locus: 哀公元年
significance: >-
  春秋的終章，也是「復仇—忍辱—復國」敘事的原型。
  但它同時是一則關於功臣命運的標本：滅吳之日即是文種之死的開始。
  范蠡看懂的那一層——共患難易、共安樂難——
  比「臥薪嘗膽」四個字所承載的勵志意涵，更接近這段歷史的本相。
