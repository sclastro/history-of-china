id: yue-mie-wu
name: 越滅吳
year: -494
year_end: -473
year_note: 魯哀公元年至二十二年
period: chun-qiu-late
type: 滅國
states: [yue, wu]
people: [gou-jian, fu-chai, fan-li, wen-zhong]
narrative: >-
  前 496 年，吳王闔閭趁越王允常去世、句踐新立之機攻打越國，在檇李戰敗，闔閭被射傷，
  不久傷重而死。臨死前他囑咐兒子夫差，一定不要忘記越國。據《左傳》，夫差即位後，
  派人站在庭院裡，每次他出入，那人就要問他：夫差，你忘了越王殺你父親的仇嗎？

  前 494 年，句踐不聽范蠡勸阻，先發兵攻吳，在夫椒大敗，只帶著殘兵五千人退守會稽山，被吳軍包圍。
  句踐問范蠡怎麼辦，范蠡主張用謙卑的言辭和豐厚的禮物討好吳王。句踐派大夫文種求和，
  願意自己做吳王的臣子、妻子做吳王的侍妾。文種又用美女寶器賄賂吳國太宰伯嚭，請他從中說項。
  伍子胥勸諫夫差：現在不滅掉越國，日後一定後悔；句踐是賢君，文種、范蠡是良臣，讓他們回國，
  必定作亂。夫差不聽，赦免越國，撤兵回國。據《國語·越語下》，句踐與范蠡到吳國做了三年臣僕，
  才被放回。

  句踐回國後，刻苦自勵，費盡心思，把苦膽放在座位旁，坐著躺著都抬頭看見它，吃飯喝水也要嘗一嘗，
  自問：你忘了會稽的恥辱嗎？他親自耕田，夫人親自織布，吃飯不加肉菜，穿衣不用兩種顏色，
  放下身段禮待賢人，厚待賓客，救濟窮人、弔唁死者，與百姓同甘共苦。他把國政交給文種，
  用范蠡謀劃軍事，推行十年繁衍積聚、十年教養訓練的策略。

  夫差則一心北上爭霸。前 484 年，他不聽伍子胥勸阻，在艾陵打敗齊國，後來又賜劍逼伍子胥自殺。
  前 482 年，夫差帶著精兵北上，在黃池會合諸侯，與晉國爭當盟主，國內只剩老弱和太子留守。
  句踐乘虛出兵，大敗吳軍，殺了吳國太子。四年後，越國再次大舉伐吳，把吳都圍困了三年。
  前 473 年，吳軍潰敗，夫差退守姑蘇山，派人求和，表示希望句踐像當年吳國在會稽赦免越國那樣，也赦免他。
  句踐於心不忍，范蠡卻說，當年上天把越國賜給吳國，吳國不要；如今上天把吳國賜給越國，越國不能違抗天意。
  句踐於是提出把夫差安置在甬東，給他一百戶人家。夫差推辭說自己老了，不能再事奉越王，
  於是自殺，臨死前遮住臉說：我沒有臉去見伍子胥！

  滅吳之後，句踐北渡淮河，在徐州會合齊、晉等國諸侯，周元王派人賜給他祭肉，任命他為霸主。
  范蠡卻離開越國，到了齊國，寫信給文種：飛鳥打盡，好弓就收藏起來；狡兔死光，獵狗就被烹煮。
  越王這個人脖子長、嘴巴尖，可以和他共患難，不可以和他共安樂，你為甚麼還不走？文種讀信後，
  稱病不上朝。有人誣告文種將要作亂，句踐便賜劍給他，說：你教給寡人討伐吳國的七條計策，
  寡人只用了三條就打敗吳國，還有四條在你那裡，你替我到先王那裡去試試吧。文種於是自殺。
original:
  - speaker: 伍子胥
    source: shiji
    locus: 越王句踐世家
    quote: >-
      今不滅越，後必悔之。句踐賢君，種、蠡良臣，若反國，將為亂。
    translation: >-
      現在不滅掉越國，日後一定後悔。句踐是賢君，文種、范蠡是良臣，讓他們回國，必定作亂。
  - source: shiji
    locus: 越王句踐世家
    quote: >-
      越王句踐反國，乃苦身焦思，置膽於坐，坐臥即仰膽，飲食亦嘗膽也。曰：「女忘會稽之恥邪？」
    translation: >-
      越王句踐回國後，刻苦自勵，費盡心思，把苦膽放在座位旁，坐著躺著都抬頭看見它，
      吃飯喝水也要嘗一嘗。他自問：「你忘了會稽的恥辱嗎？」
  - speaker: 夫差
    source: shiji
    locus: 越王句踐世家
    quote: >-
      吳王謝曰：「吾老矣，不能事君王！」遂自殺。乃蔽其面，曰：「吾無面以見子胥也！」
    translation: >-
      吳王推辭說：「我老了，不能再事奉越王！」於是自殺。臨死前遮住臉說：「我沒有臉去見伍子胥！」
  - speaker: 范蠡
    source: shiji
    locus: 越王句踐世家
    quote: >-
      蜚鳥盡，良弓藏；狡兔死，走狗烹。越王為人長頸鳥喙，可與共患難，不可與共樂。子何不去？
    translation: >-
      飛鳥打盡了，好弓就收藏起來；狡兔死光了，獵狗就被烹煮。越王這個人脖子長、嘴巴尖，
      可以和他共患難，不可以和他共安樂。你為甚麼還不走？
