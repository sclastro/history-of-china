id: yue-mie-wu
name: 越滅吳
year: -494
year_end: -473
year_note: 魯哀公元年至二十二年
period: chun-qiu-late
type: 滅國
states: [yue, wu]
people: [gou-jian, fu-chai, fan-li, wen-zhong]
narrative: >-
  前 496 年檇李之戰，越敗吳，吳王闔閭傷指而死，遺命夫差勿忘。夫差使人立於庭，出入必呼
  ：「夫差，而忘越王之殺而父乎？」

  前 494 年夫椒之戰，吳大敗越，句踐以甲楯五千保於會稽，使大夫種因吳太宰嚭以行成。伍子
  胥諫曰「今不滅越，後必悔之」，夫差不聽，許之。句踐入臣於吳三年而歸。

  返國之後，《史記》記其「苦身焦思，置膽於坐，坐臥即仰膽，飲食亦嘗膽也」（白話：勞苦身體、
  焦慮思索，把苦膽放在座位上，坐著躺著都抬頭看得見它，吃喝時也要嘗一嘗），曰「女忘會稽之恥
  邪？」身自耕作、夫人自織、食不加肉、衣不重采，折節下賢人、厚遇賓客、振貧弔死，與百姓同其
  勞。用范蠡、文種，行十年生聚、十年教訓之策。

  前 484 年夫差敗齊於艾陵，前 482
  年會諸侯於黃池而與晉爭長，國中空虛，越乘之而入，虜吳太子。前 473
  年越圍吳三年而克之，夫差請為附庸不許，乃自剄，曰「吾無面以見子胥也」。

  既滅吳，范蠡浮海而去，遺書文種曰：「蜚鳥盡，良弓藏；狡兔死，走狗烹。越王為人長頸鳥喙，可
  與共患難，不可與共樂。子何不去？」（白話：飛鳥打盡了，好弓就被收藏起來；狡兔死光了，獵狗
  就被烹煮。越王這個人長頸鳥嘴，可以和他共患難，不可以和他共安樂。你為什麼不走呢？）文種不
  去，句踐賜劍令自裁。
