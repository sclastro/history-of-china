id: song-yu-dui-wen
name: 宋玉對楚王問
year: -270
year_note: 年代不詳；《文選》繫於楚頃襄王時
period: zhan-guo-late
type: 論政
states: [chu]
people: [song-yu, chu-xiang-wang]
narrative: >-
  楚頃襄王問宋玉：先生大概有些不檢點的行為吧？為甚麼士人和百姓都這樣不稱讚您？

  宋玉先承認確有其事，請楚王寬恕，讓他把話說完，然後講了一個郢都歌者的例子。
  有一位客人在郢都唱歌，開頭唱的是通俗的〈下里〉〈巴人〉，都城裡跟著一起唱的有幾千人；
  接著唱〈陽阿〉〈薤露〉，跟著唱的有幾百人；再唱〈陽春〉〈白雪〉，跟著唱的不過幾十人；
  到了講究宮商變化、夾雜流動徵音的高深曲調，跟著唱的就只剩幾個人了。宋玉由此得出結論：
  曲調越高妙，能跟著唱的人就越少。這就是成語「曲高和寡」的由來。

  他接著用兩組比喻推開去。鳥類之中有鳳凰，魚類之中有鯤。鳳凰一飛就是九千里，
  穿過雲霞，背負青天，在高遠的天空中翱翔；籬笆間的小鷃雀，怎能和牠一同衡量天地有多高？
  鯤魚早上從崑崙山下出發，中午在碣石山邊曬鰭，晚上歇宿在孟諸澤；小水塘裡的鯢魚，
  怎能和牠一同測量江海有多大？

  最後他回到本題：不只鳥類有鳳凰、魚類有鯤，士人之中也有這樣的人。聖人志向奇偉、
  行為卓異，超然獨立，世俗之人又哪裡懂得他的作為呢？

  這段對答以《文選》所載宋玉〈對楚王問〉最為通行。劉向《新序·雜事一》也記載這件事，
  但問話的是楚威王，中間兩組曲名作〈陽陵〉〈采薇〉，大鳥大魚作鳳與鯨，文字互有出入。
  下面的原文選段據《新序》。
original:
  - speaker: 楚威王
    locus: 雜事一
    quote: >-
      先生其有遺行耶？何士民眾庶不譽之甚也？
    translation: >-
      先生大概有些不檢點的行為吧？為甚麼士人和百姓都這樣不稱讚您？
  - speaker: 宋玉
    locus: 雜事一
    quote: >-
      客有歌於郢中者，其始曰下里巴人，國中屬而和者數千人，其為陽陵采薇，國中屬而和者數百人；
      其為陽春白雪，國中屬而和者，數十人而已也；引商刻角，雜以流征，國中屬而和者，不過數人。
      是其曲彌高者，其和彌寡。
    translation: >-
      有一位客人在郢都唱歌，開頭唱〈下里巴人〉，都城裡跟著一起唱的有幾千人；唱〈陽陵采薇〉，
      跟著唱的有幾百人；唱〈陽春白雪〉，跟著唱的只有幾十人；到了講究宮商變化、夾雜流動徵音的曲調，
      跟著唱的不過幾個人。可見曲調越高妙，能跟著唱的人就越少。
  - speaker: 宋玉
    locus: 雜事一
    quote: >-
      故非獨鳥有鳳而魚有鯨也，士亦有之。夫聖人之瑰意奇行，超然獨處；世俗之民，又安知臣之所為哉！
    translation: >-
      所以不只鳥類有鳳凰、魚類有鯨，士人之中也有這樣的人。聖人志向奇偉、行為卓異，超然獨立；
      世俗之人又哪裡懂得臣的作為呢！
sources:
  - source: xin-xu
    locus: 雜事一
    ctext_urn: ctp:xin-xu/za-shi-yi
reliability: 孤證
significance: >-
  〈對楚王問〉見於《文選》，《新序》亦載而文字互異，兩者都不見於先秦典籍，
  一般認為是漢人所輯或後人依託，本站標為孤證。這段對答值得收錄，在於那個層層遞減的例子：
  四種曲調配四個和唱人數，是先秦文獻中少見以數量呈現的論證。至於論點是否成立則另當別論——
  楚王問的是品行，宋玉答的是水準；而曲高和寡，也可能只是唱得不好的另一種說法。
