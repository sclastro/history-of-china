id: song-yu-dui-wen
name: 宋玉對楚王問
year: -270
year_note: 年代不詳；事在楚頃襄王時
period: zhan-guo-late
type: 論政
states: [chu]
people: [song-yu, chu-xiang-wang]
narrative: >-
  楚襄王問宋玉：先生大概有些不檢點的行為吧？為什麼士民百姓多有非議？

  宋玉沒有辯解，講了一個郢中歌者的例子：

  唱《下里》《巴人》時，國中跟著唱的有數千人；
  唱《陽阿》《薤露》時，跟著唱的有數百人；
  唱《陽春》《白雪》時，跟著唱的不過數十人；
  等到引商刻羽、雜以流徵，國中跟著唱的不過三數人而已。

  「是其曲彌高，其和彌寡。」
  （白話：可見曲調越高妙，能跟著唱的人就越少。）

  他接著用三組比喻推開去：
  鳥有鳳凰而魚有鯤，鳳凰上擊九千里、絕雲霓、負蒼天，
  而籬笆間的鷃雀怎麼能與牠一同衡量天地之高？
  鯤魚朝發崑崙之墟、暮宿於孟諸，
  而尺澤裡的鯢鰍怎麼能與牠一同測量江海之大？

  最後收回本題：「非獨鳥有鳳而魚有鯤也，士亦有之。
  夫聖人瑰意琦行，超然獨處，世俗之民，又安知臣之所為哉？」
  （白話：不只鳥類有鳳凰、魚類有鯤，士人之中也有這樣的。
  聖人志向奇偉、行為卓異，超然獨立，世俗之人又哪裡懂得臣的作為呢？）
sources:
  - source: shiji
    locus: 屈原賈生列傳
    ctext_urn: ctp:shiji/qu-yuan-jia-sheng-lie-zhuan
reliability: 孤證
significance: >-
  〈對楚王問〉見於《文選》，未收入先秦典籍，
  一般認為是漢人所輯或後人依託，本站標為孤證。
  它值得收錄的原因在於那個層層遞減的例子本身：
  四種曲調、四個和唱人數，是先秦文獻中少見的以量化方式呈現的論證。
  至於論點是否成立則另當別論——
  宋玉用它來解釋自己何以不受歡迎，
  而「曲高和寡」也可以是「唱得不好」的另一種說法。
