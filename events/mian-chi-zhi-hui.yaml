id: mian-chi-zhi-hui
name: 澠池之會
year: -279
period: zhan-guo-late
type: 會盟
states: [zhao, qin]
people: [lin-xiang-ru, lian-po, zhao-hui-wen-wang, qin-zhao-xiang-wang]
narrative: >-
  秦王使使者告趙王，欲與王為好，會於西河外澠池。趙王畏秦，欲毋行。廉頗、藺相如計曰：「王不
  行，示趙弱且怯也。」趙王遂行，相如從。廉頗送至境，與王訣曰：「王行，度道里會遇之禮畢，還
  ，不過三十日。三十日不還，則請立太子為王，以絕秦望。」（白話：大王此行，估算路程與會見之
  禮完成，來回不會超過三十天。若三十天還不回來，就請立太子為王，以斷絕秦國的指望。）王許之
  。

  會飲，酒酣，秦王曰：「寡人竊聞趙王好音，請奏瑟。」趙王鼓瑟。秦御史前書曰：「某年月日，秦
  王與趙王會飲，令趙王鼓瑟。」（白話：某年某月某日，秦王與趙王會飲，命令趙王彈瑟。）

  藺相如前曰：「趙王竊聞秦王善為秦聲，請奏盆缻秦王，以相娛樂。」（白話：趙王私下聽說秦王擅
  長秦地的樂曲，請讓我獻上盆缻給秦王敲擊，彼此娛樂。）秦王怒，不許。於是相如前進缻，因跪請
  秦王。秦王不肯擊缻。相如曰：「五步之內，相如請得以頸血濺大王矣！」（白話：在這五步之內，
  我藺相如可以把脖子上的血濺到大王身上！）左右欲刃相如，相如張目叱之，左右皆靡。於是秦王不
  懌，為一擊缻。相如顧召趙御史書曰：「某年月日，秦王為趙王擊缻。」

  秦之群臣曰：「請以趙十五城為秦王壽。」藺相如亦曰：「請以秦之咸陽為趙王壽。」

  秦王竟酒，終不能加勝於趙。趙亦盛設兵以待秦，秦不敢動。
sources:
  - source: shiji
    locus: 廉頗藺相如列傳
    ctext_urn: ctp:shiji/lian-po-lin-xiang-ru-lie-zhuan
reliability: 大體可信
significance: >-
  一場全程在「記錄」層面進行的外交戰：雙方爭的不是實利，
  是史官筆下那一行字。秦要寫「令趙王鼓瑟」，趙就要寫「秦王為趙王擊缻」。
  值得注意的是最後一句——「趙亦盛設兵以待秦，秦不敢動」：
  藺相如在會上的所有強硬，其後盾是廉頗在邊境的軍隊。
  沒有那支軍隊，五步之內的威脅只是自殺。
