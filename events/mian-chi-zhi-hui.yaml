id: mian-chi-zhi-hui
name: 澠池之會
year: -279
period: zhan-guo-late
type: 會盟
states: [zhao, qin]
people: [lin-xiang-ru, lian-po, zhao-hui-wen-wang, qin-zhao-xiang-wang]
narrative: >-
  前 279 年，秦昭襄王派使者通知趙惠文王，說想與趙王和好，約在黃河以西的澠池相會。趙王害怕
  秦國，不想去。廉頗和藺相如商量後認為，趙王如果不去，就是向秦國顯示趙國又弱又怯。趙王於是
  動身，由藺相如隨行。廉頗送到邊境，與趙王告別時說：估算路程和會見的禮節走完，來回不會超過
  三十天；如果三十天還不回來，就請立太子為王，好斷絕秦國的指望。趙王答應了。

  宴會上，酒喝到興頭，秦王說自己聽說趙王愛好音樂，請趙王彈一曲瑟。趙王彈了。秦國的史官立即
  上前記下：某年某月某日，秦王與趙王一同飲酒，命令趙王彈瑟。

  藺相如上前說，趙王聽說秦王擅長秦地的樂曲，請讓他獻上盆缻給秦王敲擊，彼此助興。秦王發怒，
  不肯答應。藺相如便端著缻上前，跪著請秦王敲。秦王還是不肯。藺相如說，在這五步之內，他可以
  把脖子上的血濺到秦王身上。秦王身邊的侍衛想殺藺相如，藺相如瞪起眼睛大喝一聲，侍衛都嚇退了。
  秦王很不高興，只好勉強敲了一下缻。藺相如回頭叫趙國的史官記下：某年某月某日，秦王為趙王敲缻。

  接著秦國群臣說，請趙國拿出十五座城為秦王祝壽。藺相如也回敬說，那就請秦國拿出咸陽為趙王祝壽。

  直到宴會結束，秦國始終無法佔趙國的上風。趙國又在邊境大舉陳兵防備秦國，秦國不敢輕舉妄動。
original:
  - speaker: 廉頗、藺相如
    locus: 廉頗藺相如列傳
    quote: 王不行，示趙弱且怯也。
    translation: 大王如果不去，就是向秦國顯示趙國又弱又怯。
  - speaker: 廉頗
    locus: 廉頗藺相如列傳
    quote: 王行，度道里會遇之禮畢，還，不過三十日。三十日不還，則請立太子為王，以絕秦望。
    translation: >-
      大王此行，估算路程和會見的禮節走完，來回不會超過三十天。如果三十天還不回來，
      就請立太子為王，好斷絕秦國的指望。
  - speaker: 秦昭襄王
    locus: 廉頗藺相如列傳
    quote: 寡人竊聞趙王好音，請奏瑟。
    translation: 我私下聽說趙王愛好音樂，請彈一曲瑟。
  - speaker: 藺相如
    locus: 廉頗藺相如列傳
    quote: 五步之內，相如請得以頸血濺大王矣！
    translation: 在這五步之內，我藺相如可以把脖子上的血濺到大王身上！
  - speaker: 藺相如
    locus: 廉頗藺相如列傳
    quote: 某年月日，秦王為趙王擊缻。
    translation: 某年某月某日，秦王為趙王敲缻。
  - speaker: 秦之群臣、藺相如
    locus: 廉頗藺相如列傳
    quote: >-
      秦之群臣曰：「請以趙十五城為秦王壽。」藺相如亦曰：「請以秦之咸陽為趙王壽。」
    translation: >-
      秦國群臣說：「請把趙國十五座城送給秦王作壽禮。」藺相如也回敬：「那就請把秦國的咸陽
      送給趙王作壽禮。」
sources:
  - source: shiji
    locus: 廉頗藺相如列傳
    ctext_urn: ctp:shiji/lian-po-lin-xiang-ru-lie-zhuan
reliability: 大體可信
significance: >-
  一場全程圍繞史官記錄進行的外交戰：雙方爭的不是實利，而是史官筆下那一行字。秦國要寫
  「令趙王鼓瑟」，趙國就要寫「秦王為趙王擊缻」。藺相如在會上的所有強硬，靠的是廉頗在邊境的
  軍隊作後盾——「趙亦盛設兵以待秦，秦不敢動」（白話：趙國也大舉陳兵防備秦國，秦國不敢輕舉妄動）；
  沒有那支軍隊，五步之內的威脅只是自殺。
