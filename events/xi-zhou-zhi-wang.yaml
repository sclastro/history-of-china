id: xi-zhou-zhi-wang
name: 西周之亡
year: -771
year_note: 周幽王十一年
period: dong-qian
type: 滅國
states: [zhou]
people: [zhou-you-wang, bao-si]
narrative: >-
  周幽王的王后是申侯的女兒，生下太子宜臼。後來幽王寵愛褒國進獻的女子褒姒，
  褒姒生了兒子伯服。幽王於是廢掉申后和太子宜臼，改立褒姒為王后、伯服為太子。

  《史記·周本紀》說，褒姒不愛笑，幽王想盡辦法也逗不笑她。幽王設置了烽火臺和大鼓，
  約定有敵寇來犯就點燃烽火。有一次烽火點起，諸侯都率兵趕到，到了卻不見敵寇，褒姒這才大笑。
  幽王很高興，此後屢次點燃烽火，諸侯漸漸不再相信，來的人也越來越少。幽王又任用貪財善諛的虢石父，
  國人都怨恨他。

  申侯為女兒和外孫被廢而憤怒，聯合繒國和西方的犬戎進攻幽王。幽王點燃烽火徵兵，
  卻沒有一支軍隊趕來。犬戎在驪山之下殺死幽王，擄走褒姒，把周室的財物搶掠一空。
  諸侯於是與申侯一起擁立原來的太子宜臼為王，就是周平王。平王把國都東遷到雒邑，以躲避戎人，
  東周由此開始。這套解釋在此後兩千年一直是通行的說法，「烽火戲諸侯」的成語也由此而來。

  2008 年入藏清華大學的戰國竹簡〈繫年〉，第二章所記全然不同。據〈繫年〉，是幽王和伯服先把宜臼
  趕走，宜臼逃到西申；幽王隨即出兵包圍西申，要申國交出宜臼，申國不肯。繒國於是引西戎前來，
  攻打幽王，幽王和伯服都被消滅，西周滅亡。書中沒有烽火，也沒有褒姒的笑。〈繫年〉還記載，
  幽王死後，各國國君和朝中大臣在虢國另立幽王的弟弟余臣為王，就是攜惠王，與平王兩王並立；
  二十一年後，晉文侯在虢國殺了攜惠王。這段周室分裂的歷史，《史記》完全沒有記載。
original:
  - source: shiji
    locus: 周本紀
    quote: >-
      褒姒不好笑，幽王欲其笑萬方，故不笑。幽王為烽燧大鼓，有寇至則舉烽火。諸侯悉至，至而無寇，
      褒姒乃大笑。幽王說之，為數舉烽火。其後不信，諸侯益亦不至。
    translation: >-
      褒姒不愛笑，幽王想盡辦法要她笑，她還是不笑。幽王設置烽火臺和大鼓，有敵寇來犯就點燃烽火。
      諸侯都率兵趕到，到了卻不見敵寇，褒姒這才大笑。幽王很高興，便屢次點燃烽火。
      此後諸侯不再相信，來的人也越來越少。
  - source: shiji
    locus: 周本紀
    quote: >-
      申侯怒，與繒、西夷犬戎攻幽王。幽王舉烽火徵兵，兵莫至。遂殺幽王驪山下，虜褒姒，
      盡取周賂而去。
    translation: >-
      申侯大怒，聯合繒國和西方的犬戎進攻幽王。幽王點燃烽火徵兵，沒有一支軍隊趕來。
      犬戎於是在驪山之下殺死幽王，擄走褒姒，把周室的財物搶掠一空才離去。
  - source: qinghua-xinian
    locus: 第二章
    quote: >-
      幽王起師，圍平王于西申，申人弗畀。繒人乃降西戎，以攻幽王，幽王及伯盤乃滅，周乃亡。
      邦君諸正乃立幽王之弟余臣于虢，是攜惠王。立二十又一年，晉文侯仇乃殺惠王于虢。
    translation: >-
      幽王出兵，在西申包圍平王，申國人不肯交出平王。繒國人於是引來西戎，攻打幽王，
      幽王和伯盤都被消滅，周朝就此滅亡。各國國君和朝中大臣於是在虢國擁立幽王的弟弟余臣為王，
      就是攜惠王。攜惠王在位二十一年，晉文侯仇在虢國殺了他。
sources:
  - source: shiji
    locus: 周本紀
    ctext_urn: ctp:shiji/zhou-ben-ji
  - source: qinghua-xinian
    locus: 第二章
reliability: 大體可信
variants:
  - claim: >-
      清華簡〈繫年〉記幽王出兵包圍西申，繒人引西戎反擊而滅幽王，沒有烽火，也沒有褒姒之笑；
      又記幽王死後攜惠王與平王二王並立二十一年。
    source: qinghua-xinian
    locus: 第二章
notes: >-
  〈繫年〉原文採用整理者的通行釋文，「圍」原簡作「回」，「伯盤」原簡作「白盤」，「諸正」原簡作「者正」。
  伯盤即《史記》的伯服。
significance: >-
  西周的終結與東周的開端。王室失去關中舊土與直屬的軍隊，此後「禮樂征伐自諸侯出」
  （白話：制禮作樂與出兵征伐都由諸侯決定），春秋二百餘年的諸侯政治由此開場。
  它也是中國史學史的一個標本：一場由繼承之爭引發的政治崩潰，如何被改寫成一則關於女色的道德故事。
