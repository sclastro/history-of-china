id: xi-zhou-zhi-wang
name: 西周之亡
year: -771
year_note: 周幽王十一年
period: dong-qian
type: 滅國
states: [zhou]
people: [zhou-you-wang, bao-si]
narrative: >-
  周幽王廢申后與太子宜臼，改立褒姒為后、其子伯服為太子。
  申后之父申侯遂聯合繒國與西戎攻宗周，幽王死於驪山之下，
  西周亡。次年，太子宜臼在晉、鄭、秦的護送下東遷洛邑，是為平王，東周始。

  《史記·周本紀》以「烽火戲諸侯」解釋這場覆亡：
  幽王為博褒姒一笑而數舉烽火，諸侯至而無寇；及犬戎真至，
  舉烽火而諸侯不來，遂敗。此說在漢代已成定論，二千年來未嘗動搖。

  2008 年入藏清華大學的戰國楚簡〈繫年〉第二章，所記全然不同：
  幽王先主動「起師伐申」，申侯聯繒與西戎反擊而殺之——
  這是一場由王室繼承鬥爭引發的軍事冒進，而非一個女人的笑。
  〈繫年〉更記幽王死後「邦君諸正」另立幽王之弟余臣於虢，是為攜惠王，
  與平王二王並立二十一年，其後晉文侯殺攜王而周室方定。
  這段長達二十餘年的分裂，《史記》完全沒有。
sources:
  - source: shiji
    locus: 周本紀
    ctext_urn: ctp:shiji/zhou-ben-ji
  - source: qinghua-xinian
    locus: 第二章
reliability: 大體可信
variants:
  - claim: >-
      清華簡〈繫年〉記幽王主動伐申，申侯聯繒與西戎反擊殺之，
      無烽火無褒姒之笑；且記幽王死後二王並立二十一年。
    source: qinghua-xinian
    locus: 第二章
significance: >-
  西周的終結與東周的開端。王室失去關中舊土與直屬六師，
  自此「禮樂征伐自諸侯出」，春秋二百餘年的諸侯政治由此開場。
  同時它也是中國史學史的一個標本：一場結構性的政治崩潰，
  如何在數百年間被改寫成一則關於女色的道德故事。
