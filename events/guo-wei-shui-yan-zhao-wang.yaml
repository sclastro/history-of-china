id: guo-wei-shui-yan-zhao-wang
name: 郭隗說燕昭王
year: -311
year_note: 燕昭王即位之初
period: zhan-guo-mid
type: 獻策
states: [yan, qi]
people: [guo-wei, yan-zhao-wang]
narrative: >-
  燕昭王即位時，燕國剛被齊國攻破，國力殘敗。他卑身厚幣以招賢者，
  問郭隗：怎樣才能報齊國之仇？

  郭隗先講了一個故事：古代有國君懸賞千金求千里馬，三年求不到。
  一名近侍請求前往，三個月後找到千里馬，馬卻已經死了；
  他用五百金買下馬骨帶回來。國君大怒：我要的是活馬，你買死馬回來做什麼？

  近侍說：「死馬且買之五百金，況生馬乎？天下必以王為能市馬，馬今至矣。」
  （白話：死馬尚且用五百金買下，何況活馬？天下人必定認為大王真肯出錢買馬，
  千里馬很快就會來了。）

  不到一年，千里馬來了三匹。

  郭隗接著把話收回本題：「今王誠欲致士，先從隗始；
  況賢於隗者，豈遠千里哉？」
  （白話：如今大王若真想招攬人才，就先從我郭隗開始；
  何況比我賢能的人，難道還會嫌千里之遠嗎？）

  昭王於是替郭隗改築宮室，以師禮相待。消息傳開，
  樂毅自魏國來、鄒衍自齊國來、劇辛自趙國來。
  二十八年後，燕國富足，昭王以樂毅為上將軍，聯合五國伐齊，
  連下七十餘城，齊國只剩莒與即墨兩城。
sources:
  - source: zhan-guo-ce
    locus: 燕策一
    ctext_urn: ctp:zhan-guo-ce/yan-ce-yi
reliability: 大體可信
significance: >-
  「千金買骨」是先秦最精巧的一次信號設計。
  買馬骨本身毫無用處，正因為毫無用處，它才傳遞出一個純粹的訊息：
  這個買家真的肯付錢。與商鞅徙木立信是同一種手法——
  用一件本身無意義的高價交易，證明承諾的可信度。
  而郭隗最厲害的一步是把自己放進這個結構裡：
  他明說自己不是最賢的，正因為如此，厚待他才構成有效的信號。
