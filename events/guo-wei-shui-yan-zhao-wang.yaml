id: guo-wei-shui-yan-zhao-wang
name: 郭隗說燕昭王
year: -311
year_note: 燕昭王即位之初
period: zhan-guo-mid
type: 獻策
states: [yan, qi]
people: [guo-wei, yan-zhao-wang]
narrative: >-
  燕昭王即位的時候，燕國剛剛被齊國打敗，國力殘破。他放下身段，用豐厚的禮物招攬賢士，
  向大臣郭隗請教：怎樣才能向齊國報仇？

  郭隗沒有直接回答，先講了一個故事。古時有位國君，願意出一千金懸賞購買千里馬，
  找了三年也找不到。有一名近侍主動請求去辦這件事。三個月後，他找到了千里馬，
  可是馬已經死了。他還是用五百金買下馬骨帶了回來。國君大怒，說自己要的是活馬，
  買一副死馬骨頭回來有甚麼用？

  近侍回答：連死馬都肯用五百金買下，何況活馬？天下人一定認為大王是真肯出錢買馬的，
  千里馬很快就會送上門來。這就是成語「千金買骨」的出處。

  果然不到一年，就有人送來三匹千里馬。

  郭隗說完故事，把話拉回正題：大王如果真想招攬人才，就請先從我郭隗開始優待。
  我尚且受到重用，那些比我更賢能的人，又怎會嫌千里路遠而不肯來呢？

  燕昭王聽從了，替郭隗修築宮室，用對待老師的禮節侍奉他。消息傳開，
  各國賢士紛紛趕來投奔燕國：樂毅從魏國來，鄒衍從齊國來，劇辛從趙國來。

  二十八年之後，燕國變得富足強盛。燕昭王任命樂毅為上將軍，聯合五國一同攻打齊國，
  一連攻下七十多座城池，齊國最後只剩下莒和即墨兩座城。
original:
  - locus: 燕策一
    quote: 死馬且買之五百金，況生馬乎？天下必以王為能市馬，馬今至矣。
    translation: >-
      死馬尚且用五百金買下，何況活馬？天下人一定認為大王真肯出錢買馬，
      千里馬很快就會送上門來了。
  - locus: 燕策一
    quote: 於是不能期年，千里之馬至者三。
    translation: 結果不到一年，就有三匹千里馬送了上門。
  - speaker: 郭隗
    locus: 燕策一
    quote: 今王誠欲致士，先從隗始；隗且見事，況賢於隗者乎？豈遠千里哉？
    translation: >-
      如今大王若真想招攬人才，就請先從我郭隗開始優待。我尚且受到重用，
      何況比我更賢能的人呢？他們難道還會嫌千里路遠嗎？
  - locus: 燕策一
    quote: 於是昭王為隗築宮而師之。樂毅自魏往，鄒衍自齊往，劇辛自趙往，士爭湊燕。
    translation: >-
      於是燕昭王替郭隗修築宮室，用對待老師的禮節侍奉他。樂毅從魏國來，
      鄒衍從齊國來，劇辛從趙國來，賢士爭相湧向燕國。
sources:
  - source: zhan-guo-ce
    locus: 燕策一
    ctext_urn: ctp:zhan-guo-ce/yan-ce-yi
reliability: 大體可信
significance: >-
  「千金買骨」是先秦最精巧的一次信號設計。買馬骨本身毫無用處，正因為毫無用處，
  它才傳遞出一個純粹的訊息：這個買家真的肯付錢。這與商鞅徙木立信是同一種手法——
  用一件本身沒有意義的高價交易，證明承諾的可信度。而郭隗最厲害的一步，是把自己放進了這個結構裡：
  他明說自己並不是最賢能的，正因為如此，厚待他才構成一個有效的信號。
