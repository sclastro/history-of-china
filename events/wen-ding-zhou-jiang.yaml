reliability: 信史
significance: >-
  九鼎是王權的象徵，問鼎的輕重，就是試探取而代之的可能。王孫滿的回答把問題整個換掉了：
  鼎的分量不在銅，在持有者的德行。這既是拒絕，也是一套關於正當性的理論；周王室此時已無兵可恃，
  靠的正是這套理論又延續了三百五十年。「問鼎」自此成為漢語中覬覦最高權位的代稱。
