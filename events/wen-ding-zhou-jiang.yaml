id: wen-ding-zhou-jiang
name: 觀兵周疆問鼎
year: -606
year_note: 魯宣公三年
period: wu-ba
type: 外交
states: [chu, zhou]
people: [chu-zhuang-wang, wang-sun-man]
narrative: >-
  楚子伐陸渾之戎，遂至於雒，觀兵于周疆。定王使王孫滿勞楚子。楚子問鼎之大小輕重焉。

  對曰：「在德不在鼎。昔夏之方有德也，遠方圖物，貢金九牧，鑄鼎象物，百物而為之備，使民知神
  姦。故民入川澤山林，不逢不若；螭魅罔兩，莫能逢之——用能協于上下以承天休。桀有昏德，鼎遷
  于商，載祀六百；商紂暴虐，鼎遷于周。德之休明，雖小，重也；其姦回昏亂，雖大，輕也。天祚明
  德，有所厎止。成王定鼎于郟鄏，卜世三十，卜年七百，天所命也。周德雖衰，天命未改。鼎之輕重
  ，未可問也。」（白話：在於德而不在於鼎。從前夏朝正有德的時候，遠方把各種物象畫成圖，九州
  進貢銅材，鑄鼎並把那些物象鑄在上面，百物齊備，使百姓認得神物與奸邪。所以百姓進入河湖山林
  ，不會碰上不利的東西；山精水怪也遇不上他們——因此上下和協而承受上天的福祐。夏桀昏亂無德
  ，鼎就遷到商朝，歷時六百年；商紂暴虐，鼎又遷到周朝。德行美好清明，鼎雖小也是重的；若姦邪
  昏亂，鼎雖大也是輕的。上天賜福給有德者，是有期限的。成王把九鼎安放在郟鄏，占卜的結果是傳
  世三十代、享國七百年，這是天所授命。周室的德行雖已衰微，天命卻還沒有改變。鼎的輕重，是不
  可以問的。）

  楚子乃還。
sources:
  - source: zuo-zhuan
    locus: 宣公三年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/xuan-gong-san-nian
reliability: 信史
significance: >-
  九鼎是王權的象徵物，問其輕重即是試探取而代之的可能。
  王孫滿的回答把問題整個換掉了：鼎的重量不在金屬，
  在持有者的德——這既是拒絕，也是一套關於正當性的理論。
  周王室此時已無一兵可恃，靠的正是這套理論多活了三百五十年。
  「問鼎」自此成為漢語中「覬覦最高權位」的專用語。
