id: wen-ding-zhou-jiang
name: 觀兵周疆問鼎
year: -606
year_note: 魯宣公三年
period: wu-ba
type: 外交
states: [chu, zhou]
people: [chu-zhuang-wang, wang-sun-man]
narrative: >-
  楚子伐陸渾之戎，遂至於雒，觀兵于周疆。定王使王孫滿勞楚子。
  楚子問鼎之大小輕重焉。

  對曰：「在德不在鼎。昔夏之方有德也，遠方圖物，貢金九牧，
  鑄鼎象物，百物而為之備，使民知神姦。故民入川澤山林，
  不逢不若；螭魅罔兩，莫能逢之——用能協于上下以承天休。
  桀有昏德，鼎遷于商，載祀六百；商紂暴虐，鼎遷于周。
  德之休明，雖小，重也；其姦回昏亂，雖大，輕也。
  天祚明德，有所厎止。成王定鼎于郟鄏，卜世三十，卜年七百，天所命也。
  周德雖衰，天命未改。鼎之輕重，未可問也。」

  楚子乃還。
sources:
  - source: zuo-zhuan
    locus: 宣公三年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/xuan-gong-san-nian
reliability: 信史
significance: >-
  九鼎是王權的象徵物，問其輕重即是試探取而代之的可能。
  王孫滿的回答把問題整個換掉了：鼎的重量不在金屬，
  在持有者的德——這既是拒絕，也是一套關於正當性的理論。
  周王室此時已無一兵可恃，靠的正是這套理論多活了三百五十年。
  「問鼎」自此成為漢語中「覬覦最高權位」的專用語。
