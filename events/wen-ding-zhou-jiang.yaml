id: wen-ding-zhou-jiang
name: 觀兵周疆問鼎
year: -606
year_note: 魯宣公三年
period: wu-ba
type: 外交
states: [chu, zhou]
people: [chu-zhuang-wang, wang-sun-man]
narrative: >-
  前 606 年，楚莊王出兵討伐陸渾之戎，順勢來到雒水邊，在周天子的疆界上陳兵檢閱，炫耀武力。
  周定王派大夫王孫滿去慰勞楚軍。莊王當面向王孫滿打聽九鼎的大小輕重。九鼎相傳是夏禹所鑄，
  歷經夏、商、周三代，是天子王權的象徵；問鼎的輕重，等於試探能否把天下取而代之。

  王孫滿回答：天下的得失在於德行，不在於鼎。從前夏朝正有德行的時候，遠方各地把當地的物象畫成圖，
  九州的長官進貢銅材，用來鑄鼎，把各種物象鑄在鼎上，使百姓能辨認哪些是神物、哪些是害人的東西。
  因此百姓進入河湖山林，不會碰上不利的東西，山精水怪也遇不上他們，上下因而和睦，承受上天的福祐。
  後來夏桀昏亂無德，鼎就遷到商朝，歷時六百年；商紂暴虐，鼎又遷到周朝。

  他接著說：德行美好清明，鼎雖小也是重的；姦邪昏亂，鼎雖大也是輕的。上天賜福給有德的人，
  是有期限的。周成王當年把九鼎安放在郟鄏，占卜得到的結果是傳世三十代、享國七百年，
  這是上天的命令。如今周室的德行雖然衰微，天命卻還沒有改變。鼎的輕重，是不可以問的。

  《史記·楚世家》記載這段對答時，多了莊王的一句狂言：王孫滿剛說出「在德不在鼎」，
  莊王就說，你不要拿九鼎來壓人，楚國只要把折斷的戟鉤尖收集起來，就足夠鑄成九鼎。
  王孫滿於是說出上面那番話。據《史記》，莊王聽完就率軍回國了。
original:
  - locus: 宣公三年
    quote: >-
      楚子伐陸渾之戎，遂至于雒，觀兵于周疆。定王使王孫滿勞楚子。楚子問鼎之大小輕重焉。
    translation: >-
      楚莊王討伐陸渾之戎，順勢來到雒水邊，在周天子的疆界上陳兵檢閱。周定王派王孫滿去慰勞楚莊王。
      楚莊王向他打聽九鼎的大小輕重。
  - speaker: 王孫滿
    locus: 宣公三年
    quote: >-
      在德不在鼎。昔夏之方有德也，遠方圖物，貢金九牧，鑄鼎象物，百物而為之備，使民知神姦。
    translation: >-
      天下的得失在於德行，不在於鼎。從前夏朝正有德行的時候，遠方各地把當地的物象畫成圖，
      九州的長官進貢銅材，用來鑄鼎，把各種物象鑄在鼎上，百物都齊備，使百姓能辨認神物與害人的東西。
  - speaker: 王孫滿
    locus: 宣公三年
    quote: >-
      德之休明，雖小，重也。其姦回昏亂，雖大，輕也。天祚明德，有所厎止。成王定鼎于郟鄏，
      卜世三十，卜年七百，天所命也。周德雖衰，天命未改。鼎之輕重，未可問也。
    translation: >-
      德行美好清明，鼎雖小也是重的；姦邪昏亂，鼎雖大也是輕的。上天賜福給有德的人，是有期限的。
      周成王把九鼎安放在郟鄏，占卜得到的結果是傳世三十代、享國七百年，這是上天的命令。
      周室的德行雖然衰微，天命卻還沒有改變。鼎的輕重，是不可以問的。
  - speaker: 楚莊王
    source: shiji
    locus: 楚世家
    quote: >-
      子無阻九鼎！楚國折鉤之喙，足以為九鼎。
    translation: >-
      你不要拿九鼎來壓人！楚國只要把折斷的戟鉤尖收集起來，就足夠鑄成九鼎。
