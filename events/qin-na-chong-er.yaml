id: qin-na-chong-er
name: 秦納重耳
year: -636
year_note: 魯僖公二十四年
period: wu-ba
type: 外交
states: [qin, jin]
people: [qin-mu-gong, jin-wen-gong]
narrative: >-
  重耳自楚入秦，秦穆公納女五人焉，懷嬴與焉——懷嬴本晉懷公（重耳之姪）之妻，重耳初嫌其亂倫
  而不敬，司空季子曰「其國且伐，況其故妻乎」，乃受之。

  秦晉之間本已三世為婚：獻公以女伯姬妻穆公（穆姬）；惠公之子圉質秦而穆公妻以懷嬴；至此重耳
  復娶秦女。「秦晉之好」四字所指者即此——它不是一段佳話，而是一套持續三代的政治聯姻工程。

  穆公以兵送重耳渡河，晉人殺懷公於高梁，重耳立，是為文公。《左傳》記其渡河之際，狐偃以璧授
  公子曰「臣負羈絏從君巡於天下，臣之罪甚多矣，臣猶知之，而況君乎？請由此亡」（白話：臣揹著
  馬韁繩隨君侯周遊天下，臣的過失實在太多了，臣自己都知道，何況君侯呢？請容我就此離去），公
  子曰「所不與舅氏同心者，有如白水」，投其璧于河。
sources:
  - source: zuo-zhuan
    locus: 僖公二十四年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/xi-gong-er-shi-si-nian
  - source: guo-yu
    locus: 晉語四
reliability: 信史
significance: >-
  「秦晉之好」的實際內容：三代互婚、三置晉君，
  秦以婚姻為手段介入晉之繼承，晉則以婚姻換取即位的軍事支持。
  它是春秋大國關係中最緊密、也最不穩定的一組——
  韓原之戰與崤之戰同樣發生在這對「之好」之間。
