id: qin-na-chong-er
name: 秦納重耳
year: -636
year_note: 魯僖公二十四年
period: wu-ba
type: 外交
states: [qin, jin]
people: [qin-mu-gong, jin-wen-gong]
narrative: >-
  前 637 年，重耳流亡多年後，從楚國來到秦國。秦穆公一次把五名女子嫁給他，其中包括懷嬴。
  懷嬴原是晉懷公的妻子，而晉懷公是重耳的姪兒。重耳起初嫌棄迎娶姪兒的舊妻有違倫常，
  對懷嬴很不客氣：懷嬴捧水侍候他洗手，他洗完卻甩手把水潑向她。懷嬴生氣，說秦、晉本是對等的大國，
  他憑甚麼看輕自己。重耳這才害怕，脫下禮服、把自己關起來請罪。大臣司空季子勸他：
  連晉懷公的國家都快要被討伐了，何況只是他從前的妻子？接受這門婚事，正好結好秦國、
  爭取回國即位的支持，不該拘泥小節而誤了大事。重耳於是接受了。

  其實到這時候，秦、晉兩國已經三代通婚。當年晉獻公把女兒伯姬（穆姬）嫁給秦穆公；
  後來晉惠公的兒子公子圉在秦國當人質，穆公又把懷嬴嫁給他；如今重耳再娶秦國女子。
  人們常說的「秦晉之好」，指的就是這一套關係——它並不是一段美滿姻緣，
  而是一項延續三代的政治聯姻。

  隨後，秦穆公派兵護送重耳渡過黃河回國。渡河的時候，隨行多年的舅父狐偃把一塊玉璧交給重耳，
  說自己揹著馬韁繩追隨他周遊各國，過失實在太多，連自己都清楚，何況重耳，因此請求就此離開。
  重耳明白狐偃的用意，便立誓說：我若不與舅父同心，就讓這河水作證。
  說完，他把玉璧投進黃河。渡河之後，晉國人在高梁殺了晉懷公，重耳即位，就是晉文公。
original:
  - speaker: 司空季子
    source: shiji
    locus: 晉世家
    quote: 其國且伐，況其故妻乎！
    translation: 連他的國家都快要被討伐了，何況只是他從前的妻子？
  - speaker: 懷嬴
    locus: 僖公二十三年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/xi-gong-er-shi-san-nian
    quote: 秦、晉，匹也，何以卑我？
    translation: 秦國和晉國本是對等的大國，你憑甚麼看輕我？
  - speaker: 狐偃
    locus: 僖公二十四年
    quote: 臣負羈絏從君巡於天下，臣之罪甚多矣，臣猶知之，而況君乎？請由此亡。
    translation: >-
      我揹著馬韁繩隨從君侯周遊天下，我的過失實在太多，連我自己都清楚，何況君侯呢？
      請容我就此離去。
  - speaker: 重耳
    locus: 僖公二十四年
    quote: 所不與舅氏同心者，有如白水！
    translation: 我若不與舅父同心，就有這白水作證！
sources:
  - source: zuo-zhuan
    locus: 僖公二十四年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/xi-gong-er-shi-si-nian
  - source: guo-yu
    locus: 晉語四
  - source: shiji
    locus: 晉世家
    ctext_urn: ctp:shiji/jin-shi-jia
reliability: 信史
significance: >-
  「秦晉之好」的實際內容，是三代互相通婚、三次擁立晉國國君：秦國藉婚姻插手晉國的君位繼承，
  晉國則用婚姻換取回國即位的軍事支持。這是春秋大國之間最緊密、也最不穩定的一組關係——
  韓原之戰和崤之戰，同樣打在這對姻親之間。
