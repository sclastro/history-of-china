significance: >-
  春秋與戰國的分界線。就制度而言，它宣告了封建宗法的破產——
  「陪臣執國命」不再是僭越，而是新的常態。
  就此後兩百年的格局而言，晉的分裂解除了秦東出的最大屏障：
  一個統一的晉，秦是打不過的；三個分開的晉，秦逐一擊破。
