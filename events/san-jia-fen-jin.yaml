id: san-jia-fen-jin
name: 三家分晉
year: -403
year_note: 周威烈王二十三年
period: zhan-guo-early
type: 滅國
states: [jin, zhao, wei, han]
people: [zhao-xiang-zi]
narrative: >-
  前 453 年，趙、韓、魏三家聯手消滅智伯（智瑤），瓜分了他的土地。此後晉國公室日漸衰微，
  到晉幽公時只剩下絳、曲沃兩地。前 403 年，周威烈王正式冊命韓虔（韓景侯）、趙籍（趙烈侯）、
  魏斯（魏文侯）為諸侯，三家的篡奪從此取得了合法的名分。到前 376 年，三家把晉靜公廢為平民，
  晉國的宗廟從此斷絕。

  北宋司馬光編《資治通鑑》，以前 403 年三家受封為全書的開端，並且發表了一篇議論。他認為，
  天子最重要的職責是維護禮，禮之中最重要的是名分，名分之中最重要的是名號。晉國的大夫欺凌國君、
  瓜分晉國，周天子既沒有能力討伐他們，反而還加封賞賜，讓他們正式位列諸侯。這樣一來，
  周王室僅存的一點名分，也被天子親手拋棄了。在司馬光看來，名分本是周王室最後的資本，
  如今卻由天子自己花掉了。

  同一時期，齊國也走上了相同的道路。前 481 年，田常殺死齊簡公，田氏逐步把持齊國大權。
  到前 386 年，田和正式列為諸侯；前 379 年，齊康公去世，姜姓齊國的宗廟隨之斷絕，
  齊國落入田氏之手。卿大夫取代舊有的公室，成為戰國開場共同的劇本。
original:
  - locus: 周本紀
    source: shiji
    quote: 威烈王二十三年，九鼎震。命韓、魏、趙為諸侯。
    translation: 周威烈王二十三年，象徵王權的九鼎震動。這一年，周天子冊命韓、魏、趙三家為諸侯。
  - locus: 趙世家
    quote: 烈侯元年，魏文侯伐中山，使太子擊守之。六年，魏、韓、趙皆相立為諸侯，追尊獻子為獻侯。
    translation: >-
      趙烈侯元年，魏文侯攻打中山國，派太子擊鎮守那裡。烈侯六年，魏、韓、趙三家都互相承認對方為諸侯，
      趙國並追尊烈侯的祖父獻子為獻侯。
  - locus: 晉世家
    source: shiji
    quote: 靜公二年，魏武侯、韓哀侯、趙敬侯滅晉後而三分其地。靜公遷為家人，晉絕不祀。
    translation: >-
      晉靜公二年，魏武侯、韓哀侯、趙敬侯滅掉晉國公室，把剩下的土地三家平分。晉靜公被貶為平民，
      晉國的宗廟祭祀從此斷絕。
sources:
  - source: shiji
    locus: 趙世家
    ctext_urn: ctp:shiji/zhao-shi-jia
  - source: shiji
    locus: 六國年表
    ctext_urn: ctp:shiji/liu-guo-nian-biao
reliability: 信史
significance: >-
  這是春秋與戰國的分界線。就制度而言，它宣告了封建宗法秩序的破產：卿大夫掌握國家大權，
  不再被視為僭越，而成為新的常態。就此後兩百年的格局而言，晉國的分裂替秦國解除了東進的最大障礙——
  統一的晉國，秦國打不過；分成三家的晉國，秦國卻能夠逐一擊破。
