id: san-jia-fen-jin
name: 三家分晉
year: -403
year_note: 周威烈王二十三年
period: zhan-guo-early
type: 滅國
states: [jin, zhao, wei, han]
people: [zhao-xiang-zi]
narrative: >-
  前 453 年三家滅智伯而分其地，晉侯已無實土。前 403
  年，周威烈王正式命韓虔、趙籍、魏斯為諸侯——篡奪由此取得了合法名分。前 376
  年，三家廢晉靜公為庶人，晉絕祀。

  司馬光《資治通鑑》以此年為全書開端，論曰：「天子之職莫大於禮，禮莫大於分，分莫大於名……
  今晉大夫暴蔑其君，剖分晉國，天子既不能討，又寵秩之，使列於諸侯，是區區之名分復不能守而并
  棄之也。」（白話：天子的職責沒有比維護禮更大的，禮沒有比名分更大的，名分沒有比名號更大的
  ……如今晉國的大夫欺凌蔑視他們的國君、瓜分晉國，天子既不能討伐，反而還加以褒獎，使他們位
  列諸侯——這是連僅存的一點名分也守不住而一併拋棄了。）——周王室僅存的資本是名分，而它親
  手把這最後的資本花掉了。

  與此同時，齊國的田氏亦循同一路徑：田常弒簡公（前 481），至前 386
  年田和列為諸侯，前 379
  年齊康公卒而姜齊絕祀。卿大夫取代舊公室，是戰國開場的共同劇本。
