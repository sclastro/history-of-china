id: fa-shan-rong
name: 齊桓伐山戎
year: -663
year_note: 魯莊公三十一年
period: wu-ba
type: 戰役
states: [qi, yan]
people: [qi-huan-gong, guan-zhong]
narrative: >-
  山戎伐燕，燕告急於齊。桓公救燕，北伐山戎，至於孤竹而還。《韓非子·說林上》記其歸途：「管
  仲、隰朋從於桓公而伐孤竹，春往冬反，迷惑失道。管仲曰：『老馬之智可用也。』乃放老馬而隨之
  ，遂得道。行山中無水，隰朋曰：『蟻冬居山之陽，夏居山之陰，蟻壤一寸而仞有水。』乃掘地，遂
  得水。」（白話：管仲與隰朋隨齊桓公討伐孤竹，春天出征、冬天回師，迷了路。管仲說：老馬的本
  事可以用。）

  韓非於此下一斷語：「以管仲之聖而隰朋之智，至其所不知，不難師於老馬與蟻。今人不知以其愚心
  而師聖人之智，不亦過乎？」（白話：以管仲的聖明、隰朋的智慧，遇到自己不懂的事，尚且不以向
  老馬和螞蟻學習為難；今人不知道用自己愚昧的心去師法聖人的智慧，豈不是錯了嗎？）

  燕莊公送桓公至於齊境，桓公曰「非天子，諸侯相送不出境」，乃割燕君所至之地與燕——諸侯聞之
  ，皆從齊。
sources:
