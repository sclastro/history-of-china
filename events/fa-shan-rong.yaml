reliability: 大體可信
variants:
  - claim: 伐山戎救燕之事《左傳》《史記》皆載，然「老馬識途」一節僅見《韓非子》，別無旁證。
    source: shiji
    locus: 齊太公世家
    ctext_urn: ctp:shiji/qi-tai-gong-shi-jia
significance: >-
  「攘夷」的實例：齊桓不取燕地而反割地與燕，
  是用實利換取霸主的道義位置——霸權的成本核算，在這裡看得最清楚。
  而老馬識途一節的重點在韓非的按語：經驗性的知識不因其來源卑下而失效，
  這是法家反對「法先王」的認識論基礎。
