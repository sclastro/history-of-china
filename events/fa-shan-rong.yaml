variants:
  - claim: 伐山戎救燕之事《左傳》《史記》皆載，然「老馬識途」一節僅見《韓非子》，別無旁證。
    source: shiji
    locus: 齊太公世家
    ctext_urn: ctp:shiji/qi-tai-gong-shi-jia
significance: >-
  這是齊桓公尊王攘夷的一個實例。齊國出兵救燕、打退山戎，事後齊桓公不但不佔燕國的土地，
  反而把燕莊公相送越境的那片齊地割給燕國，用實利換取霸主應有的道義地位；霸權的成本要怎樣核算，
  這裡看得最清楚。至於「老馬識途」，重點在韓非的按語：經驗得來的知識，
  不會因為來源卑微就失去用處，這正是法家反對效法先王的認識論根據。
