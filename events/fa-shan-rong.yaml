id: fa-shan-rong
name: 齊桓伐山戎
year: -663
year_note: 魯莊公三十一年
period: wu-ba
type: 戰役
states: [qi, yan]
people: [qi-huan-gong, guan-zhong]
narrative: >-
  前 663 年，北方的山戎進攻燕國，燕國向齊國告急求救。齊桓公於是出兵北上救燕，討伐山戎，
  一直打到孤竹國（今河北盧龍一帶）才班師回國。

  《韓非子》記下了齊軍歸途的一件事。管仲和隰朋跟隨齊桓公討伐孤竹，春天出征，直到冬天才回師，
  途中迷了路。管仲說，老馬認得走過的路，牠的本事可以借用。於是眾人放開老馬，讓大軍跟著牠走，
  果然重新找回了道路。後來走到山裡沒有水喝，隰朋說，螞蟻冬天住在山的南面，夏天住在山的北面，
  地上的蟻穴高一寸，照著往下挖八尺（一仞）就有水。眾人依他的話掘地，果然找到了水。
  這就是成語「老馬識途」的出處。

  韓非在這件事後面加了一句評論：以管仲的聖明、隰朋的智慧，遇到自己不懂的事，
  尚且不把向老馬和螞蟻學習當作難堪；今天的人不懂得用自己這顆愚昧的心去師法聖人的智慧，
  難道不是錯了嗎？

  齊軍回國時，燕莊公一路相送，一直送過了燕國國境，進入齊國境內。
  齊桓公說，按照禮制，不是天子，諸侯彼此相送不應超出自己的國境，他不能對燕國失禮。
  於是他把燕莊公送到的那一片齊國土地割讓給燕國。各國諸侯聽說這件事，都歸附了齊國。
original:
  - locus: 說林上
    quote: 管仲、隰朋從於桓公而伐孤竹，春往冬反，迷惑失道。管仲曰：「老馬之智可用也。」乃放老馬而隨之，遂得道。
    translation: >-
      管仲和隰朋跟隨齊桓公討伐孤竹，春天出征，冬天才回師，途中迷了路。管仲說：老馬的本事可以用。
      於是放開老馬，讓大軍跟著牠走，終於找回了道路。
  - locus: 說林上
    quote: 行山中無水，隰朋曰：「蟻冬居山之陽，夏居山之陰，蟻壤一寸而仞有水。」乃掘地，遂得水。
    translation: >-
      走到山裡沒有水喝，隰朋說：螞蟻冬天住在山的南面，夏天住在山的北面，地上的蟻穴高一寸，
      往下挖八尺就有水。眾人依言掘地，果然找到了水。
  - speaker: 韓非
    locus: 說林上
    quote: 以管仲之聖而隰朋之智，至其所不知，不難師於老馬與蟻。今人不知以其愚心而師聖人之智，不亦過乎？
    translation: >-
      以管仲的聖明、隰朋的智慧，遇到自己不懂的事，尚且不把向老馬和螞蟻學習當作難堪；
      今天的人不懂得用自己愚昧的心去師法聖人的智慧，難道不是錯了嗎？
  - speaker: 齊桓公
    locus: 齊太公世家
    source: shiji
    ctext_urn: ctp:shiji/qi-tai-gong-shi-jia
    quote: >-
      桓公曰：「非天子，諸侯相送不出境，吾不可以無禮於燕。」於是分溝割燕君所至與燕，
      命燕君復修召公之政，納貢于周，如成康之時。諸侯聞之，皆從齊。
    translation: >-
      齊桓公說：不是天子，諸侯彼此相送不應超出自己的國境，我不能對燕國失禮。
      於是他把燕莊公送到的那片齊國土地割讓給燕國，又要燕君重修召公舊政，向周朝進貢，
      像成王、康王時那樣。各國諸侯聽說此事，都歸附了齊國。
