id: su-dai-jian-wei-wang
name: 蘇代諫魏安釐王
year: -273
year_note: 魏安釐王四年，華陽之戰後
period: zhan-guo-late
type: 外交
states: [wei, qin]
people: [su-dai]
narrative: >-
  魏安釐王即位後，秦國連年攻魏。前 273 年，秦軍在華陽大破魏、韓、趙三國聯軍，
  斬殺十五萬人，魏將芒卯敗逃。魏將段干子主張把南陽割給秦國求和。

  蘇代對安釐王說：想要璽印的是段干子，想要土地的是秦國。如今大王讓想要土地的秦國
  決定給誰官印，又讓想要官印的段干子主持割地——這樣下去，魏國的土地不割光是不會停止的。
  何況拿土地去侍奉秦國，就好比抱著柴去救火：柴沒有燒完，火就不會熄滅。
  這就是成語「抱薪救火」的由來。

  安釐王說：道理確實如此，只是事情已經開始辦了，不能再改。蘇代回答：大王難道沒有見過
  賭博的人為甚麼看重梟棋嗎？有利就吃掉對方，不利就停下來。如今大王說事情已經開始辦、
  不能再改，那大王運用智慧，為何還不如賭博的人運用一枚梟棋那樣靈活？

  《戰國策·魏策三》也記載這番話，但說話的是孫臣，背景是華陽戰敗後的第二年魏國將派段干崇割地講和，
  文字與《史記》略有出入。
original:
  - speaker: 蘇代
    source: shiji
    locus: 魏世家
    quote: >-
      欲璽者段干子也，欲地者秦也。今王使欲地者制璽，使欲璽者制地，魏氏地不盡則不知已。
      且夫以地事秦，譬猶抱薪救火，薪不盡，火不滅。
    translation: >-
      想要璽印的是段干子，想要土地的是秦國。如今大王讓想要土地的秦國掌握官印，
      讓想要官印的段干子主持割地，魏國的土地不割光，這件事就不會停止。
      何況拿土地去侍奉秦國，就好比抱著柴去救火——柴沒有燒完，火就不會熄滅。
  - speaker: 魏安釐王與蘇代
    source: shiji
    locus: 魏世家
    quote: >-
      王曰：「是則然也。雖然，事始已行，不可更矣。」對曰：「王獨不見夫博之所以貴梟者，
      便則食，不便則止矣。今王曰『事始已行，不可更』，是何王之用智不如用梟也？」
    translation: >-
      安釐王說：「道理確實如此。不過事情已經開始辦了，不能再改。」蘇代回答：「大王難道沒有見過
      賭博的人為甚麼看重梟棋嗎？有利就吃掉對方，不利就停下來。如今大王說『事情已經開始辦了，
      不能再改』，為甚麼大王運用智慧，還不如運用一枚梟棋呢？」
  - speaker: 孫臣
    source: zhan-guo-ce
    locus: 魏策三
    quote: >-
      且夫姦臣固皆欲以地事秦。以地事秦，譬猶抱薪而救火也。薪不盡，則火不止。
      今王之地有盡，而秦之求無窮，是薪火之說也。
    translation: >-
      而且奸臣本來都想拿土地去侍奉秦國。拿土地侍奉秦國，就好比抱著柴去救火。
      柴沒有燒完，火就不會停止。如今大王的土地有限，秦國的索求卻沒有窮盡，這正是柴與火的道理。
sources:
  - source: shiji
    locus: 魏世家
    ctext_urn: ctp:shiji/wei-shi-jia
  - source: zhan-guo-ce
    locus: 魏策三
    ctext_urn: ctp:zhan-guo-ce/wei-san
reliability: 大體可信
significance: >-
  「抱薪救火」是先秦對以割地換和平最精確的一次批評。它的力量在於指出這種交換的結構：
  割地不是付出一次代價換得一段和平，每割一次都增強了對方繼續索求的能力。
  孫臣說得更直白：「今王之地有盡，而秦之求無窮」（白話：大王的土地有限，秦國的索求卻沒有窮盡）。
