id: su-dai-jian-wei-wang
name: 蘇代諫魏安釐王
year: -273
year_note: 華陽之戰後
period: zhan-guo-late
type: 獻策
states: [wei, qin]
people: [su-dai]
narrative: >-
  魏國屢敗於秦，朝中有人主張割地求和。蘇代勸阻魏安釐王。

  他說：想要得到璽印的人希望割地，想要割地的人未必真為國家打算；
  那些主張割地的人，不過是想藉此換取自己的爵位。

  然後是那句斷語：

  「且夫以地事秦，譬猶抱薪救火，薪不盡，火不滅。」
  （白話：何況拿土地去侍奉秦國，就好比抱著柴去救火——
  柴沒有燒完，火就不會熄滅。）

  王說：這話是對的，只是事情已經答應了秦國，不能改了。

  蘇代答：大王難道沒見過賭博的人用梟棋嗎？想吃子就吃，想停就停。
  如今大王說「事已成，不可改」，是把自己的智慧看得比一枚棋子還不如。

  《史記·魏世家》記此語出於蘇代；《戰國策·魏策三》則繫於蘇代說魏王，
  而另一處相近之語出於孫臣。
sources:
  - source: shiji
    locus: 魏世家
    ctext_urn: ctp:shiji/wei-shi-jia
  - source: zhan-guo-ce
    locus: 魏策三
    ctext_urn: ctp:zhan-guo-ce/wei-san
reliability: 大體可信
significance: >-
  「抱薪救火」是先秦對「讓步換和平」最精確的一次批評，
  而它的力量在於指出了這種交換的**結構**：
  割地不是付出一次代價買到一段和平，
  而是每一次割地都增加了對方繼續索求的能力。
  柴與火的比喻之所以恰當，正因為柴本身就是火的燃料。
