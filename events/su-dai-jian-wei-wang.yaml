id: su-dai-jian-wei-wang
name: 蘇代諫魏安釐王
year: -273
year_note: 華陽之戰後
period: zhan-guo-late
type: 獻策
states: [wei, qin]
people: [su-dai]
narrative: >-
  魏國屢敗於秦，朝中有人主張割地求和。蘇代勸阻魏安釐王。

  他說：如今大王讓想要土地的秦國掌握封官的璽印，又讓想要璽印的段干子主持割地——
  主張割地的人，不過是想藉此換取自己的爵位。

  然後是那句斷語：

  「且夫以地事秦，譬猶抱薪救火，薪不盡，火不滅。」
  （白話：何況拿土地去侍奉秦國，就好比抱著柴去救火——
  柴沒有燒完，火就不會熄滅。）

  王說：這話是對的，只是事情已經答應了秦國，不能改了。

  蘇代答：大王難道沒見過賭博的人用梟棋嗎？想吃子就吃，想停就停。
  如今大王說事情已經答應、不能再改，是把自己的智慧看得比一枚棋子還不如。

  《史記·魏世家》記此語出於蘇代；《戰國策·魏策三》則記為孫臣對魏王所說，
  作「以地事秦，譬猶抱薪而救火也」，文字略異。
sources:
  - source: shiji
    locus: 魏世家
    ctext_urn: ctp:shiji/wei-shi-jia
  - source: zhan-guo-ce
