    ctext_urn: ctp:zhan-guo-ce/wei-san
reliability: 大體可信
significance: >-
  「抱薪救火」是先秦對以讓步換和平最精確的一次批評，
  而它的力量在於指出了這種交換的**結構**：
  割地不是付出一次代價買到一段和平，
  而是每一次割地都增加了對方繼續索求的能力。
  柴與火的比喻之所以恰當，正因為柴本身就是火的燃料。
