significance: >-
  戰國的實際起點。此後晉之公室徒存虛名，土地與人民盡歸三家。
  《資治通鑑》以周威烈王命三晉為諸侯（前 403）為全書之始，
  司馬光的著眼點是名分；但權力的轉移，在前 453 年這一天就已完成。
  智伯之敗，司馬光斷為「才勝德也」——
  更精確地說，是他把三個對手的利害算成了兩種：
  他以為韓魏怕他，卻沒算到韓魏更怕的是下一個輪到自己。
