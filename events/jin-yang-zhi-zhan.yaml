id: jin-yang-zhi-zhan
name: 晉陽之戰
year: -455
year_end: -453
period: zhan-guo-early
type: 戰役
states: [jin, zhao, wei, han]
people: [zhi-bo, zhao-xiang-zi]
narrative: >-
  晉六卿相攻，范氏、中行氏先滅，智、趙、韓、魏四家分其地，智伯最強。智伯請地於韓，韓康子欲
  弗與，段規曰「智伯好利而愎，不與且見伐，不如與之——彼狃，又將請地於他人，他人不予，必嚮
  之以兵」（白話：智伯貪利而剛愎，不給他土地他就會來攻打，不如給他——他嘗到甜頭，又會向別
  人索地；別人不給，必定對那人動兵），乃與之萬家之邑。復請地於魏，魏桓子亦與之。又請蔡、皋
  狼之地於趙，趙襄子弗與。

  智伯怒，帥韓、魏之甲以攻趙。襄子走晉陽（其父簡子所經營之根本），三家圍而灌之，城不浸者三
  版，「沈灶產蛙，民無叛意」（白話：我今天才知道，水可以用來滅掉一個國家。），然懸釜而炊、
  易子而食。

  智伯行水，魏桓子御、韓康子驂乘。智伯曰：「吾乃今知水可以亡人國也。」（白話：我今天才知道，水可以用來滅掉一個國家。）——桓子肘康子，康子
  履桓子之跗：汾水可以灌安邑，絳水可以灌平陽。智伯之臣絺疵察其色而諫曰「韓魏必反矣」，智伯
  不聽，反以告二子。

  襄子夜使張孟談潛出見韓魏，曰「唇亡則齒寒，今智伯帥二國之君伐趙，趙亡則韓魏為之次矣」（白
  話：嘴唇沒了牙齒就冷。如今智伯率領韓、魏兩家之君來攻趙，趙國一亡，下一個就輪到韓、魏了）
  ，二家遂約反。三月，襄子使人殺守堤之吏而決水灌智伯軍，韓魏翼而擊之，大敗智伯之眾，遂殺智
  伯而三分其地。趙襄子漆其頭以為飲器。
