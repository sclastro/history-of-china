id: jin-yang-zhi-zhan
name: 晉陽之戰
year: -455
year_end: -453
period: zhan-guo-early
type: 戰役
states: [jin, zhao, wei, han]
people: [zhi-bo, zhao-xiang-zi]
narrative: >-
  晉國六卿長年互相攻伐，范氏、中行氏先被消滅，剩下智、趙、韓、魏四家瓜分他們的土地，其中以
  智伯的勢力最強。智伯向韓康子索取土地，韓康子本來不想給。謀臣段規勸他：智伯貪利又剛愎，不
  給他土地，他就會出兵攻打韓國；不如先給。智伯嘗到甜頭，一定又會向別家索地；別家不給，他必
  定向那家動兵，韓國反而可以暫時避禍，靜觀局勢變化。韓康子聽從，割了一座萬戶的城邑給智伯。
  智伯接著向魏桓子索地，魏桓子也照給。最後他向趙襄子索取蔡、皋狼兩地，趙襄子不肯給。

  智伯大怒，率領韓、魏兩家的軍隊攻打趙國。趙襄子退守晉陽——那是他父親趙簡子多年經營的根本
  之地。三家圍城，引水灌淹，城牆只差三版高（版是築牆的計量單位）沒有被淹沒。城裡的灶都被水
  泡得生出青蛙，只能把鍋吊起來燒飯；糧食吃盡，甚至交換孩子充飢。

  據《資治通鑑》記載，一天智伯巡視水勢，魏桓子替他駕車，韓康子在旁陪乘。智伯感歎說：他今天才知道，水可以用來滅
  掉一個國家。這句話卻讓兩人心驚：因為汾水同樣可以灌魏國都城安邑，絳水同樣可以灌韓國都城平
  陽。於是魏桓子用手肘碰韓康子，韓康子踩魏桓子的腳背，彼此暗中會意。智伯的家臣絺疵（《戰國策》作郤疵）看出韓、
  魏兩人神色不對，勸智伯說他們一定會反叛。智伯不聽，反而把這番話告訴了韓、魏二人。

  趙襄子趁夜派張孟談偷偷出城，去見韓、魏之君。張孟談對他們說：嘴唇沒了牙齒就會受寒；如今智
  伯率領韓、魏兩家來攻趙，趙國一亡，下一個就輪到韓、魏。兩家於是約定倒戈。到了三月，趙襄子
  派人殺掉智伯守堤的官吏，決開堤水反灌智伯的軍隊，韓、魏兩軍從兩翼夾擊，大敗智伯的部眾，殺
  了智伯，三家瓜分他的土地。趙襄子還把智伯的頭骨塗上漆，做成飲酒的器皿。
original:
  - speaker: 段規
    locus: 趙策一
    quote: >-
      夫知伯之為人也，好利而鷙愎，來請地不與，必加兵於韓矣。君其與之。與之彼狃，
      又將請地於他國，他國不聽，必鄉之以兵；然則韓可以免於患難，而待事之變。
    translation: >-
      智伯這個人，貪圖利益又剛愎凶狠。您不給他土地，他一定會出兵攻打韓國。不如給他。
      給了他，他嘗到甜頭，又會向別家索地；別家不肯，他一定向那家動兵。這樣韓國就可以避開禍患，
      靜待局勢變化。
  - locus: 趙世家
    source: shiji
    ctext_urn: ctp:shiji/zhao-shi-jia
    quote: 引汾水灌其城，城不浸者三版。城中懸釜而炊，易子而食……
    translation: >-
      三家引汾水灌晉陽城，城牆只剩三版高沒有被淹。城裡把鍋吊起來燒飯，交換孩子來充飢……
  - speaker: 郤疵
    locus: 趙策一
    quote: 韓、魏之君必反矣。
    translation: 韓、魏兩家的國君一定會反叛。
  - speaker: 張孟談
    locus: 趙策一
    quote: 臣聞脣亡則齒寒，今知伯帥二國之君伐趙，趙將亡矣，亡則二君為之次矣。
    translation: >-
      我聽說嘴唇沒了，牙齒就會受寒。如今智伯率領你們兩位國君攻打趙國，趙國快要滅亡了；
      趙國一亡，下一個就輪到兩位了。
