reliability: 信史
significance: >-
  晉陽之戰是戰國時代的實際起點。此後晉國公室名存實亡，土地和人民都落入趙、韓、魏三家手中。
  《資治通鑑》把周威烈王正式冊命三家為諸侯的前 403 年作為全書開端，司馬光看重的是名分；
  可是權力的轉移，早在前 453 年這一天就已經完成。司馬光評智伯之敗是「才勝德也」（白話：才能勝過了德行）。
  更準確地說，智伯把三個對手的利害算成了兩種：他以為韓、魏怕他，
  卻沒有算到韓、魏更怕的，是自己成為下一個被消滅的對象。
