id: chu-wei-song
name: 楚圍宋
year: -595
year_end: -594
year_note: 魯宣公十四至十五年
period: wu-ba
type: 戰役
states: [chu, song, jin]
people: [chu-zhuang-wang, hua-yuan, zi-fan, jin-jing-gong, bo-zong, jie-yang]
narrative: >-
  楚莊王派申舟出使齊國，特意吩咐他不要向宋國借道——這在當時等於公然羞辱。申舟明知必死，仍
  然去了，果然被宋人所殺。莊王聽到消息，「投袂而起」（白話：一甩衣袖就站了起來），鞋子跑到
  庭院才追上、佩劍跑到寢門才追上、車子跑到街市才追上，當年九月出兵圍宋。

  宋國向晉國求救。晉景公想出兵，大夫伯宗勸阻：「不可。古人有言曰『雖鞭之長，不及馬腹』
  （白話：鞭子雖然長，也打不到馬肚子上）。天方授楚，未可與爭。」（白話：上天正在扶助楚國，
  還不能跟它相爭。）景公於是只派解揚去對宋人說晉國全軍已經出動——一句吊住宋國的空話。解揚
  途經鄭國被扣送到楚國，莊王重賄他要他改口說晉軍不來，他假意答應，登上樓車卻仍喊原話；莊王
  要殺他，他以「受命以出，有死無隕」自陳，莊王放了他。

  圍城到第二年五月，宋城中「易子而食，析骸以爨」（白話：交換孩子來吃，劈開屍骨當柴燒）。而
  楚軍的糧食也只剩七天。宋國執政華元夜裡潛入楚營，登上司馬子反的床把他叫醒，據實相告，並說
  宋人「雖然，城下之盟，有以國斃，不能從也」（白話：話雖如此，城下之盟等於亡國，我們寧可舉
  國而死也不能接受）。子反據實回報，莊王退軍三十里，兩國訂盟。盟辭是「我無爾詐，爾無我虞」
  （白話：我不欺騙你，你也不算計我）。
