reliability: 信史
significance: >-
  一場圍城生出「鞭長莫及」「爾虞我詐」兩條成語，兩條都與說實話有關。伯宗坦承晉國的力量有邊界，
  是霸主少有的自知；華元夜登子反之床，靠的不是計謀，而是把城中最壞的實情和盤托出——
  雙方都已到了極限，誰也不必再演下去。盟辭「我無爾詐，爾無我虞」（白話：我不欺騙你，你也不防備我）
  本是和平誓言，後世卻縮成「爾虞我詐」，意思完全翻轉：一句約定不再互相欺騙的話，
  變成了互相欺騙的代稱。
