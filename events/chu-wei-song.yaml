id: chu-wei-song
name: 楚圍宋
year: -595
year_end: -594
year_note: 魯宣公十四至十五年
period: wu-ba
type: 戰役
states: [chu, song, jin]
people: [chu-zhuang-wang, hua-yuan, zi-fan, jin-jing-gong, bo-zong, jie-yang]
narrative: >-
  前 595 年，楚莊王派大夫申舟出使齊國，吩咐他路過宋國時不要向宋國借道。按當時的禮制，
  使者經過別國，必須先請求借道；不借道，等於把對方看作自己的邊邑，是公然的輕蔑。
  申舟從前在孟諸打獵時得罪過宋國，心知此行必死。楚莊王向他保證：宋國要是殺了你，
  我就出兵討伐。申舟讓兒子申犀拜見莊王，把他託付給莊王，然後才動身。

  申舟到了宋國，果然被宋人攔下。宋國執政華元認為：楚使經過而不借道，是把宋國當作楚國的邊邑，
  這等於亡國；殺了楚國使者，楚國必定來攻打，這也是亡國；同樣是亡國，於是殺了申舟。
  楚莊王聽到消息，一甩衣袖就站起來往外走，侍從拿著鞋子追到前庭才追上，拿著佩劍追到寢宮門外
  才追上，駕著車追到蒲胥的街市才追上。同年九月，楚軍包圍了宋國都城。

  次年春天，宋國派樂嬰齊到晉國告急。晉景公想出兵救宋，大夫伯宗勸阻：鞭子再長，
  也打不到馬肚子；上天正在扶助楚國，晉國雖然強大，也不能違抗天意，不如等待時機。
  這就是成語「鞭長莫及」的由來。晉景公於是作罷，只派解揚到宋國，叫宋人不要投降，
  並告訴他們晉國大軍已經全部出動，快要到了。

  解揚途經鄭國，被鄭人拘捕，送交楚國。楚莊王用厚禮收買他，要他向宋人說相反的話。
  解揚起初不肯，被勸了三次才答應。楚人讓他登上樓車（設有瞭望樓的戰車）向城中喊話，
  他卻把晉君的命令原原本本傳達出去。莊王要殺他，派人責問他為何食言。解揚回答：
  國君能發出正當的命令，就是義；臣子能奉行命令，就是信。他接受君命出使，寧死也不能讓使命落空，
  又怎能被收買？先前答應楚王，只是為了完成使命；為完成使命而死，是做臣子的福分。
  莊王於是放他回國。

  到了五月，楚軍準備撤離宋國。申犀在莊王馬前叩頭，說父親明知必死，仍不敢違背王命，
  如今大王卻要背棄當初的承諾。莊王答不上話。替莊王駕車的申叔時獻計：在宋國築屋住下，
  分兵回國耕種，擺出長期圍困的姿態，宋國一定屈服。莊王依計而行。

  宋人害怕了，派華元在夜裡潛入楚營，登上楚國司馬子反的床，把他叫醒，說：我們國君派我來告訴你們，
  城裡已經交換孩子來吃，劈開屍骨當柴燒；即使這樣，被迫在城下訂立的盟約，宋國寧可亡國也不接受；
  只要楚軍後退三十里，宋國一切聽從吩咐。子反害怕，先與華元立誓，再稟告莊王。
  《公羊傳》另記子反也向華元坦白，楚軍只剩七天糧食。楚軍於是後退三十里，宋、楚講和，
  華元到楚國作人質。兩國的盟辭是：我不欺騙你，你也不防備我。後世把這兩句壓縮成成語「爾虞我詐」，
  意思卻變成互相欺騙。
original:
  - speaker: 華元
    locus: 宣公十四年
    quote: 過我而不假道，鄙我也。鄙我，亡也。殺其使者，必伐我。伐我，亦亡也。亡一也。
    translation: >-
      楚使經過我國卻不借道，是把我們當作楚國的邊邑。被當作邊邑，就等於亡國。
      殺了楚國使者，楚國一定來攻打我們；被攻打，也是亡國。反正同樣是亡國。
  - locus: 宣公十四年
    quote: 楚子聞之，投袂而起，屨及于窒皇，劍及于寢門之外，車及于蒲胥之市。
    translation: >-
      楚莊王聽到消息，一甩衣袖就站起來往外走。侍從拿著鞋子追到前庭才追上，
      拿著佩劍追到寢宮門外才追上，駕著車追到蒲胥的街市才追上。
  - speaker: 伯宗
    locus: 宣公十五年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/xuan-gong-shi-wu-nian
    quote: 不可。古人有言曰：『雖鞭之長，不及馬腹。』天方授楚，未可與爭。雖晉之彊，能違天乎？
    translation: >-
      不行。古人說過：「鞭子雖然長，也打不到馬肚子。」上天正在扶助楚國，不能跟它相爭。
      晉國雖然強大，能違抗天意嗎？
  - speaker: 解揚
    locus: 宣公十五年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/xuan-gong-shi-wu-nian
    quote: 受命以出，有死無霣，又可賂乎？臣之許君，以成命也，死而成命，臣之祿也。
    translation: >-
      我接受君命出使，寧死也不能讓使命落空，又怎能被收買？我先前答應大王，是為了完成使命；
      為完成使命而死，是做臣子的福分。
  - speaker: 華元
    locus: 宣公十五年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/xuan-gong-shi-wu-nian
    quote: >-
      寡君使元以病告，曰：『敝邑易子而食，析骸以爨，雖然，城下之盟，有以國斃，不能從也。
      去我三十里，唯命是聽。』
    translation: >-
      我們國君派我來把城中的困境告訴你們。他說：「敝國已經交換孩子來吃，劈開屍骨當柴燒。
      即使如此，在城下被迫訂立的盟約，我們寧可亡國也不能接受。你們後退三十里，我們就一切聽從吩咐。」
  - locus: 宣公十五年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/xuan-gong-shi-wu-nian
    quote: 宋及楚平，華元為質，盟曰：「我無爾詐，爾無我虞。」
    translation: 宋國和楚國講和，華元到楚國作人質。盟辭說：「我不欺騙你，你也不防備我。」
sources:
