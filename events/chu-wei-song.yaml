reliability: 信史
significance: >-
  一場圍城生出兩條成語，而兩條都與「說實話」有關。
  伯宗的「鞭長莫及」是霸主對自己力量邊界的罕見承認；
  華元夜登子反之床，靠的不是計謀而是把最壞的實情擺出來——
  雙方都已到極限，於是誰都不必再演下去。
  盟辭「我無爾詐，爾無我虞」本是和平誓言，後世卻縮成「爾虞我詐」，
  意思完全翻轉：一句約定不再互相欺騙的話，變成了互相欺騙的代稱。
