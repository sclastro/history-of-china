id: fu-shi-zhi-yi
name: 輔氏之役
year: -594
year_note: 魯宣公十五年
period: wu-ba
type: 戰役
states: [jin, qin]
people: [wei-ke]
narrative: >-
  秦桓公出兵伐晉，駐紮在輔氏。晉將魏顆率軍迎戰，與秦國力士杜回交鋒。

  交戰時魏顆看見一個老人把地上的草打成結，杜回被草結絆倒，因而被擒，秦師遂敗。

  當夜魏顆夢見那個老人，老人說：「余，而所嫁婦人之父也。爾用先人之治命，余是以報。」
  （白話：我是你所嫁出那位婦人的父親。你聽從了先人清醒時的吩咐，我因此來報答你。）

  這件事要接到前面一段。魏顆的父親魏武子有一名沒有生育的愛妾，武子生病時囑咐魏顆
  「必嫁是」（白話：一定要讓她改嫁）；病危時又改口「必以為殉」（白話：一定要讓她殉葬）。
  武子死後，魏顆讓那名妾改嫁，理由是「疾病則亂，吾從其治也」
  （白話：人病重時神志錯亂，我聽從他清醒時的吩咐）。
sources:
  - source: zuo-zhuan
    locus: 宣公十五年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/xuan-gong-shi-wu-nian
reliability: 大體可信
significance: >-
  輔氏之役本身是一場小仗，它之所以被記住，是因為《左傳》把它與一樁家事接在一起。
  結草的情節顯然是後人附加的靈異解釋，但被解釋的那件事——
  魏顆在兩道互相矛盾的遺命之間選了神志清醒時的那一道——卻是實實在在的判斷。
  春秋人處理遺命衝突的辦法不是比先後，是比神志。
