id: fu-shi-zhi-yi
name: 輔氏之役
year: -594
year_note: 魯宣公十五年
period: wu-ba
type: 戰役
states: [jin, qin]
people: [wei-ke]
narrative: >-
  這件事要先從魏顆的家事說起。魏顆的父親魏武子有一名寵愛的妾，沒有生育。魏武子生病時，
  吩咐魏顆日後一定要讓她改嫁；到了病危，他又改口，要魏顆讓這名妾為自己殉葬。魏武子死後，
  魏顆還是讓那名妾改嫁了。他解釋：人病重的時候神志錯亂，自己聽從的是父親清醒時的吩咐。

  前 594 年秋天，秦桓公出兵攻打晉國，軍隊駐紮在輔氏。晉國大夫魏顆領兵迎戰，
  對上了秦國的大力士杜回。

  交戰時，魏顆看見一個老人把地上的草打成結。杜回被草結絆倒摔在地上，因此被魏顆擒獲，
  秦軍於是大敗。

  當天夜裡，魏顆夢見那個老人。老人說：自己就是魏顆嫁出去那名婦人的父親；因為魏顆聽從了
  先人清醒時的吩咐，讓女兒得以改嫁而不必殉葬，所以特地前來報答。這就是成語「結草報恩」的由來。
original:
  - locus: 宣公十五年
    quote: 魏顆敗秦師于輔氏，獲杜回，秦之力人也。
    translation: 魏顆在輔氏打敗了秦軍，擒獲杜回。杜回是秦國的大力士。
  - locus: 宣公十五年
    quote: >-
      初，魏武子有嬖妾，無子。武子疾，命顆曰：「必嫁是。」疾病，則曰：「必以為殉。」
    translation: >-
      早先，魏武子有一名寵愛的妾，沒有生育。魏武子生病時，吩咐魏顆說：「一定要讓她改嫁。」
      到了病危，他又說：「一定要讓她殉葬。」
  - locus: 宣公十五年
    quote: 及卒，顆嫁之，曰：「疾病則亂，吾從其治也。」
    translation: >-
      魏武子死後，魏顆讓那名妾改嫁了，說：「人病重時神志錯亂，我聽從的是他清醒時的吩咐。」
  - locus: 宣公十五年
    quote: 及輔氏之役，顆見老人結草以亢杜回，杜回躓而顛，故獲之。
    translation: >-
      到了輔氏這一仗，魏顆看見一個老人把草打成結來擋住杜回。杜回被絆倒摔在地上，
      因此被擒獲。
  - locus: 宣公十五年
    quote: 夜夢之曰：「余，而所嫁婦人之父也。爾用先人之治命，余是以報。」
    translation: >-
      當夜魏顆夢見那個老人，老人說：「我就是你嫁出去那名婦人的父親。你聽從了先人清醒時的吩咐，
      我因此來報答你。」
sources:
  - source: zuo-zhuan
    locus: 宣公十五年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/xuan-gong-shi-wu-nian
reliability: 大體可信
significance: >-
  輔氏之役本身是一場小仗，它之所以被記住，是因為《左傳》把它與一樁家事接在一起。
  結草報恩的情節顯然是後人附加的靈異解釋，但被解釋的那件事——魏顆在兩道互相矛盾的遺命之間，
  選了神志清醒時的那一道——卻是實實在在的判斷。魏顆說「疾病則亂，吾從其治也」
  （白話：人病重時神志錯亂，我聽從他清醒時的吩咐），說明春秋人處理遺命衝突的辦法不是比先後，
  而是比神志。
