reliability: 信史
significance: >-
  「圍魏救趙」是中國軍事思想中「間接路線」的原型：
  解決一個問題的最佳方式，往往不是正面處理它，
  而是改變使它成為問題的那個條件。
  孫臏的表述——「批亢擣虛，形格勢禁，則自為解耳」（白話：扼住要害、直搗空虛，使對方形勢受制，包圍自然就解開了）——
  比二十世紀李德哈特的「間接路線」早了兩千兩百年。
  此戰亦是魏國霸權終結的開端：桂陵、馬陵兩役之後，魏再未恢復。
