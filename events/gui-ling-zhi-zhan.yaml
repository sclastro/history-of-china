id: gui-ling-zhi-zhan
name: 桂陵之戰
year: -353
period: zhan-guo-early
type: 戰役
states: [tian-qi, wei, zhao]
people: [sun-bin, tian-ji, pang-juan, qi-wei-wang]
narrative: >-
  魏伐趙，圍邯鄲。趙急，請救於齊。齊威王欲將孫臏，臏辭曰「刑餘之人不可」，乃以田忌為將而孫
  臏為師，居輜車中作計謀。

  田忌欲引兵之趙。孫子曰：「夫解雜亂紛糾者不控捲，救鬥者不搏撠——批亢擣虛，形格勢禁，則自
  為解耳。今梁趙相攻，輕兵銳卒必竭於外，老弱罷於內。君不若引兵疾走大梁，據其街路、衝其方虛
  ，彼必釋趙而自救。是我一舉解趙之圍而收弊於魏也。」（白話：要解開纏繞的亂絲，不能握拳硬扯
  ；要勸解打鬥的人，不能揮拳加入。避開對方的強處、直搗它的空虛，使它形勢受制、不得不撤，事
  情自然就解開了。如今魏趙相攻，魏國的精兵銳卒必定耗竭在外，國內只剩老弱疲憊。您不如引兵直
  趨大梁，佔據它的要道、衝擊它正空虛的地方，它必定放下趙國回師自救。這就是一舉解了趙國之圍
  ，又順勢收取魏國的疲敝。）

  田忌從之。魏果去邯鄲，與齊戰於桂陵，大破梁軍。

  十三年後（前 341），魏伐韓，齊復救之，孫臏用減灶之計——入魏地為十萬灶，明日為五萬灶
  ，又明日為三萬灶。龐涓行三日大喜曰：「我固知齊軍怯，入吾地三日，士卒亡者過半矣。」（白話
  ：我本來就知道齊軍怯懦，進入我國境內才三天，逃亡的士卒就超過一半了。）乃棄其步軍，與其輕
  銳倍日并行逐之。孫子度其行暮當至馬陵，道狹而旁多阻隘，可伏兵，乃斫大樹白而書之曰「龐涓死
  于此樹之下」（白話：龐涓死在這棵樹下），令萬弩夾道而伏，期曰「暮見火舉而俱發」。龐涓果夜
  至斫木下，見白書，鑽火燭之——讀其書未畢，齊軍萬弩俱發。龐涓自知智窮兵敗，乃自剄曰：「遂
  成豎子之名！」（白話：到頭來竟成全了那小子的名聲！）
