id: gui-ling-zhi-zhan
name: 桂陵之戰
year: -353
period: zhan-guo-early
type: 戰役
states: [tian-qi, wei, zhao]
people: [sun-bin, tian-ji, pang-juan, qi-wei-wang]
narrative: >-
  前 354 年，魏國出兵攻打趙國，包圍了趙國都城邯鄲。趙國情勢危急，向齊國求救。齊威王本想任命
  孫臏為主將，孫臏推辭，說自己是受過刑、身體殘缺的人，不適合掛帥。於是齊威王改派田忌為主將，
  讓孫臏當軍師，坐在有帷幕的兵車裡出謀劃策。

  田忌本想帶兵直接開往趙國。孫臏勸阻他，說：要解開纏繞的亂絲，不能握著拳頭硬扯；要勸開打架的
  人，不能自己也揮拳上去。應該避開對方的強處、直搗它空虛的地方，使它形勢受到牽制、不得不罷手，
  事情自然就解開了。如今魏、趙互相攻打，魏國的精兵銳卒一定都耗在國外，國內只剩下老弱疲憊之師。
  田忌不如領兵直奔魏國都城大梁，佔住它的交通要道，攻擊它防備空虛的地方，魏軍必定放下趙國、回師
  自救。這樣一來，齊國一舉既解了趙國之圍，又順勢收拾了疲憊的魏軍。這就是成語「圍魏救趙」的由來。

  田忌採納了孫臏的計策。魏軍果然撤離邯鄲回師，在桂陵與齊軍交戰，被齊軍打得大敗。

  十三年後，即前 341 年，魏國又聯合趙國攻打韓國，齊國再次出兵相救，仍以田忌為主將、孫臏為軍師，
  直接進逼大梁。魏將龐涓聞訊，從韓國撤軍趕回。孫臏料定魏軍一向輕視齊軍，便用減灶之計誘敵：
  齊軍進入魏國境內，第一天造十萬個爐灶，第二天減為五萬個，第三天再減為三萬個，讓魏軍以為齊兵
  天天大批逃亡。

  龐涓追了三天，果然大喜，以為齊軍本就膽怯，進入魏國才三天，逃亡的士兵就超過一半了。於是他丟下
  步兵，只帶輕裝精銳，日夜兼程追趕。孫臏推算魏軍的行程，估計天黑時會趕到馬陵。馬陵道路狹窄，兩
  旁多險阻，適合埋伏。孫臏便叫人把一棵大樹的皮剝白，在上面寫「龐涓死于此樹之下」，又布置上萬名
  弓弩手埋伏在道路兩旁，約定天黑見到火光就一齊放箭。

  龐涓果然在夜裡趕到那棵大樹下，看見樹上有字，就點火照看。字還沒讀完，齊軍萬箭齊發，魏軍大亂。
  龐涓自知計窮兵敗，拔劍自殺，臨死說，想不到最終竟成全了那小子（孫臏）的名聲。齊軍乘勝大破魏軍，
  俘虜了魏國太子申。孫臏也從此名揚天下。
original:
  - speaker: 孫臏
    locus: 孫子吳起列傳
    quote: 刑餘之人不可。
    translation: 我是受過刑、身體殘缺的人，不能擔任主將。
  - speaker: 孫臏
    locus: 孫子吳起列傳
    quote: >-
      夫解雜亂紛糾者不控捲，救鬥者不搏撠，批亢擣虛，形格勢禁，則自為解耳。今梁趙相攻，
      輕兵銳卒必竭於外，老弱罷於內。君不若引兵疾走大梁，據其街路，衝其方虛，彼必釋趙而自救。
      是我一舉解趙之圍而收弊於魏也。
    translation: >-
      要解開纏繞的亂絲，不能握著拳頭硬扯；要勸開打架的人，不能自己也揮拳上去。應該避開對方的
      強處、直搗它空虛的地方，使它形勢受制、不得不撤，事情自然就解開了。如今魏、趙互相攻打，
      魏國的精兵銳卒一定都耗在國外，國內只剩老弱疲憊。您不如領兵直奔大梁，佔住它的交通要道，
      攻擊它防備空虛的地方，魏軍必定放下趙國、回師自救。這樣一來，我們一舉既解了趙國之圍，
      又順勢收拾了疲憊的魏軍。
  - locus: 孫子吳起列傳
    quote: 田忌從之，魏果去邯鄲，與齊戰於桂陵，大破梁軍。
    translation: 田忌採納了他的計策。魏軍果然撤離邯鄲，在桂陵與齊軍交戰，齊軍把魏軍打得大敗。
  - speaker: 龐涓
    locus: 孫子吳起列傳
    quote: 我固知齊軍怯，入吾地三日，士卒亡者過半矣。
    translation: 我本來就知道齊軍膽怯，進入我國境內才三天，逃亡的士兵就超過一半了。
  - locus: 孫子吳起列傳
    quote: 乃斫大樹白而書之曰「龐涓死于此樹之下」。
    translation: 於是孫臏叫人把一棵大樹的皮剝白，在上面寫道「龐涓死在這棵樹下」。
  - speaker: 龐涓
    locus: 孫子吳起列傳
    quote: 龐涓自知智窮兵敗，乃自剄，曰：「遂成豎子之名！」
    translation: 龐涓知道自己計謀用盡、兵敗已定，於是拔劍自刎，臨死說：「到頭來竟成全了那小子的名聲！」
