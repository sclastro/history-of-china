reliability: 信史
significance: >-
  「圍魏救趙」是後世公認的用兵典範，也是間接路線思想的原型：要解決一個難題，最有效的辦法
  未必是正面硬碰，而是設法改變讓它成為難題的那個條件。孫臏說「批亢擣虛，形格勢禁，則自為解耳」
  （白話：避開強處、直搗空虛，使對方形勢受制、不得不撤，包圍自然就解開了），比二十世紀李德哈特
  提出間接路線理論早了兩千兩百年。桂陵、馬陵兩役之後，魏國的霸權一蹶不振，再未恢復。
