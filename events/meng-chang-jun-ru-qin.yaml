id: meng-chang-jun-ru-qin
name: 孟嘗君入秦
year: -299
period: zhan-guo-mid
type: 外交
states: [tian-qi, qin]
people: [meng-chang-jun, qin-zhao-xiang-wang]
narrative: >-
  秦昭王聞孟嘗君賢，先使涇陽君為質於齊以求見。孟嘗君入秦，昭王以為秦相。人或說昭王曰：「孟
  嘗君賢，而又齊族也，今相秦，必先齊而後秦，秦其危矣。」（白話：孟嘗君確實賢能，可是他又是
  齊國的宗族，如今做了秦國的丞相，必定先為齊國打算而後才顧秦國，秦國就危險了。）昭王乃止，
  囚之，謀欲殺之。

  孟嘗君使人抵昭王幸姬求解。姬曰：「妾願得君狐白裘。」孟嘗君有狐白裘，直千金，天下無雙，然
  已獻之昭王矣，更無他裘。最下坐有能為狗盜者，曰：「臣能得狐白裘。」乃夜為狗，以入秦宮藏中
  ，取所獻狐白裘至，以獻秦王幸姬。幸姬為言昭王，昭王釋孟嘗君。

  孟嘗君得出，即馳去，變名姓以出關。夜半至函谷關。昭王後悔，出孟嘗君，求之已去，即使人馳傳
  逐之。關法：雞鳴而出客。孟嘗君恐追至，客之居下坐者有能為雞鳴，而雞齊鳴，遂發傳出。出如食
  頃，秦追果至關，已後孟嘗君出，乃還。

  始孟嘗君列此二人於賓客，賓客盡羞之；及此二人拔之於厄，自是之後，客皆服。
sources:
  - source: shiji
    locus: 孟嘗君列傳
reliability: 大體可信
significance: >-
  「雞鳴狗盜」向為輕薄之譏——王安石便說「雞鳴狗盜之出其門，
  此士之所以不至也」。但《史記》原文的重點正相反：
  孟嘗君養客不擇貴賤，眾人以為濫，而救其命者恰是最不入流的兩個。
  它提出的問題至今有效：一個組織該不該保留看似無用的冗餘？
  答案取決於你面對的是可預期的常態，還是不可預期的危機。
