id: meng-chang-jun-ru-qin
name: 孟嘗君入秦
year: -299
period: zhan-guo-mid
type: 外交
states: [tian-qi, qin]
people: [meng-chang-jun, qin-zhao-xiang-wang]
narrative: >-
  前 299 年，秦昭襄王聽說孟嘗君（田文）賢能，先派自己的弟弟涇陽君到齊國做人質，藉此請孟嘗君
  入秦相見。孟嘗君到了秦國，昭襄王便任命他做丞相。有人向昭襄王進言：孟嘗君固然賢能，可是他
  是齊國的宗室，如今當了秦國丞相，一定先替齊國打算，然後才顧及秦國，這樣秦國就危險了。昭襄王
  於是打消原意，把孟嘗君囚禁起來，還打算殺掉他。

  孟嘗君派人去向昭襄王的寵姬求情。寵姬說，她想要孟嘗君那件狐白裘。孟嘗君本有一件狐白裘，價值
  千金，天下無雙，可是入秦時已經獻給了昭襄王，再沒有第二件。門客中坐在最末位的有人善於學狗
  行竊，說自己能取回那件皮裘。他趁夜裝成狗，潛入秦國宮中的庫房，把先前進獻的狐白裘偷了出來，
  轉獻給寵姬。寵姬替孟嘗君向昭襄王說情，昭襄王便放了孟嘗君。

  孟嘗君一獲釋，立刻乘車疾馳離開，改換姓名準備出關，半夜趕到函谷關。這時昭襄王反悔，派人去找
  孟嘗君，發現他已經走了，馬上派人乘驛車追趕。按照關卡法令，要等雞叫了才放旅客出關。孟嘗君
  擔心追兵趕到，門客中坐在末席的有人會學雞叫；他一開口，附近的雞都跟著叫起來，孟嘗君一行便
  驗過通行文書出了關。出關大約一頓飯的工夫，秦國追兵果然趕到，可是孟嘗君已經離開，只好回去。
  這就是成語「雞鳴狗盜」的由來。

  當初孟嘗君把這兩個人收在門下，其他門客都覺得跟他們同列是羞恥；等到這兩個人在危難中救了
  孟嘗君，此後門客才都心服。
original:
  - speaker: 有人
    locus: 孟嘗君列傳
    quote: 孟嘗君賢，而又齊族也，今相秦，必先齊而後秦，秦其危矣。
    translation: >-
      孟嘗君確實賢能，可是他又是齊國的宗室。如今他做了秦國丞相，一定先替齊國打算，
      然後才顧及秦國，秦國就危險了。
  - speaker: 幸姬
    locus: 孟嘗君列傳
    quote: 妾願得君狐白裘。
    translation: 我想要您那件狐白裘。
  - speaker: 狗盜之客
    locus: 孟嘗君列傳
    quote: 臣能得狐白裘。
    translation: 我能弄到那件狐白裘。
  - locus: 孟嘗君列傳
    quote: >-
      關法雞鳴而出客，孟嘗君恐追至，客之居下坐者有能為雞鳴，而雞齊鳴，遂發傳出。出如食頃，
      秦追果至關，已後孟嘗君出，乃還。
    translation: >-
      按照關卡法令，要等雞叫了才放旅客出關。孟嘗君擔心追兵趕到，門客中坐在末席的有人會學雞叫，
      他一叫，附近的雞都跟著叫起來，孟嘗君一行便驗過通行文書出了關。出關大約一頓飯的工夫，
      秦國追兵果然趕到，可是孟嘗君已經離開，只好回去。
  - locus: 孟嘗君列傳
    quote: 始孟嘗君列此二人於賓客，賓客盡羞之，及孟嘗君有秦難，卒此二人拔之。自是之後，客皆服。
    translation: >-
      當初孟嘗君把這兩個人列入門客，其他門客都覺得跟他們同列是羞恥。等到孟嘗君在秦國遇險，
      最終正是這兩個人救了他。從此以後，門客都心服了。
sources:
  - source: shiji
    locus: 孟嘗君列傳
reliability: 大體可信
significance: >-
  「雞鳴狗盜」向來被當作輕薄的譏諷——王安石就說「雞鳴狗盜之出其門，此士之所以不至也」
  （白話：會學雞叫、學狗偷盜的人出自他門下，這正是真正的士人不肯來投的原因）。可是《史記》
  原文的用意恰恰相反：孟嘗君收羅門客不分身份高低，眾人以為浮濫，最終救他一命的偏偏是最不
  入流的兩個人。這也提出一個至今仍然有效的問題：一個組織該不該保留看似無用的冗餘？
  答案取決於它面對的是可以預期的常態，還是無法預期的危機。
