id: ji-shi-fa-zhuan-yu
name: 季氏將伐顓臾
year: -484
year_note: 年代不詳；事在孔子返魯之後
period: chun-qiu-late
type: 論政
states: [lu]
people: [kong-zi]
narrative: >-
  魯國執政的季孫氏準備出兵攻打顓臾。顓臾是魯國境內的一個附庸小國。孔子的學生冉有（冉求）
  和子路（仲由）當時都是季氏的家臣，兩人來見孔子，報告這件事。

  孔子首先責備冉有：顓臾是從前周天子封的東蒙山主祭者，又在魯國疆域之內，是魯國的臣屬，
  為甚麼要攻打它？冉有推說這是季孫的意思，他們兩人都不想打。

  孔子引用古代史官周任的話：能施展才力的才擔任職位，做不到就該辭去。主人遇到危險不去扶持，
  快要跌倒不去攙扶，那還要輔佐的人做甚麼？他又打了一個比方：老虎、犀牛從籠子裡跑出來，
  龜甲和美玉在匣子裡毀壞了，這是誰的過錯？言下之意，看管的人責無旁貸。

  冉有換了一個說法：顓臾城牆堅固，又靠近季氏的封邑費，現在不奪取，日後必定成為子孫的禍患。
  孔子說，君子最討厭那種明明心裡想要，卻不肯說出來，偏要另找藉口的人。接著他講出自己的主張：
  治理國家和家族的人，不擔憂人少，而擔憂分配不均；不擔憂貧窮，而擔憂不安定。分配平均就無所謂貧窮，
  上下和睦就不會嫌人少，局面安定就不會傾覆。遠方的人不歸服，就修明禮樂教化，吸引他們前來；
  來了以後，就讓他們安居。

  最後孔子說：如今仲由和冉求輔佐季孫，遠方的人不歸服卻不能吸引他們前來，國家四分五裂卻不能保全，
  反而謀劃在國境之內動用武力。他恐怕季孫的憂患不在顓臾，而在自家門內的屏牆之後。
  成語「禍起蕭牆」即由此而來。
original:
  - speaker: 孔子與冉有
    locus: 季氏
    quote: >-
      孔子曰：「求！無乃爾是過與？夫顓臾，昔者先王以為東蒙主，且在邦域之中矣，是社稷之臣也。
      何以伐為？」冉有曰：「夫子欲之，吾二臣者，皆不欲也。」
    translation: >-
      孔子說：「冉求！這恐怕是你的過錯吧？顓臾，從前周天子封它主祭東蒙山，而且它就在魯國疆域之內，
      是魯國的臣屬。為甚麼要攻打它？」冉有說：「是季孫想打，我們兩個家臣都不想。」
  - speaker: 孔子
    locus: 季氏
    quote: >-
      求！周任有言曰：『陳力就列，不能者止。』危而不持，顛而不扶，則將焉用彼相矣？且爾言過矣！
      虎兕出於柙，龜玉毀於櫝中，是誰之過與？
    translation: >-
      冉求！周任說過：「能施展才力的才擔任職位，做不到的就該辭去。」主人遇到危險不去扶持，
      快要跌倒不去攙扶，那還要輔佐的人做甚麼？而且你的話說錯了。老虎、犀牛從籠子裡跑出來，
      龜甲和美玉在匣子裡毀壞了，這是誰的過錯？
  - speaker: 孔子
    locus: 季氏
    quote: >-
      丘也，聞有國有家者，不患寡而患不均，不患貧而患不安。蓋均無貧，和無寡，安無傾。
      夫如是，故遠人不服，則修文德以來之。既來之，則安之。
    translation: >-
      我聽說，治理國家和家族的人，不擔憂人少，而擔憂分配不均；不擔憂貧窮，而擔憂不安定。
      分配平均就無所謂貧窮，上下和睦就不會嫌人少，局面安定就不會傾覆。正因如此，遠方的人不歸服，
      就修明禮樂教化，吸引他們前來；來了以後，就讓他們安居。
  - speaker: 孔子
    locus: 季氏
    quote: >-
      今由與求也，相夫子，遠人不服而不能來也；邦分崩離析而不能守也，而謀動干戈於邦內。
      吾恐季孫之憂，不在顓臾，而在蕭牆之內也！
    translation: >-
      如今仲由和冉求輔佐季孫，遠方的人不歸服，卻不能吸引他們前來；國家四分五裂，卻不能保全；
      反而謀劃在國境之內動用武力。我恐怕季孫的憂患不在顓臾，而在自家門內的屏牆之後。
sources:
  - source: analects
    locus: 季氏
    ctext_urn: ctp:analects/ji-shi
reliability: 信史
significance: >-
  「蕭牆」是宮室大門內的屏牆，借指內部。孔子的判斷有其根據：季氏的家臣陽虎、公山弗擾此前已先後作亂，
  季氏真正的威脅向來來自內部，而不是小小的顓臾；此後魯哀公與三桓交惡，最終出奔，也印證了這一點。
  這一段同時保存了「不患寡而患不均，不患貧而患不安」（白話：不擔憂人少，而擔憂分配不均；
  不擔憂貧窮，而擔憂不安定），是先秦論分配問題最著名的一句話。
