id: ji-shi-fa-zhuan-yu
name: 季氏將伐顓臾
year: -484
year_note: 年代不詳；事在孔子返魯之後
period: chun-qiu-late
type: 論政
states: [lu]
people: [kong-zi]
narrative: >-
  魯國執政季氏將要攻打顓臾。冉有、季路當時是季氏的家臣，來見孔子報告這件事。

  孔子責備他們：顓臾是先王封的東蒙主，而且在魯國境內，是社稷之臣，
  為什麼要打？冉有推說是季氏要打，不是他們兩人的意思。

  孔子說：輔佐的人不能盡職就該辭去——「危而不持，顛而不扶，
  則將焉用彼相矣」（白話：主人有危險不去扶持，快跌倒了不去攙扶，
  那要輔佐的人做什麼呢）。

  冉有再辯：顓臾城牆堅固而靠近費邑，現在不取，日後必為子孫之憂。

  孔子說：君子最討厭那種不肯直說「我想要」而硬要找藉口的人。
  接著提出他的政治主張：「不患寡而患不均，不患貧而患不安」
  （白話：不擔憂人少而擔憂分配不均，不擔憂貧窮而擔憂不安定）；
  遠人不服，就修文德使他們來歸，來了就安頓好他們。

  最後一句是全篇的落點：

  「今由與求也，相夫子，遠人不服而不能來也，邦分崩離析而不能守也，
  而謀動干戈於邦內。吾恐季孫之憂，不在顓臾，而在蕭牆之內也。」
  （白話：如今仲由和冉求輔佐季孫，遠方的人不歸服卻不能使他們來，
  國家分崩離析卻不能守住，反而策劃在國境之內動用兵戈。
  我恐怕季孫的憂患不在顓臾，而在自己家的屏門之內。）
sources:
  - source: analects
    locus: 季氏
    ctext_urn: ctp:analects/ji-shi
reliability: 信史
significance: >-
  「蕭牆」是宮室門內的屏牆，指最內部的地方。
  孔子的判斷後來應驗：魯國真正的動亂來自三桓與家臣，
  季氏自己的家臣陽虎、公山弗擾先後作亂，
  而顓臾始終沒有成為威脅。
  這一段同時保存了「不患寡而患不均」——
  先秦論分配問題最著名的一句話。
