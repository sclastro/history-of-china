id: chu-fu-huang-jie
name: 楚俘皇頡爭功
year: -547
year_note: 魯襄公二十六年
period: wu-ba
type: 戰役
states: [chu, zheng]
people: [gong-zi-wei, chuan-feng-xu, bo-zhou-li]
narrative: >-
  前 547 年，楚康王聯合秦國進攻吳國，軍隊走到雩婁，聽說吳國早有防備，就退了回來。
  楚軍順道轉攻鄭國，五月抵達城麇。鄭國大夫皇頡奉命駐守，帶兵出城迎戰，結果打了敗仗。

  楚軍將領穿封戌俘虜了皇頡。可是楚康王的弟弟公子圍（後來的楚靈王）也來爭這份功勞，
  說俘虜是自己抓到的。兩人爭執不下，就請太宰伯州犁出面裁斷。

  伯州犁說：這件事應該問俘虜本人。於是把皇頡帶上來，站在當中。伯州犁對皇頡說：
  來爭功的兩位都是有身分的人，你怎麼會不認得？他一面說，一面把手往上抬，指著公子圍說：
  這一位是王子圍，是我們國君尊貴的弟弟。接著又把手往下放，指著穿封戌說：這一位是穿封戌，
  是方城以外的縣尹。到底是誰俘虜了你？——這一抬一放，就是成語「上下其手」的由來。

  皇頡會意，順著伯州犁的暗示回答：我碰上了王子，打不過，就被擒住了。

  穿封戌大怒，抽出戈追殺公子圍，可是沒有追上。
original:
  - locus: 襄公二十六年
    quote: 鄭皇頡戍之，出，與楚師戰，敗。穿封戌囚皇頡，公子圍與之爭之，正於伯州犁。
    translation: >-
      鄭國的皇頡奉命駐守城麇，出城與楚軍交戰，打了敗仗。楚將穿封戌俘虜了皇頡，
      公子圍卻與他爭這份功勞，兩人就請伯州犁來評斷。
  - speaker: 伯州犁
    locus: 襄公二十六年
    quote: 請問於囚。乃立囚。伯州犁曰：「所爭，君子也，其何不知？」
    translation: >-
      伯州犁說：這件事該問俘虜本人。於是把俘虜帶上來，站在當中。伯州犁說：
      來爭功的兩位都是有身分的人，你怎麼會不認得？
  - speaker: 伯州犁
    locus: 襄公二十六年
    quote: >-
      上其手，曰：「夫子為王子圍，寡君之貴介弟也。」下其手，曰：「此子為穿封戌，
      方城外之縣尹也。誰獲子？」
    translation: >-
      他把手往上一抬，說：這一位是王子圍，是我們國君尊貴的弟弟。又把手往下一放，說：
      這一位是穿封戌，是方城以外的縣尹。到底是誰俘虜了你？
  - speaker: 皇頡
    locus: 襄公二十六年
    quote: 頡遇王子，弱焉。
    translation: 我皇頡碰上了王子，打不過，就被擒住了。
  - locus: 襄公二十六年
    quote: 戌怒，抽戈逐王子圍，弗及。
    translation: 穿封戌大怒，抽出戈追殺公子圍，可是沒有追上。
sources:
  - source: zuo-zhuan
    locus: 襄公二十六年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/xiang-gong-er-shi-liu-nian
reliability: 信史
significance: >-
  中國文獻中最早、也最清晰的一次程序中偏私的記錄。伯州犁做足了程序——他確實把當事人叫來，
  當面詢問；可是他在提問的同時，用手勢把答案暗示給了俘虜。形式上的公正與實質上的操縱可以並存，
  而且正是那一套公正的形式，才使操縱得以生效。「上下其手」四字所指的，就是這種以合乎程序的外表
  行舞弊之實的手段。
