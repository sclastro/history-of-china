id: chang-shao-zhi-zhan
name: 長勺之戰
year: -684
year_note: 魯莊公十年
period: wu-ba
type: 戰役
states: [qi, lu]
people: [cao-gui, lu-zhuang-gong, qi-huan-gong]
narrative: >-
  前 684 年，齊桓公即位的第二年，齊國出兵攻打魯國。魯莊公準備應戰。平民曹劌請求進見。
  他的同鄉勸阻他，說作戰是當官的人去謀劃的事，你又何必插手。曹劌回答：當官的人見識淺陋，
  不能作長遠打算。於是他入宮進見魯莊公。

  曹劌先問莊公憑甚麼跟齊國開戰。莊公說，衣食這類讓人安身的東西，他不敢獨佔，一定分給別人。
  曹劌認為這只是小恩小惠，還沒有普及到全體百姓，百姓不會因此跟從。莊公又說，祭祀用的牲畜和
  玉帛，他不敢虛報數目，一定守信。曹劌認為這只是小信用，還不能取信於神明，神明不會因此賜福。
  莊公再說，大大小小的訴訟案件，他雖然不能一一明察，也一定按實情處理。曹劌這才說：這是盡心
  待民的表現，可以憑這一點打一仗。他請求隨軍出戰。

  兩軍在長勺交戰。莊公一開戰就想擊鼓進攻，曹劌說時機未到。等齊軍擊了三通鼓，曹劌才說可以了，
  魯軍出擊，齊軍大敗。莊公想立刻驅車追擊，曹劌又說不行。他先下車察看齊軍戰車的車轍，再登上
  車前的橫木遠望，然後說可以了，魯軍於是追擊齊軍。

  戰勝之後，莊公問曹劌其中的道理。曹劌解釋：作戰靠的是勇氣。第一次擊鼓能振起士氣，第二次就
  衰減了，第三次便耗盡了。齊軍士氣耗盡而魯軍士氣正旺，所以能取勝。這就是成語「一鼓作氣」的
  由來。他又說，齊國是大國，虛實難以測度，他擔心會有伏兵，所以不敢貿然追擊；後來看到齊軍的
  車轍雜亂、望見他們的旗幟倒伏，確定是真的潰敗，才下令追擊。
original:
  - speaker: 曹劌與鄉人
    locus: 莊公十年
    quote: >-
      其鄉人曰：「肉食者謀之，又何間焉？」劌曰：「肉食者鄙，未能遠謀。」
    translation: >-
      他的同鄉說：「這是當官的人去謀劃的事，你又何必插手？」曹劌說：「當官的人見識淺陋，
      不能作長遠打算。」
  - speaker: 魯莊公與曹劌
    locus: 莊公十年
    quote: >-
      公曰：「小大之獄，雖不能察，必以情。」對曰：「忠之屬也。可以一戰。戰則請從。」
    translation: >-
      莊公說：「大大小小的訴訟案件，我雖然不能一一明察，也一定按實情處理。」曹劌回答：
      「這是盡心待民的表現，可以憑這一點打一仗。真要打，就請讓我隨軍同去。」
  - speaker: 曹劌
    locus: 莊公十年
    quote: >-
      公將鼓之。劌曰：「未可。」齊人三鼓。劌曰：「可矣。」齊師敗績。
    translation: >-
      莊公想擊鼓進攻，曹劌說：「時機未到。」等齊軍擊了三通鼓，曹劌說：「可以了。」
      魯軍出擊，齊軍大敗。
  - speaker: 曹劌
    locus: 莊公十年
    quote: >-
      夫戰，勇氣也。一鼓作氣，再而衰，三而竭。彼竭我盈，故克之。夫大國難測也，懼有伏焉。
      吾視其轍亂，望其旗靡，故逐之。
    translation: >-
      作戰靠的是勇氣。第一次擊鼓能振起士氣，第二次就衰減了，第三次便耗盡了。齊軍氣盡而我軍
      氣滿，所以能取勝。齊國是大國，虛實難以測度，我怕有伏兵；後來看到他們車轍雜亂、旗幟
      倒伏，才下令追擊。
sources:
  - source: zuo-zhuan
    locus: 莊公十年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/zhuang-gong-shi-nian
reliability: 信史
significance: >-
  中國戰史上最早的士氣論與戰場偵察論。更值得注意的是戰前那段對答：
  曹劌把勝負的根據放在「小大之獄，雖不能察，必以情」（白話：大大小小的訴訟，雖然不能一一明察，也一定按實情處理）——不是兵器，
  不是祭祀，而是司法的公平能否換來百姓拚死效力。這是先秦民本思想最早的實戰版本，
  比孟子早了三百多年。
