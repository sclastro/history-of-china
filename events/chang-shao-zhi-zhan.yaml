id: chang-shao-zhi-zhan
name: 長勺之戰
year: -684
year_note: 魯莊公十年
period: wu-ba
type: 戰役
states: [qi, lu]
people: [cao-gui, lu-zhuang-gong, qi-huan-gong]
narrative: >-
  齊桓公即位之次年伐魯，戰於長勺。曹劌請見，鄉人止之曰「肉食者謀之，又何間焉」（白話：當官
  的自然會謀劃，你又何必去插手？），劌曰「肉食者鄙，未能遠謀」（白話：當官的見識淺陋，不能
  作長遠打算。）。

  見莊公，先問憑何可戰。公曰「衣食所安，弗敢專也，必以分人」（白話：衣食這類使人安身的東西
  ，我不敢獨佔，一定分給別人），劌曰「小惠未徧，民弗從也」（白話：小恩小惠沒有普及到全體，
  百姓不會跟從。）；公曰「犧牲玉帛，弗敢加也，必以信」（白話：祭祀用的牲畜玉帛，我不敢虛報
  數目，一定守信），劌曰「小信未孚，神弗福也」（白話：小小的信用還不能取信於神，神明不會賜
  福。）；公曰「小大之獄，雖不能察，必以情」（白話：大大小小的訴訟案件，雖然不能一一明察，
  也一定按實情處理），劌乃曰：「忠之屬也，可以一戰。」（白話：這是盡心待民一類的事，可以憑
  這個打一仗。）

  戰於長勺，公將鼓之，劌曰「未可」；齊人三鼓，劌曰「可矣」，齊師敗績。公將馳之，劌曰「未可
  」，下視其轍、登軾而望之，曰「可矣」，遂逐齊師。

  既克，公問其故。對曰：「夫戰，勇氣也。一鼓作氣，再而衰，三而竭。彼竭我盈，故克之。夫大國
  難測也，懼有伏焉。吾視其轍亂、望其旗靡，故逐之。」（白話：作戰靠的是勇氣。第一次擊鼓振起
  士氣，第二次就衰減了，第三次便耗盡了。他們氣盡而我們氣滿，所以能勝。大國的虛實難以測度，
  我怕有埋伏。我看到他們車轍雜亂、望見旗幟倒伏，所以才追。）
sources:
  - source: zuo-zhuan
    locus: 莊公十年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/zhuang-gong-shi-nian
reliability: 信史
significance: >-
  中國戰史上最早的士氣論與戰場偵察論。更值得注意的是戰前那段對答：
  曹劌把勝負的根據放在「小大之獄，必以情」（白話：大大小小的訴訟，一定按實情處理）——不是甲兵，不是祭祀，
  而是司法的公平能否換得民之效死。這是先秦「民本」思想最早的
  實戰版本，比孟子早了三百年。
