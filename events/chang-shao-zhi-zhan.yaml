id: chang-shao-zhi-zhan
name: 長勺之戰
year: -684
year_note: 魯莊公十年
period: wu-ba
type: 戰役
states: [qi, lu]
people: [cao-gui, lu-zhuang-gong, qi-huan-gong]
narrative: >-
  齊桓公即位之次年伐魯，戰於長勺。曹劌請見，鄉人止之曰
  「肉食者謀之，又何間焉」，劌曰「肉食者鄙，未能遠謀」。

  見莊公，先問憑何可戰。公曰「衣食所安，弗敢專也，必以分人」，
  劌曰「小惠未徧，民弗從也」；公曰「犧牲玉帛，弗敢加也，必以信」，
  劌曰「小信未孚，神弗福也」；公曰「小大之獄，雖不能察，必以情」，
  劌乃曰：「忠之屬也，可以一戰。」

  戰於長勺，公將鼓之，劌曰「未可」；齊人三鼓，劌曰「可矣」，
  齊師敗績。公將馳之，劌曰「未可」，下視其轍、登軾而望之，
  曰「可矣」，遂逐齊師。

  既克，公問其故。對曰：「夫戰，勇氣也。一鼓作氣，再而衰，三而竭。
  彼竭我盈，故克之。夫大國難測也，懼有伏焉。
  吾視其轍亂、望其旗靡，故逐之。」
sources:
  - source: zuo-zhuan
    locus: 莊公十年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/zhuang-gong-shi-nian
reliability: 信史
significance: >-
  中國戰史上最早的士氣論與戰場偵察論。更值得注意的是戰前那段對答：
  曹劌把勝負的根據放在「小大之獄，必以情」——不是甲兵，不是祭祀，
  而是司法的公平能否換得民之效死。這是先秦「民本」思想最早的
  實戰版本，比孟子早了三百年。
