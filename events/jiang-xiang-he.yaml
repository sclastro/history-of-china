id: jiang-xiang-he
name: 將相和（負荊請罪）
year: -279
period: zhan-guo-late
type: 論政
states: [zhao]
people: [lin-xiang-ru, lian-po]
narrative: >-
  澠池之會既罷，歸國，以相如功大，拜為上卿，位在廉頗之右。

  廉頗曰：「我為趙將，有攻城野戰之大功，而藺相如徒以口舌為勞而位居我上；且相如素賤人，吾羞
  ，不忍為之下。」（白話：我身為趙國的將軍，有攻城野戰的大功，而藺相如只憑口舌之勞，地位反
  而在我之上；何況相如本是出身低賤的人，我覺得羞恥，忍不下這口氣屈居他之下。）宣言曰：「我
  見相如，必辱之。」（白話：我見到藺相如，一定要羞辱他。）

  相如聞，不肯與會。每朝時常稱病，不欲與廉頗爭列。已而出，望見廉頗，相如引車避匿。

  於是舍人相與諫曰：「臣所以去親戚而事君者，徒慕君之高義也。今君與廉頗同列，廉君宣惡言而君
  畏匿之，恐懼殊甚，且庸人尚羞之，況於將相乎？臣等不肖，請辭去。」（白話：我們之所以離開親
  人來事奉您，只是仰慕您的高義。如今您與廉頗同列，廉將軍公開放話而您卻怕他、躲他，恐懼得太
  過分了；這種事連普通人都覺得羞恥，何況是將相？我們沒本事，請讓我們辭去。）

  藺相如固止之，曰：「公之視廉將軍孰與秦王？」（白話：諸位看廉將軍比起秦王，哪一個厲害？）
  曰：「不若也。」相如曰：「夫以秦王之威而相如廷叱之，辱其群臣。相如雖駑，獨畏廉將軍哉？顧
  吾念之，強秦之所以不敢加兵於趙者，徒以吾兩人在也。今兩虎共鬥，其勢不俱生。吾所以為此者，
  以先國家之急而後私讎也。」（白話：以秦王那樣的威勢，我尚且在朝廷上呵斥他、羞辱他的群臣。
  我藺相如再無能，難道會單單怕廉將軍嗎？只是我想到：強秦之所以不敢對趙國動兵，只因為有我們
  兩人在。如今兩虎相鬥，勢必不能同時存活。我之所以這樣做，是把國家的急難放在前面、把個人的
  恩怨放在後面。）

  廉頗聞之，肉袒負荊，因賓客至藺相如門謝罪，曰：「鄙賤之人，不知將軍寬之至此也！」（白話：
  我這卑賤的人，竟不知道將軍寬厚到這個地步！）卒相與驩，為刎頸之交。
sources:
  - source: shiji
    locus: 廉頗藺相如列傳
    ctext_urn: ctp:shiji/lian-po-lin-xiang-ru-lie-zhuan
reliability: 大體可信
significance: >-
  藺相如的那句話值得逐字讀：「強秦之所以不敢加兵於趙者，
  徒以吾兩人在也。」（白話：強秦之所以不敢出兵攻趙，只因為有我們兩個人在。）他退讓的理由不是修養，是戰略計算——
  將相不和，趙國立刻失去威懾。
  而廉頗肉袒負荊的意義在於：他不是被說服的，
  是自己想通了同一套計算。兩人的和解建立在共同的判斷之上，
  不是建立在情感之上——所以它牢固。
