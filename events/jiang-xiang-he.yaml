id: jiang-xiang-he
name: 將相和（負荊請罪）
year: -279
period: zhan-guo-late
type: 論政
states: [zhao]
people: [lin-xiang-ru, lian-po]
narrative: >-
  前 279 年，趙國與秦國在澠池會盟，藺相如隨趙惠文王出席，多次維護了趙王的尊嚴，立下大功。
  回國以後，趙王升藺相如為上卿（卿之中最高的一級），地位排在大將廉頗之上。

  廉頗很不服氣。他認為自己身為趙國大將，有攻城略地、野外作戰的大功，藺相如卻只憑一張嘴立功，
  地位反而在自己之上；何況藺相如出身低微，要他屈居其下，實在覺得羞恥。他公開放話：
  只要見到藺相如，一定要當面羞辱他。

  藺相如聽到這些話，就不肯跟廉頗碰面。每逢上朝，他常常推說有病，不願跟廉頗爭高下。
  有一次外出，遠遠望見廉頗的車，他就叫人把自己的車拉到一旁躲開。

  藺相如的門客看不過眼，一起來勸他。他們說，自己離開親人來投奔藺相如，只是仰慕他的高尚義氣；
  如今他跟廉頗地位相當，廉頗放話羞辱他，他卻怕他、躲他，這種事連普通人都覺得羞恥，何況是將相。
  門客因此表示要辭別離去。

  藺相如極力挽留，反問門客：你們看廉將軍比起秦王，哪一個厲害？門客答，廉將軍比不上秦王。
  藺相如便說：憑秦王那樣的威勢，我尚且敢在朝廷上呵斥他、羞辱他的臣子；我藺相如再無能，
  難道會單單害怕廉將軍嗎？他解釋，強大的秦國之所以不敢出兵攻打趙國，只因為有他和廉頗兩人在。
  如果兩人像兩隻老虎一樣相鬥，勢必不能同時保全。他之所以處處退讓，
  是把國家的急難放在前面，把個人的恩怨放在後面。

  廉頗聽到這番話，深受感動。他脫去上衣，背著荊條（表示願意受人鞭打），由賓客陪同，
  來到藺相如家門前請罪，說自己這卑賤的人，竟不知道將軍寬厚到這個地步。這就是成語「負荊請罪」的由來。
  從此兩人和好，結為「刎頸之交」——可以為對方拚上性命、生死與共的朋友。
original:
  - speaker: 廉頗
    locus: 廉頗藺相如列傳
    quote: >-
      我為趙將，有攻城野戰之大功，而藺相如徒以口舌為勞，而位居我上，且相如素賤人，吾羞，不忍為之下。
      宣言曰：「我見相如，必辱之。」
    translation: >-
      我身為趙國的大將，有攻城略地、野外作戰的大功，藺相如卻只憑一張嘴立功，地位反而在我之上；
      何況相如本是出身低賤的人，我覺得羞恥，忍不下這口氣屈居他之下。他還放話說：
      我見到相如，一定要羞辱他。
  - speaker: 藺相如舍人
    locus: 廉頗藺相如列傳
    quote: >-
      臣所以去親戚而事君者，徒慕君之高義也。今君與廉頗同列，廉君宣惡言而君畏匿之，恐懼殊甚，
      且庸人尚羞之，況於將相乎？臣等不肖，請辭去。
    translation: >-
      我們之所以離開親人來事奉您，只是仰慕您的高尚義氣。如今您與廉頗地位相當，廉將軍公開放話，
      您卻怕他、躲他，恐懼得太過分了；這種事連普通人都覺得羞恥，何況是將相？我們沒本事，
      請讓我們辭別離去。
  - speaker: 藺相如與舍人
    locus: 廉頗藺相如列傳
    quote: >-
      相如固止之，曰：「公之視廉將軍孰與秦王？」曰：「不若也。」相如曰：「夫以秦王之威，而相如廷叱之，
      辱其群臣，相如雖駑，獨畏廉將軍哉？顧吾念之，彊秦之所以不敢加兵於趙者，徒以吾兩人在也。
      今兩虎共鬥，其勢不俱生。吾所以為此者，以先國家之急而後私讎也。」
    translation: >-
      藺相如堅決挽留他們，問：「你們看廉將軍比起秦王，哪一個厲害？」門客答：「比不上秦王。」藺相如說：
      「憑秦王那樣的威勢，我尚且敢在朝廷上呵斥他、羞辱他的臣子；我藺相如再無能，
      難道會單單害怕廉將軍嗎？只是我想到：強大的秦國之所以不敢出兵攻打趙國，
      只因為有我們兩人在。如今兩虎相鬥，勢必不能同時保全。我之所以這樣做，
      是把國家的急難放在前面、把個人的恩怨放在後面。」
  - speaker: 廉頗
    locus: 廉頗藺相如列傳
    quote: 鄙賤之人，不知將軍寬之至此也！
    translation: 我這卑賤的人，竟不知道將軍寬厚到這個地步！
sources:
  - source: shiji
    locus: 廉頗藺相如列傳
    ctext_urn: ctp:shiji/lian-po-lin-xiang-ru-lie-zhuan
reliability: 大體可信
significance: >-
  藺相如退讓的理由不是個人修養，而是戰略計算：他說「彊秦之所以不敢加兵於趙者，徒以吾兩人在也」
  （白話：強大的秦國不敢出兵攻打趙國，只因為有我們兩個人在），將相一旦不和，趙國立刻失去對秦國的威懾。
  廉頗負荊請罪的可貴之處在於，他不是被說服，而是自己想通了同一套計算。
  兩人的和解建立在共同的判斷之上，不是建立在一時的情感之上，所以牢固。
