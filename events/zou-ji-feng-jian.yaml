id: zou-ji-feng-jian
name: 鄒忌諷齊王納諫
year: -350
year_note: 年代不詳；事在齊威王時
period: zhan-guo-early
type: 論政
states: [tian-qi]
people: [zou-ji, qi-wei-wang]
narrative: >-
  齊國的鄒忌身高八尺有餘，相貌俊美。一天早上，他穿戴整齊，照著鏡子問妻子：我和城北的徐公比，
  誰更俊美？妻子說：您俊美得多，徐公怎能比得上您！城北徐公是齊國有名的美男子，鄒忌不相信，
  又去問妾，妾也說徐公哪裡比得上他。第二天有客人來訪，鄒忌又問客人，客人也說徐公不如他俊美。

  過了一天，徐公來了。鄒忌仔細端詳，自認比不上他；再照鏡子看自己，更覺得相差很遠。
  晚上躺在床上想這件事，終於想通了：妻子說我俊美，是偏愛我；妾說我俊美，是怕我；
  客人說我俊美，是有求於我。

  於是鄒忌上朝見齊威王，把這件家事講了一遍，然後說：如今齊國土地方圓千里，有一百二十座城，
  宮中的妃嬪和左右近侍沒有不偏愛大王的，朝廷的大臣沒有不怕大王的，國內的百姓沒有不有求於大王的。
  這樣看來，大王受到的蒙蔽太嚴重了！

  威王說好，隨即下令：群臣、官吏和百姓，能當面指出我的過失的，受上等賞賜；上書勸諫我的，
  受中等賞賜；能在公共場所議論朝政、讓我聽到的，受下等賞賜。

  命令剛下達時，進諫的人很多，宮門前和庭院裡熱鬧得像市集一樣，成語「門庭若市」即出於此。
  幾個月之後，偶爾才有人來進諫；一年之後，就是有人想說，也沒有甚麼可說的了。燕、趙、韓、魏
  聽說這件事，都來朝見齊國。這就是所謂在朝廷上戰勝敵國。
original:
  - speaker: 鄒忌
    locus: 齊策一
    quote: >-
      吾妻之美我者，私我也；妾之美我者，畏我也；客之美我者，欲有求於我也。
    translation: >-
      妻子說我俊美，是偏愛我；妾說我俊美，是怕我；客人說我俊美，是有求於我。
  - speaker: 鄒忌
    locus: 齊策一
    quote: >-
      今齊地方千里，百二十城，宮婦左右，莫不私王；朝廷之臣，莫不畏王；四境之內，莫不有求於王。
      由此觀之，王之蔽甚矣！
    translation: >-
      如今齊國土地方圓千里，有一百二十座城，宮中的妃嬪和左右近侍沒有不偏愛大王的；
      朝廷的大臣沒有不怕大王的；國內的百姓沒有不有求於大王的。這樣看來，大王受到的蒙蔽太嚴重了！
  - speaker: 齊威王
    locus: 齊策一
    quote: >-
      群臣吏民，能面刺寡人之過者，受上賞；上書諫寡人者，受中賞；能謗議於市朝，聞寡人之耳者，受下賞。
    translation: >-
      群臣、官吏和百姓，能當面指出我的過失的，受上等賞賜；上書勸諫我的，受中等賞賜；
      能在公共場所議論朝政、讓我聽到的，受下等賞賜。
  - locus: 齊策一
    quote: >-
      令初下，群臣進諫，門庭若市。數月之後，時時而間進。期年之後，雖欲言，無可進者。
      燕、趙、韓、魏聞之，皆朝於齊。此所謂戰勝於朝廷。
    translation: >-
      命令剛下達時，群臣紛紛進諫，宮門前和庭院裡熱鬧得像市集一樣。幾個月之後，偶爾才有人來進諫。
      一年之後，就是有人想說，也沒有甚麼可說的了。燕、趙、韓、魏聽說這件事，都來朝見齊國。
      這就是所謂在朝廷上戰勝敵國。
sources:
  - source: zhan-guo-ce
    locus: 齊策一
    ctext_urn: ctp:zhan-guo-ce/qi-yi
reliability: 大體可信
significance: >-
  先秦談納諫的文字很多，這一篇的特別之處在於它是從懷疑自己開始的。鄒忌先發現三個人對自己說了
  同樣的假話，再分辨各人不同的動機——偏愛、畏懼、有求——然後把這三種動機按規模放大到一個國家。
  他沒有指責任何人，只讓威王自己算出蒙蔽的規模；進諫的方法本身就是論點的示範。
