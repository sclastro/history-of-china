id: zou-ji-feng-jian
name: 鄒忌諷齊王納諫
year: -350
year_note: 年代不詳；事在齊威王時
period: zhan-guo-early
type: 論政
states: [qi]
people: [zou-ji, qi-wei-wang]
narrative: >-
  鄒忌身高八尺有餘、容貌美麗。早上穿戴整齊照鏡子，問妻子：
  我與城北徐公相比，誰美？妻子說您美得多。他不信，又問小妾，小妾也說他美；
  第二天有客人來，他又問客人，客人也說他美。

  過了一天，徐公來了。鄒忌仔細端詳，自認不如；照鏡子再看，更覺得差得遠。

  晚上躺著想這件事，想通了：「吾妻之美我者，私我也；妾之美我者，畏我也；
  客之美我者，欲有求於我也。」
  （白話：我妻子說我美，是偏愛我；小妾說我美，是害怕我；客人說我美，是有求於我。）

  於是他上朝見威王，把這件家事講了一遍，然後說：
  齊國地方千里、城池百二十座，宮中的妃嬪沒有不偏愛大王的，
  朝廷的群臣沒有不畏懼大王的，四境之內沒有不有求於大王的——
  「由此觀之，王之蔽甚矣」（白話：這樣看來，大王受到的蒙蔽太嚴重了）。

  威王說「善」，隨即下令：能當面指出寡人過失的，受上賞；
  上書勸諫的，受中賞；在公共場所議論而傳到寡人耳中的，受下賞。

  命令剛下時，群臣進諫，「門庭若市」（白話：門口和庭院裡人多得像市集）；
  幾個月後，間或有人來說；一年之後，就算想說也沒有什麼可說的了。
  燕、趙、韓、魏聽說，都來朝於齊——「此所謂戰勝於朝廷」
  （白話：這就是所謂在朝廷上就打了勝仗）。
sources:
  - source: zhan-guo-ce
    locus: 齊策一
    ctext_urn: ctp:zhan-guo-ce/qi-ce-yi
reliability: 大體可信
significance: >-
  先秦談納諫的文字很多，這一篇的特別之處在於它是從**懷疑自己**開始的。
  鄒忌沒有先講大道理，他先發現三個人對自己說了同樣的假話，
  再逐一分析每個人說假話的不同動機：偏愛、畏懼、有求。
  然後把這三種動機按規模放大到一個國家。
  進諫的方法本身就是論點的示範——他沒有指責任何人，
  只是讓威王自己算出蒙蔽的規模。
