id: lv-bu-wei-li-zi-chu
name: 呂不韋立子楚
year: -265
year_end: -239
period: zhan-guo-late
type: 外交
states: [qin, zhao]
people: [lv-bu-wei, zi-chu, qin-shi-huang]
narrative: >-
  秦昭王的孫子異人（後來改名子楚）在趙國作人質。他的母親夏姬不受寵愛，加上秦國屢次攻打趙國，
  趙國對異人並不禮遇，供給他的車馬和日常用度都不寬裕，處境困窘，很不得意。

  陽翟的大商人呂不韋到趙國都城邯鄲做生意，見到異人，很同情他，說這是「奇貨可居」（一件難得的
  貨物，值得囤積起來等待時機）。據《戰國策》記載，呂不韋回家問父親：耕田的利潤有幾倍？父親說十倍。他又問買賣珠玉
  的利潤有幾倍？父親說一百倍。他再問扶立一國之君的利潤有幾倍？父親說多得無法計算。呂不韋於是說：
  如今就算拚命耕作，也換不來暖衣與餘糧；可是建立一個國家、擁立一位君主，恩澤可以留給後世。他決定
  去投靠異人。

  呂不韋拿出五百金交給異人，讓他作日常開銷、結交賓客；又用五百金買下奇珍異寶，帶著西行到秦國。
  他求見太子安國君最寵愛的華陽夫人——夫人沒有兒子。呂不韋遊說她：靠美色事奉人的，色衰了寵愛也就
  淡了；如果不趁著正得寵的時候先立下根本，等到色衰愛弛之後，就算想開口說一句話，也未必辦得到。
  華陽夫人認為有理，於是請求安國君立異人為嫡嗣。據《戰國策》記載，華陽夫人是楚國人，
  收異人為子後，替他改名子楚。

  後來邯鄲之圍解除，子楚逃回秦國。安國君即位（就是孝文王），可是即位僅三天便去世；子楚繼位，
  就是莊襄王。莊襄王任命呂不韋為丞相，封他為文信侯，把河南洛陽的十萬戶作為封邑。莊襄王在位三年
  也去世了，太子嬴政（後來的秦始皇）繼位，年僅十三歲，尊稱呂不韋為「仲父」。

  當時，魏國有信陵君、楚國有春申君、趙國有平原君、齊國有孟嘗君，這四位公子都禮賢下士、喜好結交
  賓客，彼此爭相壓倒對方。呂不韋認為秦國如此強大，養士卻比不上他們，覺得羞恥，於是也招攬士人、
  優厚款待，門下食客多達三千人。他讓門客各自把自己的見聞寫下來，彙集編成《八覽》《六論》《十二紀》，
  共二十多萬字，取名《呂氏春秋》。書成之後，他把書張掛在咸陽的市場城門上，在上面懸賞千金，公開邀請
  各國前來遊歷的士人賓客，凡能增加或刪減一個字的，就賞給千金。這就是成語「一字千金」的由來。
original:
  - speaker: 呂不韋
    locus: 呂不韋列傳
    quote: 此奇貨可居。
    translation: 這是一件難得的貨物，值得囤積起來等待時機。
  - speaker: 呂不韋與其父
    source: zhan-guo-ce
    locus: 秦策五
    quote: >-
      歸而謂父曰：「耕田之利幾倍？」曰：「十倍。」「珠玉之贏幾倍？」曰：「百倍。」「立國家之主贏幾倍？」曰：
      「無數。」曰：「今力田疾作，不得煖衣餘食；今建國立君，澤可以遺世，願往事之。」
    translation: >-
      呂不韋問父親：「耕田的利潤有幾倍？」父親說：「十倍。」呂不韋又問：「買賣珠玉的利潤有幾倍？」
      父親說：「一百倍。」呂不韋再問：「扶立一國之君，利潤有幾倍？」父親說：「多得無法計算。」
      呂不韋於是說：「如今就算拚命耕作，也換不來暖衣與餘糧；而建立一個國家、擁立一位君主，
      恩澤可以留給後世。我願意去做這件事。」
  - speaker: 呂不韋
    locus: 呂不韋列傳
    quote: >-
      以色事人者，色衰而愛弛……不以繁華時樹本，即色衰愛弛後，雖欲開一語，尚可得乎？
    translation: >-
      靠美色事奉人的，色衰了寵愛也就淡了……如果不趁著正得寵的時候先立下根本，
      等到色衰愛弛之後，就算想開口說一句話，還辦得到嗎？
  - locus: 呂不韋列傳
    quote: 布咸陽市門，懸千金其上，延諸侯游士賓客有能增損一字者予千金。
    translation: >-
      把書張掛在咸陽的市場城門上，在上面懸賞千金，邀請各國前來遊歷的士人賓客，
      凡能增加或刪減一個字的，就賞給千金。
sources:
  - source: shiji
    locus: 呂不韋列傳
