id: lv-bu-wei-li-zi-chu
name: 呂不韋立子楚
year: -265
year_end: -239
period: zhan-guo-late
type: 外交
states: [qin, zhao]
people: [lv-bu-wei, zi-chu, qin-shi-huang]
narrative: >-
  秦昭王之孫異人質於趙，母夏姬無寵，秦數攻趙，趙待之不甚禮，車乘進用不饒，居處困，不得意。

  陽翟大賈呂不韋賈邯鄲，見而憐之，曰：「此奇貨可居。」歸而問其父曰：「耕田之利幾倍？」曰：
  「十倍。」「珠玉之贏幾倍？」曰：「百倍。」「立國家之主贏幾倍？」曰：「無數。」乃曰：「今
  力田疾作，不得煖衣餘食；今建國立君，澤可以遺世。願往事之。」（白話：如今就算拚命耕作，也
  換不來暖衣與餘糧；而建立一個國家、擁立一位君主，恩澤可以留給後世。我願意去做這件事。）

  乃以五百金與異人為進用、結賓客，復以五百金買奇物玩好，自奉而西游秦，求見安國君（太子）所
  幸華陽夫人——夫人無子。說之曰：「以色事人者，色衰而愛弛……不以繁華時樹本，即色衰愛弛後
  ，雖欲開一語，尚可得乎？」（白話：靠美色來事奉人的，色衰了愛也就淡了……不趁著正得寵的時
  候先立下根本，等到色衰愛弛之後，就算想開口說一句話，還能辦得到嗎？）夫人以為然，遂請立異
  人為嫡嗣。異人本楚人所出，因更名子楚。

  邯鄲圍解，子楚亡歸秦。安國君（孝文王）立三日而卒，子楚立，是為莊襄王，以呂不韋為丞相，封
  文信侯，食河南洛陽十萬戶。莊襄王在位三年而卒，太子政立，年十三，號呂不韋為仲父。

  當是時，魏有信陵君、楚有春申君、趙有平原君、齊有孟嘗君，皆下士喜賓客以相傾。呂不韋以秦之
  強羞不如，亦招致士厚遇之，至食客三千人。使其客人人著所聞，集論以為八覽、六論、十二紀，二
  十餘萬言，號曰《呂氏春秋》。布咸陽市門，懸千金其上，延諸侯游士賓客有能增損一字者予千金。
sources:
