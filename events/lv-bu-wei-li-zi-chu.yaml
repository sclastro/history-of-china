reliability: 大體可信
significance: >-
  戰國最後階段的一個象徵：商人的資本邏輯直接進入王位繼承。
  呂不韋與其父那段對答把它說得毫不隱晦——
  農、商、政三者是同一條收益曲線上的不同段落，
  「立國家之主」不過是回報率最高的那一項投資。
  這種計算方式在春秋是不可想像的；到戰國末，它已成為可以公開講出的道理。
