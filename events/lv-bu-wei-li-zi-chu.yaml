reliability: 大體可信
significance: >-
  這是戰國末年的一個象徵：商人的資本邏輯直接進入王位繼承。呂不韋與父親那段對答說得毫不掩飾——
  耕田、珠玉、立君，只是同一條收益曲線上回報率不同的三段投資，其中「立國家之主贏幾倍」
  （白話：扶立一國之君，利潤有幾倍）的答案是「無數」。這種盤算在春秋時代難以想像，
  到戰國末年卻已成為可以公開講出的道理。
