reliability: 大體可信
notes: >-
  原文作「蔡聖侯」「宣王」，舊注或以為即春秋時的蔡靈侯與楚靈王，士禮居本黃丕烈札記認為不然。
significance: >-
  「亡羊補牢」的出處，而它出現的位置很重要：不是災前的告誡，而是災後的第一句話。
  莊辛沒有說我早就講過，他說的是現在補救還來得及。那四個層層推進的比喻，
  則是先秦說理最精巧的結構之一：每一層的主角都以為自己在安全的高處，而每一層之上都還有一層。
