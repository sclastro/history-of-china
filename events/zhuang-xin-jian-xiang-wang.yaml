id: zhuang-xin-jian-xiang-wang
name: 莊辛諫楚襄王
year: -278
year_note: 楚頃襄王二十一年，秦拔郢之年
period: zhan-guo-late
type: 論政
states: [chu, qin]
people: [zhuang-xin, chu-xiang-wang]
narrative: >-
  楚臣莊辛對楚頃襄王說：大王左邊是州侯，右邊是夏侯，車後還跟著鄢陵君和壽陵君，
  一味荒淫奢侈，不理國政，郢都一定危險了。襄王說：先生是老糊塗了嗎？還是認為楚國要出妖孽了？
  莊辛說，他確實看到事情必然如此，不敢說是國家的妖孽；大王如果始終寵信這四個人，楚國必定滅亡。
  他請求到趙國避一避，在那裡觀察局勢。

  莊辛到趙國住了五個月，秦軍果然攻下鄢、郢、巫、上蔡、陳等地，襄王流亡到城陽。
  襄王這才派人到趙國召回莊辛，問他：寡人當初不聽先生的話，如今事情到了這個地步，該怎麼辦？

  莊辛回答：俗話說，看見兔子才回頭叫獵狗，還不算晚；羊跑掉了才修補羊圈，也還不算遲。
  這就是成語「亡羊補牢」的由來。他接著說，商湯、周武王憑百里之地興起，夏桀、商紂擁有天下卻滅亡；
  如今楚國雖然變小了，截長補短，仍有幾千里，何止百里？

  然後他用四個比喻層層推進。蜻蜓在天地間飛翔，低頭啄食蚊蟲，抬頭飲取甘露，自以為無憂無慮，
  不知道五尺高的孩童正調好黏膠，要把牠從高處黏下來。黃雀低頭啄食白米，抬頭棲在茂盛的樹上，
  自以為無憂無慮，不知道公子王孫左手挾著彈弓、右手拿著彈丸，正要把牠射下來，
  早上還在樹上遊玩，晚上就成了盤中的菜餚。黃鵠在江海上遨遊，停歇在大沼澤中，展翅凌風，
  自以為無憂無慮，不知道射手正在準備弓箭和絲繩，要從高空把牠射落。蔡聖侯南遊高陂、北登巫山，
  左擁右抱，在高蔡馳騁遊樂，不把國事放在心上，不知道楚國的子發正奉楚宣王之命，要把他綁回去。

  最後他說到襄王自己：大王左有州侯，右有夏侯，鄢陵君和壽陵君隨從在後，吃著封地的糧食，
  帶著府庫的金錢，在雲夢澤中馳騁，不把天下國家放在心上，卻不知道穰侯正奉秦王之命，
  要把大王趕出黽塞之外。

  襄王聽完，臉色大變，渾身發抖，於是把執珪的爵位授給莊辛，封他為陽陵君，並賜給他淮北的土地。
original:
  - speaker: 楚頃襄王
    locus: 楚策四
    quote: >-
      先生老悖乎？將以為楚國祅祥乎？
    translation: >-
      先生是老糊塗了嗎？還是認為楚國要出妖孽了？
  - speaker: 莊辛
    locus: 楚策四
    quote: >-
      臣聞鄙語曰：「見兔而顧犬，未為晚也；亡羊而補牢，未為遲也。」
    translation: >-
      臣聽俗話說：「看見兔子才回頭叫獵狗，還不算晚；羊跑掉了才修補羊圈，也還不算遲。」
  - speaker: 莊辛
    locus: 楚策四
    quote: >-
      蔡聖侯之事其小者也，君王之事因是以。左州侯，右夏侯，輩從鄢陵君與壽陵君，飯封祿之粟，
      而戴方府之金，與之馳騁乎雲夢之中，而不以天下國家為事。不知夫穰侯方受命乎秦王，
      填黽塞之內，而投己乎黽塞之外。
    translation: >-
      蔡聖侯的事還是小的，大王的事也是這樣。大王左有州侯，右有夏侯，鄢陵君和壽陵君隨從在後，
      吃著封地的糧食，帶著府庫的金錢，和他們在雲夢澤中馳騁，不把天下國家放在心上。
      卻不知道穰侯正奉秦王之命，要佔據黽塞以內的土地，把大王趕到黽塞之外。
  - locus: 楚策四
    quote: >-
      襄王聞之，顏色變作，身體戰慄。於是乃以執珪而授之為陽陵君，與淮北之地也。
    translation: >-
      襄王聽完，臉色大變，渾身發抖。於是把執珪的爵位授給莊辛，封他為陽陵君，並賜給他淮北的土地。
sources:
