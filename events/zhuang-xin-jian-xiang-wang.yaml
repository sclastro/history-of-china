id: zhuang-xin-jian-xiang-wang
name: 莊辛諫楚襄王
year: -278
year_note: 秦拔郢之年前後
period: zhan-guo-late
type: 獻策
states: [chu, qin]
people: [zhuang-xin, chu-xiang-wang]
narrative: >-
  莊辛勸諫楚頃襄王，說他與州侯、夏侯、鄢陵君、壽陵君四人一味淫逸奢靡，
  不顧國政，郢都必危。襄王說：「先生老悖乎？將以為楚國祅祥乎？」
  （白話：先生是老糊塗了嗎？還是認為楚國要出妖孽了？）

  莊辛請求避居趙國，說五個月之後再看。

  五個月後，秦國果然攻下鄢、郢、巫、上蔡、陳等地，襄王流亡到城陽。
  這才派人到趙國召回莊辛。

  莊辛說：「臣聞鄙語曰：『見兔而顧犬，未為晚也；亡羊而補牢，未為遲也。』」
  （白話：臣聽俗話說：看見兔子才想起獵狗，還不算晚；羊跑掉了才修補羊圈，也還不算遲。）

  他接著用四個比喻層層推上：蜻蜓只顧在空中飲露，不知五尺童子正拿膠絲要黏牠；
  黃雀俯身啄食白粒，不知公子王孫正張弓要射牠；黃鵠遊於江海，不知射者正備箭要取牠；
  蔡靈侯南遊高陂、北登巫山，不知楚王正遣人要縛他。
  最後說到襄王自己——左抱鄢陵君、右擁壽陵君，以為可以長久，
  卻不知穰侯正受命於秦王，要把他趕出楚國。

  襄王聽完面色大變，封莊辛為陽陵君，與他謀劃收復失地。
sources:
  - source: zhan-guo-ce
    locus: 楚策四
    ctext_urn: ctp:zhan-guo-ce/chu-ce-si
reliability: 大體可信
significance: >-
  「亡羊補牢」的出處，而它出現的位置很重要——
  它不是災前的告誡，是災後的第一句話。
  莊辛沒有說「我早就講過」，他說的是現在補還來得及。
  那四個層層推進的比喻則是先秦說理最精巧的結構之一：
  每一層的主角都以為自己在安全的高度，而每一層之上都還有一層。
