id: ji-liang-jian-wei-wang
name: 季梁諫魏王
year: -354
year_note: 年代不詳；事在魏攻邯鄲前後
period: zhan-guo-early
type: 獻策
states: [wei, zhao]
people: [ji-liang]
narrative: >-
  魏王想出兵攻打趙國都城邯鄲。大臣季梁當時正在出行的半路上，一聽到這個消息，立刻折返回來。
  他衣服皺了來不及撫平，頭上的塵土來不及拍掉，就急著去見魏王。

  季梁沒有直接勸阻，先講了一件路上的見聞。他說，今天來的路上，在大路旁見到一個人，
  正駕著車頭朝北趕，卻對他說要去南方的楚國。季梁問：您要去楚國，怎麼反而往北走？
  那人先說自己的馬好，季梁指出馬雖然好，這條卻不是去楚國的路；那人又說自己路費多，
  季梁說路費雖然多，這條仍然不是去楚國的路；那人再說自己的車夫技術好。
  季梁的結論是：這幾樣條件越好，這個人離楚國反而越遠。這就是成語「南轅北轍」的由來。

  講完寓言，季梁把話拉回正題。他指出，魏王一舉一動都想成就霸業、想取信於天下；
  可是如今仗著國家大、兵力精銳去攻打邯鄲，想藉此擴張土地、抬高名聲。
  這樣的行動越多，離王業反而越遠，就跟那個要去楚國卻一路朝北走的人一模一樣。
original:
  - locus: 魏策四
    quote: 魏王欲攻邯鄲，季梁聞之，中道而反，衣焦不申，頭塵不去，往見王曰：
    translation: >-
      魏王想攻打邯鄲。季梁聽到消息，半路就折返回來，衣服皺了顧不上撫平，
      頭上的塵土顧不上拍掉，急著去見魏王，說：
  - speaker: 季梁
    locus: 魏策四
    quote: >-
      今者臣來，見人於大行，方北面而持其駕，告臣曰：「我欲之楚。」臣曰：「君之楚，將奚為北面？」
      曰：「吾馬良。」臣曰：「馬雖良，此非楚之路也。」曰：「吾用多。」臣曰：「用雖多，此非楚之路也。」
      曰：「吾御者善。」此數者愈善，而離楚愈遠耳。
    translation: >-
      今天我來的路上，在大路旁見到一個人，正把車頭朝北趕著，卻告訴我說：「我要去楚國。」
      我問：「您要去楚國，怎麼往北走？」他說：「我的馬好。」我說：「馬雖然好，這卻不是去楚國的路。」
      他說：「我的路費多。」我說：「路費雖然多，這仍然不是去楚國的路。」他說：「我的車夫技術好。」
      這幾樣越好，離楚國反而越遠。
  - speaker: 季梁
    locus: 魏策四
    quote: >-
      今王動欲成霸王，舉欲信於天下。恃王國之大，兵之精銳，而攻邯鄲，以廣地尊名，
      王之動愈數，而離王愈遠耳，猶至楚而北行也。
    translation: >-
      如今大王一舉一動都想成就霸業、想取信於天下；卻仗著國家大、兵力精銳去攻打邯鄲，
      想藉此擴張土地、抬高名聲。大王這樣的行動越多，離王業反而越遠，
      就跟要去楚國卻往北走一樣。
sources:
  - source: zhan-guo-ce
    locus: 魏策四
    ctext_urn: ctp:zhan-guo-ce/wei-si
reliability: 孤證
significance: >-
  這是先秦最清晰的一次論證：方向錯了，條件越好越糟。季梁沒有說攻打邯鄲會打不贏，
  他甚至承認魏國兵精國大；他攻擊的是目標與手段的矛盾：魏王要的是天下歸心，
  用的卻是使天下畏懼的辦法，兩者方向相反。他說「此數者愈善，而離楚愈遠耳」
  （白話：這幾樣越好，離楚國反而越遠），點明資源用在錯誤的方向上只會加速偏離——
  這正是成語「南轅北轍」的意思，今天仍然成立。
