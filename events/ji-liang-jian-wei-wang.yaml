id: ji-liang-jian-wei-wang
name: 季梁諫魏王
year: -354
year_note: 年代不詳；事在魏攻邯鄲前後
period: zhan-guo-early
type: 獻策
states: [wei, zhao]
people: [ji-liang]
narrative: >-
  魏王想出兵攻打趙國都城邯鄲。季梁正在半路上，聽到消息立刻折回，
  衣服皺了來不及撫平、頭上的塵土來不及拍掉，就去見魏王。

  他說：「今者臣來，見人於大行，方北面而持其駕，告臣曰『我欲之楚』。
  臣曰『君之楚，將奚為北面？』曰『吾馬良』……曰『吾用多』……曰『吾御者善』。
  此數者愈善，而離楚愈遠耳。」
  （白話：今天臣來的路上，在大路旁見到一個人，正把車頭朝北趕著，
  卻告訴臣說「我要去楚國」。臣問：「您要去楚國，怎麼往北走？」他說「我的馬好」……
  說「我的路費多」……說「我的車夫技術好」。這幾樣越好，離楚國反而越遠。）

  然後他把話收回本題：「今王動欲成霸王，舉欲信於天下；恃王國之大、兵之精銳而攻邯鄲，
  以廣地尊名——王之動愈數而離王愈遠耳，猶至楚而北行也。」
  （白話：如今大王一舉一動都想成就霸業、想取信於天下；卻仗著國家大、兵精銳而去攻打邯鄲，
  藉此擴地揚名——大王這樣的行動越多，離王業反而越遠，就跟要去楚國卻往北走一樣。）
sources:
  - source: zhan-guo-ce
    locus: 魏策四
    ctext_urn: ctp:zhan-guo-ce/wei-ce-si
reliability: 孤證
significance: >-
  這是先秦最清晰的一次「方向錯了，條件越好越糟」的論證。
  季梁沒有說攻邯鄲會打不贏——他甚至承認魏國兵精國大。
  他攻擊的是目標與手段的關係：魏王要的是天下歸心，
  用的卻是使天下畏懼的辦法，兩者方向相反。
  資源在錯誤的方向上只會加速偏離，這一點今天仍然成立。
