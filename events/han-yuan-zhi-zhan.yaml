id: han-yuan-zhi-zhan
name: 韓原之戰
year: -645
year_note: 魯僖公十五年
period: wu-ba
type: 戰役
states: [qin, jin]
people: [qin-mu-gong, jin-hui-gong, qing-zheng]
narrative: >-
  晉惠公當年靠秦國的力量才回國即位，事先答應割讓黃河以西的五座城給秦國，即位後卻反悔。後來
  晉國鬧饑荒，秦穆公仍然運糧接濟，史稱「汎舟之役」。可是輪到秦國鬧饑荒、向晉國買糧時，晉
  惠公卻閉關不給。前 645 年，秦穆公出兵討伐晉國，接連三次打敗晉軍，一直打到韓地。

  開戰前占卜由誰擔任國君戰車的護右（車右），卜得慶鄭最吉利，晉惠公卻不用他。臨戰，晉惠公乘
  坐鄭國進獻的小駟馬。慶鄭出言勸阻：古人遇到大事，一定用本國出產的馬，因為這種馬生長在本地
  水土，懂得本地人的心意，也習慣本地的訓練和駕馭方式，怎麼指揮都順心。如今改用外地的馬上
  陣，一旦馬受驚而性情大變，就會跟駕馭的人作對；到時牠氣息紊亂、暴躁憤懣，血脈奔湧、筋脈僨
  張，外表看來強壯，內裡其實已經虛竭，進退都不聽使喚，轉圈周旋也做不到，君侯一定會後悔。這
  就是成語「外強中乾」的出處。晉惠公不聽。

  兩軍在韓原交戰。晉惠公的戰馬果然陷進泥濘，動彈不得。惠公高聲呼喊慶鄭來救。慶鄭卻回答：您
  固執己見、不聽勸諫，又違背卜辭，本來就是自求失敗，如今哪裡還逃得掉？說完就走開了。晉惠公
  終於被秦軍俘虜。

  秦穆公的夫人穆姬是晉惠公的姐姐。她聽說弟弟就要被押到，便帶著太子罃等子女登上高臺，
  腳踏柴薪，派人對穆公說：晉君早上押進來，她當晚就死；晚上押進來，她次日早上就死。穆公於是答應與晉國講和，放晉惠公回國，同時取得河東的土地，
  並在那裡設置官吏管理。
original:
  - locus: 僖公十五年
    quote: >-
      晉侯謂慶鄭曰：「寇深矣，若之何？」對曰：「君實深之，可若何？」公曰：「不孫。」
    translation: >-
      晉惠公對慶鄭說：「敵人已經深入國境，該怎麼辦？」慶鄭回答：「是君侯自己讓他們深入的，
      還能怎麼辦？」惠公說：「你太無禮了。」
  - speaker: 慶鄭
    locus: 僖公十五年
    quote: >-
      古者大事，必乘其產，生其水土而知其人心，安其教訓而服習其道，唯所納之，無不如志。
      今乘異產，以從戎事，及懼而變，將與人易，亂氣狡憤，陰血周作，張脈僨興，外彊中乾，
      進退不可，周旋不能，君必悔之。
    translation: >-
      古人遇到大事，一定乘用本國出產的馬：這種馬生長在本地水土，懂得本地人的心意，習慣本地
      的訓練和駕馭方式，怎麼指揮都順心。如今改用外地的馬上陣，一旦馬受驚而性情大變，就會跟
      駕馭的人作對；到時氣息紊亂、暴躁憤懣，血脈奔湧、筋脈僨張，外表強壯而內裡枯竭，進退都
      不聽使喚，轉圈周旋也做不到，君侯一定會後悔。
  - speaker: 慶鄭
    locus: 僖公十五年
    quote: 愎諫、違卜，固敗是求，又何逃焉？
    translation: >-
      您固執己見、不聽勸諫，又違背卜辭，本來就是自求失敗，如今還逃得掉嗎？
  - speaker: 穆姬
    locus: 僖公十五年
    quote: >-
      上天降災，使我兩君匪以玉帛相見，而以興戎。若晉君朝以入，則婢子夕以死；夕以入，
      則朝以死。唯君裁之。
    translation: >-
      上天降下災禍，讓我們兩國國君不能拿著玉帛和好相見，反而動起刀兵。晉君要是早上被押進
      來，我就當晚去死；晚上被押進來，我就次日早上去死。請君侯自己定奪。
sources:
  - source: zuo-zhuan
    locus: 僖公十五年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/xi-gong-shi-wu-nian
reliability: 信史
significance: >-
  秦、晉關係由「秦晉之好」轉向敵對的關鍵一戰。慶鄭的諫辭是先秦少見的一段純技術性論證：
  他不談忠信道義，只講馬的生理——外地的馬一受驚就氣息紊亂、血脈奔湧，外表強壯而內裡枯竭，
  到時進退周旋都不由人。「外強中乾」四個字自此成為一切表面強大而內在已空者的通稱。
