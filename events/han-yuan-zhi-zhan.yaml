id: han-yuan-zhi-zhan
name: 韓原之戰
year: -645
year_note: 魯僖公十五年
period: wu-ba
type: 戰役
states: [qin, jin]
people: [qin-mu-gong, jin-hui-gong, qing-zheng]
narrative: >-
  晉惠公賴秦力得國而背河外五城之約；晉飢，秦輸之粟（泛舟之役）；
  秦飢而請糴，晉閉之不與。前 645 年秦伐晉，三敗及韓。

  戰前卜右，慶鄭吉而惠公不用。將戰，惠公乘鄭所獻之小駟。
  慶鄭諫曰：「古者大事，必乘其產：生其水土而知其人心，
  安其教訓而服習其道，唯所納之，無不如志。今乘異產以從戎事，
  及懼而變，將與人易。亂氣狡憤，陰血周作，張脈僨興，
  外彊中乾。進退不可，周旋不能，君必悔之。」弗聽。

  戰於韓原，晉戎馬還濘而止。惠公號慶鄭，慶鄭曰：
  「愎諫違卜，固敗是求，又何逃焉？」遂去。晉侯為秦所獲。

  秦穆姬（惠公之姊）登臺履薪而請，穆公乃許晉平，
  歸惠公而取河東之地，置官司焉。
sources:
  - source: zuo-zhuan
    locus: 僖公十五年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/xi-gong-shi-wu-nian
reliability: 信史
significance: >-
  秦晉關係由「之好」轉為敵對的關鍵一戰。
  慶鄭的諫辭是先秦最精確的一段技術性論證——
  他不談忠信，只談馬的生理：異地之馬遇懼則氣亂血湧、脈張筋興，
  外表仍壯而內裡已虛，屆時進退周旋皆不由人。
  「外強中乾」四字自此成為一切「表面強大而內在已空」的通稱。
