id: xian-gao-gao-shi
name: 弦高犒師
year: -627
year_note: 魯僖公三十三年
period: wu-ba
type: 外交
states: [qin, zheng, jin]
people: [xian-gao, zheng-mu-gong, qin-mu-gong]
narrative: >-
  前 628 年冬，秦國派駐鄭國的戍將杞子送密報回秦國，說鄭國人讓他掌管國都北門的鑰匙，
  如果秦國秘密派兵前來，就可以取得鄭國。秦穆公向老臣蹇叔徵詢意見。蹇叔說，勞師遠征去偷襲別國，
  從沒聽說過能成功的：軍隊疲勞、力量耗盡，而遠方的對手早有防備；行軍千里，誰會不知道？
  穆公不聽，派孟明視、西乞術、白乙丙率軍出發。蹇叔哭著送行，說只看到大軍出去，看不到大軍回來；
  又對隨軍出征的兒子說，晉國一定會在殽山截擊秦軍，他會到那裡去收兒子的屍骨。

  前 627 年春，秦軍經過周都北門，戰士只脫下頭盔下車致敬，隨即一躍上車，
  年少的王孫滿看了，說秦軍輕狂無禮，一定失敗。

  秦軍到了滑國，鄭國商人弦高正要到周都做買賣，在路上碰見了這支軍隊。他當機立斷，
  先送上四張熟牛皮，再獻上十二頭牛犒勞秦軍，並冒稱奉了鄭君之命，說：我們國君聽說各位要率軍
  經過敝國，特地派我來犒勞隨從；敝國雖然不富裕，各位若要停留，就供應一天的糧草，
  若要動身，就為各位守衛一夜。同時，他派人火速回國報信。

  鄭穆公得報，派人去查看杞子等人住的賓館，發現他們已經捆好行裝、磨快兵器、餵飽馬匹，
  準備接應秦軍。穆公派皇武子委婉地下逐客令：各位在敝國住得太久，乾糧和牲畜都吃光了；
  聽說各位要走，鄭國有原圃，就像秦國有具囿一樣，各位不妨去打些麋鹿，讓敝國稍得休息。
  杞子逃往齊國，逢孫、楊孫逃往宋國。成語「厲兵秣馬」即出於此。

  秦軍主帥孟明視說：鄭國已有防備，不能指望了；攻城攻不下，圍城又沒有後援，還是回去吧。
  秦軍滅了滑國就回師。四月，晉軍聯合姜戎在殽山截擊，秦軍全軍覆沒，孟明視、西乞術、白乙丙三帥被俘。
original:
  - speaker: 蹇叔
    locus: 僖公三十二年
    quote: >-
      勞師以襲遠，非所聞也。師勞力竭，遠主備之，無乃不可乎！
    translation: >-
      勞師遠征去偷襲別國，從沒聽說過可行。軍隊疲勞、力量耗盡，而遠方的對手早有防備，恐怕不行吧！
  - speaker: 弦高
    locus: 僖公三十三年
    quote: >-
      寡君聞吾子將步師出於敝邑，敢犒從者。不腆敝邑為從者之淹，居則具一日之積，行則備一夕之衛。
    translation: >-
      我們國君聽說各位要率軍經過敝國，特地派我來犒勞隨從。敝國雖不富裕，為了隨從們在此停留，
      若住下就供應一天的糧草，若動身就為各位守衛一夜。
  - locus: 僖公三十三年
    quote: >-
      鄭穆公使視客館，則束載、厲兵、秣馬矣。
    translation: >-
      鄭穆公派人查看賓館，發現杞子等人已經捆好行裝、磨快兵器、餵飽馬匹了。
  - speaker: 孟明視
    locus: 僖公三十三年
    quote: >-
      鄭有備矣，不可冀也。攻之不克，圍之不繼，吾其還也。
    translation: >-
      鄭國已有防備，不能指望了。攻城攻不下，圍城又沒有後援，我們還是回去吧。
sources:
  - source: zuo-zhuan
    locus: 僖公三十三年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/xi-gong-san-shi-san-nian
  - source: zuo-zhuan
    locus: 僖公三十二年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/xi-gong-san-shi-er-nian
reliability: 信史
significance: >-
  一個商人在毫無授權的情況下假託君命，改變了一場戰爭的走向。值得注意的是弦高並沒有擋住秦軍，
  他只讓秦軍相信鄭國已經知情；真正解除危機的，是他同時發出的消息，以及鄭穆公據此查看賓館的動作。
  「厲兵秣馬」之所以成為成語，正因為它是一次查證，而不是一次臆測。
