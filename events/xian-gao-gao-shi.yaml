id: xian-gao-gao-shi
name: 弦高犒師
year: -627
year_note: 魯僖公三十三年
period: wu-ba
type: 外交
states: [qin, zheng, jin]
people: [xian-gao, zheng-mu-gong, qin-mu-gong]
narrative: >-
  秦穆公得到留守鄭國的杞子密報，說鄭國北門的鑰匙由他掌管，可以偷襲。蹇叔極力勸阻，
  說千里襲人必敗，秦師出發時他哭著送行。穆公不聽。

  鄭國商人弦高趕著牛群到周地做買賣，在滑地碰上這支秦軍。他當機立斷，先送四張熟牛皮作引子，
  再獻十二頭牛犒勞秦師，並冒稱奉鄭君之命：「寡君聞吾子將步師出於敝邑，敢犒從者。」
  （白話：我們國君聽說您要率軍路過敝國，特地前來犒勞您的隨從。）同時派人快馬回國報信。

  鄭穆公得報，派人到杞子等人住的館舍查看，見他們「則束載、厲兵、秣馬矣」
  （白話：已經捆好行裝、磨快兵器、餵飽馬匹了），確認內應屬實，於是委婉地下逐客令。
  杞子逃奔齊國，其餘二人逃奔宋國。

  秦軍主帥孟明說：「鄭有備矣，不可冀也。攻之不克，圍之不繼，吾其還也。」
  （白話：鄭國已有防備，指望不上了。攻打攻不下，圍城又沒有後援，我們還是回去吧。）
  滅了滑國就回師。四月，晉軍在崤山設伏，全殲秦師，俘虜孟明視、西乞術、白乙丙三帥。
sources:
  - source: zuo-zhuan
    locus: 僖公三十三年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/xi-gong-san-shi-san-nian
reliability: 信史
significance: >-
  一個商人在毫無授權的情況下假託君命，改變了一場戰爭的走向。
  值得注意的是弦高並沒有阻止秦軍——他只是讓秦軍相信鄭國已經知情。
  真正解除危機的是那條同時發出的消息，以及鄭穆公據此查證館舍的動作：
  「厲兵秣馬」四個字之所以成為成語，正因為它是一次證實，不是一次臆測。
