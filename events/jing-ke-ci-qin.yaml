id: jing-ke-ci-qin
name: 荊軻刺秦
year: -227
period: zhan-guo-late
type: 刺殺
states: [yan, qin]
people: [jing-ke, yan-tai-zi-dan, fan-wu-ji, qin-shi-huang]
narrative: >-
  秦已滅韓、破趙，兵臨易水。燕太子丹謀於田光，光薦荊軻而自剄以明不言。

  荊軻曰：「今行而無信，則秦未可親也。夫樊將軍，秦王購之金千斤、邑萬家。誠得樊將軍首與燕督
  亢之地圖獻秦王，秦王必說見臣，臣乃得有以報。」（白話：如今就這樣去而沒有取信之物，秦王是
  不會接近我的。樊將軍那邊，秦王懸賞黃金千斤、封邑萬家。若真能得到樊將軍的頭與燕國督亢的地
  圖獻給秦王，秦王必定高興地接見我，我才有辦法報答太子。）太子曰：「樊將軍以窮困來歸丹，丹
  不忍以己之私而傷長者之意。」（白話：樊將軍在走投無路時來投奔我，我不忍為了自己的私事而傷
  了這位長者的心。）荊軻乃私見樊於期，具告之。樊於期偏袒扼腕而進曰：「此臣之日夜切齒拊心也
  ，乃今得聞教！」（白話：這正是我日夜咬牙捶胸的事，今天才聽到您的指教！）遂自剄。

  太子豫求天下之利匕首，得趙人徐夫人匕首，取之百金，使工以藥焠之，以試人，血濡縷，人無不立
  死者。以副荊卿——秦舞陽為副。

  太子及賓客知其事者，皆白衣冠以送之，至易水之上。高漸離擊筑，荊軻和而歌，為變徵之聲，士皆
  垂淚涕泣。又前而為歌曰：「風蕭蕭兮易水寒，壯士一去兮不復還！」（白話：風蕭蕭地吹著，易水
  寒冷；壯士這一去，就不再回來了！）復為羽聲慷慨，士皆瞋目，髮盡上指冠。於是荊軻就車而去，
  終已不顧。

  至秦，厚遺中庶子蒙嘉為之先言。秦王大喜，設九賓，見燕使者咸陽宮。荊軻奉樊於期頭函，秦舞陽
  奉地圖匣，以次進。至陛，秦舞陽色變振恐，群臣怪之。荊軻顧笑舞陽，前謝曰：「北蕃蠻夷之鄙人
  ，未嘗見天子，故振慴。願大王少假借之，使得畢使於前。」（白話：他是北方蠻夷之地的鄙陋之人
  ，從沒見過天子，所以害怕發抖。希望大王稍加寬容，讓他能在殿前完成使命。）

  秦王謂軻曰：「取舞陽所持地圖。」軻既取圖奉之，發圖，**圖窮而匕首見**。因左手把秦王之
  袖，而右手持匕首揕之。未至身，秦王驚，自引而起，袖絕。拔劍，劍長，操其室；時惶急，劍堅，
  故不可立拔。荊軻逐秦王，秦王環柱而走。群臣皆愕，卒起不意，盡失其度——秦法，群臣侍殿上者
  不得持尺兵。侍醫夏無且以其所奉藥囊提軻。左右乃曰：「王負劍！」遂拔以擊軻，斷其左股。軻廢
  ，乃引其匕首以擿秦王，不中，中桐柱。秦王復擊軻，被八創。軻自知事不就，倚柱而笑，箕踞以罵
  ，遂體解以徇。

  其後秦大發兵攻燕，燕王斬太子丹以獻，秦兵不解，五年而燕亡。
