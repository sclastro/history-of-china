id: jing-ke-ci-qin
name: 荊軻刺秦
year: -227
period: zhan-guo-late
type: 刺殺
states: [yan, qin]
people: [jing-ke, yan-tai-zi-dan, fan-wu-ji, qin-shi-huang]
narrative: >-
  前 227 年，秦國已經滅掉韓國、攻破趙國，大軍逼近易水，隨時可以進攻燕國。燕太子丹十分憂慮，
  找謀士田光商量對策。田光自認年老，推薦了荊軻；為了表明自己不會洩露機密，隨即自殺。

  荊軻對太子丹說，空手去見秦王，秦王不會親近自己，行刺就無從下手。他建議帶兩樣見面禮：
  一是逃亡到燕國的秦國將領樊於期的頭——秦王正懸賞黃金千斤、封邑萬家要他的命；二是燕國督亢一帶的地圖。
  有了這兩樣，秦王一定高興地接見，荊軻才有機會動手。太子丹不忍心，說樊於期在走投無路時來投奔自己，
  不能為了私事傷了這位長者的心。

  荊軻於是私下去見樊於期，把打算和盤托出。樊於期說，這正是他日夜咬牙切齒、痛恨在心的事，
  聽到荊軻的計劃後，當場自殺，把頭獻出。

  太子丹早已買下趙國徐夫人的鋒利匕首，花了一百金，讓工匠用毒藥淬過，再拿活人試驗：
  只要見血沾濕一縷絲線，沒有一個不當場死的。他又替荊軻配了一名助手——秦舞陽。

  出發那天，太子丹和知情的賓客都穿白衣、戴白帽，一路送到易水邊。高漸離擊筑，荊軻和著唱歌，
  先唱出淒涼的變徵之音，眾人都流下眼淚。接著荊軻上前高歌：「風蕭蕭兮易水寒，壯士一去兮不復還！」
  歌聲又轉為激昂的羽聲，眾人聽了都瞪大眼睛，頭髮豎起頂住帽子。荊軻登車離去，始終沒有回頭。

  到了秦國，荊軻用重禮買通秦王的近臣、中庶子蒙嘉，讓他先替自己引薦。秦王政（後來的秦始皇）大喜，
  用最隆重的九賓之禮，在咸陽宮接見燕國使者。荊軻捧著裝樊於期頭的匣子，秦舞陽捧著地圖匣，依次前進。
  走到殿階前，秦舞陽臉色大變、渾身發抖，群臣都覺得奇怪。荊軻回頭朝秦舞陽笑了笑，上前解釋：
  他是北方蠻夷之地的粗人，沒見過天子，所以害怕發抖，請大王稍加寬容，讓他在殿前完成使命。

  秦王叫荊軻把秦舞陽拿的地圖取過來。荊軻取過地圖獻上，秦王展開，圖卷展到盡頭，
  捲在裡面的匕首露了出來，這就是成語「圖窮匕見」的由來。荊軻左手抓住秦王的衣袖，右手拿匕首直刺過去。
  還沒刺中，秦王驚起，掙脫時扯斷了衣袖。秦王想拔劍，劍太長，一時慌亂又拔不出來。荊軻追著秦王，
  秦王繞著殿柱奔逃。按秦國法律，殿上侍立的群臣不准攜帶武器，一時都慌了手腳。侍醫夏無且用手中的藥袋砸向荊軻。
  旁人提醒秦王把劍推到背後再拔，秦王這才拔出劍，砍斷荊軻的左腿。荊軻倒地，把匕首擲向秦王，
  沒有擊中，只打中銅柱。秦王再上前砍殺，荊軻身中八處刀傷。荊軻知道事情失敗，靠著柱子大笑，
  兩腿張開坐在地上大罵秦王，隨即被秦王左右上前殺死。

  事後秦國大舉發兵攻打燕國。燕王喜為了求和，殺了太子丹獻給秦國，可是秦軍並沒有因此退兵。
  五年之後，燕國滅亡。
original:
  - speaker: 荊軻
    source: shiji
    locus: 刺客列傳
    ctext_urn: ctp:shiji/ci-ke-lie-zhuan
    quote: 今行而毋信，則秦未可親也。夫樊將軍，秦王購之金千斤、邑萬家。誠得樊將軍首與燕督亢之地圖，奉獻秦王，秦王必說見臣，臣乃得有以報。
    translation: >-
      如今就這樣去而沒有取信的東西，秦王是不會親近我的。樊將軍那邊，秦王懸賞黃金千斤、封邑萬家。
      要是真能得到樊將軍的頭，連同燕國督亢一帶的地圖獻給秦王，秦王一定高興地接見我，我才有辦法報答太子。
  - speaker: 樊於期
    source: shiji
    locus: 刺客列傳
    quote: 此臣之日夜切齒腐心也，乃今得聞教！
    translation: 這正是我日夜咬牙切齒、痛心疾首的事，今天才聽到您的指教！
  - speaker: 荊軻
    source: shiji
    locus: 刺客列傳
    quote: 風蕭蕭兮易水寒，壯士一去兮不復還！
    translation: 風蕭蕭地吹著，易水寒冷；壯士這一去，就不再回來了！
  - speaker: 荊軻
    source: shiji
    locus: 刺客列傳
    quote: 北蕃蠻夷之鄙人，未嘗見天子，故振慴。願大王少假借之，使得畢使於前。
    translation: >-
      他是北方蠻夷之地的粗人，從沒見過天子，所以害怕發抖。希望大王稍加寬容，讓他能在殿前完成使命。
  - source: shiji
    locus: 刺客列傳
    quote: 軻既取圖奏之，秦王發圖，圖窮而匕首見。因左手把秦王之袖，而右手持匕首揕之。未至身，秦王驚，自引而起，袖絕。
    translation: >-
      荊軻取過地圖獻上，秦王展開地圖，圖卷展到盡頭，匕首就露了出來。荊軻左手抓住秦王的衣袖，
      右手拿匕首直刺過去。還沒刺中身體，秦王大驚，向後掙起，扯斷了衣袖。
