reliability: 信史
significance: >-
  舊秩序最後一次以個人之力抗拒結構之勢。
  荊軻的失敗幾乎是必然的——一次刺殺無論成敗都改變不了秦的動員能力
  與六國的離散；太子丹選擇這條路，本身就說明常規手段已經用盡。
  司馬遷的評語只有一句：「其立意較然，不欺其志。」
  他沒有說荊軻成功了，只說他沒有辜負自己的意圖。
