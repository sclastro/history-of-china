reliability: 信史
significance: >-
  這是舊秩序在秦統一大勢前最後一次以個人之力作出的抗拒。一次刺殺無論成敗，
  都改變不了秦國的動員能力與六國的離散；太子丹走上這條路，本身就說明常規手段已經用盡。
  司馬遷評荊軻這一類刺客，只有一句「其立意較然，不欺其志」（白話：他們的心志明明白白，不曾辜負自己的初衷）。
  他沒有說荊軻成功，只說他沒有辜負自己的意圖。
