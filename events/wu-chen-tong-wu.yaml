id: wu-chen-tong-wu
name: 巫臣通吳
year: -584
year_note: 魯成公七年
period: wu-ba
type: 外交
states: [chu, jin, wu]
people: [wu-chen, zi-fan]
narrative: >-
  楚國的申縣縣尹巫臣，先後得罪了楚國兩位執政。楚莊王圍宋之後，令尹子重請求把申、呂兩地的田地
  分給自己作賞田，巫臣勸莊王不可，說申、呂靠這些田地出兵出賦，才能抵禦北方，莊王於是作罷，
  子重從此怨恨巫臣。司馬子反想娶夏姬，也被巫臣勸阻，後來巫臣自己帶著夏姬出奔，
  子反因此也怨恨他。

  前 589 年，巫臣藉出使齊國的機會，帶著夏姬投奔晉國。楚共王即位後，子重、子反殺了巫臣留在
  楚國的族人子閻、子蕩、清尹弗忌，以及夏姬前夫襄老的兒子黑要，並瓜分了他們的家產。

  巫臣從晉國寫信給子重、子反，說：你們用讒害和貪婪事奉國君，濫殺無辜，我一定要讓你們
  疲於奔走應命，直到累死為止。這就是成語「疲於奔命」的由來。

  巫臣向晉景公請求出使吳國，景公答應了。吳王壽夢很歡迎他，吳國從此與晉國往來。
  巫臣帶著一隊戰車和士卒到吳國，把其中一部分連同射手、御者留給吳國，教吳人駕車作戰、
  排列陣勢，又教他們背叛楚國，並且把兒子狐庸留在吳國擔任外交官。

  吳國從此開始攻打楚國，又攻打楚國的屬國巢國和徐國，子重疲於奔走救援。前 584 年，
  諸侯在馬陵會盟時，吳軍攻入州來，子重又從鄭國趕回去應戰。這一年之內，子重、子反
  先後七次奔走應命。附屬楚國的蠻夷各部，全被吳國奪去，吳國從此強大起來，開始與中原諸侯往來。
original:
  - locus: 成公七年
    quote: >-
      及共王即位，子重、子反殺巫臣之族子閻、子蕩及清尹弗忌及襄老之子黑要，而分其室。
    translation: >-
      等到楚共王即位，子重、子反殺了巫臣的族人子閻、子蕩、清尹弗忌，以及襄老的兒子黑要，
      並瓜分了他們的家產。
  - speaker: 巫臣
    locus: 成公七年
    quote: >-
      爾以讒慝貪惏事君，而多殺不辜，余必使爾罷於奔命以死。
    translation: >-
      你們用讒害和貪婪事奉國君，濫殺無辜；我一定要讓你們疲於奔走應命，直到累死為止。
  - locus: 成公七年
    quote: >-
      巫臣請使於吳，晉侯許之。吳子壽夢說之。乃通吳于晉，以兩之一卒適吳，舍偏兩之一焉，
      與其射御，教吳乘車，教之戰陳，教之叛楚，寘其子狐庸焉，使為行人於吳。
    translation: >-
      巫臣請求出使吳國，晉景公答應了。吳王壽夢很歡迎他。於是吳國與晉國開始往來。巫臣帶著
      一隊戰車和士卒到吳國，把其中一部分連同射手、御者留給吳國，教吳人駕車作戰、排列陣勢，
      又教他們背叛楚國，並把兒子狐庸留在吳國，讓他擔任吳國的外交官。
  - locus: 成公七年
    quote: >-
      子重、子反於是乎一歲七奔命。蠻夷屬於楚者，吳盡取之，是以始大，通吳於上國。
    translation: >-
      子重、子反在這一年之內七次奔走應命。附屬楚國的蠻夷各部，全被吳國奪去，
      吳國從此強大起來，開始與中原諸侯往來。
sources:
  - source: zuo-zhuan
    locus: 成公七年
