id: wu-chen-tong-wu
name: 巫臣通吳
year: -584
year_note: 魯成公七年
period: wu-ba
type: 外交
states: [chu, jin, wu]
people: [wu-chen, zi-fan]
narrative: >-
  楚國申縣縣尹巫臣為了夏姬而與司馬子反、令尹子重結怨，前589年攜夏姬出奔晉國。
  楚人殺盡他留在國內的族人，並瓜分其家產。

  巫臣自晉國寫信給二人：「爾以讒慝貪惏事君，而多殺不辜，余必使爾罷於奔命以死。」
  （白話：你們用讒害、貪婪來事奉國君，濫殺無辜；我一定要讓你們疲於奔走救援，直到累死為止。）

  他隨即向晉侯請求出使吳國，帶去戰車三十乘，教吳人乘車、列陣、用兵之法，
  又教他們背叛楚國，並留下自己的兒子狐庸做吳國的行人。

  吳國由此崛起，開始攻打楚國、巢國、徐國，年年侵擾楚國東境。
  子反、子重「一歲七奔命」（白話：一年之內七次疲於奔走救援）。
  蠻夷屬於楚國的，吳國一概奪去，於是吳國始大，得以與中原諸侯往來。
sources:
  - source: zuo-zhuan
    locus: 成公七年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/cheng-gong-qi-nian
reliability: 信史
significance: >-
  春秋後期最重要的一次地緣改造，而它的起點是一樁私怨。
  巫臣沒有動楚國一兵一卒，做的是替楚國東境造出一個新的敵國——
  仇恨在他手裡轉化成一項持續數十年的安排。
  七十年後吳師入郢、伍子胥鞭平王之屍，源頭正在這裡；
  再往後吳越爭霸、句踐滅吳，整條線索都由這一次出使拉開。
