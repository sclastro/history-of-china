reliability: 信史
significance: >-
  春秋後期最重要的一次地緣改造，起點卻是一樁私怨。巫臣沒有動楚國一兵一卒，
  而是替楚國東邊造出一個新的敵國，把仇恨轉成一項持續數十年的安排。七十多年後吳師攻入郢都，
  再往後吳越爭霸、句踐滅吳，整條線索都由這一次出使拉開。
