id: su-qin-he-zong
name: 蘇秦合縱
year: -333
year_note: 年份據《史記》，出土帛書所記與此大異
period: zhan-guo-mid
type: 外交
states: [zhou, qin, zhao, yan]
people: [su-qin]
narrative: >-
  蘇秦初以連橫說秦惠王曰「秦四塞之國……可以并諸侯、吞天下、稱帝而治」（白話：秦國四面有天
  險為屏障……可以兼併諸侯、吞併天下，稱帝而治理天下），書十上而說不行。黑貂之裘敝，黃金百
  斤盡，資用乏絕，去秦而歸——羸縢履蹻、負書擔橐，形容枯槁、面目犁黑。

  至家，妻不下紝，嫂不為炊，父母不與言。蘇秦喟歎曰：「妻不以我為夫，嫂不以我為叔，父母不以
  我為子，是皆秦之罪也。」（白話：妻子不把我當丈夫，嫂子不把我當小叔，父母不把我當兒子——
  這都是秦國造成的過錯。）乃夜發書、陳篋數十，得太公《陰符》之謀，伏而誦之，簡練以為揣摩。
  讀書欲睡，引錐自刺其股，血流至足，曰：「安有說人主不能出其金玉錦繡、取卿相之尊者乎？」（
  白話：哪有遊說君主而不能讓他拿出金玉錦繡、換得卿相尊位的道理？）

  期年揣摩成，乃以合縱說燕、趙、韓、魏、齊、楚六國，約從散橫以抑強秦，佩六國相印。

  將說楚王，路過洛陽。父母聞之，清宮除道、張樂設飲，郊迎三十里。妻側目而視、傾耳而聽；嫂蛇
  行匍伏、四拜自跪而謝。蘇秦曰：「嫂何前倨而後卑也？」嫂曰：「以季子之位尊而多金。」蘇秦曰
  ：「嗟乎！貧窮則父母不子，富貴則親戚畏懼。人生世上，勢位富貴，蓋可忽乎哉！」（白話：唉！
  貧窮的時候父母不把你當兒子，富貴的時候親戚都畏懼你。人活在世上，權勢地位與富貴，怎麼可以
  輕忽呢！）
sources:
  - source: zhan-guo-ce
    locus: 秦策一
    ctext_urn: ctp:zhan-guo-ce/qin-yi
  - source: shiji
    locus: 蘇秦列傳
    ctext_urn: ctp:shiji/su-qin-lie-zhuan
reliability: 孤證
variants:
  - claim: >-
      馬王堆帛書《戰國縱橫家書》所記蘇秦事跡與《史記》《戰國策》大異：
      蘇秦活動年代晚於張儀約三十年，主要事跡在燕齊之間為燕行反間，
      「佩六國相印」「與張儀同時對抗」皆為戰國末縱橫家所增飾。
    source: mawangdui-zongheng
    locus: 第四至十六章
significance: >-
  這段記載的史實成分極可疑，但它作為**戰國士人心態的標本**無可替代：
  一個沒有出身、沒有封地的人，唯一的資本是口舌與謀略；
  成敗之間，連父母妻嫂的態度都完全翻轉。
  蘇秦最後那句感慨不是抱怨，是他對世界運作方式的結論——
  而這個結論，正是縱橫家全部行為的心理基礎。
