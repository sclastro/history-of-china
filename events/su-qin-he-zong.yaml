reliability: 孤證
variants:
  - claim: >-
      馬王堆帛書《戰國縱橫家書》所記蘇秦事跡與《史記》《戰國策》大異：
      蘇秦活動年代晚於張儀約三十年，主要事跡在燕齊之間為燕國行反間；
      「佩六國相印」、與張儀同時對抗等情節，多為戰國末縱橫家所增飾。
    source: mawangdui-zongheng
    locus: 第四至十六章
significance: >-
  這段記載的史實成分很可疑，但作為戰國士人心態的標本無可替代：一個沒有出身、沒有封地的人，
  唯一的本錢是口舌與謀略，成敗之間，連父母妻嫂的態度都完全翻轉。蘇秦最後那句感慨不是抱怨，
  而是他對世情的結論，也正是縱橫家一切行動的心理基礎。
