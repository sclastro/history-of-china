id: su-qin-he-zong
name: 蘇秦合縱
year: -333
year_note: 年代據《史記》；《戰國縱橫家書》所記不同，見異說
period: zhan-guo-mid
type: 外交
states: [zhou, qin, zhao, yan]
people: [su-qin]
narrative: >-
  據《戰國策》記載，東周洛陽人蘇秦起初主張連橫，去遊說秦惠王，說秦國四面有天險、物產豐饒、
  兵力強盛，可以兼併諸侯、吞併天下，稱帝而治。惠王推說時機未到，沒有採納。蘇秦前後上書十次，
  主張始終不被接受。他的黑貂皮衣穿破了，帶來的百斤黃金也花光了，只好離開秦國回家。
  他綁著綁腿、穿著草鞋，背著書、挑著行囊，形容憔悴，臉色黑黃，滿面羞愧。

  回到家裡，妻子不肯從織布機上下來，嫂子不肯替他做飯，父母也不跟他說話。蘇秦長歎說，
  妻子不把他當丈夫，嫂子不把他當小叔，父母不把他當兒子，這都是他自己的過錯。於是他連夜翻書，
  攤開幾十個書箱，找到一部託名姜太公的兵書《陰符》，伏案誦讀，反覆揣摩。讀到想睡時，
  就拿錐子刺自己的大腿，血一直流到腳上。他說，哪有遊說君主而不能讓對方拿出金玉錦繡、
  換得卿相高位的道理？

  一年之後，他揣摩有成，轉而主張合縱。《戰國策》說他先到趙國遊說趙王，趙王大為高興，
  封他為武安君，授予相印，又給他戰車百輛、錦繡千匹、白璧百對、黃金萬鎰，讓他去聯合各國、
  拆散連橫，共同抑制強秦。《史記》則說他聯合燕、趙、韓、魏、齊、楚六國，做了合縱的盟長，
  同時兼任六國的相國。

  後來他要去遊說楚王，途經洛陽。父母聽到消息，打掃房屋、清理道路，安排音樂、擺設酒席，
  到城外三十里迎接；妻子不敢正眼看他，側著耳朵聽他說話；嫂子像蛇一樣伏在地上爬行，
  跪拜四次謝罪。蘇秦問嫂子，為甚麼從前那樣傲慢，如今卻這樣謙卑？嫂子回答，因為小叔地位尊貴、
  錢財又多。蘇秦感歎：人在貧窮時，父母都不當他是兒子；富貴了，親戚都畏懼他。
  人生在世，權勢、地位和富貴，怎麼可以忽視呢！成語「前倨後恭」即由此而來。
original:
  - locus: 秦策一
    quote: >-
      說秦王書十上而說不行。黑貂之裘弊，黃金百斤盡，資用乏絕，去秦而歸。羸縢履蹻，負書擔橐，
      形容枯槁，面目犂黑，狀有歸色。歸至家，妻不下紝，嫂不為炊，父母不與言。
    translation: >-
      蘇秦向秦王上書十次，主張始終不被接受。黑貂皮衣穿破了，百斤黃金花光了，用度斷絕，
      只好離開秦國回家。他綁著綁腿、穿著草鞋，背著書、挑著行囊，形容憔悴，臉色黑黃，滿面羞愧。
      回到家裡，妻子不肯從織布機上下來，嫂子不肯替他做飯，父母也不跟他說話。
  - locus: 秦策一
    quote: >-
      讀書欲睡，引錐自刺其股，血流至足。曰：「安有說人主不能出其金玉錦繡，取卿相之尊者乎？」
    translation: >-
      讀書讀到想睡時，就拿錐子刺自己的大腿，血一直流到腳上。他說：「哪有遊說君主，
      卻不能讓對方拿出金玉錦繡、換得卿相高位的道理？」
  - speaker: 蘇秦與其嫂
    locus: 秦策一
    quote: >-
      蘇秦曰：「嫂，何前倨而後卑也？」嫂曰：「以季子之位尊而多金。」蘇秦曰：「嗟乎！
      貧窮則父母不子，富貴則親戚畏懼。人生世上，勢位富貴，蓋可忽乎哉！」
    translation: >-
      蘇秦說：「嫂嫂，為甚麼從前那樣傲慢，如今卻這樣謙卑？」嫂子說：「因為小叔你地位尊貴，
      錢財又多。」蘇秦說：「唉！貧窮時父母都不當你是兒子，富貴了親戚都畏懼你。人生在世，
      權勢、地位和富貴，怎麼可以忽視呢！」
  - source: shiji
    locus: 蘇秦列傳
    quote: >-
      蘇秦笑謂其嫂曰：「何前倨而後恭也？」嫂委蛇蒲服，以面掩地而謝曰：「見季子位高金多也。」
    translation: >-
      蘇秦笑著對嫂子說：「為甚麼從前那樣傲慢，如今卻這樣恭敬？」嫂子彎著身子伏在地上，
      把臉貼著地面謝罪說：「因為看到小叔地位高、錢財多。」
