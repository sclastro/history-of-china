reliability: 大體可信
significance: >-
  「病入膏肓」是先秦文獻中最著名的一次不治判斷。它的分量不在絕望，而在於醫緩把理由講得非常具體：
  「攻之不可，達之不及，藥不至焉」（白話：用灸攻不到，用針達不了，藥力也送不進去），
  三條路都堵死，所以無法可治——這是一段技術性的論證，不是感嘆。至於夢境、巫言與結局一一應驗的寫法，
  則是《左傳》慣用的敘事手法，把一次醫學判斷連同君王之死，都包裝成天意的印證。
