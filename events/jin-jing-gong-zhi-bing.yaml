id: jin-jing-gong-zhi-bing
name: 晉景公之病
year: -581
year_note: 魯成公十年
period: wu-ba
type: 論政
states: [jin, qin]
people: [jin-jing-gong, yi-huan]
narrative: >-
  前 581 年（魯成公十年），晉景公病重。他先做了一個惡夢，夢見一個披頭散髮、頭髮拖到地上的大鬼，
  捶胸頓足闖進宮來，說景公殺了他的子孫，不合道義，如今已得天帝允准前來索命。景公嚇得躲進內室。
  醒來後，他召來桑田的巫者；巫者說出的情形跟夢境一樣。景公問自己會怎樣，巫者說：您吃不到今年的新麥了。

  景公病勢越來越重，就派人到秦國求醫，秦桓公派了名醫醫緩前來。

  醫緩還沒到，景公又做了一個夢，夢見自己的病變成兩個小孩。一個說：那是個高明的醫生，我怕他傷到我們，
  該往哪裡躲呢？另一個說：我們躲到肓的上面、膏的下面，他就拿我們沒辦法了。（肓指心臟與橫膈膜之間，
  膏指心下的脂肪，都是針灸和藥力難以到達的部位。）

  醫緩到後，替景公診視，說這病已經治不好了：病灶在肓的上面、膏的下面，用灸攻不到，用針達不了，
  藥力也送不進去，實在無能為力。他所說的部位，跟景公夢中兩個小孩藏身的地方一字不差。景公聽了，
  稱讚醫緩是良醫，重重酬謝，送他回秦國。這就是成語「病入膏肓」的由來。

  到了六月，景公想嘗新收的麥子，命人進獻，叫廚師做好。他還把桑田巫召來，把新麥給他看，然後把他殺了，
  藉此表明他的預言落空。可是還沒吃上一口，景公忽然腹脹，去上廁所，竟跌進廁中而死——始終沒能吃到新麥。
original:
  - speaker: 晉景公與桑田巫
    locus: 成公十年
    quote: >-
      晉侯夢大厲，被髮及地，搏膺而踊，曰：「殺余孫，不義。余得請於帝矣！」壞大門及寢門而入。
      公懼，入于室。又壞戶。公覺，召桑田巫。巫言如夢。公曰：「何如？」曰：「不食新矣。」
    translation: >-
      晉景公夢見一個披頭散髮、頭髮拖到地上的大鬼，捶著胸膛跳躍，說：「你殺了我的子孫，不合道義。
      我已經向天帝請准來索命了！」大鬼撞破宮門和寢室的門闖進來，景公害怕，躲進內室，大鬼又撞破房門。
      景公驚醒，召來桑田的巫者。巫者說的情形跟夢裡一樣。景公問：「會怎麼樣？」巫者說：「您吃不到今年的新麥了。」
  - locus: 成公十年
    quote: >-
      未至，公夢疾為二豎子，曰：「彼良醫也，懼傷我，焉逃之？」其一曰：「居肓之上，膏之下，若我何？」
    translation: >-
      醫緩還沒到，景公夢見自己的病變成兩個小孩。一個說：「那是個高明的醫生，我怕他傷到我們，往哪裡躲呢？」
      另一個說：「我們躲在肓的上面、膏的下面，他能拿我們怎麼樣？」
  - speaker: 醫緩
    locus: 成公十年
    quote: 疾不可為也。在肓之上，膏之下，攻之不可，達之不及，藥不至焉，不可為也。
    translation: >-
      這病治不好了。病灶在肓的上面、膏的下面，用灸攻不到，用針達不了，藥力也送不進去，實在沒有辦法。
  - speaker: 晉景公
    locus: 成公十年
    quote: 良醫也。厚為之禮而歸之。
    translation: 景公說：真是個好醫生。於是重重酬謝醫緩，送他回秦國。
  - locus: 成公十年
    quote: 六月丙午，晉侯欲麥，使甸人獻麥，饋人為之。召桑田巫，示而殺之。將食，張，如廁，陷而卒。
    translation: >-
      六月丙午這天，晉景公想吃新麥，命甸人獻上新麥，叫廚師做好。他又把桑田巫召來，把新麥給他看，
      然後把他殺了。正要吃的時候，肚子發脹，去上廁所，跌進廁中而死。
sources:
