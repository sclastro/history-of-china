id: jin-jing-gong-zhi-bing
name: 晉景公之病
year: -581
year_note: 魯成公十年
period: wu-ba
type: 論政
states: [jin, qin]
people: [jin-jing-gong, yi-huan]
narrative: >-
  晉景公病重，到秦國求醫，秦桓公派醫緩前往。

  醫緩還沒到，景公夢見自己的病變成兩個小孩。一個說：「彼良醫也，懼傷我，焉逃之？」
  （白話：那是個良醫，我怕他傷到我們，往哪裡躲呢？）另一個說：「居肓之上、膏之下，若我何？」
  （白話：躲到肓的上面、膏的下面，他能拿我們怎麼辦？）

  醫緩到後診視，說：「疾不可為也，在肓之上、膏之下，攻之不可，達之不及，藥不至焉，
  不可為也。」（白話：這病治不了了。它在肓的上面、膏的下面，用灸攻不到，用針達不了，
  藥力也到不了，沒有辦法了。）——所說與夢中一字不差。

  景公說：「良醫也。」厚禮送他回秦國。

  六月，景公想嘗新麥，命人獻上；正要吃時腹脹，如廁而墜入廁中，死。
sources:
  - source: zuo-zhuan
    locus: 成公十年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/cheng-gong-shi-nian
reliability: 大體可信
significance: >-
  「病入膏肓」是先秦最早的一次「不可治」判斷，
  而它的分量不在絕望，在於醫緩把理由講得極具體：
  攻不到、達不及、藥不至——三條路都堵死，所以無法可施。
  這是一段技術性論證，不是感嘆。
  夢與診斷一字不差的寫法，則是《左傳》慣用的敘事手法，
  把一次醫學判斷包裝成天意的印證。
