id: su-dai-shui-zhao
name: 蘇代說趙惠王
year: -270
year_note: 年代不詳；事在趙惠文王時
period: zhan-guo-late
type: 外交
states: [zhao, yan, qin]
people: [su-dai]
narrative: >-
  趙國將要攻打燕國。蘇代替燕國去見趙惠文王，說：

  「今者臣來，過易水，蚌方出曝而鷸啄其肉，蚌合而箝其喙。
  鷸曰『今日不雨，明日不雨，即有死蚌』；蚌亦謂鷸曰『今日不出，明日不出，即有死鷸』。
  兩者不肯相舍，漁者得而并禽之。今趙且伐燕，燕趙久相支以敝大眾，
  臣恐強秦之為漁父也。」
  （白話：今天臣來的時候，經過易水，看見河蚌正出來曬太陽，鷸鳥去啄牠的肉，
  河蚌合起殼夾住鷸的嘴。鷸說：今天不下雨、明天不下雨，就有一隻死蚌；
  河蚌也對鷸說：今天不放開、明天不放開，就有一隻死鷸。兩個都不肯放手，
  漁夫就把牠們一併捉走了。如今趙國要攻打燕國，燕趙長久相持而使兩國百姓疲敝，
  臣恐怕強大的秦國就是那個漁夫。）

  惠王說「善」，於是停止出兵。
sources:
  - source: zhan-guo-ce
    locus: 燕策二
    ctext_urn: ctp:zhan-guo-ce/yan-ce-er
reliability: 孤證
significance: >-
  戰國外交中「第三方得利」邏輯最精煉的一次表述。
  蘇代的說法有一個關鍵設計：他沒有替燕國喊冤，也沒有說趙國打不贏，
  而是把秦國引進畫面。爭執的雙方一旦意識到還有第三者在旁邊等，
  勝負的意義就變了——贏也是輸。
  這與燭之武拆秦晉聯盟是同一路數：改變當事人對局勢的計算邊界。
