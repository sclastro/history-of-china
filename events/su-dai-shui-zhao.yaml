id: su-dai-shui-zhao
name: 蘇代說趙惠王
year: -270
year_note: 年代不詳；事在趙惠文王時
period: zhan-guo-late
type: 外交
states: [zhao, yan, qin]
people: [su-dai]
narrative: >-
  趙國準備攻打燕國。蘇代替燕國去見趙惠文王，沒有替燕國求情，也沒有說趙國打不贏，
  只講了他來的路上看見的一件事。

  他說，經過易水時，看見一隻河蚌正張開殼曬太陽，一隻鷸鳥飛來啄牠的肉，河蚌立刻合上殼，
  夾住了鷸鳥的嘴。鷸鳥說：今天不下雨，明天不下雨，就會有一隻死蚌。河蚌也對鷸鳥說：
  今天不放你，明天不放你，就會有一隻死鷸。兩者都不肯放手，結果一個漁夫走過來，
  把牠們一起捉走了。

  蘇代接著說：如今趙國要攻打燕國，燕趙兩國長期相持，兩國百姓都會疲憊不堪，
  他擔心強大的秦國就會成為那個漁夫，希望惠文王仔細考慮。

  趙惠文王說好，於是停止出兵。後世從這個故事概括出成語「鷸蚌相爭」，常與「漁翁得利」連用。
original:
  - speaker: 蘇代
    locus: 燕策二
    quote: >-
      今者臣來，過易水，蚌方出曝，而鷸啄其肉，蚌合而拑其喙。鷸曰：「今日不雨，明日不雨，
      即有死蚌。」蚌亦謂鷸曰：「今日不出，明日不出，即有死鷸。」兩者不肯相舍，漁者得而并禽之。
    translation: >-
      今天臣來的路上，經過易水，看見一隻河蚌正出來曬太陽，鷸鳥去啄牠的肉，河蚌合上殼，
      夾住了鷸鳥的嘴。鷸鳥說：「今天不下雨，明天不下雨，就會有一隻死蚌。」河蚌也對鷸鳥說：
      「今天不放你出去，明天不放你出去，就會有一隻死鷸。」兩者都不肯放手，漁夫走過來，
      把牠們一起捉走了。
  - speaker: 蘇代
    locus: 燕策二
    quote: >-
      今趙且伐燕，燕、趙久相支，以弊大眾，臣恐強秦之為漁父也。故願王之熟計之也。
    translation: >-
      如今趙國要攻打燕國，燕趙兩國長期相持，使兩國百姓疲憊不堪，臣擔心強大的秦國就是那個漁夫。
      所以希望大王仔細考慮。
  - locus: 燕策二
    quote: >-
      惠王曰：「善。」乃止。
    translation: >-
      趙惠文王說：「好。」於是停止出兵。
sources:
  - source: zhan-guo-ce
    locus: 燕策二
    ctext_urn: ctp:zhan-guo-ce/yan-er
reliability: 孤證
significance: >-
  戰國外交中第三方得利這個邏輯最精煉的一次表述。蘇代不爭辯燕趙誰有理，只把秦國放進趙王的計算裡：
  爭執的雙方一旦意識到旁邊還有第三者在等，勝負的意義就變了，贏了也是輸。
  這與燭之武說退秦師是同一路數，改變的不是事實，而是當事人計算得失的範圍。
