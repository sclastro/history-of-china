id: chen-zhen-shui-zhao-yang
name: 陳軫說昭陽
year: -323
year_note: 楚敗魏於襄陵之後
period: zhan-guo-mid
type: 外交
states: [chu, qi, wei]
people: [chen-zhen]
narrative: >-
  前 323 年，楚國大將昭陽率軍攻打魏國，大敗魏軍、殺了魏將，一連奪得八座城。
  接著他又調動軍隊，轉而準備攻打齊國。齊王十分擔心，派陳軫前去遊說昭陽退兵。

  陳軫見到昭陽，先行禮祝賀他打了勝仗，然後站起來發問。他問：按楚國的制度，
  擊破敵軍、殺死敵將的人，能得到甚麼官爵？昭陽回答：官可以做到上柱國，
  爵可以封到上執珪。上柱國是楚國武官的最高一級，上執珪則是最高的爵位。
  陳軫又問：還有比這更尊貴的嗎？昭陽說：只有令尹了。令尹是楚國最高的行政長官，
  相當於別國的宰相。

  陳軫於是說：令尹確實尊貴，可是楚王不會同時設立兩個令尹。他的意思是：
  昭陽已經升到武將的最高一級，令尹之位又只有一個，就算再打勝仗，也沒有更高的官位可以加給他了。

  接著陳軫講了一個故事。楚國有個主持祭祀的人，把一壺祭酒賞給手下的門客。
  門客們商量：這壺酒幾個人一起喝不夠，一個人喝卻有餘，不如各自在地上畫蛇，
  誰先畫成就誰喝。一個人最先畫好，左手端起酒壺，右手還在畫，說自己還能替蛇添上腳。
  他腳還沒畫完，另一個人的蛇已經畫成，那人奪過酒壺，說蛇本來就沒有腳，
  你怎麼能替牠添腳，就把酒喝了。替蛇添腳的人，最後反而失掉了到手的酒。
  這就是成語「畫蛇添足」的由來。

  陳軫把話說回昭陽身上：您為楚國出兵攻打魏國，破軍殺將、拿下八座城，
  齊國已經十分怕您，單憑這一仗立下的名聲就足夠了；官位上面再沒有能往上加的了。
  打仗百戰百勝卻不知道適可而止的人，最後只會落得身死，爵位還要旁落到別人手裡——
  這正跟給蛇添腳一樣。

  昭陽覺得他說得對，於是撤軍離去。
original:
  - locus: 齊策二
    quote: 昭陽為楚伐魏，覆軍殺將得八城，移兵而攻齊。
    translation: 昭陽為楚國攻打魏國，殲滅魏軍、殺死魏將，奪得八座城，接著又調動軍隊去攻打齊國。
  - speaker: 陳軫、昭陽
    locus: 齊策二
    quote: >-
      陳軫為齊王使，見昭陽，再拜賀戰勝，起而問：「楚之法，覆軍殺將，其官爵何也？」
      昭陽曰：「官為上柱國，爵為上執珪。」陳軫曰：「異貴於此者何也？」曰：「唯令尹耳。」
    translation: >-
      陳軫替齊王出使，見到昭陽，先行禮祝賀他打了勝仗，然後站起來問：
      「按楚國的制度，殲滅敵軍、殺死敵將的人，能得到甚麼官爵？」昭陽說：
      「官做到上柱國，爵封到上執珪。」陳軫再問：「還有比這更尊貴的嗎？」
      昭陽說：「只有令尹了。」
  - speaker: 陳軫
    locus: 齊策二
    quote: 令尹貴矣！王非置兩令尹也，臣竊為公譬可也。
    translation: >-
      令尹確實尊貴，可是楚王不會同時設立兩個令尹。請容我替您打個比方。
  - speaker: 陳軫
    locus: 齊策二
    quote: >-
      楚有祠者，賜其舍人卮酒。舍人相謂曰：「數人飲之不足，一人飲之有餘。請畫地為蛇，先成者飲酒。」
      一人蛇先成，引酒且飲之，乃左手持卮，右手畫蛇曰：「吾能為之足。」未成，一人之蛇成，
      奪其卮曰：「蛇固無足，子安能為之足？」遂飲其酒。為蛇足者，終亡其酒。
    translation: >-
      楚國有個主持祭祀的人，把一壺酒賞給手下的門客。門客們互相商量：
      「這壺酒幾個人喝不夠，一個人喝卻有餘。不如各自在地上畫蛇，誰先畫成就誰喝。」
      一個人最先畫好，端起酒壺正要喝，卻左手拿著酒壺、右手繼續畫，說：
      「我還能替牠添上腳。」腳還沒畫完，另一個人的蛇已經畫成，那人奪過酒壺說：
      「蛇本來就沒有腳，你怎麼能替牠添腳？」就把酒喝了。替蛇添腳的人，最後反而失掉了那壺酒。
  - speaker: 陳軫
    locus: 齊策二
    quote: >-
      今君相楚而攻魏，破軍殺將得八城，不弱兵，欲攻齊，齊畏公甚，公以是為名居足矣，
      官之上非可重也。戰無不勝而不知止者，身且死，爵且後歸，猶為蛇足也。
    translation: >-
      如今您為楚國出兵攻打魏國，破軍殺將、拿下八座城，兵力毫無損耗，卻還想去攻打齊國。
      齊國已經十分怕您，單憑這一仗的名聲就足夠了，官位上面再沒有能往上加的了。
      打仗百戰百勝卻不知道適可而止的人，最後只會落得身死，爵位還要旁落到別人手裡——
      這正跟給蛇添腳一樣。
  - locus: 齊策二
    quote: 昭陽以為然，解軍而去。
    translation: 昭陽覺得他說得對，於是撤軍離去。
sources:
  - source: zhan-guo-ce
    locus: 齊策二
    ctext_urn: ctp:zhan-guo-ce/qi-ce-er
reliability: 大體可信
significance: >-
  陳軫的說服分兩步，缺一不可。第一步是算帳：他問清楚楚國的官制，證明昭陽再打勝仗也沒有更高的職位可拿——
  收益已經封頂，風險卻還在累加。第二步才是寓言：「畫蛇添足」把收益封頂還繼續投入這件事，變成一個看得見的畫面。
  陳軫一句「戰無不勝而不知止者，身且死」（白話：百戰百勝卻不知道收手的人，最後只會送命），
  正是這番算計的結論。先把利害算清楚，再給對方一個記得住的圖像，這是戰國說客的標準工序。
