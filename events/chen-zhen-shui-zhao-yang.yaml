id: chen-zhen-shui-zhao-yang
name: 陳軫說昭陽
year: -323
year_note: 楚敗魏於襄陵之後
period: zhan-guo-mid
type: 外交
states: [chu, qi, wei]
people: [chen-zhen]
narrative: >-
  楚將昭陽已經打敗魏軍、殺了魏將、奪得八座城，又轉移兵力去攻打齊國。
  齊王派陳軫前去遊說他。

  陳軫先問楚國的官制：擊破敵軍、殺死敵將的封什麼官？回答是上柱國。
  上柱國之上還有什麼官？回答是只有令尹了。陳軫說：令尹已經是最高的了，
  您現在就是令尹，再打贏也加不上去。

  然後他講了一個故事：楚國有個主祭的人，賞給門客一壺酒。
  門客商量：幾個人喝不夠，一個人喝有餘，不如各自在地上畫蛇，先畫成的人喝。
  一個人先畫成了，左手端著酒壺、右手繼續畫蛇說「吾能為之足」
  （白話：我還能給牠添上腳）；還沒畫完，別人的蛇已經畫成，
  把酒壺奪過去說「蛇固無足，子安能為之足」
  （白話：蛇本來就沒有腳，你怎麼能給牠添腳），就把酒喝了。

  「今君相楚而攻魏，破軍殺將得八城……又移兵欲攻齊，戰無不勝而不知止者，
  身且死，爵且後歸，猶為蛇足也。」
  （白話：如今您身為楚國宰相而攻打魏國，破軍殺將、拿下八座城……
  又轉移兵力想去攻齊。打仗百戰百勝卻不知道適可而止的人，最後會身死名裂，
  爵位還要落到別人後頭——這就跟給蛇添腳一樣。）

  昭陽於是撤兵離去。
sources:
  - source: zhan-guo-ce
    locus: 齊策二
    ctext_urn: ctp:zhan-guo-ce/qi-ce-er
reliability: 大體可信
significance: >-
  陳軫的說服分兩步，缺一不可。
  第一步是算帳：問清楚官制，證明再打贏也沒有更高的職位可拿——
  收益已經封頂，風險卻還在累加。
  第二步才是寓言：畫蛇添足把「收益封頂而繼續投入」這件事具象化。
  先算清楚，再給一個記得住的圖像，這是戰國說客的標準工序。
