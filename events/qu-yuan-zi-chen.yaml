id: qu-yuan-zi-chen
name: 屈原自沉
year: -278
year_note: 秦拔郢之年
period: zhan-guo-late
type: 內亂
states: [chu, qin]
people: [qu-yuan, chu-xiang-wang]
narrative: >-
  屈原名平，是楚國王族的同姓，擔任楚懷王的左徒。他見聞廣博，記憶力強，熟悉治亂的道理，
  又擅長外交辭令，深得懷王信任。同列的上官大夫與他爭寵，妒忌他的才能。懷王讓屈原起草法令，
  草稿還沒定下，上官大夫想拿去看，屈原不給。上官大夫便向懷王進讒言，說屈原每擬好一道法令，
  就自誇功勞，聲稱除了他沒人做得到。懷王大怒，從此疏遠屈原。屈原憂愁苦悶，寫下〈離騷〉。

  後來懷王受秦國張儀欺騙，與齊國斷交，接連戰敗，喪失土地。秦國又邀懷王會面，懷王的小兒子
  子蘭勸他前往。懷王入秦後被扣留，最終死在秦國。長子頃襄王即位，任命子蘭為令尹。
  子蘭得知屈原怨恨自己，大為憤怒，指使上官大夫在頃襄王面前說屈原的壞話，頃襄王於是把屈原放逐。

  屈原來到江邊，披頭散髮，一邊走一邊吟詠，面容憔悴，身形枯瘦。一位漁父問他：您不是三閭大夫嗎？
  怎麼落到這個地步？屈原回答：整個世界都混濁，只有他清白；眾人都醉了，只有他清醒，所以被放逐。
  這就是成語「眾醉獨醒」的由來。漁父勸他：聖人不拘泥於外物，能隨著世道變通。既然世人都混濁，
  何不順著潮流推波助瀾？既然眾人都醉了，何不也吃點酒糟、喝點薄酒？何必堅守美德，讓自己落得被放逐？
  屈原說：剛洗過頭的人，一定要彈去帽上的灰塵；剛洗過澡的人，一定要抖淨衣上的塵土。
  誰能讓清白的身子沾上污垢？他寧可投江，葬身魚腹，也不讓潔白的品格蒙受世俗的污濁。
  據《楚辭·漁父》記載，漁父聽罷笑了笑，搖槳離去，唱道：滄浪的水清，可以洗我的帽帶；
  滄浪的水濁，可以洗我的腳。

  屈原寫下〈懷沙〉之後，抱著石頭投汨羅江而死。《史記》沒有記下年份，一般認為事在前 278 年
  秦將白起攻破楚國郢都之後。
original:
  - locus: 屈原賈生列傳
    quote: 信而見疑，忠而被謗，能無怨乎？屈平之作《離騷》，蓋自怨生也。
    translation: >-
      對君主忠信，卻被懷疑、被誹謗，怎能沒有怨恨呢？屈原寫〈離騷〉，大概就是由這份怨恨而來的。
  - locus: 屈原賈生列傳
    quote: 令尹子蘭聞之大怒，卒使上官大夫短屈原於頃襄王，頃襄王怒而遷之。
    translation: >-
      令尹子蘭聽說後大怒，終於指使上官大夫在頃襄王面前說屈原的壞話。頃襄王發怒，把屈原放逐了。
  - speaker: 漁父與屈原
    locus: 屈原賈生列傳
    quote: >-
      漁父見而問之曰：「子非三閭大夫歟？何故而至此？」屈原曰：「舉世混濁而我獨清，
      眾人皆醉而我獨醒，是以見放。」
    translation: >-
      漁父見到他，問道：「您不是三閭大夫嗎？怎麼落到這個地步？」屈原說：「整個世界都混濁，
      只有我清白；眾人都醉了，只有我清醒，所以被放逐。」
  - speaker: 漁父
    locus: 屈原賈生列傳
    quote: >-
      夫聖人者，不凝滯於物而能與世推移。舉世混濁，何不隨其流而揚其波？眾人皆醉，
      何不餔其糟而啜其醨？何故懷瑾握瑜而自令見放為？
    translation: >-
      聖人不拘泥於外物，能隨著世道變通。整個世界都混濁，何不順著潮流推波助瀾？眾人都醉了，
      何不也吃點酒糟、喝點薄酒？為甚麼要懷抱美玉般的品德，讓自己落得被放逐？
  - speaker: 屈原
    locus: 屈原賈生列傳
    quote: >-
      吾聞之，新沐者必彈冠，新浴者必振衣，人又誰能以身之察察，受物之汶汶者乎？
      寧赴常流而葬乎江魚腹中耳，又安能以皓皓之白而蒙世俗之溫蠖乎？
    translation: >-
      我聽說，剛洗過頭的人一定要彈去帽上的灰塵，剛洗過澡的人一定要抖淨衣上的塵土。誰能讓清白的身子
      沾上外物的污垢？我寧可投入長流的江水，葬身魚腹，又怎能讓潔白的品格蒙受世俗的污濁？
sources:
  - source: shiji
    locus: 屈原賈生列傳
    ctext_urn: ctp:shiji/qu-yuan-jia-sheng-lie-zhuan
reliability: 大體可信
significance: >-
  〈漁父〉一篇未必出自屈原之手，多數學者以為是後人所託；但它把兩種處世態度並排放在一起，
  而且沒有判定誰對誰錯——漁父不是反派，他勸屈原與世推移，說的也是一番道理。
  《史記》把屈原與賈誼合傳，司馬遷在篇末說「讀服鳥賦，同死生，輕去就，又爽然自失矣」
  （白話：讀了賈誼的〈鵩鳥賦〉，看到他把生死等同、把去留看輕，我又茫然若失了）——
  他自己也在兩種態度之間搖擺。
