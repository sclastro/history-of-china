id: qu-yuan-zi-chen
name: 屈原自沉
year: -278
year_note: 秦拔郢之年
period: zhan-guo-late
type: 內亂
states: [chu, qin]
people: [qu-yuan, chu-xiang-wang]
narrative: >-
  屈原任楚懷王左徒，主張聯齊抗秦、修明法度，為上官大夫與令尹子蘭所讒，
  被懷王疏遠。懷王受張儀之騙而與齊絕交，喪師失地；
  後又不聽屈原勸阻而赴秦會盟，被扣留，客死於秦。

  頃襄王即位，仍聽子蘭之言，把屈原放逐到江南。

  《楚辭·漁父》記他被放之後，行吟於澤畔，形容枯槁。
  漁父問他為什麼落到這個地步，他答：

  「舉世皆濁我獨清，眾人皆醉我獨醒，是以見放。」
  （白話：整個世上都混濁只有我清白，眾人都醉了只有我清醒，因此被放逐。）

  漁父勸他隨波逐流：世人都濁，何不攪渾泥水、揚起波瀾？
  眾人都醉，何不也吃那酒糟、喝那薄酒？

  屈原說：剛洗過頭的人一定要彈去帽上的灰，剛洗過澡的人一定要抖淨衣上的塵；
  寧可投江葬身魚腹，也不能讓清白之身蒙受世俗的塵垢。

  漁父笑著搖槳離去，唱道：「滄浪之水清兮，可以濯吾纓；
  滄浪之水濁兮，可以濯吾足。」（白話：滄浪的水清啊，可以洗我的帽帶；滄浪的水濁啊，可以洗我的腳。）

  前278年，秦將白起攻破郢都。屈原自沉汨羅江。
sources:
  - source: shiji
    locus: 屈原賈生列傳
    ctext_urn: ctp:shiji/qu-yuan-jia-sheng-lie-zhuan
reliability: 大體可信
significance: >-
  〈漁父〉一篇未必出自屈原之手，多數學者以為是後人所託；
  但它把兩種處世態度並排放在一起，而且沒有判定誰對誰錯——
  漁父不是反派，他最後唱的那兩句還相當通達。
  《史記》把屈原與賈誼合傳，司馬遷的評語是
  「讀〈鵩鳥賦〉，同死生，輕去就，又爽然自失矣」——
  他自己也在兩種態度之間搖擺。
