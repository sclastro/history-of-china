id: kong-zi-du-yi
name: 孔子晚年讀易
year: -484
year_note: 孔子返魯之後
period: chun-qiu-late
type: 著述
states: [lu]
people: [kong-zi]
narrative: >-
  孔子周遊列國十四年，始終沒有得到重用。晚年他返回魯國，不再求取官職，
  專心整理古代文獻，並且教授學生。

  據《史記·孔子世家》記載，孔子晚年喜歡研讀《易》，為〈彖〉〈繫〉〈象〉〈說卦〉〈文言〉等篇作了解說。
  古時書籍寫在竹簡上，用皮繩串連成卷。孔子反覆翻閱《易》，連串連竹簡的皮繩都磨斷了三次，
  這就是成語「韋編三絕」的由來。

  他曾經說，如果上天再多給自己幾年時間，他對《易》就能融會貫通了。

  同一時期，孔子又刪訂《詩》《書》，校正禮樂，並且編修《春秋》。《春秋》上起魯隱公元年，
  下至魯哀公十四年。孔子動筆時，該寫的就寫，該刪的就刪，連擅長文辭的弟子子夏也插不上一句話。
  他的文辭簡約而含意廣博，藉此寄寓對當世人事的褒貶。

  孔子門下學生大約有三千人，其中精通六藝的有七十二人（六藝一說指禮、樂、射、御、書、數，一說指六經）。
original:
  - locus: 孔子世家
    quote: 孔子晚而喜《易》，序彖、繫、象、說卦、文言。讀《易》，韋編三絕。
    translation: >-
      孔子晚年喜歡研讀《易》，為〈彖〉〈繫〉〈象〉〈說卦〉〈文言〉等篇作了解說。
      他反覆翻閱《易》，串連竹簡的皮繩磨斷了三次。
  - speaker: 孔子
    locus: 孔子世家
    quote: 假我數年，若是，我於《易》則彬彬矣。
    translation: 再多給我幾年時間，這樣的話，我對《易》就能融會貫通了。
  - locus: 孔子世家
    quote: 至於為春秋，筆則筆，削則削，子夏之徒不能贊一辭。
    translation: >-
      到了編寫《春秋》，該寫下的就寫下，該刪去的就刪去，連子夏那一班擅長文辭的學生，
      也插不上一句話。
  - locus: 孔子世家
    quote: 孔子以詩書禮樂教，弟子蓋三千焉，身通六藝者七十有二人。
    translation: >-
      孔子用《詩》《書》和禮樂教導學生，門下學生大約三千人，其中精通六藝的有七十二人。
sources:
  - source: shiji
    locus: 孔子世家
    ctext_urn: ctp:shiji/kong-zi-shi-jia
reliability: 大體可信
significance: >-
  「韋編三絕」是先秦文獻中最具體的一則反覆研讀的記錄。它不是一個形容詞，
  而是竹簡時代的實情：串連竹簡的皮繩磨斷三次，等於整卷書被翻到散開三次。
  更值得一記的是「假我數年，若是，我於《易》則彬彬矣」（白話：再多給我幾年時間，
  我對《易》就能融會貫通了）——一個被後世尊為聖人的人，晚年竟說自己對《易》還沒有通達。
