id: kong-zi-du-yi
name: 孔子晚年讀易
year: -484
year_note: 孔子返魯之後
period: chun-qiu-late
type: 著述
states: [lu]
people: [kong-zi]
narrative: >-
  孔子周遊列國十四年而不見用，晚年返回魯國，不再求仕，專力於整理文獻與教學。

  《史記·孔子世家》記他晚年喜好《易》，為〈彖〉〈繫〉〈象〉〈說卦〉〈文言〉作解，
  「讀《易》，韋編三絕」——串連竹簡的皮繩斷了三次。

  他自己說：「假我數年，若是，我於《易》則彬彬矣。」
  （白話：再給我幾年時間，這樣的話，我對《易》就能通達了。）

  同期他刪定《詩》《書》、訂正禮樂、修《春秋》。
  《春秋》上起魯隱公元年、下至魯哀公十四年獲麟，
  「約其辭文，去其煩重，以制義法」（白話：精簡文辭、刪去繁複重出的部分，用來確立褒貶的法度），成為後世編年史的準則。

  弟子三千人，身通六藝者七十二人。
sources:
  - source: shiji
    locus: 孔子世家
    ctext_urn: ctp:shiji/kong-zi-shi-jia
reliability: 大體可信
significance: >-
  「韋編三絕」是先秦文獻中最具體的一次「反覆研讀」的記錄——
  它不是形容詞，是竹簡時代的物理事實：
  皮繩磨斷三次，意味著整卷書被翻閱到散架三次。
  值得一記的是「假我數年」那句：一個被後世奉為聖人的人，
  在晚年說自己對《易》還沒有通達。
