id: guan-zhong-xiang-qi
name: 管仲相齊
year: -685
year_note: 齊桓公元年
period: wu-ba
type: 拜相
states: [qi]
people: [qi-huan-gong, guan-zhong, bao-shu-ya]
narrative: >-
  齊襄公無道，公子糾奔魯、公子小白奔莒。襄公見弒，二公子爭國。管仲事糾，射小白中帶鉤；小白
  詐死，兼程先入而立，是為桓公。桓公使魯殺公子糾，而請生得管仲以自快——實則欲用之。

  鮑叔牙辭相位曰：「君將治齊，即高傒與叔牙足也。君且欲霸王，非管夷吾不可。」（白話：您如果
  只想把齊國治好，有我和高傒就夠了；您如果要成就霸業，非管夷吾不可。）桓公乃赦射鉤之仇，齋
  戒三日，郊迎而相之。

  管仲相齊四十年：叁其國而伍其鄙，士農工商分居定業；設輕重九府，通魚鹽之利，以官山海為財政
  之本；作內政而寄軍令，使軍賦出於鄉里之編組。對外則倡「尊王攘夷」——存邢救衛、伐楚責包茅
  、召陵之盟、葵丘之會。

  管仲曰：「倉廩實而知禮節，衣食足而知榮辱。」（白話：糧倉充實了，人才懂得禮節；衣食足夠了
  ，人才顧得上榮辱。）又曰：「生我者父母，知我者鮑子也。」（白話：生我的是父母，真正了解我
  的是鮑叔。）
sources:
