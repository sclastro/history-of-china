reliability: 大體可信
significance: >-
  霸主政治的制度起點。管仲所做的不是恢復周禮，而是在周禮的名義下
  建立一套新的動員體系——編戶、軍賦、專賣。此後兩百年的霸業，
  無論齊晉，其骨架都是這一套。孔子雖譏其「器小」，
  仍說「微管仲，吾其被髮左衽矣」（白話：要不是有管仲，我們早就披頭散髮、衣襟左開，淪為夷狄了）。
