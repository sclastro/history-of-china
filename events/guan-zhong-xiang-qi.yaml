id: guan-zhong-xiang-qi
name: 管仲相齊
year: -685
year_note: 齊桓公元年
period: wu-ba
type: 拜相
states: [qi]
people: [qi-huan-gong, guan-zhong, bao-shu-ya]
narrative: >-
  齊襄公在位時荒淫無道，兩位公子為了避禍出逃：公子糾逃到魯國，公子小白逃到莒國。後來齊襄公被
  殺，齊國一時無君，兩位公子都想搶回國內即位。管仲當時輔佐公子糾，在半路上射了小白一箭，正好
  射中他束腰皮帶上的鉤。小白假裝中箭身亡，騙過了對方，然後日夜兼程搶先回到齊國即位，這就是齊
  桓公。桓公即位後，要求魯國殺掉公子糾，又提出要活捉管仲，說要親手報那一箭之仇——其實是想重
  用他。

  鮑叔牙推辭相位，反過來向桓公推薦管仲。他說：桓公如果只想把齊國治理好，有他和大夫高傒就夠了；
  桓公如果要成就霸業，那就非用管仲不可。桓公於是不再計較射中帶鉤的仇怨，齋戒三天，親自到城郊
  迎接管仲，任命他為相。

  管仲治理齊國四十年。內政方面，他把國都劃成三部分、郊野劃成五部分，讓士、農、工、商各自聚居、
  各守本業；講求調節物價與財貨的輕重之術，發展魚鹽貿易，把山林海澤的資源收歸官府經營，作為國家
  財政的根本；又把軍事編制寄託在鄉里的戶籍組織裡，使兵員和軍費都出自這套編組。
  對外，他打出尊王攘夷的旗號：保存邢國、救援衛國，討伐楚國、責問它不向周天子進
  貢祭祀濾酒用的包茅，促成召陵的盟會和葵丘的會盟。

  管仲施政有一個基本信念：百姓先要吃飽穿暖，才顧得上禮節與榮辱，所以他把充實民生放在教化之前。
  他一生也念念不忘鮑叔牙的知遇之恩——世上生養他的是父母，而真正了解他的只有鮑叔。
original:
  - speaker: 鮑叔牙
    source: shiji
    locus: 齊太公世家
    ctext_urn: ctp:shiji/qi-tai-gong-shi-jia
    quote: 君將治齊，即高傒與叔牙足也。君且欲霸王，非管夷吾不可。
    translation: >-
      您如果只想把齊國治理好，有我和高傒就夠了；您如果要成就霸業，那就非用管夷吾不可。
  - speaker: 管仲
    locus: 管晏列傳
    quote: >-
      公子糾敗，召忽死之，吾幽囚受辱，鮑叔不以我為無恥，知我不羞小節而恥功名不顯于天下也。生我者父母，知我者鮑子也。
    translation: >-
      公子糾失敗以後，召忽為他殉死，我卻甘願被囚受辱。鮑叔不因此覺得我無恥，他知道我不會為小節
      而羞愧，只把功名不能顯揚於天下當成恥辱。生我的是父母，真正了解我的是鮑叔。
  - locus: 管晏列傳
    quote: 倉廩實而知禮節，衣食足而知榮辱，上服度則六親固。
    translation: >-
      糧倉充實了，人才顧得上禮節；衣食足夠了，人才顧得上榮辱；居上位的人遵守法度，親屬之間才能
      穩固。
  - speaker: 孔子
    source: analects
    locus: 憲問
    ctext_urn: ctp:analects/xian-wen
    quote: 管仲相桓公，霸諸侯，一匡天下，民到于今受其賜。微管仲，吾其被髮左衽矣。
    translation: >-
      管仲輔佐齊桓公，稱霸諸侯，匡正了整個天下，百姓到今天還蒙受他的恩惠。要不是有管仲，我們早
      就披頭散髮、衣襟左開，淪為夷狄了。
sources:
  - source: shiji
    locus: 管晏列傳
    ctext_urn: ctp:shiji/guan-yan-lie-zhuan
  - source: analects
    locus: 憲問
    ctext_urn: ctp:analects/xian-wen
reliability: 大體可信
significance: >-
  霸主政治的制度起點。管仲所做的不是恢復周禮，而是借周禮之名建立一套新的動員體系——編組戶籍、
  把軍令寄託在內政裡、專賣山海之利。此後兩百年，無論齊國還是晉國的霸業，骨架都是這一套。孔子
  雖然嫌他器量小，卻仍然說「微管仲，吾其被髮左衽矣」（白話：要不是有管仲，我們早就披頭散髮、
  衣襟左開，淪為夷狄了）。
