  - source: guo-yu
    locus: 晉語四
reliability: 信史
significance: >-
  這是春秋時代最著名的流亡故事，也是晉文公日後成就霸業的全部本錢：十九年間，
  重耳結交過的、羞辱過他的、以及他許下承諾的每一個國家，後來都在城濮之戰裡各就各位。
  他在楚國許下的「其辟君三舍」（白話：我一定先為您退讓三舍），當時只是一句外交辭令，
  五年後卻在城濮兌現成一場戰術部署。
