id: chong-er-liu-wang
name: 重耳流亡
year: -655
year_end: -637
year_note: 魯僖公五年至二十三年
period: wu-ba
type: 出奔
states: [jin, chu, qi]
people: [jin-wen-gong, hu-yan, chu-cheng-wang, jie-zhi-tui]
narrative: >-
  晉獻公惑於驪姬，殺太子申生，重耳奔翟，凡十九年，歷翟、衛、齊、曹、宋、鄭、楚、秦八國。

  過衛，衛文公不禮；乞食於五鹿之野，野人與之塊，重耳怒欲鞭之，狐偃曰「天賜也」，稽首受而載
  之。至齊，桓公妻之，有馬二十乘，重耳安之；從者謀於桑下而蠶妾聞之，姜氏殺妾而勸行，重耳不
  肯，乃與狐偃醉而載之以行。過曹，曹共公聞其駢脅，欲觀其裸浴，薄而觀之。過宋，襄公贈之以馬
  二十乘。過鄭，鄭文公不禮。

  至楚，楚成王以諸侯之禮饗之。成王曰：「公子若反晉國，則何以報不穀？」（白話：公子若能返回
  晉國，將拿什麼報答我？）對曰：「子女玉帛，則君有之；羽毛齒革，則君地生焉。其波及晉國者，
  君之餘也，其何以報君？」（白話：美女玉帛，君侯您有的是；羽毛獸牙皮革，是您土地上出產的。
  流到晉國的不過是您用剩的，我拿什麼報答您呢？）王曰：「雖然，何以報我？」對曰：「若以君之
  靈，得反晉國，晉、楚治兵，遇於中原，其辟君三舍。若不獲命，其左執鞭弭、右屬櫜鞬，以與君周
  旋。」（白話：若托君侯之福，我能返回晉國；他日晉楚交兵、相遇於中原，我當為君退避三舍。若
  這樣仍得不到諒解，那我就左手執鞭與弓、右邊掛著箭袋弓套，與君侯周旋到底。）子玉請殺之，成
  王不許，送諸秦。
sources:
