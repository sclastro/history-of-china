reliability: 信史
significance: >-
  春秋最著名的流亡敘事，也是晉文霸業的全部本錢——
  十九年間他所結交、所受辱、所許諾的每一國，
  日後都在城濮的棋盤上各就其位。
  「退避三舍」的承諾就在這場流亡的中途說出，
  它當時是一句外交辭令，十九年後成了一次戰術部署。
