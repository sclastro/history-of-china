id: chong-er-liu-wang
name: 重耳流亡
year: -655
year_end: -637
year_note: 魯僖公五年至二十三年
period: wu-ba
type: 出奔
states: [jin, chu, qi]
people: [jin-wen-gong, hu-yan, chu-cheng-wang, jie-zhi-tui]
narrative: >-
  晉獻公寵愛驪姬，聽信讒言，逼死了太子申生。前 655 年，公子重耳（後來的晉文公）為了避禍，
  逃亡到母親的娘家翟國。從此他在外流亡十九年，先後經過翟、衛、齊、曹、宋、鄭、楚、秦八個國家。

  重耳路過衛國，衛文公不肯以禮相待。一行人走到五鹿（衛國的郊野），糧食已經吃光，
  向田裡的農夫討飯，農夫卻遞給他們一塊泥土。重耳大怒，想拿鞭子抽人。隨行的狐偃連忙勸阻，
  說泥土象徵土地，這是上天賜予的預兆。重耳於是行禮接過，把泥土裝上車。

  到了齊國，齊桓公厚待重耳，把女兒嫁給他，又送了二十乘（一乘四匹）馬。重耳過得安逸，
  不想再走。隨行的人認為不能這樣消磨下去，便在桑樹下商量離開的事。一名採桑的女僕聽見了，
  回去告訴重耳的妻子姜氏。姜氏怕消息洩露，殺了女僕，又勸重耳上路。重耳不肯，
  姜氏就和狐偃合謀，把重耳灌醉，載上車送出齊國。

  重耳路過曹國，曹共公聽說他的肋骨連成一片，很想看看，竟趁他洗澡時靠近偷看。
  到了宋國，宋襄公送給他二十乘馬。到了鄭國，鄭文公也不肯以禮相待。

  到了楚國，楚成王用招待諸侯的規格設宴款待重耳。席間楚成王問：公子將來如果回到晉國，
  打算怎樣報答我？重耳回答：美女、玉帛，君王您都有；羽毛、象牙、皮革，是您土地上出產的；
  這些東西流到晉國的，不過是您用剩的，我拿甚麼報答您呢？楚成王再追問到底怎樣回報。
  重耳說：如果託您的福，我能回到晉國，日後晉、楚兩國交戰、在中原相遇，我一定先為您退讓三舍——
  古時行軍三十里為一舍，這就是「退避三舍」的由來；如果這樣還得不到諒解，那我就左手拿著鞭子和弓、
  右邊掛著箭袋弓套，跟您周旋到底。

  楚國大臣子玉（成得臣）請求殺掉重耳，楚成王不答應。他認為重耳為人寬宏而節儉、文雅而懂禮，
  隨從忠誠能幹，是上天要興起的人，違背天意必有大禍，於是把重耳送到秦國。
original:
  - locus: 僖公二十三年
    quote: 出於五鹿，乞食於野人，野人與之塊，公子怒，欲鞭之。子犯曰：「天賜也。」稽首，受而載之。
    translation: >-
      走到五鹿，向田裡的農夫討飯，農夫卻給了他一塊泥土。重耳大怒，想拿鞭子抽人。
      狐偃（子犯）說：「這是上天賜予的。」重耳於是行禮接過，把泥土裝上車。
  - speaker: 姜氏
    locus: 僖公二十三年
    quote: 行也！懷與安，實敗名。
    translation: 走吧！留戀妻子、貪圖安逸，實在會敗壞名聲。
  - speaker: 楚成王與重耳
    locus: 僖公二十三年
    quote: >-
      楚子饗之，曰：「公子若反晉國，則何以報不穀？」對曰：「子女玉帛則君有之，羽毛齒革則君地生焉，
      其波及晉國者，君之餘也，其何以報君？」曰：「雖然，何以報我？」對曰：「若以君之靈，得反晉國，
      晉、楚治兵，遇於中原，其辟君三舍。若不獲命，其左執鞭弭、右屬櫜鞬，以與君周旋。」
    translation: >-
      楚成王設宴款待重耳，問：「公子如果回到晉國，將拿甚麼報答我？」重耳回答：「美女玉帛，
      君王您都有；羽毛、象牙、皮革，是您土地上出產的；流到晉國的，不過是您用剩的，
      我拿甚麼報答您呢？」楚成王說：「話雖如此，你到底用甚麼回報我？」重耳說：「如果託您的福，
      我能回到晉國，日後晉、楚兩國交戰、在中原相遇，我一定先為您退讓三舍。要是這樣還得不到諒解，
      我就左手拿著鞭子和弓、右邊掛著箭袋弓套，跟您周旋到底。」
  - speaker: 楚成王
    locus: 僖公二十三年
    quote: 晉公子廣而儉，文而有禮。其從者肅而寬，忠而能力。……天將興之，誰能廢之，違天必有大咎。
    translation: >-
      晉公子為人寬宏而節儉，文雅而懂禮；他的隨從嚴謹而寬厚，忠誠而能幹。……上天要興起他，
      誰能廢掉他？違背天意，一定招來大禍。
sources:
  - source: zuo-zhuan
    locus: 僖公二十三年
