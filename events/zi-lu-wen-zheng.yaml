id: zi-lu-wen-zheng
name: 子路問政
year: -489
year_note: 年代不詳；事在孔子居衛時
period: chun-qiu-late
type: 論政
states: [wey]
people: [kong-zi]
narrative: >-
  孔子周遊列國時，在衛國住過頗長的時間。當時衛國的君位正處於一場父子之爭：衛靈公的太子蒯聵
  因謀殺南子不成而出奔，靈公死後，衛人立蒯聵的兒子輒為君，就是衛出公；蒯聵則在晉國支持下
  據守戚邑，伺機回國爭位。君、父、子的名分因此糾纏不清。

  子路問孔子：衛國國君等著先生去治理國政，先生打算先做甚麼？孔子說：一定是先端正名分吧！
  子路說：有這樣的事嗎？先生也太迂闊了，這有甚麼好端正的？

  孔子責備子路粗野：君子對於自己不懂的事，應該存疑不說。然後他講出一串環環相扣的道理：
  名分不正，說話就不順理；說話不順理，事情就辦不成；事情辦不成，禮樂就興不起來；
  禮樂興不起來，刑罰就不得當；刑罰不得當，百姓就手足無措。所以君子定下一個名分，
  一定要能說得通；說出來的話，一定要能實行。君子對於自己說的話，絕不馬虎。
  後世從這段話概括出成語「名正言順」。
original:
  - speaker: 子路與孔子
    locus: 子路
    quote: >-
      子路曰：「衛君待子而為政，子將奚先？」子曰：「必也正名乎！」子路曰：「有是哉？子之迂也！
      奚其正？」
    translation: >-
      子路說：「衛國國君等著先生去治理國政，先生打算先做甚麼？」孔子說：「一定是先端正名分吧！」
      子路說：「有這樣的事嗎？先生也太迂闊了！這有甚麼好端正的？」
  - speaker: 孔子
    locus: 子路
    quote: >-
      野哉，由也！君子於其所不知，蓋闕如也。名不正，則言不順；言不順，則事不成；事不成，
      則禮樂不興；禮樂不興，則刑罰不中；刑罰不中，則民無所措手足。
    translation: >-
      仲由，你真粗野！君子對於自己不懂的事，應該存疑不說。名分不正，說話就不順理；說話不順理，
      事情就辦不成；事情辦不成，禮樂就興不起來；禮樂興不起來，刑罰就不得當；刑罰不得當，
      百姓就手足無措。
  - speaker: 孔子
    locus: 子路
    quote: >-
      故君子名之必可言也，言之必可行也。君子於其言，無所苟而已矣。
    translation: >-
      所以君子定下一個名分，一定要能說得通；說出來的話，一定要能實行。君子對於自己說的話，絕不馬虎。
sources:
  - source: analects
    locus: 子路
    ctext_urn: ctp:analects/zi-lu
reliability: 信史
significance: >-
  這段話的背景是衛國的父子爭位，名分不定，整套規範就無從運作。子路以為正名迂闊，
  孔子的回答卻是一條完整的因果鏈：由名到言、到事、到禮樂、到刑罰、到百姓。
  「名正言順」今天多用來說做事有正當理由，原文講的卻是制度能否運作——定義不清的地方，執行必然走樣。
