id: zi-lu-wen-zheng
name: 子路問政
year: -489
year_note: 年代不詳；事在孔子居衛時
period: chun-qiu-late
type: 論政
states: [lu]
people: [kong-zi]
narrative: >-
  子路問孔子：衛國國君等著先生去治理國政，先生打算先做什麼？

  孔子答：「必也正名乎！」（白話：一定是先端正名分吧！）

  子路說：有這回事嗎？先生也太迂闊了，這有什麼好端正的？

  孔子責備他粗野，然後說出那段層層相扣的話：

  「名不正則言不順，言不順則事不成，事不成則禮樂不興，
  禮樂不興則刑罰不中，刑罰不中則民無所措手足。」
  （白話：名分不正，說話就不順理；說話不順理，事情就辦不成；
  事情辦不成，禮樂就興不起來；禮樂興不起來，刑罰就不得當；
  刑罰不得當，百姓就手足無措。）

  最後：「故君子名之必可言也，言之必可行也。君子於其言，無所苟而已矣。」
  （白話：所以君子定下一個名分，必定能說得通；說出來的話，必定能實行。
  君子對於自己說的話，絕不隨便。）
sources:
  - source: analects
    locus: 子路
    ctext_urn: ctp:analects/zi-lu
reliability: 信史
significance: >-
  這段話的背景是衛國的君位之爭——衛出公輒與其父蒯聵爭位，
  父子相攻而名分不定。子路以為「正名」迂闊，
  孔子的回答卻是一條完整的因果鏈：由名到言、到事、到禮樂、到刑罰、到民。
  「名正言順」四個字今天多用來說做事有正當理由；
  原文講的是制度的可運作性——名分不定，整套規範就無從執行。
