id: feng-xuan-ke-meng-chang-jun
name: 馮諼客孟嘗君
year: -295
year_note: 年代不詳；事在齊湣王時
period: zhan-guo-mid
type: 獻策
states: [qi, wei]
people: [feng-xuan, meng-chang-jun]
narrative: >-
  馮諼家境貧困，養不活自己，託人向孟嘗君（齊國貴族田文）請求，希望寄居門下做食客。
  孟嘗君問他有甚麼愛好、有甚麼才能，他都回答沒有。孟嘗君還是笑著收留了他。

  起初門下的人看孟嘗君並不重視他，只給他粗劣的飯菜。過了一陣，馮諼靠著柱子彈著劍唱歌：
  長劍啊，我們回去吧，吃飯沒有魚。孟嘗君聽說，吩咐給他跟一般食客一樣的待遇。
  不久他又彈劍唱：出門沒有車。孟嘗君又替他備了車。再過一陣，他第三次彈劍唱：沒有辦法養家。
  旁人都討厭他，覺得他貪心不知足。孟嘗君問明他家有老母，便派人供給老母的生活所需。
  馮諼從此不再唱歌。

  後來孟嘗君貼出通告，問門下食客有誰懂會計、能替他到封地薛收債。馮諼寫下「能」字應徵。
  臨行前，他問收完債要買甚麼回來，孟嘗君說看家裡缺甚麼就買甚麼。

  馮諼到了薛地，叫官吏召集所有欠債的百姓來核對債券。債券全部核對過後，他假託孟嘗君的命令，
  把債款賞給百姓，當眾燒掉借據。百姓歡呼萬歲。

  他趕回齊國覆命。孟嘗君奇怪他這麼快回來，問他買了甚麼。馮諼說，您宮裡珍寶堆滿，
  馬廄裡養著好狗好馬，堂下站滿美女，家中唯一缺的就是「義」，所以他替孟嘗君買了「義」回來——
  也就是靠燒券收買薛地的民心。孟嘗君很不高興，只說算了。

  一年後，齊湣王對孟嘗君說，不敢再用先王的舊臣，免去了他的相位。孟嘗君只好回到封地薛。
  離薛地還有一百里，百姓已經扶老攜幼在路上迎接他。孟嘗君這才明白馮諼替他買義的用意。

  馮諼說，狡猾的兔子有三個洞，才不過免於一死；如今您只有一個洞，還不能高枕無憂，
  請讓他再替孟嘗君鑿兩個洞。這就是成語「狡兔三窟」的由來。

  孟嘗君給他五十輛車、五百斤金。馮諼往西到魏國都城大梁，對梁惠王說，齊國放逐了大臣孟嘗君，
  哪國諸侯先請他去，就能富國強兵。梁惠王於是空出相位，派使者帶著千斤黃金、百輛車去聘請孟嘗君。
  馮諼搶先趕回來，提醒孟嘗君一概推辭。梁國使者往返三次，孟嘗君都堅決不肯應聘。

  齊王聽說這件事，君臣都很驚恐，派太傅送上千斤黃金、兩輛華貴的車、一柄佩劍，
  並寫信向孟嘗君謝罪，請他回來執掌國政。馮諼又提醒孟嘗君，趁機向齊王請求賜予先王的祭器，
  在薛地建立宗廟；宗廟一立，齊國就不敢輕易放棄薛地。三個洞都鑿好了，孟嘗君此後做了幾十年宰相，
  沒有遇上一點禍患。
original:
  - speaker: 馮諼
    locus: 齊策四
    quote: 長鋏歸來乎！食無魚。
    translation: 長劍啊，我們回去吧！吃飯沒有魚。
  - speaker: 馮諼與孟嘗君
    locus: 齊策四
    quote: 辭曰：「責畢收，以何市而反？」孟嘗君曰：「視吾家所寡有者。」
    translation: 馮諼問：「債收完了，要買甚麼回來？」孟嘗君說：「看我家裡缺甚麼就買甚麼。」
  - speaker: 馮諼
    locus: 齊策四
    quote: 君宮中積珍寶，狗馬實外廄，美人充下陳。君家所寡有者以義耳！竊以為君市義。
    translation: >-
      您宮裡堆滿珍寶，馬廄裡養著好狗好馬，堂下站滿美女；您家中唯一缺的就是「義」。
      所以我替您買了「義」回來。
  - speaker: 馮諼
    locus: 齊策四
    quote: 狡兔有三窟，僅得免其死耳。今君有一窟，未得高枕而臥也。請為君復鑿二窟。
    translation: >-
      狡猾的兔子有三個洞，也不過免於一死。如今您只有一個洞，還不能高枕無憂。
      請讓我替您再鑿兩個洞。
  - speaker: 馮諼
    locus: 齊策四
    quote: 三窟已就，君姑高枕為樂矣。
    translation: 三個洞都鑿好了，您就安心高枕享樂吧。
sources:
  - source: zhan-guo-ce
    locus: 齊策四
    ctext_urn: ctp:zhan-guo-ce/qi-ce-si
reliability: 大體可信
significance: >-
  戰國養士風氣下最完整的一次分散風險操作。馮諼替孟嘗君鑿的三個洞性質各不相同：
  燒掉債券、收買薛地民心，替孟嘗君留下退路；讓魏國高價來聘、抬高他的身價，是議價的籌碼；
  在薛地立起先王宗廟，則抬高齊國放棄薛地的成本。三者合起來，孟嘗君才能安穩坐相數十年。
  值得注意的是第一窟的代價是真金白銀——馮諼燒掉的是實打實的債權，換來的卻是無法量化的民心。
  馮諼說「狡兔有三窟，僅得免其死耳」（白話：狡猾的兔子有三個洞，也不過免於一死），
  道出安全從來不能只靠單一憑仗。
