id: feng-xuan-ke-meng-chang-jun
name: 馮諼客孟嘗君
year: -295
year_note: 年代不詳；事在齊湣王時
period: zhan-guo-mid
type: 獻策
states: [qi, wei]
people: [feng-xuan, meng-chang-jun]
narrative: >-
  馮諼初到孟嘗君門下，自稱無好無能，孟嘗君仍收留了他。
  他先後三次彈著劍唱歌：吃飯沒有魚、出門沒有車、家中無以養母。
  孟嘗君都一一滿足，沒有慍色。

  後來孟嘗君要人到封地薛收債，馮諼自請前往，臨行問收債回來要買什麼，
  孟嘗君說「視吾家所寡有者」（白話：看我家裡缺什麼就買什麼）。

  他到薛地後召集負債的人核對債券，然後假託孟嘗君之命，
  當眾把債券全部燒掉。百姓歡呼萬歲。

  回來覆命，孟嘗君問買了什麼。他說：「臣竊計，君宮中積珍寶……
  而君家所寡有者，以義耳。竊以為君市義。」
  （白話：臣私下盤算，您宮裡珍寶堆滿……您家中唯一缺的就是「義」，
  所以臣替您買了義回來。）孟嘗君不高興。

  一年後，齊王免去孟嘗君的相位，他只好回到薛地。
  距薛地還有一百里，百姓已經扶老攜幼在路上迎接。孟嘗君這才明白。

  馮諼說：「狡兔有三窟，僅得免其死耳；今君有一窟，未得高枕而臥也。
  請為君復鑿二窟。」（白話：狡猾的兔子有三個洞，才不過免於一死；
  如今您只有一個洞，還不能高枕無憂。請讓臣替您再鑿兩個洞。）

  他隨即西入大梁，說動梁惠王虛位以待、三次派使者帶重金聘孟嘗君；
  孟嘗君依他的話一概推辭。齊王聞訊驚恐，親自謝罪並復其相位。
  馮諼又請立先王宗廟於薛，使齊國不敢輕棄薛地。三窟既成，
  孟嘗君為相數十年，無纖介之禍。
sources:
  - source: zhan-guo-ce
    locus: 齊策四
    ctext_urn: ctp:zhan-guo-ce/qi-ce-si
reliability: 大體可信
significance: >-
  戰國養士制度下最完整的一次「風險分散」操作。
  三窟分別是民心（燒債券）、外部選項（梁國的聘書）、
  制度保障（宗廟立於薛），三者性質各不相同：
  一個讓他有退路，一個讓他有議價能力，一個讓對方的成本變高。
  值得注意的是第一窟的代價是真金白銀——
  馮諼燒掉的是實打實的債權，換來的是不可量化的東西。
