reliability: 孤證
significance: >-
  這則故事的說服結構值得注意：更羸不是靠射術取勝，是靠**觀察與推論**。
  他從飛行速度與叫聲兩個可觀察的指標，推出舊傷與離群兩個不可見的狀態，
  再推出這隻鳥對弦音的反應會過度。
  而魏加把它用在人身上——一個打過敗仗的將領，聽到戰鼓的反應也會過度。
  先秦說客最擅長的正是這種轉移：先在一個無關的領域確立原則，再套回本題。
