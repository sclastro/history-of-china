id: geng-lei-xu-fa
name: 更羸虛發
year: -257
year_note: 年代不詳；《戰國策·楚策四》繫於魏加語春申君時，姑繫於此
period: zhan-guo-late
type: 獻策
states: [wei]
people: [geng-lei]
narrative: >-
  更羸與魏王同在京臺之下，抬頭看見飛鳥。更羸對魏王說：
  「臣為王引弓虛發而下鳥。」（白話：臣可以為大王空拉弓弦、不發箭就把鳥射下來。）
  魏王說：射術能到這個地步嗎？更羸說能。

  過了一會兒，有雁從東方飛來。更羸拉了一下空弦，雁就掉了下來。
  魏王大驚：「射可至此乎？」（白話：射術竟能到這個地步嗎？）

  更羸解釋：「此孽也……其飛徐而鳴悲。飛徐者，故瘡痛也；鳴悲者，久失群也。
  故瘡未息而驚心未去也，聞弦音，引而高飛，故瘡隕也。」
  （白話：這是一隻有舊傷的鳥……牠飛得慢而叫聲悲。飛得慢，是舊傷還在痛；
  叫聲悲，是離群已久。舊傷未癒而驚懼未消，一聽到弓弦的聲音，就拚命往高處飛，
  於是舊傷迸裂而墜落。）

  《戰國策》記下這則故事，是魏加用來勸楚國春申君不要以臨武君為將——
  臨武君曾敗於秦，「是傷弓之鳥也」。
sources:
  - source: zhan-guo-ce
    locus: 楚策四
