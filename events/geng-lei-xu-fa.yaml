id: geng-lei-xu-fa
name: 更羸虛發
year: -257
year_note: 年代不詳；《戰國策·楚策四》繫於魏加語春申君時，姑繫於此
period: zhan-guo-late
type: 獻策
states: [wei]
people: [geng-lei]
narrative: >-
  有一天，更羸陪魏王站在京臺下面，抬頭看見天上有飛鳥。更羸對魏王說：我可以為大王空拉弓弦、
  不放箭，就把鳥射下來。魏王問：射箭的本事能到這個地步嗎？更羸說：能。

  過了一會，有一隻雁從東方飛來。更羸拉了一下空弦，那隻雁應聲掉了下來。
  魏王大為驚訝，問道：射箭的本事竟然能到這個地步嗎？

  更羸解釋：這是一隻受過傷的鳥。牠飛得慢，叫聲又悲切。飛得慢，是因為舊傷還在痛；
  叫聲悲切，是因為離開同伴已久。舊傷沒有好、驚懼也沒有消，這隻鳥一聽到弓弦的聲音，
  就拚命往高處飛，於是舊傷迸裂，跌了下來。

  《戰國策》記下這個故事，本是魏加用來勸楚國春申君的話。當時春申君打算派臨武君領兵抗秦，
  魏加指出臨武君曾經被秦國打敗，就像一隻被弓箭嚇怕的鳥，不宜再用他為將。
  成語「驚弓之鳥」即由此而來。
original:
  - speaker: 更羸
    locus: 楚策四
    quote: 臣為王引弓虛發而下鳥。
    translation: 我可以為大王空拉弓弦、不放箭，就把鳥射下來。
  - locus: 楚策四
    quote: 有間，雁從東方來，更羸以虛發而下之。
    translation: 過了一會，有雁從東方飛來，更羸空拉弓弦，就把牠射了下來。
  - speaker: 魏王
    locus: 楚策四
    quote: 然則射可至此乎？
    translation: 這樣說來，射箭的本事竟能到這個地步嗎？
  - speaker: 更羸
    locus: 楚策四
    quote: >-
      此孽也……其飛徐而鳴悲。飛徐者，故瘡痛也；鳴悲者，久失群也。故瘡未息而驚心未去也，
      聞弦音，引而高飛，故瘡隕也。
    translation: >-
      這是一隻受過傷的鳥。牠飛得慢，叫聲又悲切。飛得慢，是因為舊傷還在痛；
      叫聲悲切，是因為離開同伴已久。舊傷沒有好、驚懼也沒有消，一聽到弓弦的聲音，
      就拚命往高處飛，於是舊傷迸裂而墜落。
  - speaker: 魏加
    locus: 楚策四
    quote: 臨武君嘗為秦孽，不可為拒秦之將也。
    translation: 臨武君曾經被秦國打敗，不能派他做抵抗秦國的主將。
sources:
  - source: zhan-guo-ce
    locus: 楚策四
    ctext_urn: ctp:zhan-guo-ce/chu-ce-si
reliability: 孤證
significance: >-
  這個故事的說服方式值得注意：更羸不是靠射術取勝，而是靠觀察和推論。
  他從飛行速度和叫聲兩個看得見、聽得到的跡象，推斷出舊傷和離群兩個看不見的狀態，
  再推斷這隻鳥對弦聲的反應會過度。魏加把這個道理用到人身上——一個打過敗仗的將領，
  聽到戰鼓也會反應過度。先秦說客最擅長的正是這一手：先在一個無關的領域立下原則，再套回本題。
