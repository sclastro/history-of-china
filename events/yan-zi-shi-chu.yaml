id: yan-zi-shi-chu
name: 晏子使楚
year: -531
year_note: 楚靈王時，年份不可確考
period: chun-qiu-late
type: 外交
states: [qi, chu]
people: [yan-ying]
narrative: >-
  晏子將使楚，楚王聞之，謂左右曰：
  「晏嬰，齊之習辭者也，今方來，吾欲辱之，何以也？」
  左右對曰：「為其來也，臣請縛一人過王而行。
  王曰『何為者也』，對曰『齊人也』；王曰『何坐』，曰『坐盜』。」

  晏子至，楚王賜晏子酒。酒酣，吏二縛一人詣王。
  王曰：「縛者曷為者也？」對曰：「齊人也，坐盜。」
  王視晏子曰：「齊人固善盜乎？」

  晏子避席對曰：「嬰聞之，橘生淮南則為橘，生于淮北則為枳，
  葉徒相似，其實味不同。所以然者何？水土異也。
  今民生長於齊不盜，入楚則盜，得無楚之水土使民善盜耶？」

  王笑曰：「聖人非所與熙也，寡人反取病焉。」
sources:
  - source: yanzi-chun-qiu
    locus: 內篇雜下
    ctext_urn: ctp:yanzi-chun-qiu/nei-pian/za-xia
reliability: 孤證
significance: >-
  春秋外交辭令的另一種類型：不是召陵之盟那種以名分交易的宏大場面，
  而是一次針對人身的羞辱與反擊。晏子的回答之所以有效，
  在於他接受了對方的事實前提（此人確是齊人、確是盜），
  只更換了因果解釋——把個人品性換成環境決定。
  「南橘北枳」自此成為漢語中談論環境與本性的通用比喻。
