id: yan-zi-shi-chu
name: 晏子使楚
year: -531
year_note: 楚靈王時，年份不可確考
period: chun-qiu-late
type: 外交
states: [qi, chu]
people: [yan-ying]
narrative: >-
  晏嬰將要出使楚國。楚王聽說後，對左右說：晏嬰是齊國擅長辭令的人，如今就要來了，
  我想羞辱他一番，該用甚麼辦法？左右獻計：等他來了，我們綁一個人從大王面前走過；
  大王問這是甚麼人，我們就說是齊國人；大王問犯了甚麼罪，我們就說是偷竊。

  晏嬰到了楚國，楚王設酒款待他。喝到正酣時，兩名小吏綁著一個人來到楚王面前。
  楚王問：綁的是甚麼人？小吏回答：是齊國人，犯了偷竊罪。楚王看著晏嬰問：齊國人本來就善於偷竊嗎？

  晏嬰離開座位回答：他聽說，橘樹生在淮河以南就是橘，生在淮河以北就成了枳，兩者只是葉子相似，
  果實的味道卻完全不同。為甚麼會這樣？因為水土不同。如今這個人生長在齊國時不偷竊，
  一到楚國就偷竊，莫非是楚國的水土使人善於偷竊吧？

  楚王笑著說：聖人是不能隨便開玩笑的，寡人反而自討沒趣了。後世由晏嬰這番話概括出成語「南橘北枳」。
original:
  - speaker: 楚王
    locus: 內篇雜下
    quote: >-
      晏嬰，齊之習辭者也。今方來，吾欲辱之，何以也？
    translation: >-
      晏嬰是齊國擅長辭令的人。如今就要來了，我想羞辱他，該用甚麼辦法？
  - speaker: 楚王與小吏
    locus: 內篇雜下
    quote: >-
      王曰：「縛者曷為者也？」對曰：「齊人也，坐盜。」王視晏子曰：「齊人固善盜乎？」
    translation: >-
      楚王問：「綁的是甚麼人？」小吏回答：「是齊國人，犯了偷竊罪。」楚王看著晏嬰問：
      「齊國人本來就善於偷竊嗎？」
  - speaker: 晏嬰
    locus: 內篇雜下
    quote: >-
      嬰聞之，橘生淮南，則為橘；生於淮北，則為枳，葉徒相似，其實味不同，所以然者何？水土異也。
      今民生長於齊不盜，入楚則盜，得無楚之水土，使民善盜耶？
    translation: >-
      我聽說，橘樹生在淮河以南就是橘，生在淮河以北就成了枳，兩者只是葉子相似，果實的味道卻不同。
      為甚麼會這樣？因為水土不同。如今這個人生長在齊國時不偷竊，一到楚國就偷竊，
      莫非是楚國的水土使人善於偷竊吧？
  - speaker: 楚王
    locus: 內篇雜下
    quote: >-
      聖人非所與熙也，寡人反取病焉。
    translation: >-
      聖人是不能隨便開玩笑的，寡人反而自討沒趣了。
sources:
  - source: yanzi-chun-qiu
    locus: 內篇雜下
    ctext_urn: ctp:yanzi-chun-qiu/za-xia
reliability: 孤證
notes: >-
  「曷為者也」「與熙」據通行本；維基文庫所據版本作「何為者也」「與嬉」。
significance: >-
  春秋外交辭令的另一種類型：不是召陵之盟那種以名分交易的宏大場面，而是一次針對人身的羞辱與反擊。
  晏嬰的回答之所以有效，在於他接受了對方的事實前提——此人確是齊國人、確實偷竊——
  只更換了因果解釋，把個人品性換成環境條件，攻勢便原封不動地送了回去。
