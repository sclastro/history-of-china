id: shao-ling-zhi-meng
name: 召陵之盟
year: -656
year_note: 魯僖公四年
period: wu-ba
type: 會盟
states: [qi, chu]
people: [qi-huan-gong, guan-zhong, chu-cheng-wang]
narrative: >-
  前 656 年春，齊桓公率領魯、宋、陳、衛、鄭、許、曹各國的軍隊攻打蔡國。蔡軍潰散，
  聯軍於是轉而攻打楚國。

  楚成王派使者到聯軍中質問：齊國在北方的海邊，楚國在南方的海邊，兩國相隔遙遠，
  就是走失的牛馬也跑不到對方境內——這就是成語「風馬牛不相及」的由來。使者問，
  想不到齊侯竟然踏進楚國的土地，這是甚麼緣故？

  管仲代齊桓公回答。他說，周初召康公曾經命令齊國的始封君太公，天下的諸侯，
  齊國都可以征討，用來輔助周室；又劃定齊國可以征伐的範圍，東到大海，西到黃河，
  南到穆陵，北到無棣。管仲接著舉出兩條罪名：楚國應當進貢給周天子的包茅一直沒有送到，
  天子祭祀時沒有東西可以濾酒，齊國是為此來徵收的；當年周昭王南巡而沒有回去，
  齊國也要為此查問。

  楚國使者承認，貢品沒有送到是楚君的過錯，以後怎敢不供給；至於昭王沒有回去，
  請齊侯到漢水邊上去問吧。聯軍繼續推進，駐紮在陘地。

  夏天，楚成王派大夫屈完到聯軍中交涉。聯軍後撤，駐紮在召陵。齊桓公把各國軍隊列陣，
  請屈完同乘一車檢閱。桓公說，這次出兵不是為了他自己，而是要延續兩國先君的友好，
  問楚國願不願意與齊國交好。屈完說，承蒙齊侯為楚國的社稷求福，願意接納楚君，
  這正是楚君的心願。桓公又說：用這樣的大軍作戰，誰能抵擋？用這樣的大軍攻城，
  哪座城攻不下？屈完回答：齊侯如果用德行安撫諸侯，誰敢不服？如果要用武力，
  楚國有方城山作城牆，有漢水作護城河，齊軍再多也派不上用場。

  於是屈完與各國諸侯在召陵訂立盟約，聯軍撤退。
original:
  - speaker: 楚國使者
    locus: 僖公四年
    quote: >-
      君處北海，寡人處南海，唯是風馬牛不相及也。不虞君之涉吾地也，何故？
    translation: >-
      齊侯住在北方的海邊，寡人住在南方的海邊，就是走失的牛馬也跑不到對方境內。
      想不到齊侯竟然踏進我們的土地，這是甚麼緣故？
  - speaker: 管仲
    locus: 僖公四年
    quote: >-
      爾貢包茅不入，王祭不共，無以縮酒，寡人是徵。昭王南征而不復，寡人是問。
    translation: >-
      你們應當進貢的包茅沒有送到，天子的祭祀供應不上，沒有東西可以濾酒，寡君為此前來徵收。
      周昭王南巡沒有回去，寡君為此前來查問。
  - speaker: 楚國使者
    locus: 僖公四年
    quote: >-
      貢之不入，寡君之罪也，敢不共給。昭王之不復，君其問諸水濱。
    translation: >-
      貢品沒有送到，是寡君的過錯，以後怎敢不供給。至於昭王沒有回去，請齊侯到漢水邊上去問吧。
  - speaker: 齊桓公與屈完
    locus: 僖公四年
    quote: >-
      齊侯曰：「以此眾戰，誰能禦之？以此攻城，何城不克？」對曰：「君若以德綏諸侯，誰敢不服？
      君若以力，楚國方城以為城，漢水以為池，雖眾，無所用之。」
    translation: >-
      齊桓公說：「用這樣的大軍作戰，誰能抵擋？用這樣的大軍攻城，哪座城攻不下？」屈完回答：
      「齊侯如果用德行安撫諸侯，誰敢不服？如果要用武力，楚國有方城山作城牆，有漢水作護城河，
      您的軍隊再多，也派不上用場。」
sources:
  - source: zuo-zhuan
    locus: 僖公四年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/xi-gong-si-nian
reliability: 信史
significance: >-
  春秋外交辭令的範本。齊國不能真的滅楚，楚國也不想與八國聯軍決戰，雙方各給對方一個臺階：
  齊國只追究包茅不貢這件小事，不提楚君僭稱為王的大事；楚國只認包茅之罪，
  而用「君其問諸水濱」（白話：請到漢水邊上去問吧）擋回昭王之問。一場戰爭就這樣收束成一次盟約，
  這正是霸主秩序的實際運作方式。
