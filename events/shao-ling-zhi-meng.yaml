id: shao-ling-zhi-meng
name: 召陵之盟
year: -656
year_note: 魯僖公四年
period: wu-ba
type: 會盟
states: [qi, chu]
people: [qi-huan-gong, guan-zhong, chu-cheng-wang]
narrative: >-
  齊桓公以諸侯之師侵蔡，蔡潰，遂伐楚。楚子使與師言曰：「君處北海，寡人處南海，唯是風馬牛不
  相及也。不虞君之涉吾地也，何故？」（白話：君侯居於北海，寡人居於南海，即使牛馬走失發情也
  到不了對方境內。沒想到君侯竟踏入我的土地，這是什麼緣故？）

  管仲對曰：「昔召康公命我先君大公曰：『五侯九伯，女實征之，以夾輔周室。』賜我先君履，東至
  于海，西至于河，南至于穆陵，北至于無棣。爾貢包茅不入，王祭不共，無以縮酒，寡人是徵；昭王
  南征而不復，寡人是問。」（白話：從前召康公命令我們的先君太公說：天下諸侯，你都可以征討，
  用來輔佐周室。）

  楚使對曰：「貢之不入，寡君之罪也，敢不共給？昭王之不復，君其問諸水濱。」（白話：貢品沒有
  送到，是寡君的罪過，怎敢不供給？至於昭王南征沒有回去，請您到漢水邊上去問吧。）

  師進，次于陘。夏，楚使屈完如師。齊侯陳諸侯之師與屈完乘而觀之，曰：「以此眾戰，誰能禦之？
  以此攻城，何城不克？」（白話：用這樣的大軍作戰，誰能抵擋？用這樣的大軍攻城，哪座城攻不下
  ？）屈完對曰：「君若以德綏諸侯，誰敢不服？君若以力，楚國方城以為城，漢水以為池，雖眾，無
  所用之。」（白話：君侯若用德行安撫諸侯，誰敢不服？君侯若用武力，楚國有方城當城牆、有漢水
  當護城河，您的軍隊再多，也派不上用場。）遂盟於召陵。
sources:
  - source: zuo-zhuan
    locus: 僖公四年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/xi-gong-si-nian
reliability: 信史
significance: >-
  春秋外交辭令的最高範本。齊桓不能真的伐楚，楚亦不欲與八國之師決戰，
  雙方各給一個台階：齊只問「包茅不入」這件小事而不問僭號稱王之大事，
  楚只認包茅之罪而以「問諸水濱」擋回昭王之問。
  一場戰爭被壓縮成兩句話的交易——這就是霸權秩序的實際運作方式。
