reliability: 信史
significance: >-
  中國戰略史上最完整的一次連環詐術，同時產生了兩條入於日用的成語。
  就結構而言，它揭示的是小國在大國博弈中的處境：
  虞的存亡不繫於它自己的忠誠或德行，而繫於它與虢之間的地理關係。
  宮之奇的「唇亡齒寒」不是道德勸告，是幾何學。
