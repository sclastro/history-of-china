id: jin-mie-guo-yu
name: 晉滅虢虞
year: -658
year_end: -655
year_note: 魯僖公二年至五年
period: wu-ba
type: 滅國
states: [jin, guo, yu]
people: [jin-xian-gong, xun-xi, gong-zhi-qi, yu-gong]
narrative: >-
  晉獻公欲伐虢，虞在其道。荀息請以屈產之乘與垂棘之璧假道於虞。公曰：「是吾寶也。」對曰：「
  若得道於虞，猶外府也。」（白話：若能從虞國借到道路，那就等於寄放在外庫罷了。）公曰：「宮
  之奇存焉。」對曰：「宮之奇之為人也，懦而不能強諫，且少長於君，君暱之；雖諫，將不聽。」（
  白話：宮之奇這個人，性格軟弱不能力諫；而且他和虞君從小一起長大，虞君和他太親暱了。就算他
  進諫，虞君也不會聽。）乃使荀息假道，虞公許之。前658 年，晉伐虢，取下陽。

  前 655 年，晉復假道於虞以伐虢。宮之奇諫曰：「虢，虞之表也。虢亡，虞必從之。晉不可啟
  ，寇不可翫，一之謂甚，其可再乎？諺所謂『輔車相依，唇亡齒寒』者，其虞、虢之謂也。」（白話
  ：虢國是虞國的屏障。虢國一亡，虞國必定跟著完。晉國的野心不可助長，外寇不可輕忽——一次已
  經太過分，怎麼可以有第二次？俗話所說「頰骨與牙床相互依靠，嘴唇沒了牙齒就冷」（白話：晉國
  是我的同宗，難道會害我嗎？））虞公曰「晉，吾宗也，豈害我哉」（白話：玉璧還是原來那塊，只
  是馬的年齒長了幾歲罷了。），宮之奇歷數桓莊之族之見滅以對；公又曰「吾享祀豐絜，神必據我」
  ，對曰：「臣聞之，鬼神非人實親，惟德是依……如是，則非德民不和，神不享矣。神所馮依，將在
  德矣。」（白話：臣聽說，鬼神並不真的親近某個人，只依附有德者……這樣說來，沒有德行則人民
  不和睦，神明也不會來享用祭品。神明所依附的，終究是德。）

  弗聽，許晉使。宮之奇以其族行，曰：「虞不臘矣。在此行也，晉不更舉矣。」（白話：虞國過不了
  今年的臘祭了。就在這一次，晉國不必再出兵第二回。）冬十二月，晉滅虢，師還，館于虞，遂襲虞
  ，滅之，執虞公。荀息牽馬持璧而復曰：「璧則猶是也，而馬齒加長矣。」（白話：玉璧還是原來那塊，只是馬的年齒長了幾歲罷了。）
