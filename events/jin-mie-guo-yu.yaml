id: jin-mie-guo-yu
name: 晉滅虢虞
year: -658
year_end: -655
year_note: 魯僖公二年至五年
period: wu-ba
type: 滅國
states: [jin, guo, yu]
people: [jin-xian-gong, xun-xi, gong-zhi-qi, yu-gong]
narrative: >-
  前 658 年，晉獻公想攻打虢國，可是虞國正擋在晉國通往虢國的路上。大夫荀息建議，
  用屈地出產的良馬和垂棘出產的美玉，向虞國借路。晉獻公捨不得，說這兩樣是晉國的珍寶。
  荀息回答：只要能從虞國借到路，這些寶物就好比暫時寄放在外面的庫房，早晚拿得回來。
  晉獻公又擔心虞國賢臣宮之奇會勸阻。荀息說，宮之奇性格軟弱，不會極力進諫；何況他和虞公
  從小一起長大，虞公跟他很親近，就算他進諫，虞公也不會聽。於是晉獻公派荀息去借路，
  虞公答應了。這一年，晉軍借道攻打虢國，奪取了下陽。

  前 655 年，晉國再次向虞國借路去攻打虢國。宮之奇進諫虞公說：虢國是虞國的屏障，
  虢國一亡，虞國必定跟著滅亡。晉國的野心不能助長，外來的敵人不能輕忽；借路一次已經
  太過分，怎麼可以有第二次？他引用俗話「輔車相依，脣亡齒寒」——頰骨和牙床相互依靠，
  嘴唇沒了牙齒就會受寒——說這正是虞、虢兩國的寫照。

  虞公卻說：晉國和虞國是同宗，難道會害我嗎？宮之奇便一一列舉晉國桓叔、莊伯一族的後人
  反被晉獻公殺戮的往事，說明同宗未必保命。虞公又說：我祭祀的供品豐盛潔淨，神明一定會
  保佑我。宮之奇回答：我聽說鬼神並不偏愛某一個人，只依附有德的人。照這樣說，君主沒有
  德行，百姓就不會和睦，神明也不會來享用祭品。神明所依附的，終究在於德行。

  虞公還是不聽，答應了晉國使者。宮之奇料定虞國將亡，便帶著全族離開，臨走說：虞國連
  今年年底的臘祭都過不了了；晉國只要這一次出兵，不必再來第二回。這年冬天十二月，
  晉軍滅掉虢國，班師途中借宿在虞國，趁機發動突襲，滅掉虞國，俘虜了虞公。據《穀梁傳》記載，荀息牽著當年
  那匹馬、拿著那塊玉璧回到晉獻公面前，說：玉璧還是原來那塊，只是馬的牙齒又長了幾歲罷了。
original:
  - speaker: 荀息與晉獻公
    locus: 僖公二年
    source: zuo-zhuan
    ctext_urn: ctp:chun-qiu-zuo-zhuan/xi-gong-er-nian
    quote: >-
      晉荀息請以屈產之乘與垂棘之璧，假道於虞以伐虢。公曰：「是吾寶也。」對曰：「若得道於虞，猶外府也。」
    translation: >-
      晉國大夫荀息請求用屈地出產的良馬和垂棘出產的美玉，向虞國借路去攻打虢國。
      晉獻公說：這是我的寶物啊。荀息回答：只要能從虞國借到路，這些寶物就好比寄放在
      外面的庫房，早晚還是我們的。
  - speaker: 荀息與晉獻公
    locus: 僖公二年
    source: zuo-zhuan
    ctext_urn: ctp:chun-qiu-zuo-zhuan/xi-gong-er-nian
    quote: >-
      公曰：「宮之奇存焉。」對曰：「宮之奇之為人也，懦而不能強諫，且少長於君，君暱之，雖諫，將不聽。」
    translation: >-
      晉獻公說：虞國還有宮之奇在呢。荀息回答：宮之奇的為人，軟弱而不能極力進諫；
      何況他和虞公從小一起長大，虞公跟他很親近，就算他進諫，虞公也不會聽。
  - speaker: 宮之奇
    locus: 僖公五年
    quote: >-
      虢，虞之表也。虢亡，虞必從之。晉不可啟，寇不可翫。一之謂甚，其可再乎？諺所謂「輔車相依，脣亡齒寒」者，其虞、虢之謂也。
    translation: >-
      虢國是虞國的屏障。虢國一亡，虞國必定跟著滅亡。晉國的野心不能助長，外來的敵人不能
      輕忽；借路一次已經太過分，怎麼可以有第二次？俗話說「頰骨和牙床相互依靠，
      嘴唇沒了牙齒就會受寒」，講的正是虞、虢兩國的關係。
  - speaker: 宮之奇
    locus: 僖公五年
    quote: >-
      臣聞之，鬼神非人實親，惟德是依。……如是，則非德，民不和，神不享矣。神所馮依，將在德矣。
    translation: >-
      我聽說，鬼神並不偏愛某一個人，只依附有德的人。……照這樣說，君主沒有德行，
      百姓就不會和睦，神明也不會來享用祭品。神明所依附的，終究在於德行。
  - speaker: 宮之奇
    locus: 僖公五年
    quote: >-
      宮之奇以其族行，曰：「虞不臘矣。在此行也，晉不更舉矣。」
    translation: >-
      宮之奇帶著全族離開，說：虞國連今年的臘祭都過不了了。晉國只要這一次出兵，
      就不必再來第二回。
sources:
