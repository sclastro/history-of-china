reliability: 信史
significance: >-
  前 658 至 655 年間，晉國兩次向虞國借路去攻打虢國，最後把虞國也一併吞併，這就是「假道伐虢」；
  同一件事還留下「脣亡齒寒」「輔車相依」兩句常用成語。它揭示了小國在大國之間的處境：
  虞國的存亡並不取決於自己對晉國是否恭順，而取決於它和虢國之間的地理依存。
  宮之奇說「脣亡齒寒」（白話：嘴唇沒了，牙齒就會受寒），與其說是道德勸告，
  不如說是在講地緣形勢的道理。
