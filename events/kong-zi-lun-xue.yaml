significance: >-
  這幾則的共同點是：孔子談的都不是內容，是**分寸**——
  什麼時候該教、教到什麼程度、快慢如何、到了哪一步。
  「舉一反三」規定了教的時機（學生先要憤悱），
  「過猶不及」取消了「越多越好」這個直覺，
  「欲速則不達」把速度與結果拆開，
  「登堂入室」則給出一把可分級的尺。
  先秦論教育的文字不少，而把分寸講得這樣具體的，以《論語》為最。
