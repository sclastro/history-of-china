id: kong-zi-lun-xue
name: 孔子論學
year: -490
year_note: 年代不詳；《論語》所記師弟問答，繫於孔子在世之時
period: chun-qiu-late
type: 論政
states: [lu]
people: [kong-zi, zi-lu, zeng-zi]
narrative: >-
  《論語》記錄了孔子和弟子的問答。其中談教與學的幾則，後世各自凝成一句成語。

  孔子先講教學的時機。他說，學生不到苦苦思索卻想不通的時候，不去開導他；不到心裡明白卻說不出來的時候，
  不去點撥他。如果舉出一個角落，學生不能由此推想到另外三個角落，就不再教下去。成語「舉一反三」出自這裡。

  子貢問孔子，子張和子夏兩人哪一個好些。孔子說，子張做得過了頭，子夏卻做得不夠。
  子貢又問：那麼是子張強些嗎？孔子回答，過了頭和不夠其實是一樣的。這就是成語「過猶不及」的由來。

  子夏做了莒父（魯國城邑）的邑宰，向孔子請教怎樣治理。孔子說，不要一味求快，不要貪圖小利；
  因為求快反而達不到目的，貪圖小利就辦不成大事。成語「欲速則不達」出自這裡。

  子路在孔子門前彈瑟，孔子嫌他彈得不合雅正，說這樣的瑟聲怎麼會出於自己門下。
  門人聽了，就不再尊敬子路。孔子於是解釋：仲由（子路）已經登上廳堂，只是還沒有進入內室。
  意思是他的造詣已經不低，只是還未到最深的境地。成語「登堂入室」出自這裡。

  孔子又談到年輕一輩。他說，年輕人是值得敬畏的，怎麼知道將來的人一定比不上今天的人呢？
  不過，一個人到了四五十歲還沒有甚麼名聲，那也就不值得敬畏了。
original:
  - speaker: 孔子
    locus: 述而
    quote: 不憤不啟，不悱不發。舉一隅不以三隅反，則不復也。
    translation: >-
      學生不到苦苦思索、想弄明白卻弄不明白的時候，不去開導他；不到心裡明白、想說出來卻說不出來的時候，
      不去點撥他。舉出一個角落，他不能由此推知另外三個角落，就不再教他了。
  - speaker: 子貢與孔子
    locus: 先進
    quote: >-
      子貢問：「師與商也孰賢？」子曰：「師也過，商也不及。」曰：「然則師愈與？」子曰：「過猶不及。」
    translation: >-
      子貢問：「子張和子夏哪一個賢些？」孔子說：「子張做得過了頭，子夏做得不夠。」
      子貢說：「那麼是子張強些嗎？」孔子說：「過了頭和不夠是一樣的。」
  - speaker: 孔子
    locus: 子路
    quote: 無欲速，無見小利。欲速，則不達；見小利，則大事不成。
    translation: >-
      不要一味求快，不要貪圖小利。求快反而達不到目的，貪圖小利就辦不成大事。
  - speaker: 孔子
    locus: 先進
    quote: 由之瑟奚為於丘之門？
    translation: 仲由彈的這種瑟聲，怎麼會出於我的門下？
    source: analects
  - speaker: 孔子
    locus: 先進
    quote: 由也升堂矣，未入於室也。
    translation: 仲由已經登上廳堂，只是還沒有進入內室。
  - speaker: 孔子
    locus: 子罕
    quote: 後生可畏，焉知來者之不如今也？四十、五十而無聞焉，斯亦不足畏也已。
    translation: >-
      年輕人是值得敬畏的，怎麼知道將來的人比不上今天的人呢？不過一個人到了四五十歲還沒有名聲，
      那也就不值得敬畏了。
