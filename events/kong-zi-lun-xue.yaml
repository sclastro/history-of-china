significance: >-
  這幾則的共同點是：孔子談的都不是內容，而是分寸——甚麼時候該教、教到甚麼程度、快慢如何、到了哪一步。
  「舉一反三」規定了教的時機，學生要先有憤悱之心；「過猶不及」推翻了越多越好這個直覺；
  「欲速則不達」把速度和結果分開；「登堂入室」則給出一把可以分級的尺。
  先秦論教育的文字不少，而把分寸講得這樣具體的，以《論語》為最。
