id: kong-zi-lun-xue
name: 孔子論學
year: -490
year_note: 年代不詳；《論語》所記師弟問答，繫於孔子在世之時
period: chun-qiu-late
type: 論政
states: [lu]
people: [kong-zi, zi-lu, zeng-zi]
narrative: >-
  《論語》保存了孔子與弟子問答的片段，其中關於教與學的幾則，
  後世各自凝成一句成語。

  **論啟發**：「不憤不啟，不悱不發。舉一隅不以三隅反，則不復也。」
  （白話：不到他想弄明白而弄不明白的時候，不去開導他；
  不到他想說出來而說不出來的時候，不去啟發他。
  舉出一個角落而他不能由此推知另外三個角落，就不再教他了。）
  ——「舉一反三」由此而來。

  **論過與不及**：子貢問子張與子夏哪一個賢些。孔子說子張做得過頭、
  子夏做得不夠。子貢說：那麼子張強些？孔子答「過猶不及」
  （白話：過頭和不夠是一樣的）。

  **論急躁**：子夏做莒父的邑宰，問政。孔子答：
  「無欲速，無見小利。欲速則不達，見小利則大事不成。」
  （白話：不要求快，不要貪圖小利。求快反而達不到目的，
  貪圖小利就辦不成大事。）

  **論造詣**：子路在孔子門前彈瑟，孔子說「由之瑟，奚為於丘之門」，
  門人因此不敬子路。孔子便說：「由也升堂矣，未入於室也。」
  （白話：仲由已經登上廳堂，只是還沒有進入內室。）
  ——「登堂入室」由此而來。

  **論後輩**：「後生可畏，焉知來者之不如今也？四十五十而無聞焉，
  斯亦不足畏也已。」（白話：年輕人是值得敬畏的，怎麼知道將來的人
  比不上今天的人呢？不過一個人到了四五十歲還沒有名聲，那也就不值得敬畏了。）
