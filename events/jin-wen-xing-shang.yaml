id: jin-wen-xing-shang
name: 晉文行賞
year: -636
year_note: 魯僖公二十四年
period: wu-ba
type: 行賞
states: [jin]
people: [jin-wen-gong, jie-zhi-tui]
narrative: >-
  前 636 年，晉文公結束多年流亡、回國即位後，論功行賞，賞賜當年跟他一起流亡的人。介之推沒有
  向文公提起俸祿，文公的賞賜也沒有輪到他。

  介之推對別人說：晉獻公有九個兒子，如今只剩下晉文公一人在世。晉惠公、晉懷公在位時沒有親信，
  國內國外都拋棄了他們；上天既然沒有斷絕晉國，晉國就一定會有新的君主。主持晉國宗廟祭祀的，
  除了晉文公還會有誰？這本來是上天的安排，可是那幾位隨從卻把它當成自己的功勞。介之推認為這是
  欺騙：偷別人的財物尚且叫做盜賊，何況把上天的功勞據為己有？在下位的人把貪功的罪過說成合理，
  在上位的人又賞賜這種奸偽，上下互相蒙蔽，他實在難以再和這些人相處下去。

  介之推的母親問他：何不也去求個賞賜？就這樣死去，你又能怨恨誰呢？介之推回答：既然責怪別人，
  卻又去仿效他們，罪過就更大了；何況自己已經說出怨恨的話，就不該再吃國君的俸祿。母親再問：
  那麼至少讓國君知道你的想法，怎麼樣？介之推說：言語是用來文飾自身的；自己既然要隱居起來，
  何必再去文飾？那樣做只是在求顯揚罷了。母親說：你既然能這樣，我就跟你一起隱居。於是母子一同
  隱居，直到去世。

  晉文公四處尋找介之推卻找不到，就把綿上一帶的土地劃作他的封田，說這樣做是為了記下自己的過失，
  同時表彰善人。
original:
  - locus: 僖公二十四年
    quote: 晉侯賞從亡者，介之推不言祿，祿亦弗及。
    translation: 晉文公賞賜當年跟他一起流亡的人。介之推沒有提起俸祿，賞賜也沒有輪到他。
  - speaker: 介之推
    locus: 僖公二十四年
    quote: >-
      獻公之子九人，唯君在矣。惠、懷無親，外內棄之。天未絕晉，必將有主。主晉祀者，非君而誰？
      天實置之，而二三子以為己力，不亦誣乎？竊人之財，猶謂之盜，況貪天之功以為己力乎？
      下義其罪，上賞其姦，上下相蒙，難與處矣。
    translation: >-
      晉獻公有九個兒子，如今只剩下國君一人在世。晉惠公、晉懷公沒有親信，國內國外都拋棄了他們；
      上天既然沒有斷絕晉國，就一定會有新的君主。主持晉國宗廟祭祀的，不是國君還會是誰？
      這本來是上天的安排，可是那幾位隨從卻當成自己的功勞，不是欺騙嗎？偷別人的財物尚且叫做盜賊，
      何況把上天的功勞據為己有？在下位的人把罪過說成合理，在上位的人賞賜這種奸偽，上下互相蒙蔽，
      我難以再和他們相處下去了。
  - speaker: 介之推與其母
    locus: 僖公二十四年
    quote: >-
      其母曰：「盍亦求之，以死誰懟？」對曰：「尤而效之，罪又甚焉。且出怨言，不食其食。」
      其母曰：「亦使知之，若何？」對曰：「言，身之文也。身將隱，焉用文之？是求顯也。」
      其母曰：「能如是乎？與女偕隱。」遂隱而死。
    translation: >-
      母親問：「何不也去求個賞賜？就這樣死了，你能怨誰？」介之推回答：「責怪別人卻又去仿效他，
      罪過更大。何況我已經說出怨恨的話，就不該再吃國君的俸祿。」母親說：「那至少讓國君知道你的
      想法，怎麼樣？」介之推說：「言語是身體的文飾。身體都要隱去了，何必再文飾？那是在求顯揚。」
      母親說：「你既然能這樣，我就跟你一起隱居。」於是母子一同隱居，直到去世。
  - speaker: 晉文公
    locus: 僖公二十四年
    quote: 以志吾過，且旌善人。
    translation: 用來記下我的過失，並且表彰善人。
sources:
  - source: zuo-zhuan
    locus: 僖公二十四年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/xi-gong-er-shi-si-nian
reliability: 信史
variants:
  - claim: >-
      介之推割股啖君、晉文公放火燒山逼介之推出來而介之推抱樹燒死、寒食之俗由此而起，
      這些說法都不見於《左傳》，是漢代以後層累而成的。
    source: xin-xu
    locus: 節士
significance: >-
  介之推批評的不是晉文公待他刻薄，而是同僚的一種認識錯誤：把歷史的偶然——晉獻公九子只剩文公在世、
  上天沒有斷絕晉國——當成自己的功勞。他說的「貪天之功以為己力」（白話：把上天的功勞據為己有，
  當作自己的力量），後來成為漢語中譏刺冒認成就最鋒利的話。難得的是晉文公沒有追逼，只把綿上劃為
  介之推的封田，用來記下自己的過失，這在春秋君主中十分罕見。
