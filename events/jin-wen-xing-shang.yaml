id: jin-wen-xing-shang
name: 晉文行賞
year: -636
year_note: 魯僖公二十四年
period: wu-ba
type: 行賞
states: [jin]
people: [jin-wen-gong, jie-zhi-tui]
narrative: >-
  晉文公返國即位，賞從亡者。介之推不言祿，祿亦弗及。

  推曰：「獻公之子九人，唯君在矣。惠、懷無親，外內棄之；天未絕晉，必將有主。主晉祀者，非君
  而誰？天實置之，而二三子以為己力，不亦誣乎？竊人之財，猶謂之盜，況貪天之功以為己力乎？下
  義其罪，上賞其姦，上下相蒙，難與處矣。」（白話：獻公的九個兒子，如今只剩國君一人在世。惠
  公、懷公沒有親信，內外都拋棄了他們；上天既未斷絕晉國，就必定會有新的君主。主持晉國宗祀的
  ，不是國君還會是誰？這實在是上天安排的，而那幾位卻當作自己的功勞，不是欺騙嗎？偷別人的財
  物尚且叫做盜，何況把上天的功勞據為己有？在下的人把罪過說成合理，在上的人賞賜這種奸偽，上
  下互相蒙蔽，難以相處了。）

  其母曰：「盍亦求之？以死誰懟？」（白話：何不也去求個賞賜？就這樣死了，你能怨誰？）對曰：
  「尤而效之，罪又甚焉。且出怨言，不食其食。」（白話：責怪別人卻又去仿效他，罪過更大。何況
  我已說出怨言，就不該再吃他的俸祿。）母曰：「亦使知之，若何？」（白話：至少讓國君知道你的
  想法，怎麼樣？）對曰：「言，身之文也。身將隱，焉用文之？是求顯也。」（白話：言語是身體的
  文飾。身體都要隱去了，何必再文飾它？那是在求顯揚。）遂與母偕隱而死。

  晉侯求之不獲，以綿上為之田，曰：「以志吾過，且旌善人。」（白話：用來記下我的過失，並且表彰善人。）
sources:
  - source: zuo-zhuan
    locus: 僖公二十四年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/xi-gong-er-shi-si-nian
reliability: 信史
variants:
  - claim: >-
      「割股啖君」「文公焚山逼其出而推抱樹死」（白話：晉文公放火燒山逼介之推出來，介之推抱著樹被燒死）「寒食之俗由此起」
      諸說皆不見於《左傳》，為漢代以後層累而成。
    source: xin-xu
    locus: 節士
significance: >-
  介之推所批評的不是文公的薄待，而是同僚的認識論錯誤：
  把歷史的偶然（獻公九子唯君在、天未絕晉）算作自己的功勞。
  「貪天之功」由此成為漢語中對「僭認成就」最鋒利的一個詞。
  值得注意的是文公的回應——不追不逼，而是立田為記「以志吾過」，
  這在春秋君主中極為罕見。
