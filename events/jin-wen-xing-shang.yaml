id: jin-wen-xing-shang
name: 晉文行賞
year: -636
year_note: 魯僖公二十四年
period: wu-ba
type: 行賞
states: [jin]
people: [jin-wen-gong, jie-zhi-tui]
narrative: >-
  晉文公返國即位，賞從亡者。介之推不言祿，祿亦弗及。

  推曰：「獻公之子九人，唯君在矣。惠、懷無親，外內棄之；
  天未絕晉，必將有主。主晉祀者，非君而誰？天實置之，
  而二三子以為己力，不亦誣乎？竊人之財，猶謂之盜，
  況貪天之功以為己力乎？下義其罪，上賞其姦，上下相蒙，難與處矣。」

  其母曰：「盍亦求之？以死誰懟？」對曰：
  「尤而效之，罪又甚焉。且出怨言，不食其食。」
  母曰：「亦使知之，若何？」對曰：
  「言，身之文也。身將隱，焉用文之？是求顯也。」
  遂與母偕隱而死。

  晉侯求之不獲，以綿上為之田，曰：「以志吾過，且旌善人。」
sources:
  - source: zuo-zhuan
    locus: 僖公二十四年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/xi-gong-er-shi-si-nian
reliability: 信史
variants:
  - claim: >-
      「割股啖君」「文公焚山逼其出而推抱樹死」「寒食之俗由此起」
      諸說皆不見於《左傳》，為漢代以後層累而成。
    source: xin-xu
    locus: 節士
significance: >-
  介之推所批評的不是文公的薄待，而是同僚的認識論錯誤：
  把歷史的偶然（獻公九子唯君在、天未絕晉）算作自己的功勞。
  「貪天之功」由此成為漢語中對「僭認成就」最鋒利的一個詞。
  值得注意的是文公的回應——不追不逼，而是立田為記「以志吾過」，
  這在春秋君主中極為罕見。
