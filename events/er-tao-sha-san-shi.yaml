id: er-tao-sha-san-shi
name: 二桃殺三士
year: -517
year_note: 齊景公時，年份不可確考
period: chun-qiu-late
type: 獻策
states: [qi]
people: [yan-ying, qi-jing-gong]
narrative: >-
  公孫接、田開疆、古冶子三人都在齊景公手下做事，以勇猛聞名，能徒手搏虎。一次晏子（晏嬰）
  從他們面前快步走過，這本是表示敬意的禮節，三人卻坐著不動，一點也不起身相迎。

  晏子入宮見齊景公，說這三個人對上不懂君臣的名分，對下不講尊卑的次序；靠他們既不能在
  國內禁絕暴亂，也不能對外威懾敵國，實在是危害國家的禍根，不如除掉。齊景公面有難色，說
  這三人硬抓怕抓不住，派人行刺又怕刺不中。晏子回答：他們都是仗著力氣硬拚強敵的人，向來
  不把長幼禮數放在眼裡。於是晏子請齊景公派人送去兩個桃子，傳話說：三位何不各自算算功勞，
  按功勞來分這兩個桃？

  公孫接仰天長嘆，說晏子真是聰明人：既然要按功勞分桃，不接受桃子就等於承認自己沒有勇氣。
  他自陳曾先後徒手搏殺一頭大野豬和一頭哺乳的母虎，說完便取走一個桃子。田開疆接著說，自己曾率兵兩度擊退
  敵軍，也取走一個桃子。兩個桃子就此分完。

  輪到古冶子，他說自己曾隨國君渡河，一頭大黿咬住左邊的驂馬，把馬拖進砥柱一帶的急流；他
  潛入水中，逆流走了一百步、又順流走了九里，殺掉大黿才浮出水面——這樣的功勞，本該獨得一個
  桃子，不與人平分。說罷他拔劍而起。公孫接、田開疆自愧勇力不及、功勞不如，卻搶先取桃而不
  相讓，這是貪；明知理虧還苟活，這是無勇。兩人都把桃子退還，自刎而死。

  古冶子見狀也羞愧難當：兩人為此而死，只有自己活著，這是不仁；用言語羞辱別人、又誇耀自己
  的名聲，這是不義；痛恨自己所做的事卻不肯去死，這是無勇。於是他也退還桃子，自刎而死。兩
  個桃子，就這樣要了三名勇士的命，這便是「二桃殺三士」的由來。
original:
  - speaker: 晏子
    locus: 內篇諫下
    quote: 今君之蓄勇力之士也，上無君臣之義，下無長率之倫，內不可以禁暴，外不可以威敵，此危國之器也，不若去之。
    translation: >-
      如今您所供養的這幾位勇士，對上不講君臣的名分，對下不守尊卑的次序；對內不能靠他們禁絕暴亂，
      對外不能靠他們威懾敵國。這是危害國家的禍根，不如除掉。
  - speaker: 晏子
    locus: 內篇諫下
    quote: 三子何不計功而食桃？
    translation: 三位何不各自算算功勞，按功勞來分食這桃？
  - speaker: 古冶子
    locus: 內篇諫下
    quote: >-
      吾嘗從君濟於河，黿銜左驂，以入砥柱之中流，當是時也，冶少不能遊，潛行逆流百步，順流九里，
      得黿而殺之，左操驂尾，右挈黿頭，鶴躍而出……若冶之功，亦可以食桃，而無與人同矣。
    translation: >-
      我曾隨國君渡河，一頭大黿咬住左邊的驂馬，把馬拖進砥柱一帶的急流。那時我年少，不會游泳，
      就潛在水底逆流走了一百步、又順流走了九里，抓到大黿把牠殺了，左手握著驂馬的尾巴，
      右手提著大黿的頭，像白鶴一樣躍出水面……像我這樣的功勞，也該獨得一個桃子，不與別人平分。
  - speaker: 公孫接、田開疆
    locus: 內篇諫下
    quote: 吾勇不子若，功不子逮，取桃不讓，是貪也；然而不死，無勇也。
    translation: >-
      我的勇不如你、功也比不上你，卻搶先取桃而不相讓，這是貪；
      明知如此還苟活下去，這是無勇。
  - speaker: 古冶子
    locus: 內篇諫下
    quote: 二子死之，冶獨生之，不仁；恥人以言，而誇其聲，不義；恨乎所行，不死，無勇。
    translation: >-
      那兩人為此而死，只有我活著，這是不仁；用言語羞辱別人、又誇耀自己的名聲，
      這是不義；痛恨自己所做的事卻不肯去死，這是無勇。
sources:
