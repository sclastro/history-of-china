reliability: 孤證
significance: >-
  先秦最冷峻的一則權術記錄。晏子沒有動用任何武力，只設計了一個資源不足的分配局面——三個人，
  兩個桃子——再把「計功而食桃」定為分配規則，剩下的事就交給三名勇士自己的榮譽感去完成。
  它揭示的道理是：當一群人共享同一套價值標準時，操縱那套標準，比直接對付那群人有效得多。
