id: er-tao-sha-san-shi
name: 二桃殺三士
year: -517
year_note: 齊景公時，年份不可確考
period: chun-qiu-late
type: 獻策
states: [qi]
people: [yan-ying, qi-jing-gong]
narrative: >-
  公孫接、田開疆、古冶子事齊景公，以勇力搏虎聞。晏子過而趨，三子者不起。

  晏子入見公曰：「此三子者，上無君臣之義，下無長率之倫，內不以禁暴，外不可威敵，此危國之器
  也，不若去之。」（白話：這三個人，對上沒有君臣之義，對下沒有尊卑之序，對內不能靠他們禁絕
  暴亂，對外不能靠他們威懾敵國——這是危害國家的東西，不如除掉。）公曰：「三子者，搏之恐不
  得，刺之恐不中也。」（白話：這三個人，硬抓怕抓不住，行刺怕刺不中。）晏子曰：「此皆力攻勍
  敵之人也，無長幼之禮。」（白話：他們都是憑力氣攻擊強敵的人，不懂長幼之禮。）因請公使人饋
  之二桃，曰：「三子何不計功而食桃？」

  公孫接仰天而歎曰：「晏子，智人也……夫子言功而食桃，是欲上眾臣、下庶民也。」（白話：晏子
  真是有智慧的人……他讓國君以計功來分桃，是要把眾臣排在上、把百姓排在下。）乃自陳搏乳虎、
  搏豨之功，取桃而起。田開疆曰：「吾仗兵而卻三軍者再。」亦取桃而起。古冶子曰：「吾嘗從君濟
  于河，黿銜左驂以入砥柱之流，吾潛行逆流百步、順流九里，殺黿而出……若冶之功，亦可以食桃而
  無與人同矣。」（白話：我曾隨國君渡河，大黿咬住左驂馬拖入砥柱的急流，我潛行逆流百步、順流
  九里，殺了黿才出來……像我這樣的功勞，該獨得一桃而不與人分。）抽劍而起。

  公孫接、田開疆曰：「吾勇不子若，功不子逮，取桃不讓，是貪也；然而不死，無勇也。」（白話：
  我的勇不如你、功不及你，取了桃卻不謙讓，這是貪；明知如此還不死，這是無勇。）皆反其桃，挈
  領而死。古冶子曰：「二子死之，冶獨生之，不仁；恥人以言而夸其聲，不義；恨乎所行，不死，無
  勇。」（白話：那兩人為此而死，只有我活著，這是不仁；用言語羞辱別人又誇耀自己的名聲，這是
  不義；痛恨自己的所作所為卻不去死，這是無勇。）亦反其桃，挈領而死。
