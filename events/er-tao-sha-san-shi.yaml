id: er-tao-sha-san-shi
name: 二桃殺三士
year: -517
year_note: 齊景公時，年份不可確考
period: chun-qiu-late
type: 獻策
states: [qi]
people: [yan-ying, qi-jing-gong]
narrative: >-
  公孫接、田開疆、古冶子事齊景公，以勇力搏虎聞。
  晏子過而趨，三子者不起。

  晏子入見公曰：「此三子者，上無君臣之義，下無長率之倫，
  內不以禁暴，外不可威敵，此危國之器也，不若去之。」
  公曰：「三子者，搏之恐不得，刺之恐不中也。」
  晏子曰：「此皆力攻勍敵之人也，無長幼之禮。」
  因請公使人饋之二桃，曰：「三子何不計功而食桃？」

  公孫接仰天而歎曰：「晏子，智人也……夫子言功而食桃，
  是欲上眾臣、下庶民也。」乃自陳搏乳虎、搏豨之功，取桃而起。
  田開疆曰：「吾仗兵而卻三軍者再。」亦取桃而起。
  古冶子曰：「吾嘗從君濟于河，黿銜左驂以入砥柱之流，
  吾潛行逆流百步、順流九里，殺黿而出……若冶之功，亦可以食桃而無與人同矣。」
  抽劍而起。

  公孫接、田開疆曰：「吾勇不子若，功不子逮，取桃不讓，是貪也；
  然而不死，無勇也。」皆反其桃，挈領而死。
  古冶子曰：「二子死之，冶獨生之，不仁；恥人以言而夸其聲，不義；
  恨乎所行，不死，無勇。」亦反其桃，挈領而死。
sources:
  - source: yanzi-chun-qiu
    locus: 內篇諫下
    ctext_urn: ctp:yanzi-chun-qiu/nei-pian/jian-xia
reliability: 孤證
significance: >-
  先秦最冷峻的一則權術記錄。晏子沒有動用任何暴力，
  他只是設計了一個資源短缺的分配情境（三人二桃），
  再把「計功」定為分配規則——剩下的事，由三人自己的榮譽感完成。
  它揭示的是：當一群人共享同一套價值標準時，
  操縱那套標準比操縱那群人有效得多。
