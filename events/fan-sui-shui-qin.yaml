id: fan-sui-shui-qin
name: 范睢說秦昭王
year: -266
year_note: 秦昭王四十一年
period: zhan-guo-late
type: 獻策
states: [qin, wei, han, tian-qi]
people: [fan-sui, qin-zhao-xiang-wang]
narrative: >-
  范睢原是魏國人。他曾被懷疑向外洩露國家機密，遭魏國宰相魏齊幾乎打死。
  他改名張祿，逃到秦國，上書求見秦昭王。昭王在離宮接見他，屏退左右侍從，
  跪直身子向他請教。

  范睢先指出秦國當前戰略的根本錯誤：繞過韓、魏兩國，去攻打遠方的齊國。
  他認為，韓、魏兩國位處中原，是天下的樞紐；大王如果想稱霸，一定要先親近中原、
  掌握這個樞紐，用來威懾楚國和趙國。

  接著他提出四字方針——「遠交近攻」，也就是結交遠方的國家、攻打鄰近的國家。
  他的理由很實際：秦國攻打遠方的齊國，就算打贏，那塊土地既連不上本土，
  又守不住，最後還是歸了韓、魏；攻打相鄰的韓、魏，奪得一寸就實實在在多一寸。

  昭王採納了這個建議。范睢又替秦國籌劃：出兵攻取韓國的滎陽，北面切斷太行山的通道，
  就能把韓國截成三段，逼它就範；同時用外交手段穩住齊、楚兩國。後來長平之戰時，
  齊國拒絕借糧給趙國，一說正是這套策略見效的結果。

  范睢還勸昭王廢黜宣太后，驅逐穰侯魏冉等四位當權貴戚，把君權收回到自己手裡。
  前 266 年，昭王任命范睢為宰相，封他為應侯。
original:
  - speaker: 秦昭王與范睢
    locus: 范睢蔡澤列傳
    quote: >-
      秦王跽而請曰：「先生何以幸教寡人？」范睢曰：「唯唯。」有閒，秦王復跽而請曰：
      「先生何以幸教寡人？」范睢曰：「唯唯。」若是者三。
    translation: >-
      秦昭王跪直身子請教：「先生打算拿甚麼來指教我？」范睢只應了一聲「是、是」。
      過了一會，昭王又跪直身子請教：「先生打算拿甚麼來指教我？」范睢還是只答「是、是」。這樣一連三次。
  - speaker: 范睢
    locus: 范睢蔡澤列傳
    quote: 今夫韓、魏，中國之處而天下之樞也。王其欲霸，必親中國以為天下樞，以威楚、趙。
    translation: >-
      如今韓、魏兩國處在中原，是天下的樞紐。大王如果想稱霸，一定要先親近中原、
      掌握這個樞紐，藉此威懾楚國和趙國。
  - speaker: 范睢
    locus: 范睢蔡澤列傳
    quote: 王不如遠交而近攻，得寸則王之寸也，得尺亦王之尺也。
    translation: >-
      大王不如結交遠方、攻打鄰近，奪得一寸就是大王的一寸，奪得一尺也是大王的一尺。
sources:
  - source: shiji
    locus: 范睢蔡澤列傳
    ctext_urn: ctp:shiji/fan-sui-cai-ze-lie-zhuan
reliability: 信史
significance: >-
  「遠交近攻」成為戰國後期秦國統一天下的定型戰略。它比穰侯越過韓、魏去攻齊高明的地方，
  不在道義，而在地理與守成：奪來的土地要能連得上、守得住，才算數。范睢說「得寸則王之寸也，得尺亦王之尺也」
  （白話：奪得一寸就是大王的一寸，奪得一尺也是大王的一尺）。這一條同時解釋了秦國為何能在長平之後逐一擊破六國——
  六國之間始終沒有結成穩固的合縱，正因為秦國一直用外交把它們切開。
