reliability: 信史
significance: >-
  「遠交近攻」是戰國後期秦國統一戰略的定型，
  而它之所以比穰侯的「越韓魏而攻齊」高明，理由完全不在道義，在**地理與守成**：
  奪來的土地要能連得上、守得住，才算數。
  這一條同時解釋了秦國為何在長平之後仍能逐一擊破——
  六國之間始終沒有形成穩定的合縱，正因為秦國一直在用外交切開它們。
