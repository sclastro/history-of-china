id: fan-sui-shui-qin
name: 范睢說秦昭王
year: -266
year_note: 秦昭王四十一年
period: zhan-guo-late
type: 獻策
states: [qin, wei, han, qi]
people: [fan-sui, qin-zhao-xiang-wang]
narrative: >-
  范睢本是魏人，因被疑洩露國情而幾乎被魏相魏齊打死，改名張祿逃入秦國。
  他上書求見，秦昭王在離宮接見，屏退左右，長跪請教。

  他先指出秦國當前戰略的根本錯誤：越過韓、魏去攻打齊國。
  「今夫韓、魏，中國之處而天下之樞也。王其欲霸，必親中國以為天下樞，
  以威楚、趙。」（白話：如今韓、魏處在中原，是天下的樞紐。
  大王若想稱霸，一定要先親近中原以掌握這個樞紐，藉此威懾楚國與趙國。）

  然後提出那八個字：

  「王不如遠交而近攻，得寸則王之寸也，得尺亦王之尺也。」
  （白話：大王不如結交遠方而攻打鄰近，
  奪得一寸就是大王的一寸，奪得一尺也是大王的一尺。）

  他的論據很實際：攻打遠方的齊國，就算打贏，那塊地秦國也守不住、連不上，
  最後仍歸韓魏；而攻打相鄰的韓魏，奪一寸就實實在在多一寸。

  昭王採納。此後秦國先取韓之滎陽、斷太行之道，再逼三晉，
  而以外交穩住齊楚——長平之戰時齊國拒絕借糧給趙國，正是這套策略的結果。

  范睢又勸昭王廢宣太后、驅逐穰侯魏冉等四貴，把君權收回。
  前266年拜為相，封應侯。
sources:
