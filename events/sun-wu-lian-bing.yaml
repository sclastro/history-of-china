reliability: 大體可信
significance: >-
  「三令五申」的出處，而它的重點在孫武兩次認錯的次序。
  第一次不從，他歸咎於自己——號令沒有講清楚；
  第二次不從，他才歸咎於執行者。
  也就是說，罰之前先窮盡了自己的責任。
  這一層次序是整套軍法能夠成立的前提：
  沒有申明在先的處罰，只是暴力。
