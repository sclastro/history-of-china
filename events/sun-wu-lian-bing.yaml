id: sun-wu-lian-bing
name: 孫武練兵
year: -512
year_note: 吳王闔閭三年前後
period: chun-qiu-late
type: 論政
states: [wu]
people: [sun-wu, wu-zi-xu]
narrative: >-
  伍子胥七次向吳王闔閭推薦孫武。闔閭讀過他的兵法十三篇，問：
  「可以小試勒兵乎？」（白話：可以拿來小規模試著操練軍隊嗎？）孫武說可以。
  闔閭又問可不可以用婦人試，孫武也說可以。

  於是宮中出美女一百八十人，孫武分為兩隊，以闔閭最寵愛的兩名姬妾為隊長，
  人人手執戟。他先講明前後左右的口令，反覆申明三次、告誡五次，然後擊鼓下令向右。
  婦人大笑，隊形不動。

  孫武說：「約束不明，申令不熟，將之罪也。」
  （白話：紀律不明、號令不熟，是將領的過錯。）於是再次申明，又擊鼓下令向左。
  婦人仍然大笑。

  孫武說：「約束不明，申令不熟，將之罪也；既已明而不如法者，吏士之罪也。」
  （白話：紀律不明、號令不熟是將領的過錯；已經講明白了還不照做，
  就是軍吏士卒的過錯。）下令斬兩名隊長。

  闔閭在台上看見，急忙派人傳話：寡人已經知道將軍能用兵了，
  沒有這兩個姬妾，寡人吃飯都不香，請不要殺。

  孫武答：「臣既已受命為將，將在軍，君命有所不受。」
  （白話：臣既然已受命為將，將領在軍中，君主的命令有時可以不接受。）
  仍然斬了，另立次一位為隊長。

  再擊鼓，婦人左右前後跪起都合乎規矩，鴉雀無聲。孫武派人回報：
  兵已整齊，大王可以下來察看，任憑差遣，赴湯蹈火也可以。
  闔閭說：將軍請回館舍休息，寡人不想下去看。孫武說：
  「王徒好其言，不能用其實。」（白話：大王只是喜歡兵法的言辭，
  不能真正用它的實質。）闔閭終於知道他能用兵，任為將。
sources:
  - source: shiji
    locus: 孫子吳起列傳
