id: sun-wu-lian-bing
name: 孫武練兵
year: -512
year_note: 吳王闔閭三年前後
period: chun-qiu-late
type: 論政
states: [wu]
people: [sun-wu, wu-zi-xu]
narrative: >-
  齊國人孫武帶著他的兵法求見吳王闔閭（據《吳越春秋》，伍子胥曾七次向闔閭推薦他）。
  闔閭說，孫武的十三篇他已經全部讀過，問能不能小規模地試著操練一下軍隊。孫武說可以。
  闔閭又問能不能用婦人來試，孫武也說可以。

  於是闔閭從宮中挑出一百八十名美女。孫武把她們分成兩隊，讓闔閭最寵愛的兩名姬妾分別擔任隊長，
  人人手持長戟。他先問：你們知道自己的心口、左右手和背在哪裡嗎？眾人說知道。他便規定：
  向前就看心口所對的方向，向左看左手，向右看右手，向後看背後。眾人都答應了。
  紀律宣布之後，他擺出斧鉞等刑具，又把命令反覆申明了許多遍。

  孫武擊鼓，下令向右，婦人們卻哈哈大笑。孫武說：紀律講得不清楚，命令交代得不熟，
  這是將領的過錯。於是又把命令反覆申明，再擊鼓下令向左，婦人們仍然大笑。這一次孫武說：
  紀律講得不清楚、命令交代得不熟，是將領的過錯；已經講清楚了還不照做，那就是軍吏士卒的過錯。
  他下令要斬左右兩名隊長。

  闔閭在臺上觀看，見孫武要殺自己的寵姬，大吃一驚，急忙派人傳話：我已經知道將軍能用兵了，
  沒有這兩名姬妾，我吃飯也不香，請不要殺她們。孫武回答：我既然已經受命為將，
  將領在軍中，君主的命令有時可以不接受。他還是殺了兩名隊長示眾，改由次一位的人擔任隊長，
  再次擊鼓。這一次，婦人們向左向右、向前向後、跪下起立，全都合乎規矩，沒有一個人敢出聲。

  孫武派人回報闔閭：隊伍已經整齊，大王可以下來察看，任憑大王差遣，就是叫她們赴湯蹈火也可以。
  闔閭說：將軍回館舍休息吧，我不想下去看了。孫武說：大王只是喜歡兵法的言辭，
  卻不能真正運用它的實質。闔閭這才知道孫武確實能用兵，終於任命他為將軍。
  後來吳國向西打敗強大的楚國、攻入郢都，向北威震齊國和晉國，孫武出了很大的力。
original:
  - locus: 孫子吳起列傳
    quote: >-
      約束既布，乃設鈇鉞，即三令五申之。於是鼓之右，婦人大笑。孫子曰：「約束不明，申令不熟，
      將之罪也。」
    translation: >-
      紀律宣布之後，孫武擺出斧鉞等刑具，又把命令反覆申明許多遍。於是擊鼓下令向右，婦人們哈哈大笑。
      孫武說：「紀律講得不清楚，命令交代得不熟，這是將領的過錯。」
  - speaker: 孫武
    locus: 孫子吳起列傳
    quote: >-
      約束不明，申令不熟，將之罪也；既已明而不如法者，吏士之罪也。
    translation: >-
      紀律講得不清楚、命令交代得不熟，是將領的過錯；已經講清楚了還不照做，那就是軍吏士卒的過錯。
  - speaker: 闔閭與孫武
    locus: 孫子吳起列傳
    quote: >-
      趣使使下令曰：「寡人已知將軍能用兵矣。寡人非此二姬，食不甘味，願勿斬也。」
      孫子曰：「臣既已受命為將，將在軍，君命有所不受。」
    translation: >-
      闔閭急忙派人傳令說：「我已經知道將軍能用兵了。我沒有這兩名姬妾，吃飯也不香，
      請不要殺她們。」孫武說：「我既然已經受命為將，將領在軍中，君主的命令有時可以不接受。」
  - speaker: 孫武
    locus: 孫子吳起列傳
    quote: >-
      王徒好其言，不能用其實。
    translation: >-
      大王只是喜歡兵法的言辭，卻不能真正運用它的實質。
