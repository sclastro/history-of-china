id: shang-yang-zhi-si
name: 商鞅之死
year: -338
year_note: 秦孝公二十四年
period: zhan-guo-early
type: 內亂
states: [qin]
people: [shang-yang, qin-xiao-gong]
narrative: >-
  商鞅在秦國做了十年相國，秦國的宗室和貴戚很多都怨恨他。有一位叫趙良的人來見商鞅，
  直言他的處境：商鞅當初靠寵臣景監引見才得到孝公任用，執政後又處罰太子的師傅、用嚴刑傷害百姓，
  積下的怨恨太多；他每次出門都要大批甲士和戰車護衛，少了一樣就不敢上路。趙良說，商鞅的處境
  危險得像早晨的露水，太陽一出就會消失，勸他把封地商於的十五個城邑交還國家，退到鄉間種菜園，
  或許還能稍保平安；否則一旦孝公去世，秦國要收拾他的人絕不會少。商鞅沒有聽從。

  五個月後，秦孝公去世，太子即位，就是秦惠文王。從前被商鞅處罰過的公子虔一派人，
  隨即告發商鞅謀反。惠文王派官吏去逮捕他。

  商鞅逃到邊關附近，想在旅舍投宿。旅舍主人不知道他就是商鞅，說：按商君定下的法令，
  收留沒有身分憑證的客人，主人要一同治罪。商鞅長歎，說自己制定的法令，弊害竟到了這個地步。

  他逃到魏國。魏國人恨他當年欺騙並俘虜公子卬、打敗魏軍，不肯收留。商鞅想轉往別國，
  魏國人說，商鞅是秦國的罪人，秦國強大，它的罪人逃進魏國而不送回去，後果不堪設想，
  於是把他送回秦國。

  商鞅回到秦國後，逃往自己的封地商邑，帶領門客和部屬，調動商邑的兵力向北攻打鄭縣。
  秦國派兵進攻，在鄭縣的黽池把他殺死。秦惠文王把商鞅的屍體車裂示眾，宣告說：誰也不要像商鞅
  那樣謀反！又把他全家誅滅。

  然而商鞅的法令沒有因他的死而廢除。秦國此後一直沿用這套制度，最終統一了天下。
original:
  - speaker: 趙良
    locus: 商君列傳
    quote: >-
      君之危若朝露，尚將欲延年益壽乎？則何不歸十五都，灌園於鄙，勸秦王顯巖穴之士，養老存孤，
      敬父兄，序有功，尊有德，可以少安。
    translation: >-
      您的處境危險得像早晨的露水，還想著延年益壽嗎？那為甚麼不把十五個城邑交還國家，到鄉間去種菜園，
      勸秦王起用隱居山野的賢士，奉養老人、撫恤孤兒，尊敬父兄，按功勞排定次序，尊重有德行的人？
      這樣或許還能稍保平安。
  - locus: 商君列傳
    quote: >-
      商君亡至關下，欲舍客舍。客人不知其是商君也，曰：「商君之法，舍人無驗者坐之。」
      商君喟然嘆曰：「嗟乎，為法之敝一至此哉！」
    translation: >-
      商鞅逃到邊關附近，想在旅舍投宿。旅舍主人不知道他就是商鞅，說：「按商君的法令，
      收留沒有身分憑證的客人，主人要一同治罪。」商鞅長歎道：「唉，制定法令的弊害竟到了這個地步！」
  - speaker: 魏人
    locus: 商君列傳
    quote: >-
      商君，秦之賊。秦彊而賊入魏，弗歸，不可。
    translation: >-
      商鞅是秦國的罪人。秦國強大，它的罪人逃進魏國，我們不送回去是不行的。
  - locus: 商君列傳
    quote: >-
      秦發兵攻商君，殺之於鄭黽池。秦惠王車裂商君以徇，曰：「莫如商鞅反者！」遂滅商君之家。
    translation: >-
      秦國派兵進攻商鞅，在鄭縣的黽池把他殺死。秦惠文王把商鞅的屍體車裂示眾，說：
      「誰也不要像商鞅那樣謀反！」又把他全家誅滅。
sources:
  - source: shiji
    locus: 商君列傳
    ctext_urn: ctp:shiji/shang-jun-lie-zhuan
reliability: 大體可信
notes: >-
  「為法之敝一至此哉」據通行本；維基文庫所據版本作「為法自斃一至此哉」。
significance: >-
  「作法自斃」的原始場景。它的反諷不在商鞅死於自己的法令，而在那條法令確實生效了：
  一個素不相識的旅舍主人，在不知對方身分的情況下照章辦事，正說明變法已經深入民間。
  人死而法存，秦國靠這套制度統一天下，這在戰國變法中極為少見。
