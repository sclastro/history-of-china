id: shang-yang-zhi-si
name: 商鞅之死
year: -338
period: zhan-guo-early
type: 內亂
states: [qin]
people: [shang-yang, qin-xiao-gong]
narrative: >-
  商鞅相秦十年，宗室貴戚多怨望。趙良見商君，勸之「歸十五都，灌園於鄙」（白話：把封地十五都
  交還，到鄉間去種菜園），曰「君之危若朝露，尚將欲延年益壽乎」（白話：您的處境危險得像早晨
  的露水，還想著延年益壽嗎），商君弗從。

  後五月而孝公卒，太子立（惠文王）。公子虔之徒告商君欲反，發吏捕之。商君亡至關下，欲舍客舍
  。客人不知其是商君也，曰：「商君之法，舍人無驗者坐之。」（白話：按商君的法令，收留沒有身
  分憑證的人，主人要連坐。）商君喟然歎曰：「嗟乎，為法之敝一至此哉！」（白話：唉，制定法令
  的弊害竟到了這個地步！）

  去之魏。魏人怨其欺公子卬而破魏師，弗受。商君欲之他國，魏人曰：「商君，秦之賊。秦強而賊入
  魏，弗歸，不可。」（白話：商君是秦國的罪人。秦國強大而它的罪人逃入魏國，不遣返回去，是不
  行的。）遂內秦。商君既復入秦，走商邑，與其徒屬發邑兵北出擊鄭。秦發兵攻商君，殺之於鄭黽池
  。秦惠王車裂商君以徇，曰：「莫如商鞅反者！」遂滅商君之家。

  然其法未廢——秦卒以此并天下。
sources:
  - source: shiji
    locus: 商君列傳
    ctext_urn: ctp:shiji/shang-jun-lie-zhuan
reliability: 大體可信
significance: >-
  「作法自斃」的原始場景。它的反諷不在於商鞅死於自己的法，
  而在於那條法**確實生效了**——客舍主人不敢收留無驗之人，
  正說明變法成功。制度一旦真正建立，就不再認得它的創造者。
  這是先秦對「非人格化統治」最早、也最慘烈的一次演示。
