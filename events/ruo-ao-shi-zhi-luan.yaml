id: ruo-ao-shi-zhi-luan
name: 若敖氏之亂
year: -605
year_note: 魯宣公四年
period: wu-ba
type: 內亂
states: [chu]
people: [dou-yue-jiao, dou-zi-wen, chu-zhuang-wang]
narrative: >-
  若敖氏是楚國勢力最強的公族。令尹鬬子文的弟弟子良生了兒子鬬越椒。子文看見這孩子，
  斷定他將來會給家族帶來災禍，主張立刻殺掉他。他說這孩子長著熊虎般的形貌、豺狼般的聲音，
  留著不殺，日後必定滅掉若敖氏；俗話說「狼子野心」，這孩子就是一頭狼，怎麼能養呢？
  子良不肯下手。

  子文臨死前把族人召集起來，叮囑他們：一旦越椒掌權，你們就趕快逃走，免遭禍害。
  說完流著淚感歎，鬼尚且要求人祭祀，若敖氏將來只怕連血食都斷了、要餓肚子了。

  子文死後，越椒果然逐步坐大，當上令尹。前 605 年，他囚禁並殺掉了司馬蔿賈，佔據烝野，起兵攻打楚莊王。
  兩軍在皋滸交戰。越椒連射兩箭射向莊王：一箭飛過車轅，釘在鼓架上；一箭射穿車蓋。
  楚軍見他箭法驚人，軍心一度動搖。

  楚莊王於是派人在軍中傳話：先君楚文王攻克息國時得到三支好箭，越椒偷去了兩支，現在已經用完了。
  士氣重新振作起來，楚軍大敗越椒，把若敖氏一族滅掉。
original:
  - speaker: 鬬子文
    locus: 宣公四年
    quote: >-
      必殺之。是子也，熊虎之狀而豺狼之聲；弗殺，必滅若敖氏矣。諺曰「狼子野心」，
      是乃狼也，其可畜乎？
    translation: >-
      一定要殺掉他。這孩子長著熊虎的形貌、豺狼的聲音；不殺，日後必定滅掉若敖氏。
      俗話說「狼子野心」——他就是一頭狼，怎麼養得住？
  - speaker: 鬬子文
    locus: 宣公四年
    quote: 鬼猶求食，若敖氏之鬼不其餒而！
    translation: 鬼尚且要求人祭祀，若敖氏的鬼恐怕要餓肚子了！
sources:
  - source: zuo-zhuan
    locus: 宣公四年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/xuan-gong-si-nian
reliability: 大體可信
significance: >-
  楚莊王藉這一仗剪除了最強的公族若敖氏，此後楚國王權大振，八年後才有邲之戰的勝利——
  對內集權在前，對外稱霸在後。子文「狼子野心」的預言，是以形貌斷定心性的典型；
  《左傳》記下這句話並讓它一一應驗，本身就是一種史觀的表態。
