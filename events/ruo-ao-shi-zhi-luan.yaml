id: ruo-ao-shi-zhi-luan
name: 若敖氏之亂
year: -605
year_note: 魯宣公四年
period: wu-ba
type: 內亂
states: [chu]
people: [dou-yue-jiao, dou-zi-wen, chu-zhuang-wang]
narrative: >-
  若敖氏是楚國最強的公族。令尹鬬子文的弟弟子良生下兒子越椒，子文看了說：

  「必殺之。是子也，熊虎之狀而豺狼之聲；弗殺，必滅若敖氏矣。諺曰『狼子野心』，是乃狼也，
  其可畜乎？」（白話：一定要殺掉他。這孩子有熊虎的形貌、豺狼的聲音；不殺，必定滅掉若敖氏。
  俗話說「狼崽子有兇野的本性」——他就是一頭狼，怎麼養得？）

  子良不肯。子文臨死前召集族人說：等越椒掌權，你們就趕快逃走。說完流著淚說：
  「鬼猶求食，若敖氏之鬼不其餒而！」（白話：鬼尚且要求人祭祀，若敖氏的鬼恐怕要餓肚子了！）

  前605年，越椒殺了令尹蔿賈，據守烝野，起兵攻打楚莊王。兩軍戰於皋滸。越椒連射兩箭，
  一箭穿過車轅釘在鼓架上，一箭穿過車蓋，楚軍為之動搖。莊王派人在軍中傳言：
  這是先君文王所遺的神箭，敵人已經射完了。士氣復振，遂大敗越椒，滅若敖氏。
sources:
  - source: zuo-zhuan
    locus: 宣公四年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/xuan-gong-si-nian
reliability: 大體可信
significance: >-
  楚莊王藉此一舉剪除最強的公族，此後楚國王權大振，
  三年後才有邲之戰的勝利——內部集權在前，對外稱霸在後。
  而子文的預言是「以形貌斷心性」的典型，
  《左傳》把它記下來並讓它應驗，本身就是一種史觀的表態。
