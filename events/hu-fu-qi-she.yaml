    ctext_urn: ctp:zhan-guo-ce/zhao-er
reliability: 信史
significance: >-
  戰國唯一一次以「向被視為野蠻者學習」為內容的改革，
  阻力因此不在利益而在認同——公子成反對的理由是文化尊嚴，不是成本。
  武靈王的回應把問題重新定義為功能性的：
  「服者所以便用，禮者所以便事」——衣冠與禮制都是工具，
  工具好不好用，只看事情辦不辦得成。
  這是先秦最徹底的一次工具理性宣言。
