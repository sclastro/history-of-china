id: hu-fu-qi-she
name: 胡服騎射
year: -307
year_note: 趙武靈王十九年
period: zhan-guo-mid
type: 變法
states: [zhao, zhongshan]
people: [zhao-wu-ling-wang]
narrative: >-
  前 307 年，趙武靈王向北進攻中山國的土地，一路到了房子、代地，北面直到無窮，西面到達黃河，
  登上黃華山。他跟大臣肥義商量，打算讓百姓改穿胡人的服裝、學習騎馬射箭。他說：愚昧的人會嘲笑
  這件事，明智的人卻看得明白；就算全天下都來笑他，胡人的土地和中山國他也一定要拿到手。

  趙武靈王的叔父公子成反對，藉口生病不肯上朝。他認為，中原是聰明智慧之人聚居的地方，是各種
  財貨匯集的地方，是賢人聖人施行教化、仁義得以推行的地方。如今大王捨棄這一切，去仿效遠方胡人
  的服飾，改變古人的教化和常道，違背眾人的心意。他請大王三思。

  趙武靈王親自登門去說服他。他說：衣服是為了穿著方便，禮制是為了辦事方便。聖人觀察各地風俗，
  順應當地所宜；因應實際情形，制定合適的禮制，目的都是使百姓得利、使國家富強。各地風俗不同，
  便利卻是一致的；趙國西面與樓煩、秦、韓接壤，卻沒有騎射的防備，所以非改不可。
  公子成聽了，行大禮拜服，接受了胡服，第二天就穿著胡服上朝。趙武靈王隨即正式頒下改穿胡服的命令。

  大臣趙文、趙造、周袑、趙俊等人仍然勸阻，認為照舊法行事比較穩妥。趙武靈王反駁：治理天下
  不必只用一種辦法，便利國家也不必效法古人。聖人興起，並不是靠因襲前人才能稱王；夏、商衰亡，
  正是因為不肯改變舊禮才滅亡。這樣看來，違反古法未必該責備，墨守舊禮也未必值得稱讚。

  從此趙國有了騎兵之利，向北打敗林胡、樓煩，又沿著代地、陰山一線修築長城，一直到高闕設立要塞。
  前 296 年，趙國滅掉中山國。
original:
  - speaker: 趙武靈王
    locus: 趙世家
    quote: 愚者所笑，賢者察焉。世有順我者，胡服之功未可知也。雖驅世以笑我，胡地中山吾必有之。
    translation: >-
      愚昧的人會嘲笑，明智的人卻看得明白。世人如果肯順從我，改穿胡服的功效還難以估量。
      就算全天下都來笑我，胡人的土地和中山國我也一定要拿到手。
  - speaker: 公子成
    locus: 趙世家
    quote: >-
      臣聞中國者，蓋聰明徇智之所居也，萬物財用之所聚也，賢聖之所教也，仁義之所施也，詩書禮樂之所用也，
      異敏技能之所試也，遠方之所觀赴也，蠻夷之所義行也。今王舍此而襲遠方之服，變古之教，易古之道，
      逆人之心，而怫學者，離中國，故臣願王圖之也。
    translation: >-
      我聽說中原這地方，是聰明智慧的人聚居之處，是各種財貨匯集之處，是賢人聖人施行教化、
      仁義得以推行之處，是詩書禮樂通行、各種技藝一顯身手之處，是遠方的人前來瞻仰、四方蠻夷
      效法行事之處。如今大王捨棄這一切，去仿效遠方胡人的服飾，改變古人的教化、變易古人的常道，
      違背眾人的心意，令讀書人反感，離開了中原之風，所以我希望大王三思。
  - speaker: 趙武靈王
    locus: 趙世家
    quote: 夫服者，所以便用也；禮者，所以便事也。聖人觀鄉而順宜，因事而制禮，所以利其民而厚其國也。
    translation: >-
      衣服是為了穿著方便，禮制是為了辦事方便。聖人觀察各地風俗，順應當地所宜；因應實際情形，
      制定合適的禮制，目的都是使百姓得利、使國家富強。
  - locus: 趙世家
    quote: 乃賜胡服。明日，服而朝。於是始出胡服令也。
    translation: 於是賜給公子成胡服。第二天，他就穿著胡服上朝。趙國從此正式頒下改穿胡服的命令。
  - speaker: 趙武靈王（答趙造）
    locus: 趙策二
    source: zhan-guo-ce
    ctext_urn: ctp:zhan-guo-ce/zhao-er
    quote: >-
      故禮世不必一其道，便國不必法古。聖人之興也，不相襲而王。夏、殷之衰也，不易禮而滅。
      然則反古未可非，而循禮未足多也。
    translation: >-
      所以治理天下不必只用一種辦法，便利國家也不必效法古人。聖人興起，並不是靠因襲前人才能稱王；
      夏、商衰亡，正是因為不肯改變舊禮才滅亡。這樣看來，違反古法未必該責備，墨守舊禮也未必值得稱讚。
sources:
  - source: shiji
    locus: 趙世家
    ctext_urn: ctp:shiji/zhao-shi-jia
  - source: zhan-guo-ce
    locus: 趙策二
    ctext_urn: ctp:zhan-guo-ce/zhao-er
reliability: 信史
significance: >-
  戰國變法中唯一以向胡人學習為內容的一次。阻力不在利益，而在文化認同——
  公子成反對的理由是中原的文明尊嚴，不是成本高低。趙武靈王的回應把問題重新定義為實用：
  「服者，所以便用也；禮者，所以便事也」（白話：衣服是為了穿著方便，禮制是為了辦事方便）。
  在他看來，衣冠和禮制都只是工具，工具好不好，只看事情辦不辦得成。這是先秦最徹底的一次
  工具理性宣言。
