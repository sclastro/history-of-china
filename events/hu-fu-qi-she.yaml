id: hu-fu-qi-she
name: 胡服騎射
year: -307
year_note: 趙武靈王十九年
period: zhan-guo-mid
type: 變法
states: [zhao, zhongshan]
people: [zhao-wu-ling-wang]
narrative: >-
  趙武靈王北略中山之地，至房子，遂之代、北至無窮、西至河、登黃華之上，
  與肥義謀胡服騎射以教百姓，曰：
  「愚者所笑，賢者察焉。雖驅世以笑我，胡地中山吾必有之。」

  公子成稱疾不朝，曰：「中國者，蓋聰明徇智之所居也，
  萬物財用之所聚也，賢聖之所教也，仁義之所施也……
  今王舍此而襲遠方之服，變古之教、易古之道，逆人之心……臣願王圖之。」

  王自往請之曰：「夫服者，所以便用也；禮者，所以便事也。
  聖人觀鄉而順宜，因事而制禮，所以利其民而厚其國也……
  故禮世不必一其道，便國不必法古。
  聖人之興也，不相襲而王；夏殷之衰也，不易禮而滅。
  然則反古未可非，而循禮未足多也。」
  公子成再拜稽首，乃賜胡服。明日服而朝，於是始出胡服令。

  趙自此有騎兵之利，北破林胡、樓煩，築長城自代并陰山下至高闕為塞，
  前 296 年滅中山。
sources:
  - source: shiji
    locus: 趙世家
