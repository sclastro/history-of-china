id: hu-fu-qi-she
name: 胡服騎射
year: -307
year_note: 趙武靈王十九年
period: zhan-guo-mid
type: 變法
states: [zhao, zhongshan]
people: [zhao-wu-ling-wang]
narrative: >-
  趙武靈王北略中山之地，至房子，遂之代、北至無窮、西至河、登黃華之上，與肥義謀胡服騎射以教
  百姓，曰：「愚者所笑，賢者察焉。雖驅世以笑我，胡地中山吾必有之。」（白話：愚昧的人會嘲笑
  ，明智的人卻能明察。就算全天下都來笑我，胡人的土地與中山國我也一定要拿到手。）

  公子成稱疾不朝，曰：「中國者，蓋聰明徇智之所居也，萬物財用之所聚也，賢聖之所教也，仁義之
  所施也……今王舍此而襲遠方之服，變古之教、易古之道，逆人之心……臣願王圖之。」（白話：中
  原這地方，是聰明智慧之人所居，是萬物財貨所聚，是賢聖施行教化、仁義得以推行之處……如今大
  王捨棄這些而去仿效遠方的服飾，改變古人的教化、變易古人的常道，違逆人心……臣希望大王三思
  。）

  王自往請之曰：「夫服者，所以便用也；禮者，所以便事也。聖人觀鄉而順宜，因事而制禮，所以利
  其民而厚其國也……故禮世不必一其道，便國不必法古。聖人之興也，不相襲而王；夏殷之衰也，不
  易禮而滅。然則反古未可非，而循禮未足多也。」（白話：衣服是為了便於穿用，禮制是為了便於行
  事。聖人觀察各地風俗而順應所宜，因應實際情形而制定禮制，都是為了利民而富國……所以治世不
  必只用一種辦法，便國不必效法古人。聖人興起，並非互相因襲而稱王；夏、商衰亡，正是因為不改
  變舊禮而滅亡。這樣看來，違反古法未必該非議，而墨守舊禮也未必值得稱許。）公子成再拜稽首，
  乃賜胡服。明日服而朝，於是始出胡服令。

  趙自此有騎兵之利，北破林胡、樓煩，築長城自代并陰山下至高闕為塞，前 296 年滅中山。
