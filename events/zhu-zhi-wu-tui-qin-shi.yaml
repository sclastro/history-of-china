id: zhu-zhi-wu-tui-qin-shi
name: 燭之武退秦師
year: -630
year_note: 魯僖公三十年
period: wu-ba
type: 外交
states: [zheng, qin, jin]
people: [zhu-zhi-wu, zheng-wen-gong, qin-mu-gong, jin-wen-gong]
narrative: >-
  晉文公以鄭國當年待他無禮、又在城濮之戰時依附楚國為由，聯合秦穆公圍鄭。
  晉軍駐函陵，秦軍駐氾南。

  佚之狐向鄭文公推薦燭之武。燭之武推辭：「臣之壯也，猶不如人；今老矣，無能為也已。」
  （白話：臣年輕力壯的時候尚且比不上別人；如今老了，做不了什麼了。）
  文公說：「吾不能早用子，今急而求子，是寡人之過也。然鄭亡，子亦有不利焉。」
  （白話：我沒能早些任用您，如今情勢危急才來求您，這是寡人的過錯。
  不過鄭國滅亡了，對您也沒有好處。）他這才答應。

  夜裡用繩子把他縋出城牆。他見了秦穆公，說的話全部從秦國的利害出發：
  鄭在晉之東，秦越過晉國去佔有鄭國，土地終究是晉國的，
  「鄰之厚，君之薄也」（白話：鄰國的實力增厚，就是您的實力削薄）；
  不如留下鄭國作「東道主」（白話：東方道路上的主人），
  秦國使者往來時可以有個供應接應的地方。他又提醒穆公：
  晉惠公當年答應割讓焦、瑕給秦國，早上渡河、晚上就築城設防——晉國何曾守過信？

  穆公大悅，與鄭訂盟，留下杞子等三人戍守鄭國，自己撤軍。晉大夫子犯請求追擊秦軍，
  文公說「因人之力而敝之，不仁」（白話：靠了人家的力量卻反過來損害人家，這是不仁），
  也退兵了。
sources:
  - source: zuo-zhuan
    locus: 僖公三十年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/xi-gong-san-shi-nian
reliability: 信史
significance: >-
  春秋辭令的極品：全篇沒有一句替鄭國求情，句句都在替秦國算帳。
  燭之武的關鍵動作是把「秦晉聯軍」拆成「秦」與「晉」兩個利益主體，
  再指出滅鄭只利晉而不利秦。聯盟一旦被還原為各自的損益表，就撐不住了。
  三年後秦國偷襲鄭國、敗於崤山，用的正是這次留下的杞子——
  這場外交勝利同時埋下了下一場戰爭的引信。
