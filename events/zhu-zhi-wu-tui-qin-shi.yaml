id: zhu-zhi-wu-tui-qin-shi
name: 燭之武退秦師
year: -630
year_note: 魯僖公三十年
period: wu-ba
type: 外交
states: [zheng, qin, jin]
people: [zhu-zhi-wu, zheng-wen-gong, qin-mu-gong, jin-wen-gong]
narrative: >-
  前 630 年九月，晉文公與秦穆公聯兵包圍鄭國，理由是鄭國當年對流亡中的晉文公無禮，
  城濮之戰時又依附楚國。晉軍駐紮在函陵，秦軍駐紮在氾水之南。

  鄭國大夫佚之狐對鄭文公說，國家危急了，如果派燭之武去見秦君，秦軍一定會撤退。文公聽從了他。
  燭之武推辭說：他年輕力壯時尚且比不上別人，如今老了，做不了甚麼了。文公說：我沒能早些任用您，
  如今情勢危急才來求您，這是我的過錯；不過鄭國滅亡了，對您也沒有好處。燭之武這才答應。

  當夜，鄭國人用繩子把燭之武從城牆上放下去，他去見秦穆公。他說，秦、晉包圍鄭國，鄭國已經知道
  自己要滅亡了；如果滅鄭對秦國有好處，那就值得勞煩您。可是秦國要越過晉國，把遠方的鄭國當作自己的邊邑，
  您知道這很難做到，何必滅掉鄭國去增強鄰國？鄰國的實力增強，就是您的實力削弱。不如留下鄭國，
  讓它做秦國在東方道路上的主人，秦國使者往來時，由鄭國供應他們所缺的東西，這對您也沒有害處。
  成語「東道主」即由此而來。

  燭之武又提醒穆公：您曾經有恩於晉惠公，他答應割讓焦、瑕兩地給秦國，可是早上剛渡河回國，
  晚上就築起防禦工事，這是您知道的。晉國哪有滿足的時候？它向東把鄭國當作疆界之後，
  又會想向西擴張；如果不侵削秦國，它到哪裡去取土地？損害秦國來讓晉國得利，請您好好考慮。

  秦穆公聽了很高興，與鄭國訂立盟約，派杞子、逢孫、楊孫三人留下戍守鄭國，自己率軍回國。
  晉國的子犯請求追擊秦軍，晉文公說不可以：沒有秦穆公的幫助，他回不了晉國；借了別人的力量
  又反過來損害他，是不仁；失去盟友，是不智；用混亂代替和睦，是不武。於是晉軍也撤走了。
original:
  - speaker: 燭之武與鄭文公
    locus: 僖公三十年
    quote: >-
      辭曰：「臣之壯也，猶不如人。今老矣，無能為也已！」公曰：「吾不能早用子，今急而求子，
      是寡人之過也。然鄭亡，子亦有不利焉。」
    translation: >-
      燭之武推辭說：「我年輕力壯時尚且比不上別人。如今老了，做不了甚麼了！」文公說：
      「我沒能早些任用您，如今情勢危急才來求您，這是我的過錯。不過鄭國滅亡了，對您也沒有好處。」
  - speaker: 燭之武
    locus: 僖公三十年
    quote: >-
      越國以鄙遠，君知其難也，焉用亡鄭以倍鄰？鄰之厚，君之薄也。若舍鄭以為東道主，
      行李之往來，共其乏困，君亦無所害。
    translation: >-
      越過別國把遠方的土地當作邊邑，您知道這很難做到，何必滅掉鄭國去增強鄰國？
      鄰國的實力增強，就是您的實力削弱。如果留下鄭國，讓它做秦國在東方道路上的主人，
      秦國使者往來時，由鄭國供應他們所缺的東西，這對您也沒有害處。
  - speaker: 燭之武
    locus: 僖公三十年
    quote: >-
      夫晉，何厭之有？既東封鄭，又欲肆其西封，若不闕秦，將焉取之？闕秦以利晉，唯君圖之。
    translation: >-
      晉國哪有滿足的時候？它向東把鄭國當作疆界之後，又會想向西擴張；如果不侵削秦國，
      它到哪裡去取土地？損害秦國來讓晉國得利，請您好好考慮。
  - speaker: 晉文公
    locus: 僖公三十年
    quote: >-
      不可。微夫人力不及此。因人之力而敝之，不仁。失其所與，不知。以亂易整，不武。吾其還也。
    translation: >-
      不可以。沒有那個人的幫助，我到不了今天。借了別人的力量又反過來損害他，是不仁；
      失去盟友，是不智；用混亂代替和睦，是不武。我們還是回去吧。
sources:
  - source: zuo-zhuan
    locus: 僖公三十年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/xi-gong-san-shi-nian
reliability: 信史
significance: >-
  春秋辭令的極品：全篇沒有一句替鄭國求情，句句都在替秦國算帳。燭之武的關鍵一步，
  是把秦晉聯軍拆成秦、晉兩個利益主體，再指出滅鄭只利晉而不利秦；聯盟一旦還原為各自的得失，
  就撐不住了。三年後秦國偷襲鄭國、在殽山全軍覆沒，靠的內應正是這次留下的杞子——
  這場外交勝利同時埋下了下一場戰爭的引信。
