reliability: 信史
significance: >-
  戰國規模最大、後果最徹底的一戰。此後山東六國再無野戰之力，
  秦之統一由「可能」變成「時間問題」。
  就決策而言，它是一連串判斷失誤的累加：受上黨之獻（貪無故之利）、
  嫌廉頗怯（不解持久戰的性質）、中反間（不驗證情報來源）、
  用趙括（以名取人）。四個環節中任何一個不錯，結局都不同。
  而趙奢在多年前就已算準了最後一環——他知道自己的兒子把戰爭當成論述。
