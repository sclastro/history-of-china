id: chang-ping-zhi-zhan
name: 長平之戰
year: -262
year_end: -260
period: zhan-guo-late
type: 戰役
states: [qin, zhao]
people: [zhao-kuo, lian-po, bai-qi, zhao-xiao-cheng-wang, zhao-she]
narrative: >-
  前 262 年，秦國進攻韓國，切斷了上黨郡通往韓國本土的道路。上黨郡守馮亭不願投降秦國，
  便把郡中十七座城獻給趙國。趙國平陽君趙豹反對，認為無緣無故得來的好處往往是禍患。
  可是平原君主張接受，趙孝成王採納了平原君的意見。趙國從此與秦國結下戰禍。

  秦國派王齕領兵攻趙，趙國派老將廉頗迎戰。廉頗幾次交鋒都不順利，於是築起堅固的營壘固守，
  不跟秦軍決戰。秦軍多次挑戰，趙軍始終不出。趙王多次責備廉頗怯懦。秦國相國范睢派人帶著千金
  到趙國施行反間計，散布謠言，說秦國最怕的只是馬服君趙奢的兒子趙括來當主將，廉頗容易對付，
  快要投降了。趙王於是改用趙括接替廉頗。

  藺相如當時病重，勸阻趙王：單憑名聲任用趙括，就像把琴柱黏死了再彈瑟；趙括只會讀他父親留下的
  兵書，不懂得隨機應變。趙王不聽。趙括的母親也上書，說趙括不能當主將，並轉述丈夫趙奢生前的話：
  用兵是生死攸關的事，趙括卻說得太輕率，趙國若一定要用他，斷送趙軍的必定是趙括。她又要求：
  萬一趙括不稱職，自己不要受連坐。趙王答應了。

  趙括接替廉頗後，把原有的規章制度全部更改，撤換軍官，出兵攻擊秦軍。秦國暗中改派武安君白起
  為上將軍。白起假裝敗退，布下兩支奇兵：一支二萬五千人截斷趙軍後路，一支五千騎兵切斷趙軍與
  營壘之間的聯繫。趙軍被分割成兩段，糧道也斷了。秦昭王聽說趙軍糧道被切斷，親自趕到河內，
  賜給百姓每人爵位一級，徵發十五歲以上的男子全部開往長平，攔截趙國的援兵和糧食。

  到九月，趙軍已斷糧四十六天，士兵在營中暗中互相殘殺充飢。趙括率領精銳部隊親自搏戰，
  被秦軍射死。趙括的軍隊潰敗，四十萬士兵向白起投降。白起盤算：先前秦國攻下上黨，上黨百姓
  不願歸順秦國，反而投奔趙國；趙國的士兵反覆無常，不全部殺掉恐怕會作亂。於是他用欺詐手段
  把降卒全部活埋，只留下年紀小的二百四十人放回趙國。長平一役前後斬殺和俘虜的趙軍共四十五萬人，
  趙國舉國震恐。
original:
  - speaker: 秦國間諜
    locus: 白起王翦列傳
    source: shiji
    ctext_urn: ctp:shiji/bai-qi-wang-jian-lie-zhuan
    quote: 秦之所惡，獨畏馬服子趙括將耳；廉頗易與，且降矣。
    translation: 秦國最怕的，只怕馬服君之子趙括來當主將；廉頗容易對付，而且快要投降了。
  - speaker: 藺相如
    locus: 廉頗藺相如列傳
    quote: 王以名使括，若膠柱而鼓瑟耳。括徒能讀其父書傳，不知合變也。
    translation: >-
      大王只憑名聲任用趙括，就像把琴柱黏死了再彈瑟一樣。趙括只會讀他父親留下的兵書，
      不懂得隨機應變。
  - speaker: 趙奢
    locus: 廉頗藺相如列傳
    quote: 兵，死地也，而括易言之。使趙不將括即已，若必將之，破趙軍者必括也。
    translation: >-
      用兵是關乎生死的事，趙括卻說得太輕率。趙國不用他為將便算了；如果一定要用他，
      斷送趙軍的一定是趙括。
  - speaker: 趙括母
    locus: 廉頗藺相如列傳
    quote: 王終遣之，即有如不稱，妾得無隨坐乎？
    translation: 大王若終究要派他去，萬一他不稱職，我可以不受連坐嗎？
  - speaker: 白起
    locus: 白起王翦列傳
    source: shiji
    ctext_urn: ctp:shiji/bai-qi-wang-jian-lie-zhuan
    quote: 前秦已拔上黨，上黨民不樂為秦而歸趙。趙卒反覆，非盡殺之，恐為亂。
    translation: >-
      先前秦國已攻下上黨，上黨百姓不願歸順秦國，反而投奔趙國。趙國的士兵反覆無常，
      不全部殺掉，恐怕會作亂。
