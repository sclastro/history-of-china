id: chang-ping-zhi-zhan
name: 長平之戰
year: -262
year_end: -260
period: zhan-guo-late
type: 戰役
states: [qin, zhao]
people: [zhao-kuo, lian-po, bai-qi, zhao-xiao-cheng-wang, zhao-she]
narrative: >-
  秦攻韓，絕上黨之道。上黨守馮亭不欲降秦，以其地十七城獻趙。平陽君趙豹諫曰：「聖人甚禍無故
  之利。」平原君主受之，趙王從之——遂與秦兵連禍結。

  秦使王齕攻趙，趙使廉頗為將。頗數戰不利，乃堅壁以待秦，秦數挑戰而不出。趙王數以為怯而讓之
  。秦相范睢使人行千金於趙為反間，曰：「秦之所惡，獨畏馬服子趙括將耳；廉頗易與，且降矣。」
  （白話：秦國最怕的，只怕馬服君之子趙括來當主將；廉頗容易對付，而且快要投降了。）趙王遂以
  趙括代廉頗。

  藺相如病篤，諫曰：「王以名使括，若膠柱而鼓瑟耳。括徒能讀其父書傳，不知合變也。」（白話：
  大王只憑名聲任用趙括，就像把琴柱黏死了再彈瑟一樣。趙括只會讀他父親留下的兵書，不懂得隨機
  應變。）王不聽。趙括母亦上書言括不可使將，述其父趙奢之言：「兵，死地也，而括易言之。使趙
  不將括即已；若必將之，破趙軍者必括也。」（白話：用兵是關乎生死的事，而趙括說得太輕易了。
  趙國不用他為將便罷；若一定要用他，使趙軍覆滅的必定是趙括。）又曰：「王終遣之，即有如不稱
  ，妾得無隨坐乎？」（白話：大王若終究要派他去，萬一他不稱職，我可以不受連坐嗎？）王許諾。

  趙括既代廉頗，悉更約束、易置軍吏，出兵擊秦。秦陰使武安君白起為上將軍。白起佯敗而走，張二
  奇兵以劫之：一軍二萬五千人絕趙軍之後，一軍五千騎絕壁間，趙軍分而為二、糧道絕。秦王聞趙食
  道絕，自之河內，賜民爵各一級，發年十五以上悉詣長平，遮絕趙救及糧食。

  至九月，趙卒不得食四十六日，皆內陰相殺食。趙括出銳卒自搏戰，秦軍射殺趙括。括軍敗，卒四十
  萬人降武安君。白起計曰：「前秦已拔上黨，上黨民不樂為秦而歸趙。趙卒反覆，非盡殺之，恐為亂
  。」（白話：先前秦國已攻下上黨，上黨的百姓不願歸秦而投奔趙國。趙國的士卒反覆無常，不全部
  殺掉，恐怕會作亂。）乃挾詐而盡阬殺之，遺其小者二百四十人歸趙。前後斬首虜四十五萬人，趙人
  大震。
