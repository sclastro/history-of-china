reliability: 信史
significance: >-
  戰國規模最大、後果最徹底的一場會戰。此後山東六國再無野戰之力，秦國統一由可能變成
  時間問題。就決策而言，這是一連串失誤的累加：貪圖上黨這份無故之利、嫌廉頗固守太怯、
  中了反間計、又只憑名聲起用趙括；四個環節任何一個不錯，結局都會不同。趙奢多年前已看穿
  最後一環——他說「破趙軍者必括也」（白話：斷送趙軍的一定是趙括），因為他知道自己的兒子
  只把戰爭當成紙上的言談。
