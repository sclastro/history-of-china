id: zheng-bo-ke-duan
name: 鄭伯克段于鄢
year: -722
year_note: 魯隱公元年
period: chun-qiu-early
type: 內亂
states: [zheng]
people: [zheng-zhuang-gong, gong-shu-duan]
narrative: >-
  鄭武公娶於申，曰武姜，生莊公及共叔段。莊公寤生（難產），
  姜氏惡之而愛段，屢請立段為太子，武公弗許。
  莊公即位，姜氏請以制（虎牢）為段之封邑，莊公以「制，巖邑也，
  虢叔死焉」辭，改封於京，號京城大叔。

  祭仲諫曰「都城過百雉，國之害也」，請早為之所，
  莊公答：「多行不義必自斃，子姑待之。」
  其後段命西鄙北鄙貳於己，又收貳以為己邑而至於廩延。
  公子呂再請討，莊公曰：「無庸，將自及。」
  待段繕甲兵、具卒乘，將襲鄭而姜氏為之內應，
  莊公乃曰「可矣」，命子封帥車二百乘以伐京——
  京叛段，段入鄢，公伐諸鄢，段出奔共。

  《春秋》書曰「鄭伯克段于鄢」：不言「弟」而言「段」，譏段之不弟；
  不言「討」而言「克」，譏莊公之處心積慮如敵國。一句六字，兩面俱誅。
  其後莊公置姜氏於城潁而誓「不及黃泉，無相見也」，
  既而悔之；潁考叔獻計掘地及泉、隧而相見，母子如初。
sources:
  - source: zuo-zhuan
    locus: 隱公元年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/yin-gong-yuan-nian
reliability: 信史
significance: >-
  《左傳》開篇第一事，也是春秋筆法最經典的示範。
  就政治史而言，它顯示宗法制下「立嫡以長」的規則一旦受到母權干預，
  兄弟相殘即是結構性的後果；就權術而言，
  莊公二十餘年的「不作為」本身就是最高明的作為——
  縱其惡至於眾所共見，然後才動手。
