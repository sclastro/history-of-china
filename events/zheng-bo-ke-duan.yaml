id: zheng-bo-ke-duan
name: 鄭伯克段于鄢
year: -722
year_note: 魯隱公元年
period: chun-qiu-early
type: 內亂
states: [zheng]
people: [zheng-zhuang-gong, gong-shu-duan]
narrative: >-
  鄭武公從申國娶妻，就是武姜，生了莊公和共叔段。莊公出生時腳先出來，難產，嚇壞了武姜，
  所以取名「寤生」，武姜因此厭惡他，偏愛小兒子共叔段，想立段為太子，屢次向武公請求，
  武公都不答應。

  莊公即位後，武姜替段請求封在制邑。莊公說：制邑是險要的地方，從前虢叔就死在那裡；
  別的城邑都可以聽從吩咐。武姜於是改請京邑，莊公讓段住在那裡，稱為京城太叔。
  大夫祭仲提醒莊公：都邑的城牆超過三百丈，就是國家的禍害；按先王的制度，大的都邑不能超過國都的三分之一，
  如今京邑不合規格，國君將來會控制不住。莊公說，這是母親要的，他又怎能避開禍害？祭仲勸他早作安排，
  不要讓禍根蔓延。莊公說：多做不義的事，一定會自己倒下，你姑且等著看吧。成語「多行不義必自斃」即出於此。

  不久，太叔段命令西邊和北邊的邊邑同時聽命於自己。公子呂請莊公早作決斷，莊公說不必，
  他自己會招來禍患。段又把兩處邊邑收為自己的封邑，地盤一直擴展到廩延。公子呂說時候到了，
  地盤一大就會得到民心。莊公說：對君主不義，對兄長不親，地盤越大，垮得越快。

  後來，太叔段修築城郭、聚集百姓，整治鎧甲兵器，備齊步卒戰車，準備偷襲鄭國都城，
  武姜則打算替他打開城門作內應。莊公得知了偷襲的日期，說：可以動手了！他命公子呂率領戰車二百輛
  攻打京邑。京邑的人背叛了段，段逃到鄢地，莊公又追到鄢地攻打他，段最後逃往共國，所以稱共叔段。

  《春秋》把這件事記作「鄭伯克段于鄢」。《左傳》解釋：段不像個弟弟，所以不稱「弟」；
  兄弟兩人像兩個國君那樣交戰，所以用「克」字；稱莊公為「鄭伯」，是譏諷他沒有好好教導弟弟，
  說明這場結局本就是莊公有意促成的。

  事後，莊公把母親安置在城潁，並發誓說：不到黃泉，不再相見。不久他就後悔了。
  潁谷的地方官潁考叔得知此事，借進獻禮物的機會見到莊公，獻計挖地見到泉水，在地道裡與母親相見，
  莊公依計而行，母子於是和好如初。
original:
  - speaker: 祭仲與鄭莊公
    locus: 隱公元年
    quote: >-
      祭仲曰：「都城過百雉，國之害也。先王之制：大都不過參國之一，中五之一，小九之一。
      今京不度，非制也，君將不堪。」公曰：「姜氏欲之，焉辟害？」
    translation: >-
      祭仲說：「都邑的城牆超過三百丈，就是國家的禍害。按先王的制度：大的都邑不能超過國都的三分之一，
      中等的不能超過五分之一，小的不能超過九分之一。如今京邑不合規格，不符合制度，國君將來會控制不住。」
      莊公說：「這是母親要的，我又怎能避開禍害？」
  - speaker: 鄭莊公
    locus: 隱公元年
    quote: >-
      多行不義，必自斃，子姑待之。
    translation: >-
      多做不義的事，一定會自己倒下，你姑且等著看吧。
  - speaker: 公子呂與鄭莊公
    locus: 隱公元年
    quote: >-
      子封曰：「可矣，厚將得眾。」公曰：「不義，不暱，厚將崩。」
    translation: >-
      公子呂說：「可以動手了，他的地盤一大，就會得到民心。」莊公說：「對君主不義，對兄長不親，
      地盤越大，垮得越快。」
  - locus: 隱公元年
    quote: >-
      書曰：「鄭伯克段于鄢。」段不弟，故不言弟；如二君，故曰克；稱鄭伯，譏失教也：謂之鄭志。
    translation: >-
      《春秋》記作「鄭伯克段于鄢」。段不像個弟弟，所以不稱「弟」；兄弟交戰像兩個國君，
      所以用「克」字；稱莊公為「鄭伯」，是譏諷他沒有好好教導弟弟，也說明這是莊公有意促成的結局。
sources:
  - source: zuo-zhuan
    locus: 隱公元年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/yin-gong-yuan-nian
reliability: 信史
significance: >-
  《左傳》開篇第一事，也是春秋筆法最經典的示範：「鄭伯克段于鄢」六字之中，既責段不守弟道，
  也責莊公失教而有意縱容。就權術而言，莊公二十餘年的不作為本身就是最高明的作為——
  放任對方的惡行到眾所共見，然後才一舉動手。
