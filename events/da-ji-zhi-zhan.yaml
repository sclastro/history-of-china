id: da-ji-zhi-zhan
name: 大棘之戰
year: -607
year_note: 魯宣公二年
period: wu-ba
type: 戰役
states: [song, zheng]
people: [hua-yuan, yang-zhen]
narrative: >-
  鄭國奉楚國之命伐宋，兩軍戰於大棘。

  開戰前一天，宋國主帥華元殺羊犒賞士卒，替他駕車的羊斟卻沒有分到。

  第二天交戰，羊斟說：「疇昔之羊，子為政；今日之事，我為政。」
  （白話：昨天分羊肉的事，你作主；今天駕車的事，我作主。）說完便把戰車直接趕進鄭軍陣中。

  主帥被俘，宋師大敗，喪車四百六十乘，被俘二百五十人、被割耳者一百人。

  《左傳》的君子評語極重：「羊斟非人也，以其私憾，敗國殄民」
  （白話：羊斟不是人，為了個人的怨恨，害了國家、殘害了百姓）。
sources:
  - source: zuo-zhuan
    locus: 宣公二年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/xuan-gong-er-nian
reliability: 信史
significance: >-
  一碗羊肉換一場敗仗，是先秦文獻中最著名的一次「個人怨恨壓過集體存亡」。
  值得注意的是《左傳》的追究方向：它沒有只罵羊斟，
  也記下了華元分羊時漏掉車夫這個細節——
  主帥在戰前對一個看似無足輕重的人失了禮，代價由全軍承擔。
