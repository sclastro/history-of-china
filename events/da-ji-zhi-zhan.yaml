id: da-ji-zhi-zhan
name: 大棘之戰
year: -607
year_note: 魯宣公二年
period: wu-ba
type: 戰役
states: [song, zheng]
people: [hua-yuan, yang-zhen]
narrative: >-
  前 607 年春天，鄭國的公子歸生（子家）奉楚國之命出兵攻打宋國。宋國派主帥華元、
  副帥樂呂領兵迎戰。二月，兩軍在大棘交鋒。

  開戰前一天，華元殺羊犒賞將士，卻漏掉了替他駕車的羊斟，羊斟一份也沒分到。

  第二天交戰，羊斟對華元說：昨天分羊肉，是你作主；今天駕車，該我作主。說完便把戰車
  直接趕進鄭軍陣中。這就是成語「各自為政」的由來。

  主帥華元因此被俘，副帥樂呂也被擒，宋軍大敗，損失戰車四百六十輛，二百五十人被俘，
  一百人被割去左耳。

  事後《左傳》的君子評語極重，說羊斟簡直不是人：為了一己的私怨，害了國家、殘害了百姓，
  還有比這更該受重刑的罪嗎？
original:
  - locus: 宣公二年
    quote: 二年，春，鄭公子歸生受命于楚，伐宋。宋華元、樂呂御之。
    translation: 這年春天，鄭國的公子歸生奉楚國之命攻打宋國，宋國派華元、樂呂領兵抵禦。
  - locus: 宣公二年
    quote: 二月，壬子，戰于大棘，宋師敗績，囚華元，獲樂呂，及甲車四百六十乘，俘二百五十人，馘百人。
    translation: >-
      二月壬子那天，兩軍在大棘交戰，宋軍大敗；鄭軍俘虜了華元，擒獲了樂呂，
      繳得戰車四百六十輛，俘虜二百五十人，割下一百人的左耳。
  - locus: 宣公二年
    quote: 將戰，華元殺羊食士，其御羊斟不與。
    translation: 快要交戰時，華元殺羊犒賞士卒，卻沒有分給替他駕車的羊斟。
  - speaker: 羊斟
    locus: 宣公二年
    quote: 及戰，曰：「疇昔之羊，子為政；今日之事，我為政。」與入鄭師，故敗。
    translation: >-
      到了交戰，羊斟說：「昨天分羊肉的事，你作主；今天駕車的事，我作主。」
      說完就駕車衝進鄭軍陣裡，宋軍因此大敗。
  - locus: 宣公二年
    quote: 君子謂羊斟非人也，以其私憾，敗國殄民，於是刑孰大焉。
    translation: >-
      君子評論說：羊斟簡直不是人，為了個人的怨恨，害了國家、殘害了百姓，
      還有比這更該受重刑的罪嗎？
sources:
  - source: zuo-zhuan
    locus: 宣公二年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/xuan-gong-er-nian
reliability: 信史
significance: >-
  一碗羊肉換來一場敗仗，是先秦文獻中最著名的一次個人怨恨壓過集體存亡。
  成語「各自為政」即出於羊斟「今日之事，我為政」（白話：今天駕車的事，我作主）一句。
  值得注意的是《左傳》追究責任的方向：它固然痛斥羊斟，也記下華元分羊時漏掉車夫這個細節——
  主帥在戰前對一個看似無足輕重的人失了禮，代價卻由全軍承擔。
