id: lv-shi-chun-qiu-cheng-shu
name: 呂氏春秋成書
year: -239
year_note: 秦王政八年
period: zhan-guo-late
type: 著述
states: [qin]
people: [lv-bu-wei]
narrative: >-
  呂不韋做秦國丞相的時候，各國正盛行養士的風氣：魏國有信陵君，楚國有春申君，趙國有平原君，
  齊國有孟嘗君，這四位公子都禮敬賢才，門下食客數以千計，彼此比拼聲勢。秦國國力強盛，
  這方面卻落後於人，呂不韋引以為恥，於是也廣招人才，待遇優厚，門下食客多達三千人。

  呂不韋讓門客各自寫下自己的見聞學問，再彙編整理，分成八覽、六論、十二紀，全書二十多萬字。
  他認為這部書已經涵蓋天地萬物、古往今來的一切事情，便命名為《呂氏春秋》。

  書寫成以後，呂不韋把它公布在秦國都城咸陽的市集城門上，在書的上方懸掛一千金，
  邀請各國前來的游士賓客：誰能替這部書增加或刪去一個字，就賞給他一千金。
  這就是成語「一字千金」的由來。

  這部書不專主一家之言，儒家、道家、法家、墨家、農家、兵家、陰陽家各派學說兼收並蓄，
  是先秦諸子由各自分立走向融合的一個標本。〈察今〉篇的刻舟求劍、〈本味〉篇的高山流水，
  都出自這部書。

  前 237 年，呂不韋因為牽連嫪毐一案，被免去相位；前 235 年，秦王命他遷往蜀地，他飲毒酒自盡。
original:
  - locus: 呂不韋列傳
    quote: 當是時，魏有信陵君，楚有春申君，趙有平原君，齊有孟嘗君，皆下士喜賓客以相傾。呂不韋以秦之彊，羞不如，亦招致士，厚遇之，至食客三千人。
    translation: >-
      在那個時候，魏國有信陵君，楚國有春申君，趙國有平原君，齊國有孟嘗君，
      他們都禮敬賢才、喜好結交賓客，藉此互相較量聲勢。呂不韋覺得秦國國力雖強，
      這方面卻比不上人家，感到羞恥，於是也招攬人才，給他們優厚的待遇，門下食客多達三千人。
  - locus: 呂不韋列傳
    quote: 呂不韋乃使其客人人著所聞，集論以為八覽、六論、十二紀，二十餘萬言。以為備天地萬物古今之事，號曰呂氏春秋。
    translation: >-
      呂不韋讓門客各自把自己的見聞寫下來，再彙編整理，分成八覽、六論、十二紀，共二十多萬字。
      他認為這部書已經齊備了天地萬物、古今上下的一切事情，就取名叫《呂氏春秋》。
  - locus: 呂不韋列傳
    quote: 布咸陽市門，懸千金其上，延諸侯游士賓客有能增損一字者予千金。
    translation: >-
      呂不韋把書公布在咸陽的市集城門上，在書的上方懸掛一千金，邀請各國前來的游士賓客：
      有誰能替這部書增加或刪去一個字，就賞給他一千金。
