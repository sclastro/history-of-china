id: lv-shi-chun-qiu-cheng-shu
name: 呂氏春秋成書
year: -239
year_note: 秦王政八年
period: zhan-guo-late
type: 著述
states: [qin]
people: [lv-bu-wei]
narrative: >-
  呂不韋做秦國丞相時，正值魏有信陵君、楚有春申君、趙有平原君、齊有孟嘗君，
  四公子都禮賢下士、養士數千。秦國強大而在這方面落後，呂不韋以為恥，
  也招致士人，待遇優厚，門下食客達三千人。

  他讓門客各自把所聞所知寫下來，彙集編成八覽、六論、十二紀，
  共二十餘萬字，自以為備天地萬物古今之事，命名為《呂氏春秋》。

  書成之後，他把它公布在咸陽的市集門口，上面懸掛千金，
  邀請諸侯各國的游士賓客——「有能增損一字者予千金」
  （白話：有誰能增添或刪去一個字，就給他千金）。

  《史記》記下的結果是：沒有人能改。

  這部書不主一家：儒、道、法、墨、農、兵、陰陽各家之說並收，
  是先秦諸子由分立走向綜合的一個標本；
  〈察今〉篇的刻舟求劍、〈本味〉篇的高山流水都出自其中。

  前235年呂不韋因嫪毐案被免相、遷蜀，飲鴆而死。
sources:
  - source: shiji
    locus: 呂不韋列傳
    ctext_urn: ctp:shiji/lv-bu-wei-lie-zhuan
reliability: 信史
significance: >-
  「一字千金」的出處，而它同時是一次政治宣示。
  懸書市門、賞格千金，做的不是學術評議——
  沒有人敢去改秦國丞相的書，這一點呂不韋自己不會不知道。
  真正被展示的是：秦國也有能力主持文化事業，
  而且規模大到可以向天下叫陣。
  書的內容不主一家，也與這個目的相符：
  一部要為即將統一的天下立言的書，不能只屬於某一派。
