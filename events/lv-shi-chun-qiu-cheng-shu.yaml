reliability: 信史
significance: >-
  成語「一字千金」的出處，同時也是一次政治宣示。呂不韋把書掛在市門、開出千金賞格，
  並不是真要人評改文字——東漢高誘為此書作序時已指出，當時的人不是不能改，而是怕秦國丞相的權勢。他真正要展示的是：
  秦國一樣有能力主持文化事業，而且規模大到足以向天下叫陣。「有能增損一字者予千金」
  （白話：有誰能增添或刪去一個字，就賞給他一千金），這句話的重點不在校勘，而在氣派。
  書的內容不主一家，也正合這個用意：一部要為即將統一的天下立言的書，不能只屬於某一個學派。
