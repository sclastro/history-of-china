id: han-dan-zhi-wei
name: 邯鄲之圍
year: -258
year_end: -257
period: zhan-guo-late
type: 戰役
states: [qin, zhao, wei, chu]
people: [ping-yuan-jun, mao-sui, xin-ling-jun, hou-ying, zhao-xiao-cheng-wang]
narrative: >-
  長平之後，秦圍邯鄲。趙使平原君求救於楚，約與門下食客文武備具者二十人偕，得十九人，餘無可
  取者。門下有毛遂者，前自贊於平原君。平原君曰：「夫賢士之處世也，譬若錐之處囊中，其末立見
  。今先生處勝之門下三年於此矣，左右未有所稱誦，勝未有所聞，是先生無所有也。先生不能，先生
  留。」（白話：賢士處於世上，就像錐子放在布袋裡，錐尖立刻就會露出來。如今先生在我門下已經
  三年了，左右沒有稱讚過您，我也沒有聽說過您，這說明先生沒有什麼本事。先生不行，先生留下吧
  。）毛遂曰：「臣乃今日請處囊中耳。使遂蚤得處囊中，乃穎脫而出，非特其末見而已。」（白話：
  臣今天才請求放進袋裡罷了。假使我早得以放進袋中，整個錐子都會脫穎而出，不只是露出錐尖而已
  。）平原君竟與毛遂偕。

  至楚，日出而言之，日中不決。毛遂按劍歷階而上，曰：「從之利害，兩言而決耳。今日出而言從，
  日中不決，何也？」（白話：合縱的利與害，兩句話就能決定。今天日出時開始談合縱，到了正午還
  沒決定，這是為什麼？）楚王叱曰：「胡不下！吾乃與而君言，汝何為者也！」（白話：還不下去！
  我是在同你的主君說話，你算什麼東西！）毛遂按劍而前曰：「王之所以叱遂者，以楚國之眾也。今
  十步之內，王不得恃楚國之眾也，王之命懸於遂手。」（白話：大王之所以敢呵斥我，是仗著楚國人
  多。如今在這十步之內，大王仗不上楚國的人多了——大王的性命就懸在我手上。）復言湯以七十里
  之地王天下、文王以百里之壤而臣諸侯，而「白起，小豎子耳，率數萬之眾興師以與楚戰，一戰而舉
  鄢郢，再戰而燒夷陵，三戰而辱王之先人——此百世之怨而趙之所羞，而王弗知惡焉。合從者為楚，
  非為趙也。」（白話：白起不過是個小子罷了，率領幾萬人來與楚國作戰，一戰就攻下鄢、郢，再戰
  就燒了夷陵，三戰就羞辱了大王的先人——這是百世的仇怨，連趙國都替你們羞恥，而大王卻不知道
  以此為恥。合縱是為了楚國，不是為了趙國。）楚王曰：「唯唯，誠若先生之言，謹奉社稷而以從。
  」（白話：是，是，確實像先生說的那樣，我謹奉整個國家加入合縱。）

  同時，平原君數遺書責讓魏公子無忌（其妻為公子姊）。魏王使晉鄙將十萬眾救趙，畏秦而壁鄴不進
  。公子乃用侯嬴之謀：請如姬竊兵符於魏王臥內（如姬感公子為其父報仇之德），復使朱亥袖四十斤
  鐵椎椎殺晉鄙，奪其軍。簡選得八萬人進兵擊秦，秦軍解去，遂救邯鄲、存趙。
