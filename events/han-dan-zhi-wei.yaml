reliability: 信史
significance: >-
  這是六國最後一次成功的合縱抗秦，同時呈現了戰國政治的兩種極端手段：毛遂在楚國殿堂上以性命相脅，
  逼出兩國的盟約；信陵君則盜取兵符、擊殺主帥，奪走本國的軍隊。兩者都是體制以外的做法，
  可是救活趙國的恰恰就是這兩次破格之舉。邯鄲解圍之後三十六年，六國全被秦國消滅；這一戰是那個時代最後的光彩。
