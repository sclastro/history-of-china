reliability: 信史
significance: >-
  六國最後一次成功的合作。它同時展示了戰國政治的兩種極端手段：
  毛遂在殿上以個人的暴力威脅逼出一國之盟，
  信陵君以盜竊兵符、椎殺主帥的方式奪取本國軍隊——
  兩者都是體制外的操作，而挽救趙國的正是這兩次違制。
  秦圍解後三十六年，六國盡滅；邯鄲之圍是那個世界最後的高光。
