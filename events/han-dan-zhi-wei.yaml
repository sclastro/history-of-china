id: han-dan-zhi-wei
name: 邯鄲之圍
year: -258
year_end: -257
period: zhan-guo-late
type: 戰役
states: [qin, zhao, wei, chu]
people: [ping-yuan-jun, mao-sui, xin-ling-jun, hou-ying, zhao-xiao-cheng-wang]
narrative: >-
  前 260 年長平之戰後，秦軍進圍趙國都城邯鄲。趙國派平原君到楚國求救，想促成趙、楚合縱抗秦。
  平原君打算從門客裡挑選二十名文武兼備的人同行，只選到十九人，剩下的都不合用。這時門客毛遂
  走到平原君面前，主動請求同去。平原君說，賢能的人處身世上，就像錐子放在布袋裡，錐尖立刻會露出來；
  毛遂在自己門下已經三年，左右從沒稱讚過他，自己也沒聽說過他，可見他沒有本事，還是留下吧。
  毛遂回答，他正是今天才請求被放進布袋；要是早就放進去，整個錐子都會冒出來，不只是露個錐尖。
  平原君最終帶他一同前往。這就是「毛遂自薦」和「脫穎而出」的由來。

  到了楚國，平原君與楚王從早上談合縱，談到中午還定不下來。毛遂握著劍，拾級登上殿堂，
  質問為甚麼從日出談到正午還沒有結果。楚王呵斥他退下，說自己是在跟平原君說話，他算甚麼東西。
  毛遂握劍上前，說楚王敢呵斥他，不過是仗著楚國人多；可是此刻兩人相距十步之內，楚國人再多也幫不上忙，
  楚王的性命就握在他手裡。接著他歷數往事：商湯憑七十里的土地、周文王憑百里的疆域就號令天下，
  如今楚國方圓五千里、持戟的士兵上百萬，本是稱霸的本錢；而秦將白起不過是個小子，帶幾萬人攻打楚國，
  一戰攻陷鄢、郢，再戰火燒夷陵，三戰羞辱了楚王的祖先——這是百世的仇恨，連趙國都替楚國感到羞恥，
  楚王卻不知道以此為恥。他強調合縱其實是為楚國，不是為趙國。楚王連聲稱是，答應舉國加入合縱。

  與此同時，平原君多次寫信責備魏國的信陵君（信陵君的姊姊是平原君的夫人）。魏王本已派將軍晉鄙
  率十萬大軍救趙，卻因為畏懼秦國，把軍隊駐紮在鄴地按兵不動。信陵君採用門客侯嬴的計謀：
  託魏王的寵姬如姬到魏王寢宮偷出調兵的虎符——如姬感激信陵君從前替她父親報過仇，願意效力。
  信陵君拿到虎符後前往軍中，又叫朱亥用袖中四十斤重的鐵椎打死不肯交出兵權的晉鄙，奪得軍隊。
  他挑選出八萬精兵進擊秦軍，秦軍撤圍離去，邯鄲之圍就此解除，趙國得以保全。
original:
  - speaker: 平原君
    locus: 平原君虞卿列傳
    quote: >-
      夫賢士之處世也，譬若錐之處囊中，其末立見。今先生處勝之門下三年於此矣，左右未有所稱誦，
      勝未有所聞，是先生無所有也。先生不能，先生留。
    translation: >-
      賢能的人處身世上，就像錐子放在布袋裡，錐尖立刻就會露出來。如今先生在我門下已經三年了，
      左右沒有稱讚過您，我也沒有聽說過您，這說明先生沒有甚麼本事。先生不行，先生留下吧。
  - speaker: 毛遂
    locus: 平原君虞卿列傳
    quote: 臣乃今日請處囊中耳。使遂蚤得處囊中，乃穎脫而出，非特其末見而已。
    translation: >-
      我正是今天才請求被放進布袋罷了。假使我早就被放進袋裡，整個錐子都會冒出來，
      不只是露出個錐尖而已。
  - speaker: 毛遂
    locus: 平原君虞卿列傳
    quote: 從之利害，兩言而決耳。今日出而言從，日中不決，何也？
    translation: >-
      合縱是好是壞，兩句話就能決定。今天日出時就開始談合縱，到了正午還定不下來，這是為甚麼？
  - speaker: 楚王
    locus: 平原君虞卿列傳
    quote: 胡不下！吾乃與而君言，汝何為者也！
    translation: 還不退下！我是在跟你的主君說話，你算甚麼東西！
  - speaker: 毛遂
    locus: 平原君虞卿列傳
    quote: >-
      王之所以叱遂者，以楚國之眾也。今十步之內，王不得恃楚國之眾也，王之命縣於遂手。吾君在前，
      叱者何也？且遂聞湯以七十里之地王天下，文王以百里之壤而臣諸侯，豈其士卒眾多哉，誠能據其勢而奮其威。
      今楚地方五千里，持戟百萬，此霸王之資也。以楚之彊，天下弗能當。白起，小豎子耳，率數萬之眾，
      興師以與楚戰，一戰而舉鄢郢，再戰而燒夷陵，三戰而辱王之先人。此百世之怨而趙之所羞，而王弗知惡焉。
      合從者為楚，非為趙也。吾君在前，叱者何也？
    translation: >-
      大王之所以敢呵斥我，是仗著楚國人多。可是此刻在這十步之內，大王仗不上楚國的人多了——
      大王的性命就懸在我手上。我的主君在跟前，大王憑甚麼呵斥我？何況我聽說，商湯憑七十里的土地就號令天下，
      周文王憑百里的疆域就使諸侯臣服，難道靠的是士兵眾多嗎？靠的是佔住形勢、奮起威勢。
      如今楚國方圓五千里，持戟的士兵上百萬，這正是稱霸的本錢；憑楚國的強大，天下沒有誰擋得住。
      白起不過是個小子罷了，率領幾萬人來跟楚國作戰，一戰就攻下鄢、郢，再戰就燒了夷陵，
      三戰就羞辱了大王的祖先——這是百世的仇恨，連趙國都替楚國感到羞恥，大王卻不知道以此為恥。
      合縱是為了楚國，不是為了趙國。我的主君在跟前，大王憑甚麼呵斥我？
  - speaker: 楚王
    locus: 平原君虞卿列傳
    quote: 唯唯，誠若先生之言，謹奉社稷而以從。
    translation: 是，是，確實像先生說的那樣，我謹奉整個國家加入合縱。
  - speaker: 侯嬴
    source: shiji
    locus: 魏公子列傳
    ctext_urn: ctp:shiji/wei-gong-zi-lie-zhuan
    quote: >-
      嬴聞晉鄙之兵符常在王臥內，而如姬最幸，出入王臥內，力能竊之。嬴聞如姬父為人所殺，如姬資之三年，
      自王以下欲求報其父仇，莫能得。如姬為公子泣，公子使客斬其仇頭，敬進如姬。如姬之欲為公子死，
      無所辭，顧未有路耳。公子誠一開口請如姬，如姬必許諾，則得虎符奪晉鄙軍，北救趙而西卻秦，此五霸之伐也。
    translation: >-
      我聽說晉鄙的兵符一向放在魏王寢宮裡，而如姬最受寵愛，能出入魏王寢宮，有辦法偷到兵符。
      我又聽說如姬的父親被人殺害，她懸賞尋仇整整三年，從魏王以下，沒有人能替她報成。
      後來如姬向公子哭訴，公子派門客斬下仇人的頭，恭敬地送給如姬。如姬情願為公子效死都不推辭，
      只是一直沒有機會罷了。公子只要開口向如姬求助，她一定答應，這樣就能拿到虎符、奪取晉鄙的軍隊，
      北面救趙、西面逼退秦國，這是可比五霸的功業。
