id: han-dan-zhi-wei
name: 邯鄲之圍
year: -258
year_end: -257
period: zhan-guo-late
type: 戰役
states: [qin, zhao, wei, chu]
people: [ping-yuan-jun, mao-sui, xin-ling-jun, hou-ying, zhao-xiao-cheng-wang]
narrative: >-
  長平之後，秦圍邯鄲。趙使平原君求救於楚，約與門下食客文武備具者二十人偕，
  得十九人，餘無可取者。門下有毛遂者，前自贊於平原君。
  平原君曰：「夫賢士之處世也，譬若錐之處囊中，其末立見。
  今先生處勝之門下三年於此矣，左右未有所稱誦，勝未有所聞，
  是先生無所有也。先生不能，先生留。」
  毛遂曰：「臣乃今日請處囊中耳。使遂蚤得處囊中，乃穎脫而出，
  非特其末見而已。」平原君竟與毛遂偕。

  至楚，日出而言之，日中不決。毛遂按劍歷階而上，曰：
  「從之利害，兩言而決耳。今日出而言從，日中不決，何也？」
  楚王叱曰：「胡不下！吾乃與而君言，汝何為者也！」
  毛遂按劍而前曰：「王之所以叱遂者，以楚國之眾也。
  今十步之內，王不得恃楚國之眾也，王之命懸於遂手。」
  復言湯以七十里之地王天下、文王以百里之壤而臣諸侯，
  而「白起，小豎子耳，率數萬之眾興師以與楚戰，
  一戰而舉鄢郢，再戰而燒夷陵，三戰而辱王之先人——
  此百世之怨而趙之所羞，而王弗知惡焉。合從者為楚，非為趙也。」
  楚王曰：「唯唯，誠若先生之言，謹奉社稷而以從。」

  同時，平原君數遺書責讓魏公子無忌（其妻為公子姊）。
  魏王使晉鄙將十萬眾救趙，畏秦而壁鄴不進。
  公子乃用侯嬴之謀：請如姬竊兵符於魏王臥內（如姬感公子為其父報仇之德），
  復使朱亥袖四十斤鐵椎椎殺晉鄙，奪其軍。
  簡選得八萬人進兵擊秦，秦軍解去，遂救邯鄲、存趙。
