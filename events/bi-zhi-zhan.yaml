id: bi-zhi-zhan
name: 邲之戰
year: -597
year_note: 魯宣公十二年
period: wu-ba
type: 戰役
states: [chu, jin]
people: [chu-zhuang-wang, luan-shu]
narrative: >-
  楚圍鄭三月而克之，鄭伯肉袒牽羊以逆，楚子退三十里而許之平。
  晉師救鄭，至河而聞鄭既及楚平，中軍將荀林父欲還，
  中軍佐先縠不可，以其屬濟河。晉軍令不一，遂與楚戰於邲，大敗。

  戰前，晉下軍佐欒書力言楚不可伐：
  「楚自克庸以來，其君無日不討國人而訓之于民生之不易、
  禍至之無日、戒懼之不可以怠；在軍，無日不討軍實而申儆之于勝之不可保、
  紂之百克而卒無後。訓之以若敖、蚡冒篳路藍縷以啟山林。
  箴之曰：『民生在勤，勤則不匱。』不可謂驕。」

  楚既勝，潘黨請收晉屍以為京觀。楚子曰：
  「非爾所知也。夫文，止戈為武……夫武，禁暴、戢兵、保大、定功、
  安民、和眾、豐財者也……今我使二國暴骨，暴矣；觀兵以威諸侯，
  兵不戢矣……武有七德，我無一焉，何以示子孫？」
  乃祀于河，作先君宮，告成事而還。
sources:
  - source: zuo-zhuan
    locus: 宣公十二年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/xuan-gong-shi-er-nian
reliability: 信史
significance: >-
  晉楚爭霸的轉折點，楚莊王由此為霸主。
  欒書的敗戰分析值得注意：他不算兵力，算的是楚國君臣的自我訓誡——
  以敵國的政治文化為戰略判斷的根據，這在春秋是罕見的思路。
  而莊王勝後拒築京觀、論「止戈為武」，
  則是先秦最完整的一段戰爭倫理論述——出自一個剛贏了大仗的人之口。
