id: bi-zhi-zhan
name: 邲之戰
year: -597
year_note: 魯宣公十二年
period: wu-ba
type: 戰役
states: [chu, jin]
people: [chu-zhuang-wang, luan-shu]
narrative: >-
  前 597 年，楚莊王率軍包圍鄭國，圍了三個月才攻下鄭國都城。鄭襄公袒露上身、牽著羊出城迎接楚王，
  表示投降。楚莊王於是把軍隊後撤三十里，答應與鄭國講和。

  晉國派兵救鄭，大軍到了黃河邊，才聽說鄭國已經跟楚國講和。中軍主帥荀林父打算撤兵回國。
  可是中軍副帥先縠不肯罷休。他認為晉國能稱霸，靠的是軍隊勇武、臣子出力；如今失去諸侯擁戴、
  遇上敵人卻不迎戰，霸業若因此斷送，還不如去死。先縠於是帶著自己的部屬渡過黃河。
  司馬韓厥勸荀林父：先縠這支偏師一旦覆沒，主帥的罪責最重，不如全軍前進。晉軍於是全數渡河。

  這時鄭國派大夫皇戌到晉營，勸晉軍出戰。下軍副帥欒書極力反對：楚國自從攻滅庸國以來，
  國君沒有一天不召集國人訓誡，提醒他們民生艱難、禍患隨時降臨、戒懼之心不能鬆懈；在軍中，
  也天天檢查軍備，告誡將士勝利保不住，又拿商紂百戰百勝卻終於絕了後代作為鑑戒。
  楚君還常用先君若敖、蚡冒駕著柴車、穿著破衣（「篳路藍縷」）開闢山林的事跡教導眾人，
  告誡他們生計靠勤勞、勤勞就不會匱乏。這樣的國家算不上驕傲自滿，攻不得。
  可是晉軍將帥號令不統一，結果在邲地與楚軍交戰，大敗。

  楚軍獲勝後，大夫潘黨建議收集晉軍屍體，堆築成「京觀」——把敵人屍首壘起封土，作為誇耀武功的標記。
  楚莊王不同意，說這不是潘黨所能明白的。他解釋：就文字來說，「武」字由「止」和「戈」合成，
  所以「止戈為武」——停止干戈才是真正的武。真正的武，本該做到禁絕暴亂、收起兵器、保有天下、
  鞏固功業、安定百姓、和睦人群、豐足財用七件事。如今這一仗讓晉、楚兩國士卒暴屍荒野，這就是暴虐；
  陳兵示威去威嚇諸侯，這就是沒有收起兵器。武應有的七種德行，他一樣都做不到，拿甚麼傳給子孫？

  於是楚莊王祭祀河神，修建祭祀先君的宮室，向祖先稟告戰事成功，然後班師回國。
original:
  - speaker: 荀林父
    locus: 宣公十二年
    quote: 無及於鄭而勦民，焉用之？楚歸而動，不後。
    translation: >-
      我們趕不及救鄭國，反而害得百姓勞苦，這有甚麼用？等楚軍撤回去以後再有所行動，也不算晚。
  - speaker: 先縠
    locus: 宣公十二年
    quote: >-
      晉所以霸，師武、臣力也。今失諸侯，不可謂力；有敵而不從，不可謂武。由我失霸，不如死。
    translation: >-
      晉國之所以能稱霸，靠的是軍隊勇武、臣子出力。如今失去諸侯的擁戴，不能說是出力；
      遇上敵人卻不迎戰，不能說是勇武。霸業要是因我而喪失，我還不如去死。
  - speaker: 欒書
    locus: 宣公十二年
    quote: >-
      楚自克庸以來，其君無日不討國人而訓之于民生之不易、禍至之無日、戒懼之不可以怠；在軍，
      無日不討軍實而申儆之于勝之不可保、紂之百克而卒無後。訓之以若敖、蚡冒篳路藍縷以啟山林。
      箴之曰：「民生在勤，勤則不匱。」不可謂驕。
    translation: >-
      楚國自從攻克庸國以來，國君沒有一天不召集國人訓誡：民生不易、禍患隨時會來、戒懼不可鬆懈；
      在軍中，沒有一天不檢點軍備並告誡他們：勝利保不住、商紂百戰百勝而終於絕後。還用先君若敖、
      蚡冒駕柴車、穿破衣開闢山林的事跡教導他們，告誡說：民生在於勤勞，勤勞就不會匱乏。
      這樣不能說是驕傲。
  - speaker: 潘黨
    locus: 宣公十二年
    quote: 臣聞克敵必示子孫，以無忘武功。
    translation: 我聽說戰勝了敵人，一定要留下標記給子孫看，讓他們不忘這次武功。
  - speaker: 楚莊王
    locus: 宣公十二年
    quote: >-
      非爾所知也。夫文，止戈為武。……夫武，禁暴、戢兵、保大、定功、安民、和眾、豐財者也，
      故使子孫無忘其章。今我使二國暴骨，暴矣；觀兵以威諸侯，兵不戢矣。暴而不戢，安能保大？
      猶有晉在，焉得定功？所違民欲猶多，民何安焉？無德而彊爭諸侯，何以和眾？利人之幾，
      而安人之亂，以為己榮，何以豐財？武有七德，我無一焉，何以示子孫？
    translation: >-
      這不是你能明白的。就文字來說，「止」和「戈」合起來才是「武」。……所謂武，是要禁絕暴亂、
      收起兵器、保有天下、鞏固功業、安定百姓、和睦人群、豐足財用，所以才讓子孫不忘這些功德。
      如今我讓晉、楚兩國士卒暴屍野外，這是暴；陳兵示威去威嚇諸侯，這是不肯收起兵器。逞暴而不收兵，
      怎能保有天下？晉國還在，哪裡談得上鞏固功業？違背百姓意願的事還那麼多，百姓怎麼安定？
      沒有德行卻硬要跟諸侯爭霸，怎能和睦人群？趁別人危難謀利、以別人的禍亂為安樂，還當作自己的光榮，
      怎能豐足財用？武有七種德行，我一樣都沒有，拿甚麼傳給子孫？
sources:
  - source: zuo-zhuan
    locus: 宣公十二年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/xuan-gong-shi-er-nian
reliability: 信史
significance: >-
  邲之戰是晉、楚爭霸的轉折點，楚莊王由此躋身霸主之列。值得注意的是欒書的敗戰分析：
  他不去計較雙方兵力，而是從楚國君臣日日自我訓誡的政治風氣入手，以敵國的政治文化作為戰略判斷的依據，
  這在春秋是少見的思路。而莊王戰勝後拒絕堆築京觀，並提出「止戈為武」（白話：停止干戈才是真正的武），
  是先秦最完整的一段戰爭倫理論述，卻出自一個剛打了勝仗的人之口。
