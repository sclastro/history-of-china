id: zhou-xu-zhi-luan
name: 州吁之亂
year: -719
year_note: 魯隱公四年
period: chun-qiu-early
type: 弒君篡位
states: [wey, zheng]
people: [wei-zhou-xu, shi-que, shi-hou]
narrative: >-
  衛莊公嬖人之子州吁好兵，莊公弗禁。大夫石碏諫曰：「臣聞愛子，教之以義方，弗納於邪。驕、奢
  、淫、泆，所自邪也……將立州吁，乃定之矣；若猶未也，階之為禍。」（白話：臣聽說疼愛兒子，
  要用正道教他，不讓他走上邪路。驕縱、奢侈、放蕩、安逸，是邪路的起點……若打算立州吁為嗣，
  就趁早定下來；若還沒打算，如今這樣只是替他鋪一條禍路。）莊公不聽，石碏乃告老。

  前 719 年，州吁弒兄桓公自立。既立而國人不附，乃連宋、陳、蔡伐鄭以求外功——兩度圍鄭
  東門而不能定其民。石碏之子石厚為州吁之黨，問「定君」之計於父。石碏曰：「王覲為可。」——
  欲得王命則須陳桓公為之請。二人如陳，石碏使告於陳曰：「衛國褊小，老夫耄矣，無能為也。此二
  人者，實弒寡君，敢即圖之。」（白話：衛國狹小，老夫又年邁昏聵，做不了什麼。這兩個人，正是
  弒殺寡君的兇手，請立刻處置他們。）陳人執之。衛人使右宰醜蒞殺州吁于濮，石碏使其宰獳羊肩蒞
  殺石厚于陳。

  《左傳》君子曰：「石碏，純臣也。惡州吁而厚與焉。『大義滅親』，其是之謂乎！」（白話：石碏
  是純粹的忠臣。他厭惡州吁，而自己的兒子石厚卻參與其事。所謂「大義滅親」）
sources:
  - source: zuo-zhuan
    locus: 隱公四年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/yin-gong-si-nian
reliability: 信史
significance: >-
  《春秋》所記第一批弒君事件之一，標誌春秋政治秩序的鬆動已由外及內。
  石碏的判語「眾叛親離，難以濟矣」（白話：眾人背叛、親信離散，這樣是成不了事的）則是先秦政治判斷的範式——
  它不問道德而問支持結構，是一種相當現代的分析。
