id: zhou-xu-zhi-luan
name: 州吁之亂
year: -719
year_note: 魯隱公四年
period: chun-qiu-early
type: 弒君篡位
states: [wey, zheng]
people: [wei-zhou-xu, shi-que, shi-hou]
narrative: >-
  衛莊公的夫人莊姜美麗而沒有兒子，莊公另娶陳國女子，其妹戴媯生下桓公，莊姜把他當作自己的兒子撫養。
  莊公又有一個寵妾所生的兒子州吁，受到寵愛，喜歡舞刀弄兵，莊公也不加約束。

  大夫石碏勸諫莊公：疼愛兒子，就要用正道教導他，不讓他走上邪路；驕縱、奢侈、放蕩、安逸，
  都是走上邪路的起點，而這四種毛病，都來自寵愛和俸祿過了分。如果打算立州吁為繼承人，
  就趁早定下來；如果還沒有這個打算，現在這樣做，只是一步步替他鋪好闖禍的臺階。莊公不聽。
  石碏的兒子石厚與州吁交遊，石碏禁止不了。桓公即位後，石碏就告老退休。

  前 719 年，州吁殺了哥哥衛桓公，自立為君。他想替先君向鄭國報仇，討好諸侯，以此安撫國內百姓，
  於是聯合宋、陳、蔡三國攻打鄭國，包圍鄭都東門，五天後撤兵；秋天又聯合諸侯再次伐鄭。
  魯隱公問大夫眾仲，州吁能成事嗎？眾仲說：只聽說用德行安撫百姓，沒聽說用禍亂來安撫的；
  州吁倚仗武力而安於殘忍，倚仗武力就失去眾人，安於殘忍就失去親信，眾人背叛、親信離散，
  是成不了事的。

  州吁始終無法安定百姓。石厚向父親請教穩固君位的辦法。石碏說，去朝見周天子就可以了。
  石厚問怎樣才能朝見天子，石碏說，陳桓公正受天子寵信，陳、衛兩國又和睦，如果去朝見陳桓公，
  請他代為請求，一定能成功。石厚便跟隨州吁到了陳國。石碏暗中派人告訴陳國：衛國狹小，
  他年老昏聵，做不了甚麼；這兩個人正是殺害衛君的兇手，請陳國趁機處置他們。

  陳國人把兩人扣押起來，請衛國派人來處理。九月，衛國派右宰丑到濮地殺了州吁，
  石碏也派自己的家宰獳羊肩到陳國殺了石厚。《左傳》的君子評論說，石碏是一位純正的忠臣，
  他厭惡州吁，而自己的兒子石厚也參與其中，他連兒子一併處置，所謂「大義滅親」，說的正是這種人。
original:
  - speaker: 石碏
    locus: 隱公三年
    quote: >-
      臣聞愛子，教之以義方，弗納于邪。驕、奢、淫、泆，所自邪也。四者之來，寵祿過也。
      將立州吁，乃定之矣，若猶未也，階之為禍。
    translation: >-
      臣聽說，疼愛兒子，就要用正道教導他，不讓他走上邪路。驕縱、奢侈、放蕩、安逸，是走上邪路的起點；
      這四種毛病的產生，都是因為寵愛和俸祿過了分。如果打算立州吁為繼承人，就趁早定下來；
      如果還沒有這個打算，現在這樣做，只是一步步替他鋪好闖禍的臺階。
  - speaker: 眾仲
    locus: 隱公四年
    quote: >-
      夫州吁，阻兵而安忍。阻兵無眾，安忍無親，眾叛親離，難以濟矣。夫兵猶火也，弗戢，將自焚也。
    translation: >-
      州吁倚仗武力而安於殘忍。倚仗武力就失去眾人，安於殘忍就失去親信；眾人背叛、親信離散，
      是成不了事的。用兵就像玩火，不加收斂，終會燒到自己。
  - speaker: 石碏
    locus: 隱公四年
    quote: >-
      衛國褊小，老夫耄矣，無能為也。此二人者，實弒寡君，敢即圖之。
    translation: >-
      衛國狹小，老夫年老昏聵，做不了甚麼。這兩個人，正是殺害我們國君的兇手，請貴國立刻處置他們。
  - locus: 隱公四年
    quote: >-
      君子曰：「石碏，純臣也，惡州吁而厚與焉。『大義滅親』，其是之謂乎！」
    translation: >-
      君子說：「石碏是純正的忠臣。他厭惡州吁，而自己的兒子石厚也參與其中。
      所謂『大義滅親』，說的正是這種人吧！」
sources:
