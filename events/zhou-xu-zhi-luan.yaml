reliability: 信史
significance: >-
  《春秋》所記最早的一批弒君事件之一，標誌春秋政治秩序的鬆動已由外及內。眾仲的判語
  「眾叛親離，難以濟矣」（白話：眾人背叛、親信離散，是成不了事的）是先秦政治判斷的範式：
  它不問道德，只問支持的基礎，是一種相當冷靜的結構分析。
