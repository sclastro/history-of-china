id: wan-bi-gui-zhao
name: 完璧歸趙
year: -283
period: zhan-guo-late
type: 外交
states: [zhao, qin]
people: [lin-xiang-ru, zhao-hui-wen-wang, qin-zhao-xiang-wang]
narrative: >-
  趙惠文王得楚和氏璧。秦昭王聞之，遺趙王書，願以十五城請易璧。
  趙王與大將軍廉頗諸大臣謀：予秦，秦城恐不可得，徒見欺；
  欲勿予，即患秦兵之來。計未定，求人可使報秦者，未得。
  宦者令繆賢薦其舍人藺相如。

  相如曰：「秦以城求璧而趙不許，曲在趙；趙予璧而秦不予趙城，曲在秦。
  均之二策，寧許以負秦曲。」王曰誰可使者，相如曰：
  「王必無人，臣願奉璧往使。城入趙而璧留秦；城不入，臣請完璧歸趙。」

  相如奉璧奏秦王。秦王大喜，傳以示美人及左右，左右皆呼萬歲——
  無意償趙城。相如乃前曰：「璧有瑕，請指示王。」
  王授璧。相如因持璧卻立，倚柱，怒髮上衝冠，
  歷數趙王齋戒五日、修敬於庭之禮，而「大王見臣列觀，禮節甚倨，
  得璧傳之美人以戲弄臣」，遂曰：
  「臣頭今與璧俱碎於柱矣！」持璧睨柱，欲以擊柱。

  秦王恐其破璧，辭謝固請，召有司案圖指從此以往十五都予趙。
  相如度秦王特以詐佯為予趙城，實不可得，乃謂秦王曰：
  「和氏璧，天下所共傳寶也……王必欲急臣，臣頭今與璧俱碎於柱矣。」
  請齋戒五日、設九賓於廷。秦王度之終不可強奪，遂許齋五日。

  相如乃使其從者衣褐，懷其璧，從徑道亡，歸璧于趙。
  秦王齋五日後設九賓禮於廷，相如至，曰：
  「秦自繆公以來二十餘君，未嘗有堅明約束者也……臣誠恐見欺於王而負趙，
  故令人持璧歸，間至趙矣。」
  秦王與群臣相視而嘻。左右或欲引相如去，秦王曰：
  「今殺相如，終不能得璧也，而絕秦趙之驩。」卒廷見相如，畢禮而歸之。
sources:
  - source: shiji
    locus: 廉頗藺相如列傳
    ctext_urn: ctp:shiji/lian-po-lin-xiang-ru-lie-zhuan
reliability: 大體可信
significance: >-
  一場不對稱博弈中弱方的完整操作示範。
  藺相如的每一步都建立在同一個判斷上：秦王要的是「不背信之名」
  多於「一塊玉」——所以只要把「曲」推到秦一方，秦就不能動手。
  他賭的不是秦王的善意，是秦王的成本核算。
  「寧許以負秦曲」五字，是先秦外交思想中對「道義即籌碼」最清晰的表述。
