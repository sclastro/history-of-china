id: wan-bi-gui-zhao
name: 完璧歸趙
year: -283
year_note: 趙惠文王十六年前後
period: zhan-guo-late
type: 外交
states: [zhao, qin]
people: [lin-xiang-ru, zhao-hui-wen-wang, qin-zhao-xiang-wang]
narrative: >-
  趙惠文王得到楚國的和氏璧。秦昭王聽說後，寫信給趙王，表示願意用十五座城交換這塊璧。
  趙王與大將軍廉頗等大臣商量：給秦國，怕秦國的城得不到，白白被騙；不給，又怕秦軍打過來。
  一時拿不定主意，也找不到可以出使回覆秦國的人。宦者令繆賢推薦了自己的門客藺相如。

  趙王召見藺相如，問該不該給。藺相如說，秦強趙弱，不能不答應。趙王問：秦國拿了璧卻不給城，
  怎麼辦？藺相如說：秦國用城來換璧而趙國不答應，理虧的是趙國；趙國給了璧而秦國不給城，
  理虧的是秦國。兩相權衡，寧可答應下來，讓秦國承擔理虧的責任。他自願捧璧出使，並且說：
  城池歸入趙國，璧就留在秦國；城池不歸趙國，他一定把完整的璧帶回趙國。

  秦昭王在章臺接見藺相如。藺相如獻上璧，昭王非常高興，把璧傳給妃嬪和左右侍從觀看，
  左右都高呼萬歲。藺相如看出秦王沒有交城的意思，就上前說璧上有一處瑕疵，請讓他指給大王看。
  秦王把璧交給他，他立刻捧著璧後退，靠著柱子站定，憤怒得頭髮豎起、頂起了帽子。
  他說，趙王送璧之前齋戒五天，在朝廷上恭敬地拜送國書；大王卻在普通的宮觀接見使臣，
  禮節傲慢，拿到璧就傳給妃嬪觀看，藉此戲弄他。他看出秦王無意交城，所以把璧取回；
  如果秦王一定要逼他，他的頭就和這塊璧一起撞碎在柱子上。說完，他捧著璧斜看柱子，作勢要撞。

  秦王怕他把璧撞碎，連忙道歉，叫主管官員拿來地圖，指出從某處到某處的十五座城給趙國。
  藺相如判斷秦王只是假裝給城，實際上不可能兌現，就說：和氏璧是天下公認的寶物，
  趙王送璧時齋戒了五天，大王也應該齋戒五天，在朝廷上設九賓大禮，他才敢獻上。
  秦王估計終究無法強奪，只好答應，安排藺相如住在廣成傳舍。藺相如料定秦王即使齋戒，
  也一定會背約，就讓隨從換上粗布衣服，把璧藏在懷裡，從小路逃回趙國。

  五天後，秦王在朝廷上設九賓大禮，請藺相如入見。藺相如說：秦國自穆公以來二十多位國君，
  沒有一位堅守過盟約；他實在怕被大王欺騙而辜負趙國，所以已經派人帶著璧從小路回到趙國了。
  秦國強而趙國弱，只要秦國先把十五座城割給趙國，趙國怎敢留著璧而得罪大王？他知道欺騙大王罪該處死，
  請受烹刑，只請大王與群臣仔細商量。秦王和群臣面面相覷，發出驚怒的聲音。侍從中有人想把藺相如拉出去，
  秦王說：如今殺了藺相如，終究得不到璧，反而斷絕了秦趙兩國的交好，不如趁機好好款待他，
  讓他回趙國。最後秦王在朝廷上接見藺相如，按禮節送他回國。

  藺相如回國後，趙王認為他出使諸侯而不辱使命，任命他為上大夫。結果秦國沒有把城給趙國，
  趙國也始終沒有把璧給秦國。
original:
  - speaker: 藺相如
    locus: 廉頗藺相如列傳
    quote: >-
      秦以城求璧而趙不許，曲在趙。趙予璧而秦不予趙城，曲在秦。均之二策，寧許以負秦曲。
    translation: >-
      秦國用城來換璧而趙國不答應，理虧的是趙國。趙國給了璧而秦國不給城，理虧的是秦國。
      兩相權衡，寧可答應下來，讓秦國承擔理虧的責任。
  - speaker: 藺相如
    locus: 廉頗藺相如列傳
    quote: >-
      王必無人，臣願奉璧往使。城入趙而璧留秦；城不入，臣請完璧歸趙。
    translation: >-
      大王如果實在找不到人，臣願意捧著璧出使。城池歸入趙國，璧就留在秦國；城池不歸趙國，
      臣請求把完整的璧帶回趙國。
  - locus: 廉頗藺相如列傳
    quote: >-
      相如因持璧卻立，倚柱，怒髮上衝冠，謂秦王曰：「……今臣至，大王見臣列觀，禮節甚倨；
      得璧，傳之美人，以戲弄臣。臣觀大王無意償趙王城邑，故臣復取璧。大王必欲急臣，
      臣頭今與璧俱碎於柱矣！」
    translation: >-
      藺相如於是捧著璧後退站定，靠著柱子，憤怒得頭髮豎起、頂起了帽子，對秦王說：
      「……如今臣到了這裡，大王在普通的宮觀接見臣，禮節十分傲慢；拿到璧就傳給妃嬪觀看，
      藉此戲弄臣。臣看大王無意償還趙王城邑，所以把璧取回。大王如果一定要逼臣，
      臣的頭今天就和這塊璧一起撞碎在柱子上！」
  - speaker: 秦昭王
    locus: 廉頗藺相如列傳
    quote: >-
      今殺相如，終不能得璧也，而絕秦趙之驩，不如因而厚遇之，使歸趙，趙王豈以一璧之故欺秦邪！
    translation: >-
      如今殺了藺相如，終究得不到璧，反而斷絕了秦趙兩國的交好。不如趁機好好款待他，讓他回趙國，
      趙王難道會為了一塊璧而欺騙秦國嗎！
sources:
  - source: shiji
    locus: 廉頗藺相如列傳
    ctext_urn: ctp:shiji/lian-po-lin-xiang-ru-lie-zhuan
reliability: 大體可信
significance: >-
  弱國應付強國的一次完整示範。藺相如每一步都建立在同一個判斷上：秦王要的是不背信的名聲，
  多於一塊玉，所以只要把理虧的一方推給秦國，秦國就不能動手。他賭的不是秦王的善意，
  而是秦王的成本計算；「寧許以負秦曲」（白話：寧可答應下來，讓秦國承擔理虧的責任）六字，
  是先秦外交思想中以道義為籌碼最清晰的表述。
