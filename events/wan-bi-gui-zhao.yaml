id: wan-bi-gui-zhao
name: 完璧歸趙
year: -283
period: zhan-guo-late
type: 外交
states: [zhao, qin]
people: [lin-xiang-ru, zhao-hui-wen-wang, qin-zhao-xiang-wang]
narrative: >-
  趙惠文王得楚和氏璧。秦昭王聞之，遺趙王書，願以十五城請易璧。趙王與大將軍廉頗諸大臣謀：予
  秦，秦城恐不可得，徒見欺；欲勿予，即患秦兵之來。計未定，求人可使報秦者，未得。宦者令繆賢
  薦其舍人藺相如。

  相如曰：「秦以城求璧而趙不許，曲在趙；趙予璧而秦不予趙城，曲在秦。均之二策，寧許以負秦曲
  。」（白話：秦國拿城來換璧而趙國不答應，理虧的是趙；趙國給了璧而秦國不給城，理虧的是秦。
  權衡這兩種策略，寧可答應下來，讓秦國背上理虧。）王曰誰可使者，相如曰：「王必無人，臣願奉
  璧往使。城入趙而璧留秦；城不入，臣請完璧歸趙。」（白話：大王若實在找不到人，臣願意捧著璧
  出使。城池歸入趙國，璧就留在秦國；城池不歸趙國，臣請求把完整的璧送回趙國。）

  相如奉璧奏秦王。秦王大喜，傳以示美人及左右，左右皆呼萬歲——無意償趙城。相如乃前曰：「璧
  有瑕，請指示王。」王授璧。相如因持璧卻立，倚柱，怒髮上衝冠，歷數趙王齋戒五日、修敬於庭之
  禮，而「大王見臣列觀，禮節甚倨，得璧傳之美人以戲弄臣」（白話：大王在一般的宮觀接見臣，禮
  節非常傲慢；拿到璧就傳給美人看，藉此戲弄臣），遂曰：「臣頭今與璧俱碎於柱矣！」持璧睨柱，
  欲以擊柱。

  秦王恐其破璧，辭謝固請，召有司案圖指從此以往十五都予趙。相如度秦王特以詐佯為予趙城，實不
  可得，乃謂秦王曰：「和氏璧，天下所共傳寶也……王必欲急臣，臣頭今與璧俱碎於柱矣。」（白話
  ：和氏璧是天下公認的寶物……大王若一定要逼迫臣，臣的頭今天就與這塊璧一同碎在柱子上。）請
  齋戒五日、設九賓於廷。秦王度之終不可強奪，遂許齋五日。

  相如乃使其從者衣褐，懷其璧，從徑道亡，歸璧于趙。秦王齋五日後設九賓禮於廷，相如至，曰：「
  秦自繆公以來二十餘君，未嘗有堅明約束者也……臣誠恐見欺於王而負趙，故令人持璧歸，間至趙矣
  。」（白話：秦國自繆公以來二十多位君主，沒有一個是堅守盟約的……臣實在怕被大王欺騙而辜負
  趙國，所以派人把璧送回，從小路已經到趙國了。）秦王與群臣相視而嘻。左右或欲引相如去，秦王
  曰：「今殺相如，終不能得璧也，而絕秦趙之驩。」（白話：如今殺了藺相如，終究得不到璧，反而
  斷絕了秦趙兩國的交好。）卒廷見相如，畢禮而歸之。
