id: chu-zhuang-ting-zheng
name: 楚莊王親政
year: -611
year_note: 楚莊王三年
period: wu-ba
type: 論政
states: [chu]
people: [chu-zhuang-wang, wu-ju]
narrative: >-
  楚莊王即位三年，不出號令，日夜為樂，令國中曰：「有敢諫者死無赦。」

  伍舉入諫。莊王左抱鄭姬、右抱越女，坐鍾鼓之間。伍舉曰：「願有進隱。」曰：「有鳥在於阜，三
  年不蜚不鳴，是何鳥也？」（白話：有隻鳥停在土山上，三年不飛不叫，這是什麼鳥？）莊王曰：「
  三年不蜚，蜚將沖天；三年不鳴，鳴將驚人。舉退矣，吾知之矣。」（白話：三年不飛，一飛就要沖
  天；三年不叫，一叫就要驚人。伍舉你退下吧，我明白了。）

  居數月，淫益甚。大夫蘇從乃入諫。王曰：「若不聞令乎？」對曰：「殺身以明君，臣之願也。」

  於是乃罷淫樂、聽政，所誅者數百人，所進者數百人，任伍舉、蘇從以政，國人大悅。是歲滅庸，六
  年伐宋獲車五百乘。

  《韓非子·喻老》記同一事而繫於楚莊王，不著諫者之名，並以老子「大器晚成，大音希聲」釋之。
sources:
  - source: shiji
    locus: 楚世家
    ctext_urn: ctp:shiji/chu-shi-jia
  - source: hanfeizi
    locus: 喻老
    ctext_urn: ctp:hanfeizi/yu-lao
reliability: 大體可信
variants:
  - claim: >-
      《史記·滑稽列傳》記同型故事於齊威王與淳于髡，
      文句幾乎全同——「此鳥不飛則已，一飛沖天；不鳴則已，一鳴驚人」。
      同一母題繫於兩君，其一必為移植。
    source: shiji
    locus: 滑稽列傳
significance: >-
  「三年不鳴」是一種政治技術：新君即位而權柄在舊臣，
  韜晦以觀群臣之忠佞，然後一舉而誅進數百人。
  它被記成一則勵志故事，實際上是一次徹底的人事清洗。
  韓非用它注老子，看中的正是這一層——無為是手段，不是目的。
