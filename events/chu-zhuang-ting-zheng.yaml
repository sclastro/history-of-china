reliability: 大體可信
variants:
  - claim: >-
      《史記·滑稽列傳》記同型故事於齊威王與淳于髡，
      文句幾乎全同——「此鳥不飛則已，一飛沖天；不鳴則已，一鳴驚人」（白話：這隻鳥不飛則已，一飛就直沖雲天；不叫則已，一叫就震驚眾人）。
      同一母題繫於兩君，其一必為移植。
    source: shiji
    locus: 滑稽列傳
significance: >-
  「一鳴驚人」常被讀成一則勵志故事，其實是一套政治手段。楚莊王剛即位時，大權還握在舊臣手裏，
  他於是裝作沉迷享樂，暗中觀察群臣誰忠誰奸，然後一舉誅殺數百人、提拔數百人，徹底清洗朝廷人事。
  韓非子用老子「大音希聲」（白話：最大的聲音聽來反而像無聲）來解說這件事，看中的正是這一層——
  裝作無為只是手段，不是目的。
