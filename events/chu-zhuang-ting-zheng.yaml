id: chu-zhuang-ting-zheng
name: 楚莊王親政
year: -611
year_note: 楚莊王三年
period: wu-ba
type: 論政
states: [chu]
people: [chu-zhuang-wang, wu-ju]
narrative: >-
  楚莊王即位已經三年，卻一直不頒布任何政令，日夜只顧享樂。他還向全國下令：有敢來進諫的人，
  一律處死，絕不寬赦。

  大臣伍舉進宮勸諫。當時莊王左邊摟著鄭國的美女，右邊摟著越國的美女，坐在成排的鐘鼓樂器之間。
  伍舉不敢直說，只說想給莊王猜一個謎語：有一隻鳥停在土山上，三年不飛也不叫，這是甚麼鳥？
  莊王回答：這隻鳥三年不飛，一飛就要直沖雲天；三年不叫，一叫就要震驚眾人。你退下吧，
  我明白你的意思了。成語「一鳴驚人」即出於此事。

  過了幾個月，莊王反而更加放縱。大夫蘇從再進宮勸諫。莊王問他：你難道沒聽到我的命令嗎？
  蘇從回答：只要能用我的死換來國君醒悟，這正是我的心願。

  於是莊王停止了荒淫享樂，開始親自處理政事。他一舉誅殺了數百人，又提拔了數百人，
  把國政交給伍舉和蘇從，全國上下都非常高興。就在這一年，楚國滅掉了庸國；到了莊王六年，
  楚國討伐宋國，繳獲兵車五百輛。

  《韓非子·喻老》記載同一件事，但沒有寫出進諫者的名字，並且引用《老子》的話
  來解說這個故事。
original:
  - locus: 楚世家
    quote: 莊王即位三年，不出號令，日夜為樂，令國中曰：「有敢諫者死無赦。」
    translation: >-
      楚莊王即位三年，一直不頒布政令，日夜只顧享樂，還向全國下令：有敢來進諫的人，一律處死，絕不寬赦。
  - speaker: 伍舉與莊王
    locus: 楚世家
    quote: >-
      伍舉曰：「願有進隱。」曰：「有鳥在於阜，三年不蜚不鳴，是何鳥也？」莊王曰：「三年不蜚，
      蜚將沖天；三年不鳴，鳴將驚人。舉退矣，吾知之矣。」
    translation: >-
      伍舉說：想給您猜一個謎語。他問：有一隻鳥停在土山上，三年不飛也不叫，這是甚麼鳥？
      莊王說：這隻鳥三年不飛，一飛就要直沖雲天；三年不叫，一叫就要震驚眾人。伍舉你退下吧，我明白你的意思了。
  - speaker: 蘇從
    locus: 楚世家
    quote: 殺身以明君，臣之願也。
    translation: 用我的死來使國君醒悟，正是我的心願。
  - locus: 楚世家
    quote: 於是乃罷淫樂，聽政，所誅者數百人，所進者數百人，任伍舉、蘇從以政，國人大說。
    translation: >-
      於是莊王停止荒淫享樂，開始親自處理政事，一舉誅殺數百人、提拔數百人，把國政交給伍舉和蘇從，
      全國上下都非常高興。
  - speaker: 右司馬與莊王
    locus: 喻老
    quote: >-
      右司馬御座而與王隱曰：「有鳥止南方之阜，三年不翅，不飛不鳴，嘿然無聲，此為何名？」王曰：
      「三年不翅，將以長羽翼；不飛不鳴，將以觀民則。雖無飛，飛必沖天；雖無鳴，鳴必驚人。子釋之，
      不穀知之矣。」
    translation: >-
      右司馬陪坐時給楚王出謎語：有一隻鳥停在南邊的土山上，三年不展翅，不飛也不叫，靜默無聲，
      這叫甚麼鳥？楚王說：三年不展翅，是要長好羽翼；不飛不叫，是要觀察民情國法。牠雖然沒飛，
      一飛就要直沖雲天；雖然沒叫，一叫就要震驚眾人。你不必再說了，我明白了。
    source: hanfeizi
    ctext_urn: ctp:hanfeizi/yu-lao
sources:
  - source: shiji
    locus: 楚世家
    ctext_urn: ctp:shiji/chu-shi-jia
  - source: hanfeizi
