id: shang-yang-bian-fa
name: 商鞅變法
year: -356
year_end: -350
period: zhan-guo-early
type: 變法
states: [qin]
people: [shang-yang, qin-xiao-gong]
narrative: >-
  秦孝公即位後頒下求賢令，廣招人才。衛鞅本在魏國，聽到消息便西入秦國。他三次進言，
  最後用富國強兵的辦法打動了孝公。衛鞅隨即在朝廷上提議變法，遭到守舊大臣反對。
  甘龍認為，聖人不改變百姓的習俗來施教，智者不變更成法來治國。杜摯認為，利益沒有百倍就不該變法，
  功效沒有十倍就不該更換器具。衛鞅反駁說：治理天下不止一條路，只要對國家有利，就不必效法古人；
  違反古法的不該非議，墨守舊禮的也不值得稱許。孝公表示贊同，任命衛鞅為左庶長（秦國高級爵位兼官職），
  終於定下變法的法令。

  法令已經擬定，還沒公布，衛鞅擔心百姓不信任自己。於是他在國都市集的南門立起一根三丈高的木頭，
  招募百姓，說誰能把它搬到北門，就賞十金。百姓覺得奇怪，沒人敢搬。衛鞅又把賞金提高到五十金。
  有一個人把木頭搬了過去，衛鞅立刻賞他五十金，以表明自己說話算數。然後才正式頒布法令。

  變法的要點如下：把百姓按五家、十家編組，互相監督，一家犯法，各家連坐；告發奸人的，
  跟斬得一顆敵人首級同樣受賞。努力耕田織布、多繳糧食布帛的，可以免除徭役；棄農經商或因懶惰而貧困的，
  連同妻子兒女一併罰作官奴。宗室貴族沒有軍功的，不能列入宗室名冊。爵位等級劃分分明，
  各按等級佔有田宅、奴婢和衣飾。後來衛鞅又廢除井田制，開闢田間的道路；把小的鄉、邑、聚合併為縣；
  統一斗、桶、秤和尺等度量標準；並把國都遷到咸陽。

  新法推行滿一年，到國都投訴新法不便的秦國百姓數以千計。正在這時，太子觸犯了法令。
  衛鞅說：法令推行不了，是因為上面的人帶頭違犯。他要依法懲辦太子；可是太子是國君的繼承人，
  不能對他施刑，於是處罰了太子的兩位老師——對太傅公子虔用刑，又在師傅公孫賈的臉上刺字。
  第二天，秦國人都趕緊遵從法令。新法推行十年，秦國百姓十分滿意，路上遺失的東西沒人撿走，
  山裡沒有盜賊，家家富足；百姓勇於為國家作戰，不敢私下鬥毆，鄉邑得到很好的治理。
original:
  - speaker: 甘龍
    locus: 商君列傳
    quote: 聖人不易民而教，知者不變法而治。因民而教，不勞而成功；緣法而治者，吏習而民安之。
    translation: >-
      聖人不改變百姓的習俗去施教，智者不變更成法去治國。順著百姓來施教，不費力就能成功；
      依照舊法來治理，官吏熟悉，百姓也安穩。
  - speaker: 杜摯
    locus: 商君列傳
    quote: 利不百，不變法；功不十，不易器。法古無過，循禮無邪。
    translation: >-
      利益不到百倍，就不變法；功效不到十倍，就不更換器具。效法古人不會有過失，遵循舊禮不會出差錯。
  - speaker: 衛鞅
    locus: 商君列傳
    quote: 治世不一道，便國不法古。故湯武不循古而王，夏殷不易禮而亡。反古者不可非，而循禮者不足多。
    translation: >-
      治理天下不止一條路，只要對國家有利就不必效法古人。所以商湯、周武王不遵循古法卻成就王業，
      夏桀、殷紂不更改舊禮卻走向滅亡。違反古法的不該非議，墨守舊禮的也不值得稱許。
  - locus: 商君列傳
    quote: >-
      令既具，未布，恐民之不信己，乃立三丈之木於國都市南門，募民有能徙置北門者予十金。民怪之，
      莫敢徙。復曰：「能徙者予五十金。」有一人徙之，輒予五十金，以明不欺。卒下令。
    translation: >-
      法令已經擬好，還沒公布，衛鞅擔心百姓不信任自己，就在國都市集的南門立起一根三丈高的木頭，
      招募百姓，說誰能把它搬到北門，就賞十金。百姓覺得奇怪，沒人敢搬。衛鞅又說：能搬的賞五十金。
      有一個人把它搬了過去，衛鞅立刻賞他五十金，以表明說話算數。然後才頒布法令。
  - speaker: 衛鞅
    locus: 商君列傳
    quote: >-
      於是太子犯法。衛鞅曰：「法之不行，自上犯之。」將法太子。太子，君嗣也，不可施刑，
      刑其傅公子虔，黥其師公孫賈。明日，秦人皆趨令。
    translation: >-
      這時太子觸犯了法令。衛鞅說：法令推行不了，是因為上面的人帶頭違犯。他要依法懲辦太子。
      可是太子是國君的繼承人，不能施刑，於是處罰太子的老師：對太傅公子虔用刑，
      又在師傅公孫賈的臉上刺字。第二天，秦國人都趕緊遵從法令。
sources:
  - source: shiji
    locus: 商君列傳
    ctext_urn: ctp:shiji/shang-jun-lie-zhuan
reliability: 大體可信
significance: >-
  戰國各國變法之中最徹底的一次，也是少數在主持者死後仍能存續的一次。
  它的核心不在某一項具體政策，而在於把賞罰變成國家唯一的社會分層機制：軍功之外沒有爵位，
  耕織之外沒有出路。徙木立信一節則點出變法真正的難題：不在於設計制度，而在於讓百姓相信制度真會執行。
  衛鞅說「法之不行，自上犯之」（白話：法令推行不了，是因為上面的人帶頭違犯），
  正是這一難題的另一面——執行必須從有權有勢的人開始。
