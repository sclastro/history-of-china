id: shang-yang-bian-fa
name: 商鞅變法
year: -356
year_end: -350
period: zhan-guo-early
type: 變法
states: [qin]
people: [shang-yang, qin-xiao-gong]
narrative: >-
  秦孝公下求賢令，衛鞅自魏入秦，三說而後以強國之術動之。議變法於朝，甘龍曰「聖人不易民而教
  ，知者不變法而治」（白話：聖人不改變百姓的習俗來施教，智者不變更成法來治國），杜摯曰「利
  不百不變法，功不十不易器」（白話：法令推行不了，是因為上面的人帶頭違犯。）。衛鞅曰：「治
  世不一道，便國不法古……反古者不可非，而循禮者不足多。」（白話：治理天下不只一條路，有利
  於國家就不必效法古人……違反古法的不應該非議，而墨守舊禮的也不值得稱許。）孝公曰「善」，
  以衛鞅為左庶長，卒定變法之令。

  令既具，未布，恐民之不信己。乃立三丈之木於國都市南門，募民有能徙置北門者予十金。民怪之，
  莫敢徙。復曰「能徙者予五十金」。有一人徙之，輒予五十金，以明不欺。卒下令。

  變法之要：什伍連坐、告姦者與斬敵首同賞；戮力本業耕織致粟帛多者復其身，事末利及怠而貧者舉
  以為收孥；宗室非有軍功論不得為屬籍；明尊卑爵秩等級，各以差次名田宅臣妾衣服。其後又廢井田
  、開阡陌，並小鄉邑聚為縣，平斗桶權衡丈尺，徙都咸陽。

  令行於民期年，秦民之國都言初令之不便者以千數。於是太子犯法。衛鞅曰：「法之不行，自上犯之
  。」（白話：法令推行不了，是因為上面的人帶頭違犯。）將法太子——太子，君嗣也，不可施刑，刑其傅公子虔、黥其師公孫賈。明日，秦人皆趨令。行
  之十年，秦民大悅，道不拾遺，山無盜賊，家給人足；民勇於公戰，怯於私鬥，鄉邑大治。
sources:
  - source: shiji
    locus: 商君列傳
    ctext_urn: ctp:shiji/shang-jun-lie-zhuan
reliability: 大體可信
significance: >-
  戰國變法中最徹底、也是唯一在主持者死後仍完整存續的一次。
  其核心不是任何單項政策，而是把「賞罰」變成國家唯一的社會分層機制——
  軍功之外無爵位，耕織之外無出路。
  徙木立信一節則揭示了變法的真正難題：不是設計制度，
  而是使人相信制度會被執行。
