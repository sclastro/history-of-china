id: cheng-pu-zhi-zhan
name: 城濮之戰
year: -632
year_note: 魯僖公二十八年四月
period: wu-ba
type: 戰役
states: [jin, chu]
people: [jin-wen-gong, hu-yan, xian-zhen, chu-cheng-wang]
narrative: >-
  楚圍宋，宋告急於晉。先軫獻策：伐曹、衛以致楚師，
  又執曹伯、分曹衛之田以賜宋人，使楚不得不戰而曲在楚。
  楚成王察勢不利，令子玉退師，曰「無從晉師」；子玉不從，請戰。

  戰前，晉侯有疑：「楚始得曹而新昏於衛，若伐之，齊、秦必救之。」
  又念楚之惠。狐偃曰：「戰也。戰而捷，必得諸侯；若其不捷，
  表裡山河，必無害也。」

  子玉使鬥勃請戰，晉侯使欒枝對曰：
  「寡君聞命矣。楚君之惠，未之敢忘，是以在此。
  為大夫退，其敢當君乎？既不獲命矣，敢煩大夫謂二三子：戒爾車乘、
  敬爾君事，詰朝將見。」

  晉師退三舍（九十里）而後止。軍吏曰：「以君辟臣，辱也；
  且楚師老矣，何故退？」子犯曰：「師直為壯，曲為老，豈在久乎？
  微楚之惠不及此，退三舍辟之，所以報也。背惠食言，以亢其讎，
  我曲楚直，其眾素飽，不可謂老。我退而楚還，我將何求？
  若其不還，君退臣犯，曲在彼矣。」

  楚師果進。晉下軍佐胥臣蒙馬以虎皮先犯陳蔡，陳蔡奔，楚右師潰；
  狐毛設二旆而退，欒枝使輿曳柴而偽遁，子玉逐之，
  原軫、郤溱以中軍公族橫擊之，楚左師潰。子玉收其卒而止，故不敗。
  楚師還至方城，成王使謂之曰「大夫若入，其若申息之老何」，子玉自縊。

  晉侯獻楚俘於王，作王宮于踐土，周襄王策命晉侯為侯伯。
sources:
  - source: zuo-zhuan
    locus: 僖公二十八年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/xi-gong-er-shi-ba-nian
reliability: 信史
significance: >-
  春秋最重要的一場會戰，晉之霸業由此確立，楚之北進受阻近四十年。
  它同時是一場「名分之戰」：晉的每一步——伐曹衛以致師、
  退三舍以報惠、使欒枝致辭——都在爭「直」而非爭利。
  狐偃那句「師直為壯，曲為老」把道義直接換算成士氣，
  是先秦戰爭觀最精確的一次表述：正當性不是戰爭的裝飾，是戰鬥力的變數。
