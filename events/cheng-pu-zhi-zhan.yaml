id: cheng-pu-zhi-zhan
name: 城濮之戰
year: -632
year_note: 魯僖公二十八年四月
period: wu-ba
type: 戰役
states: [jin, chu]
people: [jin-wen-gong, hu-yan, xian-zhen, chu-cheng-wang]
narrative: >-
  前 633 年冬，楚成王率領陳、蔡等國軍隊包圍宋國，宋國派人向晉國求救。晉國大臣先軫認為，這是報答宋國舊恩、
  樹立威望、成就霸業的機會。可是晉、楚之間隔著曹、衛兩國，直接救宋並不容易。狐偃於是建議轉攻曹、衛：
  這兩國剛剛投靠楚國，晉軍一打，楚國必定回師相救，宋國之圍自然解除。

  次年春天，晉文公出兵，攻入曹國都城，俘虜了曹國國君，衛國國君也被迫出奔。楚軍仍然不肯撤離宋國。
  先軫再出一計：讓宋國用財物求齊、秦兩國出面調停，晉國同時把曹、衛的部分土地分給宋國。楚國偏袒曹、衛，
  一定不肯答應調停；齊、秦收了宋國的好處，又被楚國拒絕，便會站到晉國一方。結果正如先軫所料。

  楚成王看出形勢不利，自己退回楚國境內，命令主將子玉（成得臣）撤兵，不要與晉軍交戰。子玉不服，堅持請戰。
  成王很不高興，只撥給他少量兵力。子玉派使者向晉國提出交換條件：晉國讓曹、衛復國，楚國就解宋國之圍。
  先軫看穿這是楚國想一舉收買三國人心，便建議晉文公私下答應讓曹、衛復國，條件是兩國與楚國斷交，
  同時扣押楚國使者，激怒子玉。子玉果然大怒，率軍追擊晉軍。

  晉軍卻向後撤退了九十里。古時行軍以三十里為一舍，這就是「退避三舍」的由來。部分將領不解，
  認為國君避讓對方的臣子是一種恥辱。狐偃解釋：當年晉文公流亡到楚國，曾經答應楚成王，
  日後兩國交戰，晉軍會先退三舍報答恩情；現在是兌現承諾。軍隊有理，士氣就旺盛；軍隊理虧，士氣就低落。
  如果晉軍退讓了，楚軍仍然進逼，理虧的便是楚國。楚軍中不少人也想就此停下，子玉不肯。

  前 632 年四月，晉、宋、齊、秦聯軍駐紮在衛國的城濮，楚軍背靠丘陵紮營。晉文公仍然猶豫，
  既擔心戰敗，又念及楚國舊恩。狐偃勸他開戰：打贏了，諸侯必定歸附；即使打輸，晉國外有黃河、
  內有太行山作屏障，也不會有大損失。這就是成語「表裡山河」的出處。子玉派人下戰書，語氣輕佻，
  說要跟晉軍將士較量一番當作遊戲，請晉君坐在車上觀看。晉文公讓欒枝客氣而堅定地回覆：
  晉國不敢忘記楚君的恩惠，所以一再退讓；既然楚國不肯罷兵，那就明天一早戰場上見。

  交戰當日，晉國下軍副帥胥臣用虎皮蒙住戰馬，率先衝擊楚軍右翼的陳、蔡軍隊。陳、蔡兵士驚散，
  楚軍右翼隨即崩潰。晉國上軍主將狐毛豎起兩面大旗假裝撤退，欒枝又讓戰車拖著樹枝揚起塵土，
  裝作全軍敗逃。楚軍左翼追上來，先軫與郤溱率領中軍精銳從側面截擊，狐毛、狐偃再從兩旁夾攻，
  楚軍左翼也告崩潰。子玉及時收攏中軍，才沒有全軍覆沒。

  楚軍敗退後，楚成王派人斥責子玉：你要是回來，怎樣面對申、息兩地陣亡子弟的父老？子玉在歸途中自殺。
  晉文公隨即在踐土為周天子修建行宮，向周襄王獻上楚國俘虜和戰車。周襄王正式冊命晉文公為諸侯之長，
  晉國的霸業由此確立。

original:
  - speaker: 先軫
    locus: 僖公二十七年
    quote: 報施救患，取威定霸，於是乎在矣。
    translation: 報答恩惠、解救危難、樹立威望、奠定霸業，全在這一仗了。
  - speaker: 狐偃
    locus: 僖公二十七年
    quote: 楚始得曹，而新昏於衛，若伐曹、衛，楚必救之，則齊、宋免矣。
    translation: >-
      楚國剛剛拉攏了曹國，又新近跟衛國結了親。我們攻打曹、衛，楚國一定出兵相救，
      齊國和宋國的危難就可以解除了。
  - speaker: 軍吏與狐偃
    locus: 僖公二十八年
    quote: >-
      軍吏曰：「以君辟臣，辱也。且楚師老矣，何故退？」子犯曰：「師直為壯，曲為老，豈在久乎？
      微楚之惠不及此，退三舍辟之，所以報也。背惠食言，以亢其讎，我曲楚直。其眾素飽，不可謂老。
      我退而楚還，我將何求？若其不還，君退臣犯，曲在彼矣。」
    translation: >-
      軍官問：「國君躲避對方的臣子，這是恥辱。況且楚軍在外已久，早已疲憊，為甚麼要退？」
      狐偃說：「軍隊有理，士氣就旺盛；理虧，士氣就低落，跟出兵時間長短無關。當初沒有楚國的恩惠，
      我們走不到今天。後退九十里避開他們，就是報恩。如果背棄恩惠、說話不算數，反過來跟恩人作對，
      那就是我們理虧、楚國有理；他們的士兵一向吃得飽，說不上疲憊。我們退了，楚軍也回去，
      我們還求甚麼？要是他們不回去，國君已經退讓，臣子還要進逼，理虧的就是他們了。」
  - speaker: 狐偃
    locus: 僖公二十八年
    quote: 戰也！戰而捷，必得諸侯。若其不捷，表裡山河，必無害也。
    translation: >-
      打吧！打贏了，一定能得到諸侯擁護；就算打不贏，我們晉國外有黃河、內有高山，
      也肯定不會有甚麼損失。
  - speaker: 欒枝
    locus: 僖公二十八年
    quote: >-
      寡君聞命矣。楚君之惠，未之敢忘，是以在此。為大夫退，其敢當君乎？既不獲命矣，
      敢煩大夫謂二三子：戒爾車乘，敬爾君事，詰朝將見。
    translation: >-
      我們國君已經明白你的意思了。楚王從前的恩惠，他一直不敢忘記，所以才退到這裡。
      我們連你這位臣子都肯避讓，又怎敢跟楚王本人交鋒？既然你們不肯停戰，就請你轉告各位將領：
      準備好戰車，盡好為國君效力的本分，明天一早戰場上見。
  - speaker: 楚成王
    locus: 僖公二十八年
    quote: 大夫若入，其若申、息之老何？
    translation: 你要是回來，怎樣面對申、息兩地陣亡子弟的父老？
sources:
