reliability: 信史
significance: >-
  春秋時代最重要的一場會戰。晉國由此成為霸主，楚國向北擴張的勢頭受阻了三十多年。
  這場仗也是一場爭理之戰：晉國每一步——攻曹、衛逼楚回師，退三舍報恩，派欒枝客氣回話——
  都在爭取道理站在自己一邊，而不是爭奪實利。狐偃說「師直為壯，曲為老」（白話：軍隊有理，士氣就旺盛；理虧，士氣就低落），
  把道義直接換算成士氣，是先秦戰爭觀最精準的一句話：正當與否不是戰爭的點綴，而是實實在在影響戰鬥力的因素。
