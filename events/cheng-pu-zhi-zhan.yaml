id: cheng-pu-zhi-zhan
name: 城濮之戰
year: -632
year_note: 魯僖公二十八年四月
period: wu-ba
type: 戰役
states: [jin, chu]
people: [jin-wen-gong, hu-yan, xian-zhen, chu-cheng-wang]
narrative: >-
  楚圍宋，宋告急於晉。先軫獻策：伐曹、衛以致楚師，又執曹伯、分曹衛之田以賜宋人，使楚不得不
  戰而曲在楚。楚成王察勢不利，令子玉退師，曰「無從晉師」；子玉不從，請戰。

  戰前，晉侯有疑：「楚始得曹而新昏於衛，若伐之，齊、秦必救之。」（白話：楚國剛得到曹國、又
  新近與衛國聯姻，若去攻打它們，齊、秦必定出手相救。）又念楚之惠。狐偃曰：「戰也。戰而捷，
  必得諸侯；若其不捷，表裡山河，必無害也。」（白話：打。打贏了，必定得到諸侯擁戴；就算打不
  贏，晉國外有黃河、內有高山，也不會有大害。）

  子玉使鬥勃請戰，晉侯使欒枝對曰：「寡君聞命矣。楚君之惠，未之敢忘，是以在此。為大夫退，其
  敢當君乎？既不獲命矣，敢煩大夫謂二三子：戒爾車乘、敬爾君事，詰朝將見。」（白話：寡君已聽
  到您的話了。楚君的恩惠，我們不敢忘記，所以才在這裡。為了大夫您而退兵，哪敢與貴國國君對陣
  ？既然得不到停戰的答覆，那就煩請大夫轉告貴軍將士：整備你們的車馬、認真對待你們國君的事，
  明天早上戰場上見。）

  晉師退三舍（九十里）而後止。軍吏曰：「以君辟臣，辱也；且楚師老矣，何故退？」（白話：以國
  君之尊迴避對方的臣子，是恥辱；何況楚軍已是疲師，為什麼要退？）子犯曰：「師直為壯，曲為老
  ，豈在久乎？微楚之惠不及此，退三舍辟之，所以報也。背惠食言，以亢其讎，我曲楚直，其眾素飽
  ，不可謂老。我退而楚還，我將何求？若其不還，君退臣犯，曲在彼矣。」（白話：軍隊理直就士氣
  壯，理曲就士氣衰，哪裡在於出兵久暫？沒有楚國的恩惠我們到不了今天，退三舍避開他，是為了報
  恩。背棄恩惠、說話不算，反而抵擋自己的恩人，那就是我曲楚直；他們兵力素來充足，不能說是疲
  師。我們退了而楚軍也回去，我們還求什麼？若他們不肯回去，就是國君退讓而臣子進逼，理曲的就
  在他們那邊了。）

  楚師果進。晉下軍佐胥臣蒙馬以虎皮先犯陳蔡，陳蔡奔，楚右師潰；狐毛設二旆而退，欒枝使輿曳柴
  而偽遁，子玉逐之，原軫、郤溱以中軍公族橫擊之，楚左師潰。子玉收其卒而止，故不敗。楚師還至
  方城，成王使謂之曰「大夫若入，其若申息之老何」（白話：大夫若真要回來，怎麼面對申、息兩地
  陣亡子弟的父老？），子玉自縊。

  晉侯獻楚俘於王，作王宮于踐土，周襄王策命晉侯為侯伯。
