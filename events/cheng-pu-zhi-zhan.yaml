reliability: 信史
significance: >-
  春秋最重要的一場會戰，晉之霸業由此確立，楚之北進受阻近四十年。
  它同時是一場「名分之戰」：晉的每一步——伐曹衛以致師、
  退三舍以報惠、使欒枝致辭——都在爭「直」而非爭利。
  狐偃那句「師直為壯，曲為老」（白話：軍隊理直就士氣壯盛，理虧就士氣衰竭）把道義直接換算成士氣，
  是先秦戰爭觀最精確的一次表述：正當性不是戰爭的裝飾，是戰鬥力的變數。
