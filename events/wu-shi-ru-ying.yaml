id: wu-shi-ru-ying
name: 吳師入郢
year: -506
year_note: 魯定公四年
period: chun-qiu-late
type: 戰役
states: [wu, chu]
people: [wu-zi-xu, sun-wu]
narrative: >-
  楚平王聽信費無忌之讒，殺伍奢與其長子伍尚。次子伍子胥出奔，
  過昭關一夜白頭，輾轉奔吳，助公子光奪位，是為闔閭。

  前506年，吳以孫武、伍子胥為將，五戰而入郢都。楚昭王出奔。

  楚平王已死。伍子胥掘開他的墓，把屍體拖出來鞭打三百下才停手。

  他的舊友申包胥當時逃在山中，派人責備他：
  「子之報讎，其以甚乎！吾聞之，人眾者勝天，天定亦能破人。
  今子故平王之臣，親北面而事之，今至於僇死人，此豈其無天道之極乎！」
  （白話：您這樣報仇，未免太過分了吧！我聽說人多勢眾時可以勝過天理，
  但天理一定下來也能勝過人。您本是平王的臣子，曾親自北面事奉他，
  如今竟然侮辱死人，這難道不是違背天道到極點了嗎！）

  伍子胥回話說：「為我謝申包胥曰：吾日莫途遠，吾故倒行而逆施之。」
  （白話：替我告訴申包胥：我的日子已近黃昏而路途還遠，
  所以只好倒過來做、違背常理去行事。）

  申包胥於是到秦國求救，在庭中哭了七天七夜，秦哀公為之出兵，
  吳師敗退。同年越國乘虛襲吳，闔閭之弟夫概自立，吳王回師平亂。
sources:
  - source: shiji
    locus: 伍子胥列傳
    ctext_urn: ctp:shiji/wu-zi-xu-lie-zhuan
reliability: 大體可信
significance: >-
  「日暮途遠」與「倒行逆施」同出伍子胥回覆申包胥的那一句話，
  而兩者本是一組因果：因為日暮途遠，所以倒行逆施。
  值得注意的是他沒有辯解自己做得對——
  他承認那是「倒行逆施」，只解釋為什麼非如此不可。
  一個承認自己違背常理的人，與一個為自己找理由的人，是兩回事。
