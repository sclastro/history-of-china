id: wu-shi-ru-ying
name: 吳師入郢
year: -506
year_note: 魯定公四年
period: chun-qiu-late
type: 戰役
states: [wu, chu]
people: [wu-zi-xu, sun-wu]
narrative: >-
  伍子胥名員，是楚國人，父親伍奢做太子建的太傅。少傅費無忌在楚平王面前不斷讒害太子建，
  平王於是殺了伍奢和伍子胥的哥哥伍尚。伍子胥出奔，輾轉投奔吳國（後世傳說他過昭關時一夜白頭），
  後來幫助公子光奪得王位，就是吳王闔閭。伍子胥出逃時曾對好友申包胥說，他一定要顛覆楚國；
  申包胥回答，他一定要保存楚國。

  前 506 年，闔閭問伍子胥和孫武，現在是否可以攻入郢都。兩人說，楚國主將囊瓦貪婪，
  唐、蔡兩國都怨恨他，要大舉伐楚，必須先爭取唐、蔡。闔閭聽從，聯合唐、蔡出動全部兵力伐楚，
  與楚軍隔著漢水對陣。闔閭的弟弟夫概率領自己的五千部屬攻擊楚將子常（即囊瓦），楚軍大敗，
  子常逃往鄭國。吳軍乘勝前進，五戰五勝，攻入郢都，楚昭王出逃。

  伍子胥搜捕昭王不得，就掘開楚平王的墳墓，把屍體拖出來鞭打了三百下才停手。
  申包胥當時逃在山中，派人責備他：您這樣報仇，未免太過分了吧！人多勢眾時可以勝過天理，
  但天理一旦定下來，也能制服人。您本是平王的臣子，曾經北面事奉他，如今竟然侮辱死人，
  這難道不是違背天道到了極點嗎？伍子胥託人回答：我的日子已近黃昏而路途還遠，
  所以只好倒過來做、違背常理去行事。成語「日暮途遠」與「倒行逆施」都出自這句話。

  申包胥於是到秦國求救，秦國起初不答應。他站在秦國的朝廷裡日夜痛哭，七天七夜哭聲不斷。
  秦哀公被他感動，說楚國雖然無道，有這樣的臣子，怎能不保存它，於是派出戰車五百輛救楚。
  次年（前 505 年），秦軍在稷地打敗吳軍。闔閭在楚國久留搜捕昭王，他的弟弟夫概逃回吳國，
  自立為王；闔閭只好放下楚國回國，擊敗夫概。楚昭王見吳國內亂，又回到郢都。
original:
  - locus: 伍子胥列傳
    quote: >-
      及吳兵入郢，伍子胥求昭王。既不得，乃掘楚平王墓，出其尸，鞭之三百，然後已。
    translation: >-
      吳軍攻入郢都後，伍子胥搜捕楚昭王。搜不到，就掘開楚平王的墳墓，把屍體拖出來，
      鞭打了三百下才停手。
  - speaker: 申包胥
    locus: 伍子胥列傳
    quote: >-
      子之報讎，其以甚乎！吾聞之，人眾者勝天，天定亦能破人。今子故平王之臣，親北面而事之，
      今至於僇死人，此豈其無天道之極乎！
    translation: >-
      您這樣報仇，未免太過分了吧！我聽說，人多勢眾時可以勝過天理，但天理一旦定下來，也能制服人。
      您本是平王的臣子，曾經親自北面事奉他，如今竟然侮辱死人，這難道不是違背天道到了極點嗎！
  - speaker: 伍子胥
    locus: 伍子胥列傳
    quote: >-
      為我謝申包胥曰，吾日莫途遠，吾故倒行而逆施之。
    translation: >-
      替我回覆申包胥說：我的日子已近黃昏而路途還遠，所以只好倒過來做、違背常理去行事。
  - locus: 伍子胥列傳
    quote: >-
      包胥立於秦廷，晝夜哭，七日七夜不絕其聲。秦哀公憐之，曰：「楚雖無道，有臣若是，可無存乎！」
      乃遣車五百乘救楚擊吳。
    translation: >-
      申包胥站在秦國的朝廷裡，日夜痛哭，七天七夜哭聲不斷。秦哀公可憐他，說：「楚國雖然無道，
      有這樣的臣子，怎能不保存它！」於是派出戰車五百輛救楚攻吳。
sources:
  - source: shiji
    locus: 伍子胥列傳
    ctext_urn: ctp:shiji/wu-zi-xu-lie-zhuan
reliability: 大體可信
variants:
  - claim: >-
      掘墓鞭屍一事不見於《左傳》。《左傳》定公四年只記吳軍入郢後「以班處宮」（按尊卑分住楚王宮室），
      鞭屍之說首見於《史記》，可能是戰國以後的增飾。
    source: zuo-zhuan
    locus: 定公四年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/ding-gong-si-nian
significance: >-
  「日暮途遠」與「倒行逆施」出自同一句話，兩者本是一組因果：因為日暮途遠，所以倒行逆施。
  值得注意的是伍子胥沒有辯解自己做得對，他承認那是違背常理，只解釋為甚麼非如此不可。
  承認自己違背常理的人，與替自己找理由的人，是兩回事。
