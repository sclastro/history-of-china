id: yu-bang-xiang-zheng
idiom:
  zh: 鷸蚌相爭
  pinyin: yù bàng xiāng zhēng
  jyutping: wat6 bong5 soeng1 zang1
  literal: 鷸鳥與河蚌互相夾持
  en: The snipe and the clam locked together
type: historical
period: zhan-guo-late
year: -270
year_note: 年代不詳；事在趙惠文王時
states: [zhao, yan, qin]
meaning: 雙方相持不下，讓第三者得利。
benshi:
  event: su-dai-shui-zhao
  summary: >-
    趙國將要伐燕，蘇代替燕國去見趙惠文王。他說路過易水時見到河蚌出來曬太陽，鷸鳥啄牠的肉，河蚌合殼夾住鷸嘴，兩者互不相讓，結果被漁夫一併捉走。接著指出燕趙長久相持而使百姓疲敝，強秦就是那個漁夫。惠王於是罷兵。
dianyuan:
  - source: zhan-guo-ce
    locus: 燕策二
    ctext_urn: ctp:zhan-guo-ce/yan-ce-er
    quote: >-
      兩者不肯相舍，漁者得而并禽之。今趙且伐燕，燕趙久相支以敝大眾，
      臣恐強秦之為漁父也。
    translation: >-
      兩個都不肯放手，漁夫就把牠們一併捉走了。
      如今趙國要攻打燕國，燕趙長久相持而使兩國百姓疲敝，
      臣恐怕強大的秦國就是那個漁夫。
crystallisation:
  note: >-
    《戰國策》原文並無「鷸蚌相爭」四字，
    是後人對這則寓言的概括；宋元以降與「漁翁得利」連用而定型。
  moe_id: 1268
reliability: 孤證
people: [su-dai]
concepts: [第三方, 消耗, 外交]
related_idioms:
  - target: dong-dao-zhu
    kind: same_source
    note: 兩條都靠「把第三方引進畫面」來改變當事人的計算。
lessons:
  historical: >-
    蘇代的說法有一個關鍵設計：他沒有替燕國喊冤，
    也沒有說趙國打不贏——他甚至完全承認趙國會贏。
    他做的是把秦國引進畫面。
    爭執的雙方一旦意識到旁邊還有第三者在等，勝負的意義就變了：
    贏也是輸，因為贏下來的代價會被別人收走。
    這與燭之武拆秦晉聯盟是同一路數——不爭辯是非，只改變計算的邊界。
    值得一提的是趙惠文王只回了一個字：「善」。
    戰國君主聽得懂利害，往往比聽得懂道理快得多。
  modern: >-
    引申為兩敗俱傷、第三者得利。
    在競爭中它提醒的是：先確認這場競爭的贏家是不是自己。
references:
  - https://ctext.org/zhan-guo-ce/yan-ce-er/zh
