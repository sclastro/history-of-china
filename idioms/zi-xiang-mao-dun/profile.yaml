id: zi-xiang-mao-dun
idiom:
  zh: 自相矛盾
  pinyin: zì xiāng máo dùn
  jyutping: zi6 soeng1 maau4 teon5
  literal: 自己的矛和自己的盾互相牴觸
  en: One's own spear against one's own shield
type: parable
period: zhan-guo-mid
year: null
states: [chu]
meaning: 言語或行為前後牴觸，不能同時成立。
dianyuan:
  - source: hanfeizi
    locus: 難一
    ctext_urn: ctp:hanfeizi/nan-yi
    quote: >-
      楚人有鬻楯與矛者，譽之曰：「吾楯之堅，物莫能陷也。」
      又譽其矛曰：「吾矛之利，於物無不陷也。」
      或曰：「以子之矛，陷子之楯，何如？」其人弗能應也。
      夫不可陷之楯與無不陷之矛，不可同世而立。
    translation: >-
      楚國有個賣盾又賣矛的人，誇他的盾說：「我的盾堅固得很，
      沒有東西能刺穿它。」又誇他的矛說：「我的矛鋒利得很，
      沒有東西是它刺不穿的。」有人問：「拿你的矛去刺你的盾，會怎樣？」
      那人答不上來。因為刺不穿的盾與無所不穿的矛，不可能同時存在於世上。
crystallisation:
  note: >-
    《韓非子》原文無「自相矛盾」四字，只有「以子之矛陷子之楯」（白話：拿你的矛去刺你的盾）；
    「矛盾」二字連用而指相互牴觸，正是由此進入漢語；
    「自相矛盾」四字語形出於後世，魏晉南北朝已見用例。
  moe_id: 1141
reliability: 寓言
people: [han-fei]
concepts: [邏輯, 歸謬, 名實, 論證方法]
lessons:
  historical: >-
    這則寓言在〈難一〉裡有明確的論戰功能。儒者稱堯明察，又稱舜以德化民——歷山之農侵畔而
    舜往耕，河濱之漁爭坻而舜往漁，一年而讓。韓非問：舜救敗須以年計，若堯果為明君，天下本
    不當有敗。「堯之明察在上位，將使天下無姦也」（白話：堯的明察在君位之上，就該使天下沒
    有姦邪）——譽舜則毀堯，譽堯則毀舜，「不可兩譽」。矛盾之喻就用來坐實這一點。所以它不
    只是一個邏輯笑話，是一次針對儒家聖王敘事的攻擊：一套互不相容的頌詞，不能同時成為制度
    設計的根據。
  modern: >-
    引申為前後牴觸。方法上值得取的是韓非的手法：
    當一組主張各自看來都有道理時，把它們放在同一個場景中檢驗。
references:
  - https://ctext.org/hanfeizi/nan-yi/zh
