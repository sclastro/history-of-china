id: da-yi-mie-qin
idiom:
  zh: 大義滅親
  pinyin: dà yì miè qīn
  jyutping: daai6 ji6 mit6 can1
  literal: 為大義而消滅親屬
  en: Sacrificing kin for the greater righteousness
type: historical
period: chun-qiu-early
year: -719
year_note: 魯隱公四年
states: [wey]
meaning: 為維護公義而不惜懲治自己的親人。
benshi:
  event: zhou-xu-zhi-luan
  summary: >-
    衛國公子州吁弒兄桓公、自立為君，大夫石碏的兒子石厚是他的黨羽。石碏假意獻上「朝周請命須先過陳」的計策，引誘兩人前往陳國，讓陳國人將他們拘押；衛國人在濮地殺了州吁，石碏則派家宰獳羊肩在陳國殺死了石厚。
dianyuan:
  - source: zuo-zhuan
    locus: 隱公四年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/yin-gong-si-nian
    quote: >-
      君子曰：「石碏，純臣也。惡州吁而厚與焉。『大義滅親』，其是之謂乎！」
    translation: >-
      君子說：「石碏是純粹的忠臣。他厭惡州吁，而自己的兒子石厚卻參與其事。
      所謂『大義滅親』，說的正是這種情形吧！」
  - source: zuo-zhuan
    locus: 隱公三年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/yin-gong-san-nian
    quote: >-
      臣聞愛子，教之以義方，弗納於邪。驕、奢、淫、泆，所自邪也。
      四者之來，寵祿過也……將立州吁，乃定之矣；若猶未也，階之為禍。
    translation: >-
      臣聽說疼愛兒子，要用正道教他，不讓他走上邪路。驕縱、奢侈、放蕩、安逸，是邪路的起點；這四樣之所以出現，是寵愛與賞賜過了頭……若打算立州吁為嗣，就趁早定下來；若還沒打算，如今這樣只是替他鋪一條禍路。
crystallisation:
  note: >-
    這四個字的語形直接出自《左傳》君子曰，是《左傳》為數不多的自造成語之一——先有評語，後有成語，中間沒有經過語形演變。
  moe_id: 1178
reliability: 信史
people: [shi-que, shi-hou, wei-zhou-xu]
concepts: [宗法, 忠, 公私之辨, 春秋筆法]
related_idioms:
  - target: duo-xing-bu-yi
    kind: contrast
    note: 同為宗族內部的清除，莊公縱之使自斃，石碏則先發而誅之。
lessons:
  historical: >-
    值得注意的是《左傳》的措辭：稱石碏為「純臣」，而不是「純父」。這四個字所肯定的是一套排序——君臣之義高於父子之親。在宗法制下這是一個相當激進的立場：西周的政治秩序本以血緣為骨架，「親親」與「尊尊」原是同一件事；石碏的選擇則預示了兩者將要分離。到了戰國，法家把這一分離推到極致——「儒以文亂法」，韓非明言父子之間的親情也靠不住。石碏是這條路上的第一塊路標。
  modern: >-
    現在多用於褒揚不徇私情的公職人員。須注意其原始語境要嚴酷得多：石碏所「滅」者是親手把兒子送上死路，且此前他已多次警告，始終沒被採納。
references:
  - https://ctext.org/chun-qiu-zuo-zhuan/yin-gong-si-nian/zh
