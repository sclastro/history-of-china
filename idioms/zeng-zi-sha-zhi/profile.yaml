id: zeng-zi-sha-zhi
idiom:
  zh: 曾子殺彘
  pinyin: zēng zǐ shā zhì
  jyutping: zang1 zi2 saat3 zi6
  literal: 曾子殺豬
  en: Zengzi kills the pig
type: historical
period: zhan-guo-early
year: -470
year_note: 年代不詳；曾子在世之時
states: [lu]
meaning: 對孩子守信；引申為言出必行。
benshi:
  event: kong-zi-lun-xue
  summary: >-
    曾子的妻子要上市集，兒子哭著要跟去，妻子哄他說回來殺豬給他吃。妻子回來，曾子真的要捉豬來殺。妻子阻止，說那只是哄小孩的話。曾子說小孩沒有自己的判斷，凡事等著向父母學習；如今你欺騙他，就是教他欺騙。於是把豬殺了煮給兒子吃。
dianyuan:
  - source: hanfeizi
    locus: 外儲說左上
    ctext_urn: ctp:hanfeizi/wai-chu-shuo-zuo-shang
    quote: >-
      嬰兒非與戲也。嬰兒非有知也，待父母而學者也，聽父母之教。
      今子欺之，是教子欺也。母欺子，子而不信其母，非所以成教也。
    translation: >-
      小孩不是可以跟他開玩笑的。小孩沒有自己的判斷，
      凡事等著向父母學習、聽父母的教導。
      如今你欺騙他，就是教他欺騙。
      母親欺騙孩子，孩子就不再相信母親，這不是教育之道。
crystallisation:
  note: >-
    《韓非子》原文無四字語形；「曾子殺彘」是後人就此事的命名，
    亦作「曾子烹彘」。「彘」即豬。
  moe_id: 2007
reliability: 大體可信
variants:
  - claim: >-
      此事只見於《韓非子·外儲說左上》，《論語》《孟子》皆不載。
      〈外儲說〉是韓非蒐羅說理素材的篇章，取材以論證需要為準，
      未必實有其事。
    source: hanfeizi
    locus: 外儲說左上
people: [zeng-zi]
concepts: [信用, 教育, 示範]
related_idioms:
  - target: xi-mu-li-xin
    kind: same_source
    note: 兩條都出自「信用要用一次實際兌現來建立」這個思路，
      一在朝廷，一在家庭。
lessons:
  historical: >-
    韓非把這則故事收進〈外儲說〉，用意不在講孝道或親子之情，
    在講**信用是可以教出來的，也可以被教壞**。
    曾子的理由完全是機制性的：小孩沒有自己的判斷，
    行為模式從父母那裡學；
    你示範一次「說了不算」，他學到的就是說了可以不算。
    殺一頭豬是代價，而代價正是這件事成立的原因——
    如果不殺，那句話就只是一句哄人的話；
    殺了，那句話才變成一個可以依賴的東西。
    與商鞅徙木立信並看：一個在朝廷，一個在家庭，
    而手法完全相同——用一次實際兌現，讓承諾變成可信的。
    差別在於商鞅面對的是不信任，曾子面對的是一個還沒有形成判斷的人。
  modern: >-
    引申為言出必行、教育以身作則。
    要點在韓非的角度：這不是一個關於誠實的道德故事，
    是一個關於信用如何被建立或破壞的機制說明。
references:
  - https://ctext.org/hanfeizi/wai-chu-shuo-zuo-shang/zh
