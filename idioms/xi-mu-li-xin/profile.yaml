id: xi-mu-li-xin
idiom:
  zh: 徙木立信
  pinyin: xǐ mù lì xìn
  jyutping: saai2 muk6 laap6 seon3
  literal: 靠搬一根木頭建立信用
  en: Moving a pole to establish trust
type: historical
period: zhan-guo-early
year: -356
year_note: 秦孝公六年
states: [qin]
meaning: 以具體而可驗證的小事取信於人，為推行政令作準備。
benshi:
  event: shang-yang-bian-fa
  summary: >-
    商鞅變法的法令已經擬定而還未公布，他怕百姓不信任，便在國都市集南門立了一根三丈長的木頭，
    招募能把它搬到北門的人，賞十金。百姓覺得奇怪，沒有人敢搬，他就把賞金加到五十金。
    有一個人搬了，當即得到五十金，以表明絕不欺騙，然後才頒布法令。
dianyuan:
  - source: shiji
    locus: 商君列傳
    ctext_urn: ctp:shiji/shang-jun-lie-zhuan
    quote: >-
      令既具，未布，恐民之不信己，乃立三丈之木於國都市南門，
      募民有能徙置北門者予十金。民怪之，莫敢徙。復曰：「能徙者予五十金。」
      有一人徙之，輒予五十金，以明不欺。卒下令。
    translation: >-
      法令已經擬定，還沒有公布，商鞅怕百姓不信任自己，
      就在國都市集的南門立了一根三丈長的木頭，
      招募百姓有能把它搬到北門的，給十金。百姓覺得奇怪，沒有人敢搬。
      又宣布：「能搬的給五十金。」有一個人搬了，當即給他五十金，
      以表明絕不欺騙。然後才頒布法令。
crystallisation:
  note: >-
    《史記》原文無「徙木立信」四字，是後世對此事的概括。宋人論商鞅已多詠此事，如王安石〈商鞅〉詩
    「自古驅民在信誠，一言為重百金輕」（白話：自古以來驅使百姓全在誠信，一句承諾比百金還重），
    但未見四字連用；四字語形出現較晚。
reliability: 大體可信
people: [shang-yang, qin-xiao-gong]
concepts: [信用, 變法, 制度可信性, 誘因設計]
related_idioms:
  - target: zuo-fa-zi-bi
    kind: sequel
    note: 同出商鞅變法；一者立法之始，一者法成之後反噬其身。
  - target: feng-huo-xi-zhu-hou
    kind: contrast
    note: 一者以重賞立信，一者以戲弄毀信。
lessons:
  historical: >-
    這一節揭示了變法真正的難題：不是設計制度，是使人**相信制度會被執行**。
    商鞅選的道具很有講究——搬木頭是一件毫無意義的事，
    正因為毫無意義，賞金與勞動之間才不存在任何合理的對價關係；
    百姓從中唯一能學到的資訊就是：這個政府說到做到。
    賞金由十金加到五十金也是刻意的：價格越不合理，
    信號的強度越大。這是一次精心設計的公共承諾實驗。
    與之對應的是同一次變法中「刑其傅公子虔、黥其師公孫賈」（白話：處罰太子的師傅公子虔，在太子的老師公孫賈臉上刺字）——
    賞的一面用重賞立信，罰的一面用刑太子之師立威，
    兩者合起來才是完整的可信性建構。
  modern: >-
    引申為以身作則、取信於眾。設計上的要點是：
    立信的動作最好與利益無關，否則它會被讀成交易而不是承諾。
references:
  - https://ctext.org/shiji/shang-jun-lie-zhuan/zh
