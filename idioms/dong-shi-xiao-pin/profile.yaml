id: dong-shi-xiao-pin
idiom:
  zh: 東施效顰
  pinyin: dōng shī xiào pín
  jyutping: dung1 si1 haau6 pan4
  literal: 東施模仿西施皺眉
  en: Dong Shi imitating Xi Shi's frown
type: parable
period: chun-qiu-late
year: null
states: [yue]
meaning: 盲目模仿他人而不知其所以然，結果適得其反。
dianyuan:
  - source: zhuangzi
    locus: 天運
    ctext_urn: ctp:zhuangzi/revolution-of-heaven
    quote: >-
      西施病心而矉其里，其里之醜人見而美之，歸亦捧心而矉其里。
      其里之富人見之，堅閉門而不出；貧人見之，挈妻子而去之走。
      彼知矉美而不知矉之所以美。
    translation: >-
      西施心口疼而在鄉里間皺著眉，同鄉的醜女看見了覺得美，
      回去也捧著心口在鄉里間皺眉。鄉里的富人看見她，緊閉大門不出來；
      窮人看見她，帶著妻子兒女躲得遠遠的。
      那個醜女只知道皺眉好看，卻不知道皺眉為什麼好看。
crystallisation:
  first_attested: 「東施」之名見於宋代以後
  note: >-
    《莊子》原文只作「其里之醜人」，**並無「東施」之名**；
    「東施」係後人與「西施」相對而造，宋以後始見，明清小說戲曲中通行。
    四字語形「東施效顰」定型更晚。另有「效顰」「醜女效顰」等較早說法。
  moe_id: 1216
reliability: 寓言
people: [xi-shi, zhuang-zi]
concepts: [模仿, 所以然, 復古之非, 時勢]
lessons:
  historical: >-
    〈天運〉這一段的上下文是批評孔子推行周禮：「今蘄行周於魯，是猶推舟於陸也，勞而無功，
    身必有殃。」（白話：如今想在魯國推行周代的那一套，就像在陸地上推船一樣——勞而無功，
    自身還必定招禍。）醜女效顰的寓言就緊接在後——它針對的不是任何一個模仿者，是「法先王
    」這件事本身。莊子的關鍵句是「彼知矉美而不知矉之所以美」：西施皺眉之所以好看，是因為
    那是她病中的自然狀態；脫離了那個條件去複製表象，得到的只有表象。這與韓非的「守株待兔
    」是同一個論點的兩種說法——先秦兩大反傳統的學派，在這一點上意外地一致。
  modern: >-
    引申為盲目模仿。要點在於分辨：
    你複製的是對方的做法，還是對方做法之所以有效的條件？
references:
  - https://ctext.org/zhuangzi/tian-yun/zh
