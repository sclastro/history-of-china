id: tang-bi-dang-che
idiom:
  zh: 螳臂當車
  pinyin: táng bì dāng chē
  jyutping: tong4 bei3 dong1 ce1
  literal: 螳螂舉起前臂去擋車
  en: A mantis raising its arms against a chariot
type: parable
period: zhan-guo-mid
year: null
states: [wei]
meaning: 不自量力，以極弱之力去抗拒極強之勢。
dianyuan:
  - source: zhuangzi
    locus: 人間世
    ctext_urn: ctp:zhuangzi/man-in-the-world-associated-with
    quote: >-
      汝不知夫螳蜋乎？怒其臂以當車轍，不知其不勝任也，是其才之美者也。
    translation: >-
      你不知道那螳螂嗎？奮起牠的臂膀去擋車輪，
      不知道自己勝任不了，這是因為牠太自負於自己的本事了。
crystallisation:
  note: >-
    《莊子》原文作「怒其臂以當車轍」；
    「螳臂當車」的四字語形是後人的節縮，唐宋以降通行。
  moe_id: 1953
reliability: 寓言
people: [zhuang-zi]
concepts: [自不量力, 處世, 才能]
related_idioms:
  - target: tang-lang-bu-chan
    kind: same_source
    note: 兩條同以螳螂為喻，一是只顧眼前，一是不自量力。
lessons:
  historical: >-
    這則比喻的語境常被略掉。
    〈人間世〉記顏闔要去做衛靈公太子的師傅，
    那位太子「其德天殺」——生性殘忍。顏闔向蘧伯玉請教怎麼辦。
    蘧伯玉先說要戒慎，然後舉了三個例子：螳臂當車、養虎、愛馬。
    螳臂當車是第一個，講的是**硬碰硬會死**；
    養虎是第二個，講順著牠的性子；
    愛馬是第三個，講就算你對牠再好，一次不小心也會被踢。
    所以這則寓言不是嘲笑螳螂愚蠢，
    是講一個弱勢者在強權旁邊該怎麼活下去。
    值得注意原文的用詞：「是其才之美者也」——
    螳螂之所以去擋車，正因為牠對自己的能力有信心。
    把才能誤認為可以硬碰的本錢，這才是那句話要說的事。
  modern: >-
    引申為不自量力。
    原文的重點卻在處境：它是說給一個必須與危險相處的人聽的。
references:
  - https://ctext.org/zhuangzi/man-in-the-world-associated-with/zh
