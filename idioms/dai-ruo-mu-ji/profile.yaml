id: dai-ruo-mu-ji
idiom:
  zh: 呆若木雞
  pinyin: dāi ruò mù jī
  jyutping: ngoi4 joek6 muk6 gai1
  literal: 呆得像木頭做的雞
  en: Still as a wooden rooster
type: parable
period: zhan-guo-mid
year: null
states: [qi]
meaning: 今指因驚愕而發愣；原義卻是修養到極處、不為外物所動。
dianyuan:
  - source: zhuangzi
    locus: 達生
    ctext_urn: ctp:zhuangzi/full-understanding-of-life
    quote: >-
      幾矣。雞雖有鳴者，已無變矣，望之似木雞矣，
      其德全矣，異雞無敢應者，反走矣。
    translation: >-
      差不多了。別的雞就算叫，牠也不再有反應，
      看上去像木頭做的雞一樣，牠的德行已經完備，
      別的雞沒有敢應戰的，掉頭就走。
crystallisation:
  note: >-
    《莊子》原文作「望之似木雞矣」，並無四字語形。
    「呆若木雞」是後世的概括，而語義完全翻轉——
    原義是最高境界，今義是發愣失神。
    這是本站語形演變中語義倒轉的一例，與「朝三暮四」「爾虞我詐」同類。
reliability: 寓言
people: [ji-xing-zi]
concepts: [修養, 語義翻轉, 沉靜]
related_idioms:
  - target: zhao-san-mu-si
    kind: contrast
    note: 兩條都是語形定型而語義翻轉，可互相對照。
lessons:
  historical: >-
    紀渻子養鬥雞，分四個階段回報，每次相隔十天。
    第一階段「方虛憍而恃氣」——虛浮驕矜，依恃血氣。
    第二階段「猶應嚮景」——還會對聲音和影子起反應。
    第三階段「猶疾視而盛氣」——還是目光凌厲、盛氣未消。
    第四階段才成：別的雞叫牠也不動了。
    四個階段拆解的是同一件事：**反應**。
    最初是主動挑釁，其次是被動應激，再次是壓抑而未消，
    最後是根本不起反應。
    值得注意的是最後的效果：牠並沒有去鬥，
    「異雞無敢應者，反走矣」——對手直接走了。
    《莊子》要說的是不爭而勝，而不爭的前提是真的不動心，
    不是忍住不動。
  modern: >-
    引申為驚愕發愣。
    使用時值得記住原義正好相反：那是四十天訓練的終點，不是失態。
references:
  - https://ctext.org/zhuangzi/full-understanding-of-life/zh
