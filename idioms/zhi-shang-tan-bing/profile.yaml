id: zhi-shang-tan-bing
idiom:
  zh: 紙上談兵
  pinyin: zhǐ shàng tán bīng
  jyutping: zi2 soeng6 taam4 bing1
  literal: 在紙上談論用兵
  en: Discussing warfare on paper
type: historical
period: zhan-guo-late
year: -260
year_note: 秦昭襄王四十七年
states: [zhao, qin]
meaning: 空談理論而不切實際，不能解決實際問題。
benshi:
  event: chang-ping-zhi-zhan
  summary: >-
    長平之戰，廉頗堅壁不出，趙王嫌其怯；秦行反間曰「獨畏馬服子趙括」，
    趙王遂以趙括代廉頗。括盡改約束、出兵擊秦，為白起所圍四十六日，
    括戰死，降卒四十萬盡坑。趙括之父趙奢與其母皆早已斷言括不可為將。
dianyuan:
  - source: shiji
    locus: 廉頗藺相如列傳
    ctext_urn: ctp:shiji/lian-po-lin-xiang-ru-lie-zhuan
    quote: >-
      趙括自少時學兵法，言兵事，以天下莫能當。嘗與其父奢言兵事，奢不能難，
      然不謂善。括母問奢其故，奢曰：「兵，死地也，而括易言之。
      使趙不將括即已，若必將之，破趙軍者必括也。」
    translation: >-
      趙括從小學兵法、談論用兵的事，自以為天下沒有人比得上他。他曾與父親趙奢辯論兵事，趙奢駁不倒他，卻不認為他高明。趙括的母親問是什麼緣故，趙奢說：「用兵是關乎生死的事，而趙括說得太輕易了。趙國不用他為將便罷；若一定要用他，使趙軍覆滅的必定是趙括。」
  - source: shiji
    locus: 廉頗藺相如列傳
    ctext_urn: ctp:shiji/lian-po-lin-xiang-ru-lie-zhuan
    quote: >-
      藺相如曰：「王以名使括，若膠柱而鼓瑟耳。括徒能讀其父書傳，不知合變也。」
    translation: >-
      藺相如說：「大王只憑名聲任用趙括，就像把琴柱黏死了再彈瑟一樣。
      趙括只會讀他父親留下的兵書，不懂得隨機應變。」
crystallisation:
  first_attested: 清代
  note: >-
    這是本站語形與本事落差極大的一條：**戰國時還沒有紙**（紙是東漢蔡倫改良推廣的），所以「紙上談兵」四字絕不可能出於當時。《史記》原文沒有這個說法，只有趙奢的「括易言之」與藺相如的「膠柱鼓瑟」兩條評語。四字語形出現得很晚，一般認為定型於清代，由明清人評論長平之戰而來，後來才回頭套到趙括身上。
  moe_id: 1233
reliability: 信史
people: [zhao-kuo, zhao-she, lian-po, bai-qi, zhao-xiao-cheng-wang]
concepts: [經驗與理論, 用人, 反間, 語形時代錯置]
related_idioms:
  - target: wo-xin-chang-dan
    kind: contrast
    note: 二者同為「本事早、語形晚」之例；一者晚出一千五百年，一者晚出近二千年。
lessons:
  historical: >-
    長平之敗不是一個人的錯，是一連串判斷失誤的累加：
    受上黨之獻（貪無故之利）、嫌廉頗怯（不解持久戰的性質）、
    中秦反間（不驗證情報來源）、以名取人（用趙括）。
    四個環節中任何一個不錯，結局都不同。
    把責任集中在趙括一人身上，其實是後世敘事的簡化。
    而趙奢的判斷值得細看：他不是說兒子讀書無用，
    是說「兵，死地也，而括易言之」（白話：用兵是關乎生死的事，而趙括說得太輕易了）——問題不在知識量，
    在他把一件會死人的事說得太輕易。
    這是對「理論與經驗」關係最精確的一次表述：
    差別不在懂多少，在對後果的重量有沒有感覺。
  modern: >-
    引申為空談。使用時值得記住兩點：一，戰國時沒有紙，這四個字是清代人的話；二，趙奢批評的不是理論本身，是輕率。
references:
