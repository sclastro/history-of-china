id: ya-miao-zhu-zhang
idiom:
  zh: 揠苗助長
  pinyin: yà miáo zhù zhǎng
  jyutping: aat3 miu4 zo6 zoeng2
  literal: 把禾苗拔高來幫它生長
  en: Pulling up sprouts to help them grow
type: parable
period: zhan-guo-early
year: null
states: [song]
meaning: 違反事物發展的規律而強求速成，結果反受其害。
dianyuan:
  - source: mengzi
    locus: 公孫丑上
    ctext_urn: ctp:mengzi/gong-sun-chou-i
    quote: >-
      宋人有閔其苗之不長而揠之者，芒芒然歸，謂其人曰：「今日病矣，予助苗長矣。」
      其子趨而往視之，苗則槁矣。天下之不助苗長者寡矣。以為無益而舍之者，
      不耘苗者也；助之長者，揠苗者也——非徒無益，而又害之。
    translation: >-
      宋國有個人擔憂自己的禾苗長不高，就把它們一一拔高，
      疲憊地回到家，對家人說：「今天可把我累壞了，我幫禾苗長高了。」
      他兒子快步跑去看，禾苗全枯死了。
      天下不幫禾苗生長的人是很少的。認為沒有用處而放棄的，是不去鋤草的人；
      幫著它生長的，就是拔苗的人——不但沒有好處，反而害了它。
crystallisation:
  note: >-
    《孟子》原文作「揠之」，無「揠苗助長」四字；
    四字語形為後世節縮，另有「拔苗助長」一形並行（「揠」即拔）。
  moe_id: 1064
reliability: 寓言
people: [meng-zi]
concepts: [養氣, 自然之勢, 急功, 修養工夫]
related_idioms:
  - target: wu-shi-bu-xiao-bai-bu
    kind: same_source
    note: 同為孟子論政、論修養時所設之譬。
lessons:
  historical: >-
    這則寓言在《孟子》裡不是講農業，是講「養浩然之氣」的工夫。
    孟子的原話是「必有事焉而勿正，心勿忘，勿助長也」——
    要持續用功，但不可預期成效，不可揠助。
    值得注意的是他把「不助長」與「不耘苗」並列為兩種錯誤：
    放任不管與強行催熟同樣有害。
    這是先秦修養論中對「工夫的節奏」最精確的一次表述，
    也是儒家與道家在此處的分界——道家順其自然，孟子則要求
    在順其自然的同時「必有事焉」。
  modern: >-
    引申為急於求成反而壞事。孟子原意更完整：
    錯誤有兩種，放任與催熟；正確的位置在兩者之間，
    是持續投入而不預期時程。
references:
  - https://ctext.org/mengzi/gong-sun-chou-i/zh
