id: jia-dao-fa-guo
idiom:
  zh: 假道伐虢
  pinyin: jiǎ dào fá guó
  jyutping: gaa2 dou6 fat6 gwok3
  literal: 借路去攻打虢國
  en: Borrowing a road to attack Guo
type: historical
period: wu-ba
year: -658
year_note: 魯僖公二年、五年
states: [jin, guo, yu]
meaning: 以借道為名，實際上進行吞併；泛指以合作為名，實際上進行侵吞。
benshi:
  event: jin-mie-guo-yu
  summary: >-
    晉獻公想攻打虢國，但虞國擋在路上，便採用荀息的計謀，以屈地所產的良馬和垂棘所出的美玉賄賂虞國，向其借道。前 658 年借道取下陽，前 655 年再借道滅虢，回師途中順勢襲滅虞國，馬和璧都歸了晉國。
dianyuan:
  - source: zuo-zhuan
    locus: 僖公二年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/xi-gong-er-nian
    quote: >-
      晉荀息請以屈產之乘與垂棘之璧，假道於虞以伐虢。公曰：「是吾寶也。」
      對曰：「若得道於虞，猶外府也。」公曰：「宮之奇存焉。」
      對曰：「宮之奇之為人也，懦而不能強諫，且少長於君，君暱之；雖諫，將不聽。」
    translation: >-
      晉國的荀息請求用屈地出產的良馬和垂棘出產的美玉，向虞國借路去攻打虢國。晉獻公說：「這些是我的寶物。
      」荀息回答：「如果能從虞國借到路，寶物放在虞國，就像放在我們宮外的庫房一樣。」獻公說：「虞國有宮之奇在。
      」荀息回答：「宮之奇這個人，性格軟弱，不敢強力進諫；而且他從小和虞公一起長大，虞公跟他太親近，就算他進諫，
      虞公也不會聽。」
crystallisation:
  first_attested: 《三十六計》第二十四計
  note: >-
    《左傳》原文作「假道於虞以伐虢」，沒有「假道伐虢」四字連用；四字連用見於一般認為成書於明末清初的《三十六計》，列為第二十四計，計文云「兩大之間，敵脅以從，我假以勢」（白話：夾在兩個大國之間的小國，敵方以武力脅迫它順從，我方則先借它的地勢以取得優勢）。
reliability: 信史
people: [jin-xian-gong, xun-xi, yu-gong, gong-zhi-qi]
concepts: [詐術, 小國處境, 賂遺, 兼併]
related_idioms:
  - target: chun-wang-chi-han
    kind: same_event
    note: 宮之奇諫虞公之語，與此同出一事。
lessons:
  historical: >-
    荀息這個策略的精巧，不在於賄賂，而在於他對人的判斷。獻公擔心宮之奇會阻止，荀息沒有說宮之奇不聰明，他的回答是「宮之奇之為人也，懦而不能強諫，且少長於君，君暱之」（白話：宮之奇性格軟弱不能力諫，而且他和虞君從小一起長大、關係太親暱）——他算準的是進諫者與被諫者的關係：太熟的人反而說不動。這是先秦文獻中極罕見的一次組織行為分析。而虞公兩度中同一計，說明真正的漏洞不是資訊不足（宮之奇說得很清楚），是激勵錯位——虞公拿到的是馬和璧，付出的是國家的長期安全，而他個人在短期內只感受到前者。
  modern: >-
    今用以指以合作、過境、借用為名，實際上進行吞併。防範的方法不在於識破話術，而在於檢查「誰得到眼前的好處、誰承擔長期的風險」。
references:
  - https://ctext.org/chun-qiu-zuo-zhuan/xi-gong-er-nian/zh
