id: wai-qiang-zhong-gan
idiom:
  zh: 外強中乾
  pinyin: wài qiáng zhōng gān
  jyutping: ngoi6 koeng4 zung1 kin4
  literal: 外表強壯而內裡枯竭
  en: Strong without, hollow within
type: historical
period: wu-ba
year: -645
year_note: 魯僖公十五年
states: [jin, qin]
meaning: 表面上看似強盛，實則內裡空虛。
benshi:
  event: han-yuan-zhi-zhan
  summary: >-
    （欄位）韓原之戰前，晉惠公放棄本國的馬，改乘鄭國所獻的小駟。大夫慶鄭以馬的生理為據力諫：異地的馬一旦受驚，氣血就會逆亂，外表仍壯而內裡已虛，進退周旋都不由人。惠公不聽，戰時車陷泥中，被秦軍所虜。
dianyuan:
  - source: zuo-zhuan
    locus: 僖公十五年
    ctext_urn: ctp:chun-qiu-zuo-zhuan/xi-gong-shi-wu-nian
    quote: >-
      慶鄭曰：「古者大事，必乘其產：生其水土而知其人心，安其教訓而服習其道，
      唯所納之，無不如志。今乘異產以從戎事，及懼而變，將與人易。
      亂氣狡憤，陰血周作，張脈僨興，外彊中乾。進退不可，周旋不能，君必悔之。」
    translation: >-
      慶鄭說：「古人遇大事，必定乘用本國所產的馬：生長在本地的水土而懂得本地人的心意，
      習慣本地的訓練而服從本地的駕馭方式，怎麼指揮都不會違背心意。
      如今用外地產的馬來從事戰陣，等到牠受驚而性情改變，就會與駕馭者相違。
      屆時氣息紊亂躁怒、血脈奔湧僨張，外表強壯而內裡枯竭。
      進退都不成，周旋也不能——君侯必定會後悔。」
crystallisation:
  note: >-
    （欄位）《左傳》原文作「外彊中乾」（彊是強的古字），語形從一開始就已固定。原本是對馬的生理描述，後世引申為對人、對組織、對國力的通用比喻。
  moe_id: 1129
reliability: 信史
people: [qing-zheng, jin-hui-gong, qin-mu-gong]
concepts: [虛實, 諫言, 秦晉關係]
related_idioms:
  - target: qin-jin-zhi-hao
    kind: same_event
    note: 韓原之戰正是「秦晉之好」翻臉的一戰。
lessons:
  historical: >-
    （欄位）慶鄭的諫辭是先秦最精確的一段技術性論證。他完全不談忠信、不談天命，只談一件具體的事：異地馬匹的應激反應。他的推論鏈非常完整——水土不同就不熟本地人心，訓練不同就不服駕馭；平時看不出來，一旦受驚才顯現；顯形時的表徵是「氣亂血湧、脈張筋興」，看上去更壯，實際上已不受控。「平時無異、臨事崩潰」正是「外強中乾」最要害的一層意思，今天在使用時多半只取「表面強大」，卻失掉了這個時間結構。
  modern: >-
    評估任何體系的強弱，不能只看常態下的表現，要看它在壓力下的反應。
    表面指標在壓力來臨時往往不降反升——這正是最危險的時刻。
references:
