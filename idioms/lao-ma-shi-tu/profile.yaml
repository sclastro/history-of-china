id: lao-ma-shi-tu
idiom:
  zh: 老馬識途
  pinyin: lǎo mǎ shí tú
  jyutping: lou5 maa5 sik1 tou4
  literal: 老馬認得路
  en: The old horse knows the way
type: historical
period: wu-ba
year: -663
year_note: 魯莊公三十年前後
states: [qi, yan]
meaning: 有經驗的人熟悉情況，遇事能發揮作用。
benshi:
  event: fa-shan-rong
  summary: >-
    齊桓公應燕之請北伐山戎，春往冬返，於歸途迷失道路。
    管仲提出放老馬而隨之，遂得道；隰朋復以蟻穴之高下判斷地下水位，掘地得水。
dianyuan:
  - source: hanfeizi
    locus: 說林上
    ctext_urn: ctp:hanfeizi/shuo-lin-shang
    quote: >-
      管仲、隰朋從於桓公而伐孤竹，春往冬反，迷惑失道。管仲曰：「老馬之智可用也。」
      乃放老馬而隨之，遂得道。行山中無水，隰朋曰：「蟻冬居山之陽，夏居山之陰，
      蟻壤一寸而仞有水。」乃掘地，遂得水。以管仲之聖而隰朋之智，
      至其所不知，不難師於老馬與蟻。今人不知以其愚心而師聖人之智，不亦過乎？
    translation: >-
      管仲與隰朋隨桓公伐孤竹，春天出征、冬天回師，迷了路。
      管仲說：「老馬的本事可以用。」於是放開老馬跟著牠走，找回了路。
      行軍山中沒有水，隰朋說：「螞蟻冬天住在山南、夏天住在山北，
      蟻穴之土高一寸，地下八尺就有水。」掘地果然得水。
      以管仲之聖明、隰朋之智慧，遇到自己不懂的事，尚且不以向老馬和螞蟻學習為難；
      今人不知道用自己愚昧的心去師法聖人的智慧，豈不是錯了嗎？
crystallisation:
  note: >-
    《韓非子》原文作「老馬之智可用也」，並無「老馬識途」四字；
    四字語形定型甚晚，宋元以後始通行。今日多用其字面義（有經驗者可靠），
    而韓非原意的重點在末句的推論——知識不因來源卑下而失效。
  moe_id: 1305
reliability: 孤證
variants:
  - claim: >-
      齊桓伐山戎救燕之事《左傳》《史記》皆載，然「老馬識途」一節僅見《韓非子·說林上》，
      別無旁證；《說林》為韓非輯錄說理故事之篇，取材以論證為的，未必實有其事。
    source: shiji
    locus: 齊太公世家
    ctext_urn: ctp:shiji/qi-tai-gong-shi-jia
people: [guan-zhong, qi-huan-gong]
concepts: [經驗知識, 攘夷, 師法, 認識論]
lessons:
  historical: >-
    韓非收這個故事，看中的不是老馬，是末尾那句按語：「以管仲之聖而隰朋之智，至其所不知，
    不難師於老馬與蟻。」（白話：以管仲的聖明、隰朋的智慧，遇到自己不懂的事，尚且不以向老
    馬和螞蟻學習為難。）這是法家認識論的一次表態——知識的效力不繫於它的出身。放在戰國的
    語境裡，它針對的是儒家「法先王」：如果連老馬和螞蟻的經驗都可以取用，那麼「先王之道」
    也就沒有天然的優先權，一切都得回到「管不管用」上來評判。
  modern: >-
    今日多用以肯定資深者的價值。原文的意思其實更寬——
    值得學的不限於「資深的人」，而是任何在特定問題上比你懂的東西，
    哪怕它是一匹馬、一群螞蟻。
references:
  - https://ctext.org/hanfeizi/shuo-lin-shang/zh
