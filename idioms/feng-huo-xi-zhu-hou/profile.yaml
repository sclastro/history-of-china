id: feng-huo-xi-zhu-hou
idiom:
  zh: 烽火戲諸侯
  pinyin: fēng huǒ xì zhū hóu
  jyutping: fung1 fo2 hei3 zyu1 hau4
  literal: 用烽火戲弄諸侯
  en: Toying with the feudal lords by beacon fire
type: historical
period: dong-qian
year: -771
year_note: 周幽王十一年
states: [zhou]
meaning: 為博一笑而以國之大事作兒戲，終致信用破產、亡國殺身。
benshi:
  event: xi-zhou-zhi-wang
  summary: >-
    周幽王廢申后與太子宜臼，改立褒姒之子伯服。申侯遂聯合繒國與西戎攻宗周，
    幽王死於驪山之下，西周亡。《史記》以「舉烽火戲諸侯，及寇至而諸侯不來」
    解釋這場覆亡；清華簡〈繫年〉所記則是幽王先主動伐申而見殺，全無烽火之事。
dianyuan:
  - source: shiji
    locus: 周本紀
    ctext_urn: ctp:shiji/zhou-ben-ji
    quote: >-
      褒姒不好笑，幽王欲其笑萬方，故不笑。幽王為烽燧大鼓，有寇至則舉烽火。
      諸侯悉至，至而無寇，褒姒乃大笑。幽王說之，為數舉烽火。
      其後不信，諸侯益亦不至。
    translation: >-
      褒姒不愛笑，幽王想盡辦法要她笑，她就是不笑。幽王設了烽火台與大鼓，
      有敵來犯就舉烽火。諸侯全趕到了，到了卻沒有敵人，褒姒這才大笑。
      幽王很高興，於是屢次舉烽火。此後諸侯不再相信，也就漸漸不來了。
crystallisation:
  note: >-
    《史記》原文並無「烽火戲諸侯」五字，只作「為數舉烽火」；
    此一五字語形係後世對該段敘事的概括，宋元以後民間講史與戲曲中始定型，
    今日通行的說法更受《東周列國志》影響甚深。
reliability: 後世附會
variants:
  - claim: >-
      清華簡〈繫年〉第二章記：幽王主動「起師伐申」，申侯聯合繒國與西戎反擊而殺之，
      無烽火、無褒姒之笑；且記幽王死後諸侯另立其弟余臣為攜惠王，
      與平王二王並立達二十一年——這段周室分裂，《史記》完全沒有。
    source: qinghua-xinian
    locus: 第二章
  - claim: >-
      制度上亦不可通：烽燧報警是漢代為防匈奴而建的邊防體系，西周無此制；
      即便有，烽火傳訊至諸侯集結需時數日乃至數月，
      「諸侯悉至」而後「褒姒大笑」在時間上根本不成立。
    source: shiji
    locus: 周本紀
    ctext_urn: ctp:shiji/zhou-ben-ji
people: [zhou-you-wang, bao-si]
concepts: [信用, 女禍史觀, 王權崩解, 史料批判]
related_idioms:
  - target: xi-mu-li-xin
    kind: contrast
    note: 一者以重賞立信，一者以戲弄毀信；同樣是統治者如何處理「信」的問題。
lessons:
  historical: >-
    這則故事的史料價值不在它記錄了什麼，而在它顯示了漢人如何理解王朝覆亡。
    西周之亡是一場結構性崩潰——王畿縮小、諸侯坐大、繼承鬥爭引入外族武力；
    但戰國至漢代的史觀需要一個可歸咎的個人，於是「女禍」框架被套了上去。
    妲己之於商、褒姒之於周、驪姬之於晉，是同一套敘事模板的反覆使用。
    本站保留此條，正因為它是這套史觀最完整的標本。
  modern: >-
    就「信用一旦透支即不可恢復」而言，這個比喻至今有效——
    但須記得：它是一則寓言的教訓，不是一段史實的教訓。
references:
  - https://ctext.org/shiji/zhou-ben-ji/zh
notes: >-
  本條 reliability 標為「後世附會」而非「寓言」，
  因為西周亡於前 771 年、幽王死於驪山確為信史，
  被附會的只是覆亡的原因與過程。
