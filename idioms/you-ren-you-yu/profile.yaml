id: you-ren-you-yu
idiom:
  zh: 遊刃有餘
  pinyin: yóu rèn yǒu yú
  jyutping: jau4 jan6 jau5 jyu4
  literal: 運轉刀刃還有餘地
  en: The blade moves with room to spare
type: parable
period: zhan-guo-mid
year: null
states: [wei]
meaning: 技藝純熟，做起事來從容不迫。
dianyuan:
  - source: zhuangzi
    locus: 養生主
    ctext_urn: ctp:zhuangzi/nourishing-the-lord-of-life
    quote: >-
      彼節者有間，而刀刃者無厚；以無厚入有間，恢恢乎其於遊刃必有餘地矣。
    translation: >-
      那些骨節之間有空隙，而刀刃薄得沒有厚度；
      用沒有厚度的刀刃進入有空隙的地方，
      寬綽得很，運轉刀刃必定有餘地。
crystallisation:
  note: >-
    《莊子》原文作「遊刃必有餘地」；
    「遊刃有餘」的四字語形是後人的節縮，唐宋以降通行。
  moe_id: 1731
reliability: 寓言
people: [pao-ding, zhuang-zi]
concepts: [熟練, 結構, 養生]
related_idioms:
  - target: pao-ding-jie-niu
    kind: same_event
    note: 同出庖丁解牛一段，「遊刃有餘」是方法的結果。
  - target: mu-wu-quan-niu
    kind: same_event
    note: 三條同出〈養生主〉，分別是看見、下刀與結果。
lessons:
  historical: >-
    「餘地」這個詞值得細看。
    庖丁的刀之所以十九年而刃若新發於硎，不是因為刀特別好，
    也不是因為他力氣大——恰恰相反，是因為刀從來不碰骨頭。
    「以無厚入有間」：刀刃薄到沒有厚度，而骨節之間本來有空隙；
    薄的東西進入有空隙的地方，自然寬綽。
    所以「餘地」不是他留出來的，是那個結構本來就有的。
    他做的只是找到它。
    〈養生主〉的主題是如何在危險的世界裡保全自己，
    刀就是人的比喻：省力來自路徑正確，
    而路徑正確的前提是先看清結構。
  modern: >-
    引申為做事從容不迫、綽有餘裕。
    要點在於：餘裕通常不是靠能力擠出來的，是靠找對位置本來就有的。
references:
  - https://ctext.org/zhuangzi/nourishing-the-lord-of-life/zh
