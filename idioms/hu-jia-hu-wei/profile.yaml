id: hu-jia-hu-wei
idiom:
  zh: 狐假虎威
  pinyin: hú jiǎ hǔ wēi
  jyutping: wu4 gaa2 fu2 wai1
  literal: 狐狸借用老虎的威風
  en: The fox borrowing the tiger's might
type: parable
period: zhan-guo-mid
year: null
states: [chu]
meaning: 借他人的權勢來嚇唬人。
dianyuan:
  - source: zhan-guo-ce
    locus: 楚策一
    ctext_urn: ctp:zhan-guo-ce/chu-yi
    quote: >-
      虎求百獸而食之，得狐。狐曰：「子無敢食我也。天帝使我長百獸，
      今子食我，是逆天帝命也。子以我為不信，吾為子先行，子隨我後，
      觀百獸之見我而敢不走乎？」虎以為然，故遂與之行。獸見之皆走。
      虎不知獸畏己而走也，以為畏狐也。
      今王之地方五千里，帶甲百萬，而專屬之昭奚恤；故北方之畏奚恤也，
      其實畏王之甲兵也，猶百獸之畏虎也。
    translation: >-
      老虎搜捕百獸來吃，捉到一隻狐狸。狐狸說：「你不敢吃我。
      天帝派我做百獸之長，如今你吃了我，就是違背天帝的命令。
      你要是不信，我在前面走，你跟在我後面，看看百獸見了我敢不逃跑嗎？」
      老虎認為有理，就跟牠一起走。野獸見了都跑。
      老虎不知道野獸是怕自己才跑的，還以為是怕狐狸。
      如今大王的土地方圓五千里、甲兵百萬，卻全交給昭奚恤掌管；
      所以北方諸國怕昭奚恤，其實是怕大王的甲兵，就像百獸怕的是老虎一樣。
crystallisation:
  note: >-
    《戰國策》原文無「狐假虎威」四字，係後世對此則寓言的概括；
    《尹文子》另載同型故事，文字略異。四字語形唐宋以降通行。
  moe_id: 1284
reliability: 寓言
people: [jiang-yi, chu-xuan-wang]
concepts: [借勢, 權力歸屬, 錯誤歸因, 讒]
lessons:
  historical: >-
    這則寓言在《戰國策》裡是一次精確的政治攻擊。
    楚宣王問「北方之畏昭奚恤」是怎麼回事，江乙用狐虎之喻回答，
    而他真正的落點在最後一句：北方所畏者是王之甲兵，不是昭奚恤。
    這既解答了君主的疑問，也在同一句話裡拆掉了一位權臣的權力基礎——
    你的威望是借來的，而債主就坐在這裡。
    值得注意的是老虎的處境：牠不是被騙走了力量，
    牠的力量一直都在，被誤讀的只是那力量**屬於誰**。
    權力的歸屬感，往往比權力本身更容易被操縱。
  modern: >-
    引申為仗勢欺人。從被借勢一方的角度看，
    更值得警惕的是江乙提出的那個問題：
    別人畏懼你的下屬時，畏懼的到底是誰？
references:
  - https://ctext.org/zhan-guo-ce/chu-yi/zh
