id: zuo-fa-zi-bi
idiom:
  zh: 作法自斃
  pinyin: zuò fǎ zì bì
  jyutping: zok3 faat3 zi6 bai6
  literal: 自己制定的法律，反而害死了自己
  en: Undone by the law one made oneself
type: historical
period: zhan-guo-early
year: -338
year_note: 秦孝公卒之年
states: [qin]
meaning: 自己所立的規矩反過來使自己受害。
benshi:
  event: shang-yang-zhi-si
  summary: >-
    秦孝公卒，惠文王立，公子虔之徒告商鞅欲反。
    商鞅出亡至關下欲投宿，客舍主人不知其為商君，
    以「商君之法，舍人無驗者坐之」（白話：按商君的法令，收留沒有身分憑證的人，主人要連坐）拒之。商鞅乃歎「為法之敝一至此哉」（白話：制定法令的弊害竟到了這個地步），
    終為秦兵所殺，車裂以徇。
dianyuan:
  - source: shiji
    locus: 商君列傳
    ctext_urn: ctp:shiji/shang-jun-lie-zhuan
    quote: >-
      商君亡至關下，欲舍客舍。客人不知其是商君也，曰：
      「商君之法，舍人無驗者坐之。」商君喟然歎曰：「嗟乎，為法之敝一至此哉！」
    translation: >-
      商君逃到關口，想住進客舍。店主人不知道他就是商君，說：
      「商君的法令規定，收留沒有身分憑證的人，主人要連坐。」
      商君長歎道：「唉，制定法令的弊害竟到了這個地步！」
crystallisation:
  note: >-
    《史記》原文只有「為法之敝一至此哉」，無「作法自斃」四字；
    四字語形出於後世，明清以降通行。另有「自作自受」「作繭自縛」等近義而不同源。
  moe_id: 1201
reliability: 大體可信
people: [shang-yang, qin-xiao-gong]
concepts: [法治, 非人格化統治, 變法, 反噬]
related_idioms:
  - target: xi-mu-li-xin
    kind: same_event
    note: 同出商鞅變法，一者立法之始，一者法成之後反噬其身。
lessons:
  historical: >-
    這一幕的反諷不在於商鞅死於自己的法，而在於那條法**確實生效了**。
    一個素不相識的客舍主人，在完全不知道對方是誰的情況下，
    嚴格執行了規定——這正是商鞅變法成功的證明。
    制度一旦真正建立，就不再認得它的創造者。
    這是先秦對「非人格化統治」最早也最慘烈的一次演示：
    法之所以為法，正在於它對所有人一視同仁，包括立法者。
    值得補一句的是結局——商鞅被車裂，而他的法沒有被廢，
    秦國正是靠這套制度并了天下。人亡而政不息，
    在戰國變法中僅此一例。
  modern: >-
    引申為自食其果。更精確的一層是：
    一個制度若真正生效，它必然會在某個時刻約束到設計者本人；
    做不到這一點的，其實不是制度。
references:
  - https://ctext.org/shiji/shang-jun-lie-zhuan/zh
