id: bao-xin-jiu-huo
idiom:
  zh: 抱薪救火
  pinyin: bào xīn jiù huǒ
  jyutping: pou5 can4 gau3 fo2
  literal: 抱著柴去救火
  en: Carrying firewood to put out a fire
type: historical
period: zhan-guo-late
year: -273
year_note: 華陽之戰後
states: [wei, qin]
meaning: 用錯方法去消除禍患，反而使禍患擴大。
benshi:
  event: su-dai-jian-wei-wang
  summary: >-
    魏國屢敗於秦，朝中主張割地求和。蘇代勸阻魏安釐王，指出那些主張割地的人多半是想藉此換取自己的爵位；而拿土地去侍奉秦國，就像抱著柴去救火——柴沒有燒完，火就不會熄滅。
dianyuan:
  - source: shiji
    locus: 魏世家
    ctext_urn: ctp:shiji/wei-shi-jia
    quote: >-
      且夫以地事秦，譬猶抱薪而救火也，薪不盡則火不滅。
    translation: >-
      何況拿土地去侍奉秦國，就好比抱著柴去救火——
      柴沒有燒完，火就不會熄滅。
crystallisation:
  note: >-
    《史記》原文作「抱薪而救火」；
    「抱薪救火」的四字語形是後人的節縮，唐宋以降通行。
    《戰國策·魏策三》另有相近之語繫於孫臣。
  moe_id: 1837
reliability: 大體可信
people: [su-dai]
concepts: [讓步, 結構, 外交]
related_idioms:
  - target: yuan-jiao-jin-gong
    kind: contrast
    note: 一是秦國分化六國的辦法，一是六國割地求和的後果。
  - target: yu-bang-xiang-zheng
    kind: same_source
    note: 同出蘇代，兩條都是用一個日常場景推翻一項國策。
lessons:
  historical: >-
    這個比喻之所以恰當，在於它指出了交換的**結構**：
    柴本身就是火的燃料。
    割地不是付出一次代價買到一段和平，
    而是每一次割地都增加了對方繼續索求的能力——
    秦國多一分土地，下一次來要的時候就多一分籌碼。
    蘇代還有更尖銳的一層：他先指出主張割地的人未必為國家打算，
    「欲璽者制地，欲地者制璽」——想要相印的人負責割地，
    而割地換來的功勞正好用來換相印。
    決策之所以走向割地，不一定因為那是最好的選擇，
    也可能因為那是對提議者最有利的選擇。
  modern: >-
    引申為方法不當而使禍患加劇。
    要點在於分辨：付出的代價是不是同時增強了對方索取的能力。
references:
  - https://ctext.org/shiji/wei-shi-jia/zh
