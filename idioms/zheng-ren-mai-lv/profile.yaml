id: zheng-ren-mai-lv
idiom:
  zh: 鄭人買履
  pinyin: zhèng rén mǎi lǚ
  jyutping: zeng6 jan4 maai5 lei5
  literal: 鄭國人買鞋
  en: The man of Zheng buying shoes
type: parable
period: zhan-guo-late
year: null
states: [zheng]
meaning: 死守教條而不顧事實。
dianyuan:
  - source: hanfeizi
    locus: 外儲說左上
    ctext_urn: ctp:hanfeizi/wai-chu-shuo-zuo-shang
    quote: >-
      鄭人有且置履者，先自度其足而置之其坐，至之市而忘操之。
      已得履，乃曰：「吾忘持度。」反歸取之。及反，市罷，遂不得履。
      人曰：「何不試之以足？」曰：「寧信度，無自信也。」
    translation: >-
      鄭國有個要買鞋的人，先量了自己的腳，把尺碼放在座位上；
      到了市集卻忘了帶。挑好鞋才說：「我忘了帶尺碼。」
      回家去取，等他回來，市集已經散了，終究沒有買到鞋。
      有人問：「為甚麼不用腳試一試？」他說：
      「寧可相信尺碼，也不相信自己的腳。」
crystallisation:
  note: >-
    《韓非子》原文並無「鄭人買履」四字，是後人就此事的概括；
    四字語形宋以降通行。
  moe_id: 14556
reliability: 寓言
people: [han-fei]
concepts: [教條, 度量, 變法]
related_idioms:
  - target: ke-zhou-qiu-jian
    kind: contrast
    note: 一是守著量好的尺碼而不看腳，一是守著刻好的記號而不看船。
  - target: shou-zhu-dai-tu
    kind: same_source
    note: 同出《韓非子》，都以一則小故事攻擊效法先王。
lessons:
  historical: >-
    這則寓言的關鍵句是最後那七個字：
    「寧信度，無自信也。」（白話：寧可相信尺碼，也不相信自己的腳。）
    值得注意的是那個尺碼並沒有錯——它正是照他自己的腳量出來的。
    問題在於：尺碼是腳的**摹本**，而腳就在他身上。
    他捨棄原件去追摹本，而且理由是對摹本更有信心。
    韓非要攻擊的正是這個：先王之法也是一種「度」——
    照當時的條件量出來的；
    如今條件變了，而人們寧可相信那份早已量好的尺碼。
    與刻舟求劍並看：刻舟的人不知道參照系會動，
    買履的人則是知道腳在哪裡而不肯用——後者更難救。
  modern: >-
    引申為墨守成規、不知變通。
    要點在「寧信度」三個字：教條之所以難破，
    往往不是因為看不見事實，是因為對規則比對事實更有信心。
references:
  - https://ctext.org/hanfeizi/wai-chu-shuo-zuo-shang/zh
